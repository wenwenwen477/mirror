<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT1</title>
<style>
:root{ --bg:#0a0c10; --ink:#c8d0c2; --ink2:#8f9a8c; }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden; cursor:crosshair;
    font:14px/1.95 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
}
/* 扫描线 + 暗角：跟主界面同一套氛围 */
body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:30;
    background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px),
        radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%);
}
#stageWrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }

/* ---- 整个 AVG 窗口：粗外框（用户要求明显一点） ---- */
#frame{
    position:relative; width:min(880px, 95vw); height:min(84vh, 760px);
    border:3px solid rgba(200,208,194,.5);
    box-shadow:0 0 22px rgba(200,208,194,.12);
    background:#07090c;
    display:flex; flex-direction:column; overflow:hidden;
}
#frame .cn{ position:absolute; width:14px; height:14px; border:0 solid rgba(200,208,194,.7); z-index:20; }
#frame .cn.tl{ top:-2px; left:-2px;    border-top-width:2px;    border-left-width:2px; }
#frame .cn.tr{ top:-2px; right:-2px;   border-top-width:2px;    border-right-width:2px; }
#frame .cn.bl{ bottom:-2px; left:-2px; border-bottom-width:2px; border-left-width:2px; }
#frame .cn.br{ bottom:-2px; right:-2px;border-bottom-width:2px; border-right-width:2px; }

/* ---- 背景层（占位：教室氛围的极简渐变 + 一扇窗）铺满整框 ---- */
#bg{ position:absolute; inset:0; z-index:1;
    background:
        radial-gradient(130% 90% at 50% -10%, rgba(58,66,58,.55), rgba(7,9,12,1) 72%);
}
#bg::before{   /* 窗 */
    content:""; position:absolute; top:14%; left:8%; width:30%; height:46%;
    border:1px solid rgba(200,208,194,.12);
    background:linear-gradient(180deg, rgba(120,140,150,.06), rgba(120,140,150,.02));
    box-shadow:inset 0 0 30px rgba(200,208,194,.04);
}

/* ---- 角色层：女主立绘（占位，填色）+ 其他角色（白边占位）铺满整框 ---- */
#actors{ position:absolute; inset:0; z-index:2; pointer-events:none; transition:opacity .8s ease; }
/* 背景揭示：立绘淡出，只留背景 */
#frame.bgonly #actors{ opacity:0; }
.actor{ position:absolute; bottom:0; opacity:0; transition:opacity .6s ease; will-change:opacity; }
.actor .inner{ transform:translateY(34px); will-change:transform; transition:transform .8s cubic-bezier(.22,.61,.36,1); }
.actor.on{ opacity:1; }
.actor.on .inner{ transform:translateY(0); }
.actor svg{ display:block; height:min(50vh,400px); will-change:transform;
    filter:drop-shadow(0 0 10px rgba(200,208,194,.18));
    animation:bob 6.5s ease-in-out infinite; }
/* 更慢、更轻的浮动，呼吸感而非跳动 */
@keyframes bob{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-7px) scale(1.012); } }
.actor.heroine{ right:10%; }
.actor.heroine.center{ left:50%; right:auto; margin-left:-115px; }
.actor.boy{ left:10%; }
.actor.teacher{ left:9%; }
.actor.mira{ left:10%; }
.actor .nametag{
    text-align:center; font-size:12px; letter-spacing:3px; margin-top:4px;
    color:rgba(200,208,194,.5); text-shadow:0 0 8px rgba(0,0,0,.8);
}
.actor.boy .nametag{ color:rgba(223,230,216,.65); }

/* ---- 文本层：覆盖整框的半透明大矩形，文字置顶、累计显示 ---- */
#textbox{
    position:absolute; inset:0; z-index:5; pointer-events:none;
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:64px 46px 46px;   /* 顶部留出目录/重播按钮的一行空间 */
    /* 上浓下淡：顶部文字区更实，底部留出背景/立绘 */
    background:linear-gradient(180deg, rgba(7,9,12,.52), rgba(7,9,12,.14));
    transition:background .5s ease;
}
/* 背景揭示：矩形更淡，立绘淡出 → 整个背景直接显现 */
#textbox.reveal{
    background:linear-gradient(180deg, rgba(7,9,12,.3), rgba(7,9,12,.04));
}
#log{ display:flex; flex-direction:column; gap:14px; }
.ln{ font-size:17px; line-height:1.95; color:#dde2d6; text-shadow:0 0 7px rgba(0,0,0,.7); white-space:pre-wrap; }
.ln .sp{ display:block; font-size:14px; letter-spacing:2px; margin-bottom:4px; }
.ln .sp.narr{ color:var(--ink2); }
.ln .sp.hero{ color:#e7b98a; }
.ln .sp.boy{ color:#9fc3d6; }
.ln .sp.tea{ color:#e0a9a0; }
.ln .sp.mira{ color:#e9b8c8; }   /* 幂偌：淡粉，女二号 */
.ln .sp.unknown{ color:#93a091; } /* 未知道姓名前，幂偌显示为「？？？」 */
.ln .sp.inner{ color:#a9a3c2; }  /* 内心独白：淡紫灰，和旁白区分 */
.ln.cur{ font-size:19px; color:#eaece6; }   /* 正在打字的当前行稍大 */
#next{ position:absolute; right:22px; bottom:18px; font-size:13px; color:rgba(200,208,194,.6);
    animation:blink 1.1s steps(1) infinite; pointer-events:none; }
#next.off{ display:none; }

/* ---- 顶部按钮：目录（节点选择回看）/ 重播 ---- */
#menuBtn, #end{
    position:absolute; top:12px; z-index:8; font:11px/1 inherit; letter-spacing:2px;
    color:rgba(200,208,194,.4); background:none; border:1px solid rgba(200,208,194,.2);
    padding:7px 10px; cursor:crosshair; border-radius:2px; transition:all .2s ease;
}
#menuBtn{ left:14px; } #end{ right:14px; }
#menuBtn:hover, #end:hover{ color:rgba(200,208,194,.85); border-color:rgba(200,208,194,.6); }
#end.off{ display:none; }

/* ---- 节点选择遮罩：回看任意一段 ---- */
#nodes{
    position:absolute; inset:0; z-index:15; display:none;
    background:rgba(7,9,12,.94); flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:30px;
}
#nodes.open{ display:flex; }
#nodes h2{ margin:0 0 6px; font-size:14px; letter-spacing:6px; color:var(--ink2); font-weight:normal; }
#nodes .list{ display:flex; flex-direction:column; gap:8px; width:min(420px,86%);
    max-height:calc(100% - 56px); overflow-y:auto; padding:4px 12px 4px 4px; }
#nodes .list::-webkit-scrollbar{ width:8px; }
#nodes .list::-webkit-scrollbar-track{ background:rgba(200,208,194,.05); }
#nodes .list::-webkit-scrollbar-thumb{ background:rgba(200,208,194,.25); border-radius:4px; }
#nodes .list::-webkit-scrollbar-thumb:hover{ background:rgba(200,208,194,.45); }
.node-item{
    all:unset; cursor:pointer; display:flex; align-items:center; gap:14px;
    padding:11px 16px; border:1px solid rgba(200,208,194,.22); border-radius:2px;
    color:var(--ink); font-size:14px; letter-spacing:1px; transition:all .18s ease;
}
.node-item:hover{ border-color:rgba(200,208,194,.7); background:rgba(200,208,194,.06); transform:translateX(4px); }
.node-item .no{ color:var(--ink2); font-size:12px; }
.node-item .nm{ flex:1; }

/* ---- 开场：空框 + 被小方框围起来的三角开始键 ---- */
#idle{
    position:absolute; inset:0; z-index:12;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:rgba(7,9,12,.97); transition:opacity .5s ease;
}
#idle.off{ opacity:0; pointer-events:none; }
#idle .tag{ font-size:12px; letter-spacing:6px; color:var(--ink2); }
#play{
    width:74px; height:74px; margin:0; border:1px solid rgba(200,208,194,.55);
    background:rgba(200,208,194,.04); color:var(--ink); cursor:pointer; font:30px/1 inherit;
    display:flex; align-items:center; justify-content:center; border-radius:3px;
    box-shadow:0 0 16px rgba(200,208,194,.16) inset, 0 0 20px rgba(200,208,194,.14);
    text-shadow:0 0 10px rgba(200,208,194,.55); position:relative;
    transition:transform .18s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
}
#play::before, #play::after{ content:""; position:absolute; width:9px; height:9px; border:0 solid rgba(200,208,194,.8); }
#play::before{ top:5px; left:5px; border-top-width:1px; border-left-width:1px; }
#play::after { bottom:5px; right:5px; border-bottom-width:1px; border-right-width:1px; }
#play:hover{ transform:scale(1.08); border-color:rgba(200,208,194,.9);
    box-shadow:0 0 24px rgba(200,208,194,.34) inset, 0 0 30px rgba(200,208,194,.3); }
#play:active{ transform:scale(.95); }
#idle .hint{ font-size:11px; letter-spacing:2px; color:rgba(200,208,194,.3); text-align:center; line-height:1.8; }

/* ============ 特效：化学实验室爆炸（独立火光画面） ============ */
#fx{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0;
    transition:opacity .25s ease;
}
#fx.explode{
    opacity:1;
    background:
        radial-gradient(circle at 50% 52%, rgba(255,244,190,.95), rgba(255,150,40,.72) 20%, rgba(220,46,12,.55) 38%, rgba(110,12,0,0) 62%),
        radial-gradient(circle at 34% 40%, rgba(255,196,84,.6), rgba(0,0,0,0) 40%),
        radial-gradient(circle at 68% 60%, rgba(255,150,40,.6), rgba(0,0,0,0) 42%);
    animation:fireburst 1.25s ease-out forwards;
}
@keyframes fireburst{
    0%{ transform:scale(.18); filter:brightness(2.4); opacity:0; }
    12%{ transform:scale(1.12); opacity:1; filter:brightness(1.7); }
    32%{ filter:brightness(1); }
    100%{ transform:scale(1.3); opacity:0; filter:brightness(.6); }
}
/* 爆炸时文字更实一点，压住火光 */
#textbox.overfx{ background:linear-gradient(180deg, rgba(7,9,12,.74), rgba(7,9,12,.32)); }

/* ============ 突脸层：整屏放大的老师脸（独立场景，背景直接换成脸） ============ */
#face{
    position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:#05070a;
    opacity:0; visibility:hidden; transition:opacity .35s ease;
}
#face.on{ opacity:1; visibility:visible; }
#face svg{ height:120%; width:auto;
    filter:drop-shadow(0 0 34px rgba(200,208,194,.14)); }
/* 突脸场景的文字略实一点，压在脸上好读 */
#textbox.facemode{ background:linear-gradient(180deg, rgba(7,9,12,.6), rgba(7,9,12,.2)); }

/* ============ 特效：天花板（摔倒后躺着仰视的独立画面） ============ */
#ceil{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; visibility:hidden;
    transition:opacity .4s ease;
    background:
        radial-gradient(circle at 50% 30%, rgba(255,248,222,.12), rgba(0,0,0,0) 30%),
        radial-gradient(130% 130% at 50% 50%, #11141a 42%, #05070a 100%);
}
#ceil::before{   /* 吊灯：平躺仰视时天花板上的灯 */
    content:""; position:absolute; top:6%; left:50%; transform:translateX(-50%);
    width:30px; height:40px; border-radius:0 0 50% 50%;
    background:radial-gradient(circle at 50% 28%, rgba(255,249,224,.95), rgba(255,240,200,.22) 58%, rgba(0,0,0,0) 72%);
    box-shadow:0 36px 70px 34px rgba(255,238,196,.10);
}
#ceil::after{   /* 四角暗影，强化仰视的包裹感 */
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,.6) 100%);
}
#ceil.on{ opacity:1; visibility:visible; }
/* 天花板场景文字略实一点，压在天棚上好读 */
#textbox.ceilmode{ background:linear-gradient(180deg, rgba(7,9,12,.62), rgba(7,9,12,.24)); }

/* ============ 走廊场景（出了教室以后，背景换成走廊） ============ */
#frame.corridor #bg{
    background:
        linear-gradient(180deg, rgba(4,6,9,.88) 0 20%, rgba(0,0,0,0) 46%),
        radial-gradient(140% 74% at 50% 62%, rgba(86,98,90,.34), rgba(7,9,12,1) 70%);
}
#frame.corridor #bg::before{ display:none; }   /* 走廊没有教室那扇窗 */
#frame.corridor #bg::after{                    /* 两侧依次排开的门 */
    content:""; position:absolute; top:30%; left:0; right:0; height:38%;
    background:repeating-linear-gradient(90deg, rgba(200,208,194,.05) 0 2px, rgba(0,0,0,0) 2px 92px);
}

/* ============ 镜头推进：把某个角色的立绘平滑放大怼近（不是整屏头像，不会吓人） ============ */
.actor.zoom{ z-index:6; left:50%!important; right:auto!important; margin-left:-115px!important; }
.actor.on.zoom .inner{ transform:scale(1.85) translateY(5%); }   /* .inner 自带 .8s 缓动 → 平滑推镜 */

/* ============ 倒视画面：躺着倒着看，整个画面旋转 180°（文字层不转） ============ */
#frame.down #bg, #frame.down #actors, #frame.down #ceil, #frame.down #face{
    transform:rotate(180deg); transition:transform .75s cubic-bezier(.3,.7,.3,1);
}

/* ============ 特效：画面抖动（爆炸冲击 / 突脸共用） ============ */
#frame.shake{ animation:shake .55s linear; }
@keyframes shake{
    0%,100%{ transform:translate(0,0); }
    10%{ transform:translate(-6px,4px); } 20%{ transform:translate(7px,-3px); }
    30%{ transform:translate(-5px,5px); } 40%{ transform:translate(6px,3px); }
    50%{ transform:translate(-4px,-4px); } 60%{ transform:translate(5px,2px); }
    70%{ transform:translate(-3px,3px); } 80%{ transform:translate(4px,-2px); }
    90%{ transform:translate(-2px,1px); }
}

/* ============ 特效：白光闪 ============ */
#flash{
    position:absolute; inset:0; z-index:25; pointer-events:none; opacity:0;
    background:rgba(255,244,232,.96);
}
#flash.on{ animation:flashpop .5s ease-out; }
@keyframes flashpop{ 0%{ opacity:0; } 16%{ opacity:1; } 100%{ opacity:0; } }

</style>
</head>
<body>
<div id="stageWrap">
    <div id="frame">
        <span class="cn tl"></span><span class="cn tr"></span>
        <span class="cn bl"></span><span class="cn br"></span>

        <div id="bg"></div>
        <div id="actors">
            <div class="actor heroine" id="aHero"><div class="inner"></div></div>
            <div class="actor boy"     id="aBoy"><div class="inner"></div></div>
            <div class="actor teacher" id="aTea"><div class="inner"></div></div>
            <div class="actor mira"    id="aMira"><div class="inner"></div></div>
        </div>

        <!-- 特效层：化学实验室爆炸的独立火光画面 -->
        <div id="fx"></div>

        <!-- 突脸层：整屏放大的老师脸（独立场景背景） -->
        <div id="face"></div>

        <!-- 天花板层：摔倒后躺着仰视的独立画面（背景直接换成天花板） -->
        <div id="ceil"></div>

        <div id="textbox">
            <div id="log"></div>
            <div id="next" class="off">▼</div>
        </div>

        <button id="menuBtn" title="目录 / 回看">☰ 目录</button>
        <button id="end" class="off" title="重播全部">↻ 重播</button>

        <!-- 节点选择遮罩 -->
        <div id="nodes">
            <h2>选 择 回 看 节 点</h2>
            <div class="list" id="nodeList"></div>
        </div>

        <!-- 开场 -->
        <div id="idle">
            <div class="tag">CUT1</div>
            <button id="play" title="开始">▶</button>
            <div class="hint">点 击 开 始　　·　　点 击 / 空 格 推 进 文 本<br>点「☰ 目录」可 回 看 任 意 一 段</div>
        </div>
        <!-- 特效层：白光闪（爆炸冲击 / jumpscare 突脸共用） -->
        <div id="flash"></div>
    </div>
</div>

<script>
/* ==================================================================
   CUT1 —— 老式文字 AVG / Galgame 演出（参考 Sayo 教风格）
   ------------------------------------------------------------------
   玩法：底部文本框逐字打出一长段文本，点击/空格推进；女主有立绘，
         其他角色用白边占位；顶部「☰ 目录」可跳到任意节点反复回看。
   素材：F:\网页游戏\幂偌0.2\原文.txt（第 2~3 段起，续写至初遇攀谈、自报姓名：涵盖第 3~37 段）
   ------------------------------------------------------------------
   ⚠ 幂偌的名字保护：她在「自报姓名」节点亲口叫出名字之前，说话人标签、
     立绘名牌、目录里含她名字的段名一律显示「？？？」；揭示后自动回溯更新。
     标记方式：那一条台词写 nameReveal:true。
   ------------------------------------------------------------------
   ⚠ 立绘目前是 SVG 占位图。以后换真素材：把 actorSVG() 里返回的
     <svg>…</svg> 换成 <img src="你画的立绘.png"> 即可（保持外层 .actor
     结构和 .inner / .on 类名不动，动画与切换逻辑无需改）。
   改剧情只动 NODES：每个节点 name=段名，cast=['heroine'|'boy'] 决定
         谁登场，lines=[{sp:说话人, t:文本}] 是逐条打出的台词。
         画面 flags（节点级）：reveal(空镜) / ceil(天花板) / down(倒视 180°) /
         scene:'corridor'(走廊背景) / face:'teacher'|'mira'(整屏大脸，慎用，很吓人) /
         zoom:'heroine'|'boy'|'teacher'|'mira'(镜头推进＝放大立绘，推荐代替 face) /
         fx:'explosion'(火光)。
         行级 flags（写在某一条台词上，这句一开演就生效）：
         scene:'corridor' / shake:true / ceil:true(切天花板) / zoom:'mira' / nameReveal:true(幂偌自报姓名)。
   ================================================================== */
(function(){
'use strict';

/* ---- 占位立绘 ----
   heroine = 原版填色立绘（框脸短发 + 圆点眼 + 微笑嘴），用户指定沿用；
   mira    = 填色立绘（黑色四六分及肩长发 + 白色吊带连衣裙 + 半截淡棕夹克），与女主靠发型/衣装区分；
   boy / teacher = 白边占位，露耳短发（与女主区分），只留两个圆点眼睛，无眉无嘴；
   teacher 额外加衬衫领 + 领带，和「男生」剪影区分。 */
function actorSVG(type){
    var isMira = (type === 'mira');
    var fill   = (type === 'heroine' || isMira);
    var isMale = (type === 'boy' || type === 'teacher');
    var skin  = fill ? '#e9d9c7' : 'none';
    var eye   = fill ? '#23201c' : 'none';
    var st    = fill ? 'rgba(200,208,194,.3)' : '#dfe6d8';
    var sw    = fill ? 1.2 : 2;
    var hair  = fill ? (isMira ? '#2c2622' : '#3a2f2a') : 'none';   // 幂偌=黑长发
    var cloth = fill ? (isMira ? '#d9d2c4' : '#6f7d6a') : 'none';   // 幂偌=白色连衣裙
    /* 发型区分：女主=框脸短发；幂偌=及肩长发；男生/班主任=露耳短发 */
    var hairPath;
    if (isMira){
        hairPath = 'M46 110 C44 42 156 42 154 110 L158 176 C158 198 140 206 140 206 L132 206 L132 150 C132 116 68 116 68 150 L68 206 L60 206 C60 206 42 198 42 176 Z';
    } else if (isMale){
        hairPath = 'M52 106 C52 50 82 38 100 38 C120 38 150 50 150 106 L150 94 C150 66 124 56 100 56 C76 56 52 66 52 94 Z';
    } else {
        hairPath = 'M48 100 C48 38 152 38 152 100 L154 158 C154 188 100 196 100 196 C100 196 46 188 46 158 Z';
    }
    /* 衣身：女主=裤装；幂偌=连衣裙（到膝）；男生=白边裤装 */
    var bodyPath = isMira
        ? 'M62 188 C70 176 130 176 138 188 L150 314 C122 332 78 332 50 314 Z'
        : 'M60 188 C70 172 130 172 140 188 L156 326 C122 344 78 344 44 326 Z';
    var extra = '';
    if (type === 'teacher'){
        // 白边 + 衬衫领 / 领带，和「男生」剪影区分开
        extra = '<path d="M84 188 L100 206 L116 188" fill="none" stroke="'+st+'" stroke-width="2"/>'
              + '<path d="M100 206 L95 252 L105 252 Z" fill="none" stroke="'+st+'" stroke-width="2"/>';
    }
    if (isMira){
        // 半截淡棕夹克，覆盖肩到腰，叠在连衣裙上

var pendingReveal = null;   // 当前这句打完后要执行的揭示回调

/* 立绘名牌初始值：不提前透露名字 */
aMira.querySelector('.inner').innerHTML = actorSVG('mira') + '<div class="nametag">？？？（占位立绘）</div>';

/* 占位立绘注入 */
aHero.querySelector('.inner').innerHTML = actorSVG('heroine') + '<div class="nametag">玻琳秋（占位立绘）</div>';
aBoy.querySelector('.inner').innerHTML  = actorSVG('boy')     + '<div class="nametag">男生（白边占位）</div>';
aTea.querySelector('.inner').innerHTML  = actorSVG('teacher') + '<div class="nametag">班主任（白边占位）</div>';
/* 突脸层：注入放大的老师头像（白边头部） */
faceEl.innerHTML = actorHeadSVG('teacher');

/* 说话人配色：幂偌在自报姓名前是「？？？」（unknown），之后才用 mira 淡粉 */
function spClass(sp){
    if (sp === '玻琳秋') return 'hero';
    if (sp === '班主任') return 'tea';
    if (sp === '幂偌')  return miraNamed ? 'mira' : 'unknown';
    if (sp === '男生')  return 'boy';
    if (sp === '内心')  return 'inner';
    return 'narr';
}

/* 目录条目：幂偌未揭晓时，含她名字的段名一律打码，避免剧透 */
function nodeLabel(n){
    return (!miraNamed && n.name.indexOf('幂偌') >= 0) ? '？？？' : n.name;
}

/* 切换「是否已知道幂偌名字」，并同步立绘名牌 + 目录条目 */
function setNamed(v){
    miraNamed = v;
    var nt = aMira.querySelector('.nametag');
    if (nt) nt.textContent = (v ? '幂偌' : '？？？') + '（占位立绘）';
    refreshNodes();
}

/* 名字揭示：幂偌亲口说出名字的那一刻调用。
   ① 切换状态 ② 回溯更新本幕已经打出的所有「？？？」标签 */
function revealMiraName(){
    setNamed(true);
    var tags = logEl.querySelectorAll('.sp[data-sp="mira"]');
    for (var i = 0; i < tags.length; i++){
        tags[i].textContent = '幂偌';
        tags[i].className = 'sp mira';
    }
}

/* 幂偌说出自己名字所在的节点序号（用于从目录跳段时判断该不该显示真名） */
function miraRevealIdx(){
    for (var i = 0; i < NODES.length; i++){
        var ls = NODES[i].lines;
        for (var j = 0; j < ls.length; j++) if (ls[j].nameReveal) return i;
    }
    return -1;
}

/* 登场角色切换 */
function setCast(cast){
    var aloneHero = (cast.length === 1 && cast[0] === 'heroine');
    aHero.classList.toggle('on', cast.indexOf('heroine') >= 0);
    aHero.classList.toggle('center', aloneHero);
    aBoy.classList.toggle('on', cast.indexOf('boy') >= 0);
    aTea.classList.toggle('on', cast.indexOf('teacher') >= 0);
    aMira.classList.toggle('on', cast.indexOf('mira') >= 0);
}

/* 目录节点列表 */
function buildNodes(){
    nodeList.innerHTML = '';
    NODES.forEach(function(n, i){
        var b = document.createElement('div');
        b.className = 'node-item';
        b.innerHTML = '<span class="no">' + (i+1) + '</span><span class="nm">' + nodeLabel(n) + '</span>';
        b.addEventListener('click', function(){ jumpNode(i); });
        nodeList.appendChild(b);
    });
}
function refreshNodes(){
    var items = nodeList.children;
    for (var i = 0; i < items.length && i < NODES.length; i++){
        items[i].querySelector('.nm').textContent = nodeLabel(NODES[i]);
    }
}

/* 开一行：把说话人 + 文本作为一条 .ln 追加到顶部文本区（累计），并逐字打出 */
function startLine(sp, t, line){
    var prev = logEl.querySelector('.ln.cur');
    if (prev) prev.classList.remove('cur');
    var div = document.createElement('div');
    div.className = 'ln cur';
    if (sp){
        var named = (sp !== '幂偌') || miraNamed;
        var s = document.createElement('span');
        s.className = 'sp ' + spClass(sp);
        s.textContent = named ? sp : '？？？';
        if (sp === '幂偌') s.setAttribute('data-sp', 'mira');   // 供揭示后回溯更新
        div.appendChild(s);
    }
    var tx = document.createElement('span');
    div.appendChild(tx);
    logEl.appendChild(div);
    curTx = tx; fullText = t; typing = true;
    nextEl.classList.add('off');
    // 幂偌自报姓名的那一句：打完（或被打断补全）才揭晓真名
    pendingReveal = (line && line.nameReveal) ? revealMiraName : null;
    typeInto();
    // 行级演出：背景切换 / 抖动 / 镜头推进（标记在某一句上时，这句一开始播就立刻生效）
    if (line){
        if (line.scene) frame.classList.toggle('corridor', line.scene === 'corridor');
        if (line.shake) doShake();
        if (line.zoom) applyZoom(line.zoom);
        if (line.ceil) applyCeil(true);
    }
}

/* 白光闪（化学实验室爆炸冲击用） */
function popFlash(){
    flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
    setTimeout(function(){ flashEl.classList.remove('on'); }, 520);
}

/* 画面抖动：爆炸冲击、绊倒等瞬间都可复用 */
function doShake(){
    frame.classList.remove('shake'); void frame.offsetWidth; frame.classList.add('shake');
    setTimeout(function(){ frame.classList.remove('shake'); }, 600);
}

/* 镜头推进：放大某个角色的立绘（zoom:'heroine'|'boy'|'teacher'|'mira'；空字符串=取消） */
function applyZoom(who){
    var map = { heroine:aHero, boy:aBoy, teacher:aTea, mira:aMira };
    map.heroine.classList.remove('zoom'); map.boy.classList.remove('zoom');
    map.teacher.classList.remove('zoom'); map.mira.classList.remove('zoom');
    if (who && map[who]) map[who].classList.add('zoom');
}

/* 天花板画面开关：立绘淡出 + 整屏换成躺着仰视的天花板 */
function applyCeil(on){
    frame.classList.toggle('bgonly', on);
    ceilEl.classList.toggle('on', on);
    textbox.classList.toggle('ceilmode', on);
}

/* 逐字打字机（打在 curTx 上） */
function typeInto(){
    clearTimeout(typeTimer);
    var i = 0;
    (function step(){
        if (i >= fullText.length){ typing = false; updateNext(); fireLineEnd(); return; }
        curTx.textContent = fullText.slice(0, i+1);
        var ch = fullText.charAt(i);
        var delay = (ch === '，' || ch === '。' || ch === '：' || ch === '、' || ch === '”' || ch === '』') ? 90 : 30;
        i++;
        typeTimer = setTimeout(step, delay);
    })();
}
function finishType(){
    clearTimeout(typeTimer);
    if (curTx) curTx.textContent = fullText;
    typing = false; updateNext(); fireLineEnd();
}
/* 一句打完/补全时执行挂起的揭示（幂偌自报姓名） */
function fireLineEnd(){ if (pendingReveal){ var fn = pendingReveal; pendingReveal = null; fn(); } }

/* ▼ 只在「还能继续推进」时显示 */
function updateNext(){
    if (typing){ nextEl.classList.add('off'); return; }
    var node = NODES[nodeIdx];
    var hasMore = (lineIdx < node.lines.length - 1) || (nodeIdx < NODES.length - 1);
    nextEl.classList.toggle('off', !hasMore);
}

/* 显示某节点的某条线（累计追加） */
function showLine(){
    var node = NODES[nodeIdx], line = node.lines[lineIdx];
    startLine(line.sp, line.t, line);
}

/* 进入某节点（清文本区 + 设置登场 + 背景揭示/爆炸/突脸画面 + 第一条线） */
function showNode(i){
    nodeIdx = i; lineIdx = 0;
    var node = NODES[i];
    logEl.innerHTML = '';
    setCast(node.cast);
    applyZoom(node.zoom || '');   // 节点级镜头推进（行级的由 startLine 处理）
    var reveal = !!node.reveal;
    var explosion = (node.fx === 'explosion');
    var facemode = node.face || '';      // 'teacher' / 'mira' → 整屏大脸角色
    var ceilmode = !!node.ceil;
    var downmode = !!node.down;          // 倒视：整个画面旋转 180°
    // reveal / 爆炸 / 天花板 都会让角色立绘淡出（bgonly），只剩背景或特效画面
    frame.classList.toggle('bgonly', reveal || explosion || ceilmode);
    frame.classList.toggle('down', downmode);
    frame.classList.toggle('corridor', node.scene === 'corridor');   // 出了教室换走廊背景
    textbox.classList.toggle('reveal', reveal);
    textbox.classList.toggle('overfx', explosion);
    textbox.classList.toggle('facemode', !!facemode);
    textbox.classList.toggle('ceilmode', ceilmode);
    // 突脸/近脸：背景直接换成整屏放大的脸（独立场景，覆盖正常背景与角色）
    if (facemode) faceEl.innerHTML = actorHeadSVG(facemode);
    faceEl.classList.toggle('on', !!facemode);
    // 天花板：背景直接换成抬头看到的天花板（躺着仰视的独立画面）
    ceilEl.classList.toggle('on', ceilmode);
    if (explosion){
        // 化学实验室爆炸：独立火光画面，覆盖背景与角色，随后切回正常画面
        fxEl.classList.remove('explode'); void fxEl.offsetWidth; fxEl.classList.add('explode');
        doShake();
        popFlash();
    } else {
        fxEl.classList.remove('explode');
    }
    startLine(node.lines[0].sp, node.lines[0].t, node.lines[0]);
}

/* 推进：没打完→打完；打完了→下一条 / 下一节点 / 结束 */
function advance(){
    if (!playing) return;
    if (typing){ finishType(); return; }
    var node = NODES[nodeIdx];
    if (lineIdx < node.lines.length - 1){ lineIdx++; showLine(); }
    else if (nodeIdx < NODES.length - 1){ showNode(nodeIdx + 1); }
    else endShow();
}

/* 从头播（反复观看整段）——名字状态重置 */
function startAll(){
    playing = true; closeNodes(); endBtn.classList.add('off'); idle.classList.add('off');
    setNamed(false);
    showNode(0);
}

/* 跳到某节点并继续（反复观看某一段）：跳到揭示之后就该显示真名，跳回之前则重新打码 */
function jumpNode(i){
    playing = true; closeNodes(); idle.classList.add('off'); endBtn.classList.add('off');
    var ri = miraRevealIdx();
    setNamed(ri >= 0 && i >= ri);
    showNode(i);
}

function endShow(){
    playing = false; endBtn.classList.remove('off');
    /* **这里什么都不解锁**（2026-10-03 改）：
       CUT2 不是看完这一段就白送的 —— 玩家得自己在学校官网里翻到「学生食堂」那一页，
       进去了才算"捡到"（标记由 canteen.html 自己写，见 pages/school/canteen.html）。
       线索是碎片化的：官网的快速通道、通告里的只言片语，都得他自己对上。 */
}

/* 目录开合 */
function openNodes(){ nodesEl.classList.add('open'); }
function closeNodes(){ nodesEl.classList.remove('open'); }

/* 交互 */
document.getElementById('play').addEventListener('click', function(e){ e.stopPropagation(); startAll(); });
idle.addEventListener('click', function(){ if (!nodesEl.classList.contains('open')) startAll(); });
frame.addEventListener('click', function(e){
    if (nodesEl.classList.contains('open')) { closeNodes(); return; }
    if (e.target.closest('#menuBtn') || e.target.closest('#end') || e.target.closest('#nodes')) return;
    advance();
});
endBtn.addEventListener('click', function(e){ e.stopPropagation(); startAll(); });
menuBtn.addEventListener('click', function(e){ e.stopPropagation(); nodesEl.classList.contains('open') ? closeNodes() : openNodes(); });
document.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'Enter'){
        e.preventDefault();
        if (nodesEl.classList.contains('open')) { closeNodes(); return; }
        if (idle.classList.contains('off')) advance(); else startAll();
    }
});

buildNodes();
setNamed(false);
})();
</script>
</body>
</html>
