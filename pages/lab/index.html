<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT7 · 实验楼</title>
<link rel="stylesheet" href="cut7.css">
<style>
/* ==================================================================
   第五段之后的那扇门（CUT8 入口）—— 只归选关页用
   ------------------------------------------------------------------
   走完第五段（mp_unlock_v1.cut7e）才出现；点开是一段对话问题，
   答对（黑板擦）才放行去 CUT8。答对过一次（cut8）之后，
   这一行就变成通往采访演出的普通入口，不再问。
   ================================================================== */
.lv.gate8{ border-color:rgba(176,35,42,.5); }
.lv.gate8 .tag{ color:#c8453f; border-color:rgba(176,35,42,.45); }
.lv.gate8.sel{ border-color:#c8453f; background:rgba(176,35,42,.08); }
.lv.gate8 .t{ color:#d8b9b4; }
.lv.gate8 .ar{ color:#c8453f; }

/* 答题遮罩：一段对话问题 + 输入框 */
#ask{ position:fixed; inset:0; z-index:90; display:none;
      align-items:center; justify-content:center; background:rgba(4,6,8,.97); }
#ask.on{ display:flex; }
#askbox{ width:min(760px,92vw); transform:translateY(16px); opacity:0;
         transition:opacity .5s ease, transform .5s ease; }
#askbox.on{ transform:none; opacity:1; }
#askbox #dbox{ width:100%; }
#askin{ margin-top:18px; display:flex; gap:10px; justify-content:center;
        opacity:0; pointer-events:none; transition:opacity .4s ease .15s; }
#askin.on{ opacity:1; pointer-events:auto; }
#ans{ flex:1; max-width:340px; background:#07090c; border:2px solid rgba(200,208,194,.4);
      color:var(--ink); font:16px/1.6 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei",monospace;
      letter-spacing:2px; padding:9px 14px; outline:none; }
#ans:focus{ border-color:#c8453f; }
#ok{ background:none; border:2px solid rgba(200,208,194,.4); color:var(--ink);
     font:14px/1 "Sarasa Mono SC","Microsoft YaHei",monospace; letter-spacing:3px;
     padding:10px 16px; cursor:pointer; transition:all .2s ease; }
#ok:hover{ border-color:#c8453f; color:#e8caca; }
#askhint{ margin-top:12px; text-align:center; font-size:13px; letter-spacing:2px;
          color:#8a5a56; opacity:0; transition:opacity .3s ease; min-height:20px; }
#askhint.on{ opacity:1; }
@keyframes askshake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
    40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(4px)} }
#askbox.shake{ animation:askshake .45s ease; }
</style>
</head>
<body>
<div id="wrap">
    <div id="head">
        <div class="cut">C U T 7</div>
        <h1>实 验 楼</h1>
        <div class="sub">KELI NO.1 MIDDLE SCHOOL LAB BUILDING</div>
    </div>
    <div id="levels"></div>
    <div id="foot"><b>↑ ↓</b> 选择　　<b>Z</b> 进入　　<b>X</b> 回主页面　　<b>M</b> 音效　　<span id="prog"></span></div>
</div>
<div id="veil"><div class="vm"></div></div>

<!-- 第五段之后的那扇门：先答对一个问题，才放行去 CUT8 -->
<div id="ask">
    <div id="askbox">
        <div id="dbox">
            <div id="dname"></div>
            <div id="dtext"></div>
            <div id="dnext">▶</div>
        </div>
        <div id="askin">
            <input id="ans" maxlength="10" placeholder="输入答案" autocomplete="off">
            <button id="ok">回　答</button>
        </div>
        <div id="askhint"></div>
    </div>
</div>

<script src="levels.js" charset="utf-8"></script>
<script src="sfx.js" charset="utf-8"></script>
<script src="big.js" charset="utf-8"></script>
<script src="dialog.js" charset="utf-8"></script>
<script>
/* ==================================================================
   CUT7 · 选关页
   ------------------------------------------------------------------
   ★ 关卡表在 levels.js，这一页只负责画出来 + 判断哪些能进：
       · need 没走完 → 锁
       · ready 为 false（那段页面还没做） → 也锁
     锁上的一律显示 ？？？，标题副标题都不泄底。
   ★ 走完的段数记在 mp_unlock_v1 里（cut7a / cut7b …），
     由**各段自己的页面**写 —— 这一页只读不写，避免出现两处写同一个键。
     唯一例外是 cut7 本身：玩家摸到这一页 = 捡到 CUT7，写一次（跟
     教室页写 cut3 同一套做法），主页面轮询到就飘出那枚网页按钮。
   ================================================================== */
(function(){
'use strict';

var box = document.getElementById('levels');
var veil = document.getElementById('veil');
var vm = veil.querySelector('.vm');
var prog = document.getElementById('prog');
var going = false;

function unlocks(){
    try { return JSON.parse(localStorage.getItem(LAB_UNLOCK_KEY) || '{}') || {}; }
    catch (e){ return {}; }
}
var U = unlocks();

/* 捡到这一页 = 解锁 CUT7（写一次，仅此一处） */
try {
    if (!U.cut7){ U.cut7 = 1; localStorage.setItem(LAB_UNLOCK_KEY, JSON.stringify(U)); }
} catch (e){}

function isOpen(lv){
    if (!lv.ready) return false;
    if (!lv.need) return true;
    return !!U[lv.need];
}

/* 刚进这一页的头 700ms 不认按键 —— 上一段结束时玩家往往还在连按 Z，
   不挡一下就会"刚回到选关、手一抖又进了第一段"。 */
var ready = false;
setTimeout(function(){ ready = true; }, 700);

var sel = 0;
var els = LAB_LEVELS.map(function(lv, i){
    var open = isOpen(lv);
    var el = document.createElement('div');
    el.className = 'lv' + (open ? '' : ' lock');
    el.innerHTML =
        '<div class="no">' + (open ? lv.no : '？？？') + '</div>' +
        '<div class="tag">' + (open ? lv.tag : '？') + '</div>' +
        '<div class="mid"><div class="t">' + (open ? lv.t : '？？？') + '</div>' +
        '<div class="d">' + (open ? lv.d : '—— 尚未解锁 ——') + '</div></div>' +
        '<div class="ar">▶</div>';
    el.addEventListener('click', function(){
        if (open) enter(i);
        else if (window.CUT7Sfx) window.CUT7Sfx.deny();
    });
    el.addEventListener('mouseenter', function(){ if (open){ sel = i; paint(); } });
    box.appendChild(el);
    return el;
});
function paint(){
    els.forEach(function(e, k){ e.classList.toggle('sel', k === sel && !e.classList.contains('lock')); });
}
paint();

/* 已走完几段 */
var doneN = LAB_LEVELS.filter(function(lv){ return U[lv.id]; }).length;
prog.textContent = '　已走完 ' + doneN + ' / ' + LAB_LEVELS.length + ' 段';

/* 界面音：上下移 / 进入 / 返回 / 撞到锁着的关（没引 sfx.js 就什么都不响） */
var SFX = window.CUT7Sfx || null;
function enter(i){
    var lv = LAB_LEVELS[i];
    if (!lv || !isOpen(lv) || going) return;
    going = true;
    if (SFX) SFX.step();
    vm.textContent = lv.no;
    veil.classList.add('on');
    setTimeout(function(){ location.href = lv.url; }, 900);
}
function back(){
    if (going) return;
    going = true;
    if (SFX) SFX.step();
    /* 主页面在项目根目录，不在 pages/ 下 —— 少一层会跳到不存在的 pages/index.html（404） */
    location.href = '../../index.html';
}
function move(d){
    var n = LAB_LEVELS.length;
    for (var k = 1; k <= n; k++){
        var i = (sel + d * k + n * 2) % n;
        if (isOpen(LAB_LEVELS[i])){ sel = i; paint(); if (SFX) SFX.move(); return; }
    }
    if (SFX) SFX.deny();     /* 一圈都是锁着的：给一声"过不去" */
}
document.addEventListener('keydown', function(e){
    if (!ready) return;
    /* 那扇门在答题：按键全归答题那边，选关这边一根手指都别动 */
    var askEl = document.getElementById('ask');
    if (askEl && askEl.classList.contains('on')) return;
    var k = e.key;
    if (k === 'ArrowDown'){ e.preventDefault(); move(1); }
    else if (k === 'ArrowUp'){ e.preventDefault(); move(-1); }
    else if (k === 'z' || k === 'Z' || k === 'Enter'){ e.preventDefault(); enter(sel); }
    else if (k === 'x' || k === 'X' || k === 'Escape'){ e.preventDefault(); back(); }
});
})();

/* ==================================================================
   第五段之后的那扇门（CUT8 入口）
   ------------------------------------------------------------------
   · 走完第五段（cut7e）→ 选关页末尾多出一行红框的"？？"，点开是
     一段对话问题，最后一句是红字；答对「黑板擦」→ 写 cut8 → 去 CUT8。
   · 答对过一次之后，这一行就变成通往采访演出的普通入口，不再问。
   · 答错：门框抖一下 + 一声"过不去"，第三次起给提示。
   · 问题本体在下面 SCRIPT 里，怎么打字归 dialog.js，怎么响归 sfx.js。
   ================================================================== */
(function(){
'use strict';
var KEY = 'mp_unlock_v1';
var box  = document.getElementById('levels');
var ask  = document.getElementById('ask');
var askbox = document.getElementById('askbox');
var dtext = document.getElementById('dtext');
var inWrap = document.getElementById('askin');
var ans  = document.getElementById('ans');
var hintEl = document.getElementById('askhint');
var going = false, wrongs = 0, opened = false;

function unlocks(){
    try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }
    catch (e){ return {}; }
}
var U = unlocks();
if (!U.cut7e) return;                      /* 第五段没走完：这扇门根本不存在 */

/* 那一行：没答过 = 红框的"？"；答过 = 通往采访演出的普通入口 */
var g = document.createElement('div');
if (U.cut8){
    g.className = 'lv gate8';
    g.innerHTML = '<div class="no">CUT8</div><div class="tag">问</div>'
        + '<div class="mid"><div class="t">答记者问</div>'
        + '<div class="d">火灾之后 —— 采访演出</div></div><div class="ar">▶</div>';
    g.addEventListener('click', function(){ location.href = '../interview/cut8.html'; });
} else {
    g.className = 'lv gate8';
    g.innerHTML = '<div class="no">？？</div><div class="tag">？</div>'
        + '<div class="mid"><div class="t">（有人在门口叫住了你）</div>'
        + '<div class="d">—— 回答一个问题，就让你过去。</div></div><div class="ar">▶</div>';
    g.addEventListener('click', openAsk);
}
box.appendChild(g);

/* ---------------- 那段对话问题 ---------------- */
var WHO = { narr:'' };
var SCRIPT = [
    { w:'narr', t:'……进这扇门之前，先回答一个问题。' },
    { w:'narr', t:'播音教室窗户下方的杂物里。' },
    { w:'narr', t:'那块黑色的东西……' },
    { w:'narr', t:'最有可能是什么？', red:true }
];

function openAsk(){
    if (opened) return;
    opened = true;
    ask.classList.add('on');
    requestAnimationFrame(function(){ askbox.classList.add('on'); });
    window.CUT7Dialog.play(SCRIPT, {
        who: WHO, sink: false,
        /* 最后一句是红字 —— 红色只挂在这一句上 */
        onLine: function(i, it){ dtext.style.color = it.red ? '#c8453f' : ''; },
        onEnd:  function(){
            inWrap.classList.add('on');
            setTimeout(function(){ ans.focus(); }, 300);
        },
        onExit: closeAsk
    });
}
function closeAsk(){
    opened = false;
    ask.classList.remove('on');
    inWrap.classList.remove('on');
    hintEl.classList.remove('on');
    hintEl.textContent = '';
    ans.value = '';
    going = false;
}
/* 答对：她替你把答案说出口，然后门就开了 */
function pass(){
    going = true;
    inWrap.classList.remove('on');
    if (window.CUT7Sfx) CUT7Sfx.step();
    window.CUT7Dialog.play([
        { w:'lq',   t:'——黑板擦。' },
        { w:'narr', t:'……门开了。' }
    ], {
        who: { narr:'', lq:'玻琳秋' }, sink: false,
        onLine: function(){ dtext.style.color = ''; },
        onEnd: function(){
            var u = unlocks(); u.cut8 = 1;
            try { localStorage.setItem(KEY, JSON.stringify(u)); } catch (e){}
            var veil = document.getElementById('veil');
            veil.querySelector('.vm').textContent = 'C U T 8';
            veil.classList.add('on');
            setTimeout(function(){ location.href = '../interview/cut8.html'; }, 1700);
        },
        onExit: function(){}
    });
}
function submit(){
    if (going || !inWrap.classList.contains('on')) return;
    /* 只看字面：空格和标点都不算数 */
    var v = (ans.value || '').replace(/[\s。．，,、.·]/g, '');
    if (!v) return;
    if (v === '黑板擦'){ pass(); return; }
    wrongs++;
    askbox.classList.remove('shake'); void askbox.offsetWidth; askbox.classList.add('shake');
    if (window.CUT7Sfx) CUT7Sfx.deny();
    hintEl.textContent = wrongs >= 3 ? '（三个字。播音教室里本来就有的东西。）'
                       : (wrongs === 2 ? '……不对。再想想。' : '……不对。');
    hintEl.classList.add('on');
}
document.getElementById('ok').addEventListener('click', submit);
ans.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); submit(); }
});
/* Esc = 把门带上，回选关 */
document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && ask.classList.contains('on') && !going) closeAsk();
});
})();
</script>
</body>
</html>
