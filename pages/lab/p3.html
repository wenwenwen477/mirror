<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT7 · 第三段　在楼梯上打了个照面</title>
<link rel="stylesheet" href="cut7.css">
</head>
<body>
<div id="ptag">C U T 7 ／ 第 三 段 ／ 二 层</div>
<div id="rpghint"><b>↑ ↓ ← →</b> 走　　<b>Z</b> 调查　　<b>C</b> 记录　　<b>X</b> 取消　　<b>M</b> 音效</div>

<!-- 开场那段戏：黑屏，背后是走廊的演出，对话框浮在正中 -->
<div id="scene"><canvas id="sc"></canvas></div>
<!-- 演完之后：RPG 的二层走廊 -->
<div id="world" class="hold"><canvas id="cv"></canvas></div>

<div id="stage">
    <div id="dbox">
        <div id="dname"></div>
        <div id="dtext"></div>
        <div id="dnext">▶</div>
    </div>
</div>

<div id="bag">
    <div class="bgh">随 身 · 记 下 的</div>
    <ul id="baglist"></ul>
    <div class="bgf"><b>C</b> / <b>X</b> 合上</div>
</div>

<div id="veil"><div class="vm"></div></div>

<script src="levels.js" charset="utf-8"></script>
<script src="sfx.js" charset="utf-8"></script>
<script src="big.js" charset="utf-8"></script>
<script src="dialog.js" charset="utf-8"></script>
<script src="scene.js" charset="utf-8"></script>
<script src="rpg.js" charset="utf-8"></script>
<script src="floor2.js" charset="utf-8"></script>
<script>
/* ==================================================================
   CUT7 · 第三段「二层 · 在楼梯上打了个照面」—— 页面只干三件事
   ------------------------------------------------------------------
   1) 开场：黑屏 + 居中对对话框，背后开演出（scene.js）。每条台词带一个
      cue，dialog.js 每翻一条回调 onLine，把 cue 转给演出，画面自己走。
   2) 演完：演出停、黑屏淡出、对话框改成 RPG 那一种（挪到画面下沿），
      把 floor2.js 那份地图交给 rpg.js —— 切回自由走位。
   3) 走到中楼梯按 Z = 上楼 → 停引擎 → 压暗画面 → 播 scripts.end →
      压黑「第 三 段 · 完」→ 写 mp_unlock_v1.cut7c → 回选关。
   ★ 台词、地图、cue 一个字都不写在这里 —— 改剧情只动 floor2.js。
   ★ 打字音在 sfx.js：man 是那个男人的嗓子（低、闷、吐字慢），
     mp 是幂偌（圆、亮，跟玻琳秋分得开）。
   ================================================================== */
(function(){
'use strict';

var veil  = document.getElementById('veil');
var vm    = veil.querySelector('.vm');
var box   = document.getElementById('dbox');
var world = document.getElementById('world');
var sceneEl = document.getElementById('scene');
var going = false;
var RPG = null;

function writeUnlock(){
    try {
        var u = JSON.parse(localStorage.getItem(LAB_UNLOCK_KEY) || '{}') || {};
        if (!u.cut7c){ u.cut7c = 1; localStorage.setItem(LAB_UNLOCK_KEY, JSON.stringify(u)); }
    } catch (e){}
}
function back(){
    if (going) return;
    going = true;
    location.href = 'index.html';
}
function veilTo(text, then, wait){
    vm.textContent = text || '';
    veil.classList.add('on');
    setTimeout(function(){ if (then) then(); }, wait || 1500);
}

/* ---------------- 1) 开场那段戏 ---------------- */
var scene = window.CUT7Scene.open(document.getElementById('sc'));
sceneEl.classList.add('on');

function toRPG(){
    scene.stop();
    sceneEl.classList.remove('on');
    world.classList.remove('hold');
    box.classList.add('rpg');
    box.classList.add('off');                 /* 先收起来，画面全留给走廊 */
    startRPG();
}

window.CUT7Dialog.play(P3_SCENE, {
    who:  P3_WHO,
    sink: false,
    onLine: function(i, it){ if (it.cue) scene.cue(it.cue); },
    onEnd:  function(){ setTimeout(toRPG, 700); },      /* 等黑屏淡出去再切 */
    onExit: function(){ toRPG(); }                      /* 按 X 也能跳到探索 */
});

/* ---------------- 2) 演完 → 切回 RPG ---------------- */
function startRPG(){
    RPG = window.CUT7RPG.start({
        canvas:  document.getElementById('cv'),
        data:    FLOOR2,
        who:     P3_WHO,
        box:     box,
        name:    document.getElementById('dname'),
        text:    document.getElementById('dtext'),
        next:    document.getElementById('dnext'),
        bag:     document.getElementById('bag'),
        bagList: document.getElementById('baglist'),
        intro:   FLOOR2.scripts.intro,
        onExit:  function(){ runEnd(); }
    });
}

/* ---------------- 3) 上楼：收尾 ---------------- */
function runEnd(){
    if (RPG) RPG.stop();
    box.classList.remove('off');
    world.classList.add('dim');                /* 镜头交给对话，画面压暗 */
    window.CUT7Dialog.play(FLOOR2.scripts.end, {
        who:  P3_WHO,
        box:  box,
        name: document.getElementById('dname'),
        text: document.getElementById('dtext'),
        next: document.getElementById('dnext'),
        onEnd: function(){
            writeUnlock();
            veilTo('第 三 段 · 完', back, 2600);
            document.addEventListener('keydown', function(e){
                if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter') back();
            });
        }
    });
}
})();
</script>
</body>
</html>
