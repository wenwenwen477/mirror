<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT7 · 第四段　播音主持教室</title>
<link rel="stylesheet" href="cut7.css">
</head>
<body>
<div id="ptag">C U T 7 ／ 第 四 段 ／ 三 层</div>
<div id="rpghint"><b>↑ ↓ ← →</b> 走　　<b>Z</b> 调查　　<b>C</b> 记录　　<b>X</b> 取消　　<b>M</b> 音效</div>

<!-- 开场那段戏：黑屏，背后是三层走廊和那扇大铁门，对话框浮在正中 -->
<div id="scene"><canvas id="sc"></canvas></div>
<!-- 演完之后：RPG 的播音主持教室 -->
<div id="world" class="hold"><canvas id="cv"></canvas></div>

<div id="stage">
    <div id="dbox">
        <div id="dname"></div>
        <div id="dtext"></div>
        <div id="dnext">▶</div>
    </div>
</div>

<div id="bag">
    <div class="bgh">随 身 · 记 下 的</div>
    <ul id="baglist"></ul>
    <div class="bgf"><b>C</b> / <b>X</b> 合上</div>
</div>

<div id="veil"><div class="vm"></div></div>

<script src="levels.js" charset="utf-8"></script>
<script src="sfx.js" charset="utf-8"></script>
<script src="big.js" charset="utf-8"></script>
<script src="dialog.js" charset="utf-8"></script>
<script src="scene3.js" charset="utf-8"></script>
<script src="rpg.js" charset="utf-8"></script>
<script src="floor3.js" charset="utf-8"></script>
<script>
/* ==================================================================
   CUT7 · 第四段「三层 · 播音主持教室」—— 页面只干三件事
   ------------------------------------------------------------------
   1) 开场：黑屏 + 居中对对话框，背后开演出（scene3.js：门口重逢）。
      每条台词带一个 cue，dialog.js 每翻一条回调 onLine，把 cue 转给
      演出，画面自己走；最后一拍是黑屏大字「又一次，她孤身一人。」
      （big.js），收掉它就切进教室。
   2) 演完：演出停、黑屏淡出、对话框改成 RPG 那一种（挪到画面下沿），
      把 floor3.js 那份地图交给 rpg.js —— 切回自由走位。
      这一回她一个人：教室里随便看看（讲台 / 窗 / 镜子 / 黑包 / 椅子），
      然后走到门边按 Z，把门反锁。
   3) 锁门 = 播 scripts.end（原文到「反正这样保险。」为止）→
      压黑「第 四 段 · 完」→ 写 mp_unlock_v1.cut7d → 回选关。
   ★ 台词、地图、cue 一个字都不写在这里 —— 改剧情只动 floor3.js。
   ★ 打字音在 sfx.js：mp 是幂偌（圆、亮），lq 是玻琳秋（亮、上挑）。
   ================================================================== */
(function(){
'use strict';

var veil  = document.getElementById('veil');
var vm    = veil.querySelector('.vm');
var box   = document.getElementById('dbox');
var world = document.getElementById('world');
var sceneEl = document.getElementById('scene');
var going = false;
var RPG = null;

function writeUnlock(){
    try {
        var u = JSON.parse(localStorage.getItem(LAB_UNLOCK_KEY) || '{}') || {};
        if (!u.cut7d){ u.cut7d = 1; localStorage.setItem(LAB_UNLOCK_KEY, JSON.stringify(u)); }
    } catch (e){}
}
function back(){
    if (going) return;
    going = true;
    location.href = 'index.html';
}
function veilTo(text, then, wait){
    vm.textContent = text || '';
    veil.classList.add('on');
    setTimeout(function(){ if (then) then(); }, wait || 1500);
}

/* ---------------- 1) 开场那段戏：门口重逢 ---------------- */
var scene = window.CUT7Scene3.open(document.getElementById('sc'));
sceneEl.classList.add('on');

function toRPG(){
    scene.stop();
    sceneEl.classList.remove('on');
    world.classList.remove('hold');
    box.classList.add('rpg');
    box.classList.add('off');                 /* 先收起来，画面全留给教室 */
    startRPG();
}

window.CUT7Dialog.play(P4_SCENE, {
    who:  P4_WHO,
    sink: false,
    onLine: function(i, it){ if (it.cue) scene.cue(it.cue); },
    /* 最后一拍是黑屏大字 —— 收掉卡就切，不在黑屏上留一只空框 */
    onEnd:  function(){ toRPG(); },
    onExit: function(){ toRPG(); }                      /* 按 X 也能跳到探索 */
});

/* ---------------- 2) 演完 → 切回 RPG：她一个人在教室里 ---------------- */
function startRPG(){
    RPG = window.CUT7RPG.start({
        canvas:  document.getElementById('cv'),
        data:    FLOOR3,
        who:     P4_WHO,
        box:     box,
        name:    document.getElementById('dname'),
        text:    document.getElementById('dtext'),
        next:    document.getElementById('dnext'),
        bag:     document.getElementById('bag'),
        bagList: document.getElementById('baglist'),
        intro:   FLOOR3.scripts.intro,
        onExit:  function(){ runEnd(); }            /* 门边反锁 = 这一段的终点 */
    });
}

/* ---------------- 3) 反锁房门：收尾 ---------------- */
function runEnd(){
    if (RPG) RPG.stop();
    box.classList.remove('off');
    world.classList.add('dim');                /* 镜头交给对话，画面压暗 */
    window.CUT7Dialog.play(FLOOR3.scripts.end, {
        who:  P4_WHO,
        box:  box,
        name: document.getElementById('dname'),
        text: document.getElementById('dtext'),
        next: document.getElementById('dnext'),
        onEnd: function(){
            writeUnlock();
            veilTo('第 四 段 · 完', back, 2600);
            document.addEventListener('keydown', function(e){
                if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter') back();
            });
        }
    });
}
})();
</script>
</body>
</html>
