<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例演示 · 文字 AVG 舞台</title>
<style>
/* ==================================================================
   示例演示：文字 AVG 舞台（框架）
   ------------------------------------------------------------------
   用途：给「全暴露式 Meta」配一个能实际运行、也能被一层层拆开的示例。
   素材：character/走廊.png（背景）· character/口林00.png / 口林01.png（立绘）
   滤镜：CRT（扫描线 / 栅格 / 暗角 / 滚动亮带 / 闪烁），文字：像素字体 Zpix
   结构：#stage
           └ #cam          ← 相机（整体推拉/横移）
               ├ #bg       ← 走廊背景
               └ #chara    ← 她的立绘（两张切换 = 口型）
           #fx             ← CRT 叠加层
           #ui #dg         ← 对话框
   控制：window.AVG（见文件末尾 API），按 D 开调试面板，按 A 开关自动播放。
   ================================================================== */
@font-face{
    font-family:"Zpix";
    src:url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@v3.1.9/dist/zpix.ttf") format("truetype");
    font-display:swap;
}
:root{
    --px:"Zpix","Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei",monospace;
    --ink:#cfe6d6; --eye:#c6d2c6; --edge:#8fb89a; --red:#ff3a3a;
    --fs:24px; --fs2:12px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:#04060a; overflow:hidden; }
body{ font-family:var(--px); -webkit-font-smoothing:none; text-rendering:geometricPrecision; color:var(--ink); }
#screen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 120% at 50% 45%,#0a1216,#04060a 72%);
}
#stage{
    position:relative; width:min(100vw,177.78vh); height:min(56.25vw,100vh);
    overflow:hidden; background:#000; border-radius:12px;
    box-shadow:0 0 0 2px #0b1411, 0 0 0 7px #060a09, 0 26px 90px rgba(0,0,0,.92),
               inset 0 0 150px rgba(0,0,0,.78), inset 0 0 34px rgba(120,255,190,.045);
    animation:poweron .8s ease-out both;
}
@keyframes poweron{
    0%{ transform:scale(1,.004); filter:brightness(3) blur(3px); }
    55%{ transform:scale(1,.02); filter:brightness(2.2) blur(1px); }
    100%{ transform:scale(1); filter:none; }
}

/* ---------- 相机 + 背景 + 立绘 ---------- */
#cam{
    position:absolute; inset:0; transform-origin:50% 50%; will-change:transform;
    filter:saturate(1.02) contrast(1.12) brightness(.88);
}
#bg{
    position:absolute; inset:-8%;
    background:#0c1113 url("../../character/走廊.png") center/cover no-repeat;
    image-rendering:pixelated;
}
#chara{
    position:absolute; left:50%; bottom:0; height:100%; transform-origin:50% 100%;
    opacity:0; will-change:transform,opacity;
}
#chara > .in{ height:100%; display:grid; transform-origin:50% 100%; }
#chara > .in.breathe{ animation:bob 3.4s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
#chara img{ grid-area:1 / 1; height:100%; width:auto; opacity:0;
    filter: contrast(1.35) saturate(0.7) brightness(1.2)
            drop-shadow(0 0 1px rgba(0,0,0,.6)) drop-shadow(0 0 9px rgba(255,175,205,.32)); }
#chara img.on{ opacity:1; }
/* 拆开（expose）时：在原位铺一层棋盘格，露出 PNG 的透明通道 */
#chara .ck{ grid-area:1 / 1; align-self:stretch; justify-self:stretch; z-index:-1; display:none;
    background-color:#cfcfcf; opacity:.78;
    background-image:linear-gradient(45deg,#9a9a9a 25%,transparent 25%),
        linear-gradient(-45deg,#9a9a9a 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#9a9a9a 75%),
        linear-gradient(-45deg,transparent 75%,#9a9a9a 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
#chara.raw .ck{ display:block; }

/* ---------- CRT 叠加层 ---------- */
#fx{ position:absolute; inset:0; z-index:40; pointer-events:none; overflow:hidden; }
#fx > div{ position:absolute; inset:0; }
#fx .scan{ background:repeating-linear-gradient(to bottom,rgba(0,0,0,.40) 0 1px,rgba(0,0,0,0) 1px 3px); opacity:.9; }
#fx .rgb{ background:repeating-linear-gradient(to right,rgba(255,60,60,.05) 0 1px,rgba(60,255,90,.05) 1px 2px,rgba(70,110,255,.05) 2px 3px); opacity:.5; }
#fx .vig{ background:radial-gradient(130% 130% at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.45) 82%,rgba(0,0,0,.88) 100%); }
#fx .glow{ box-shadow:inset 0 0 100px rgba(110,255,185,.05), inset 0 0 30px rgba(0,0,0,.55); }
#fx .roll{
    inset:auto 0 auto 0; height:26%;
    background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.04),rgba(255,255,255,0));
    animation:roll 8s linear infinite;
}
@keyframes roll{ 0%{ top:-28%; } 100%{ top:104%; } }
#fx .flick{ background:rgba(140,255,200,.02); animation:flick 4.1s steps(1) infinite; }
@keyframes flick{ 0%,100%{opacity:.30} 43%{opacity:.55} 45%{opacity:.12} 47%{opacity:.45} 49%{opacity:.25} }
#fx.off{ display:none; }

/* ---------- 拆解标签（expose） ---------- */
#labels{ position:absolute; inset:0; z-index:45; pointer-events:none; opacity:0; transition:opacity .3s; }
#stage.expose #labels{ opacity:1; }
#labels .lb{
    position:absolute; font-size:var(--fs2); line-height:1.5; color:#bff0d6;
    background:rgba(0,0,0,.74); border:1px solid rgba(120,255,190,.5); padding:3px 8px; white-space:nowrap;
    text-shadow:0 0 6px rgba(120,255,190,.25);
}
.l-cam{ top:8px; left:8px; }
.l-fx { top:8px; right:8px; }
.l-bg { top:34px; left:8px; }
.l-ch { bottom:8px; right:8px; }
.l-ui { bottom:8px; left:8px; }
#stage.expose #cam{ outline:1px dashed rgba(120,255,190,.5); }
#stage.expose #bg{ outline:1px dashed rgba(120,200,255,.6); }
#stage.expose #chara{ outline:1px dashed rgba(255,190,90,.75); }
#stage.expose #fx{ outline:1px dashed rgba(255,90,90,.6); }
#stage.expose #dg{ outline:1px dashed rgba(255,255,255,.5); }

/* ---------- UI / 对话框 ---------- */
#ui{ position:absolute; inset:0; z-index:50; pointer-events:none; }
#top{
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:9px 14px; font-size:var(--fs2); color:#8fb69f; text-shadow:0 0 6px rgba(120,255,190,.2);
}
#dg{
    position:absolute; left:6%; right:6%; bottom:4.5%; min-height:22%;
    background:rgba(2,6,5,.80); border:3px solid var(--edge); padding:16px 20px 24px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.6), 0 0 26px rgba(0,0,0,.7);
    opacity:0; transform:translateY(10px); transition:opacity .35s ease, transform .35s ease;
}
#dg.on{ opacity:1; transform:none; }
#dg::before,#dg::after{ content:""; position:absolute; width:12px; height:12px; border:2px solid var(--edge); }
#dg::before{ left:-3px; top:-3px; border-right:0; border-bottom:0; }
#dg::after{ right:-3px; bottom:-3px; border-left:0; border-top:0; }
#dg-nm{
    position:absolute; left:-3px; top:calc(-1 * var(--fs) - 16px);
    background:#020605; border:3px solid var(--edge); padding:2px 14px;
    font-size:var(--fs); color:var(--eye); letter-spacing:1px; display:none;
}
#dg-nm.on{ display:block; }
#dg-tx{
    font-size:var(--fs); line-height:1.55; color:var(--eye); white-space:pre-wrap;
    text-shadow:1px 0 rgba(255,60,60,.28), -1px 0 rgba(70,120,255,.28), 0 0 8px rgba(190,230,205,.22);
}
#dg-more{ position:absolute; right:14px; bottom:8px; font-size:var(--fs); color:var(--eye); opacity:0; }
#dg-more.on{ opacity:1; animation:curblink 1.1s steps(1) infinite; }
/* 末态（终态）才浮出的「返回主页面」入口：演完末句 → 加 .on 显示 */
#meta-home{ position:absolute; right:14px; bottom:12px; font-size:var(--fs2); color:var(--eye);
    text-decoration:none; opacity:0; pointer-events:none; transition:opacity .3s; letter-spacing:1px; }
#meta-home.on{ opacity:.85; pointer-events:auto; }
#meta-home:hover{ opacity:1; }
@keyframes curblink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* ---------- 调试面板 ---------- */
#dbg{
    position:absolute; right:10px; bottom:10px; z-index:60; width:252px; display:none;
    background:rgba(3,8,6,.95); border:2px solid rgba(120,255,190,.45); padding:10px 12px;
    font-size:var(--fs2); color:#bfe8cf; line-height:1.5;
}
#dbg.on{ display:block; }
#dbg h4{ margin:0 0 6px; font-size:var(--fs2); color:#8fe0b8; letter-spacing:1px; }
#dbg label{ display:block; margin:8px 0 2px; color:#8fb69f; }
#dbg input[type=range]{ width:100%; accent-color:#4fd39a; }
#dbg .row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
#dbg button{
    font-family:var(--px); font-size:var(--fs2); background:#0b1a14; color:#bfe8cf;
    border:1px solid rgba(120,255,190,.4); padding:4px 8px; cursor:pointer;
}
#dbg button:hover{ background:#123326; }
#dbg .kv{ color:#6f9a83; }

#flash{ position:absolute; inset:0; z-index:70; background:#eafff4; opacity:0; pointer-events:none; }
#flash.on{ animation:flash .5s ease-out; }
@keyframes flash{ 0%{opacity:.9} 100%{opacity:0} }

/* ---------- 选项（阻塞式） ---------- */
#choices{
    position:absolute; left:6%; right:6%; bottom:30%; z-index:55;
    display:none; flex-direction:column; gap:10px; pointer-events:auto;
}
#choices.on{ display:flex; }
#choices .c{
    font-family:var(--px); font-size:var(--fs); color:var(--eye);
    background:rgba(2,6,5,.88); border:3px solid var(--edge); padding:12px 18px;
    text-align:left; cursor:pointer; letter-spacing:1px;
    text-shadow:0 0 8px rgba(190,230,205,.2); transition:background .15s, transform .1s;
}
#choices .c:hover{ background:rgba(12,30,22,.96); transform:translateX(6px); }
#choices .c::before{ content:"▸ "; color:#6f9a83; }

/* ---------- 自由输入（提问系统） ---------- */
#ask{
    position:absolute; left:6%; right:6%; bottom:30%; z-index:56;
    display:none; flex-direction:column; gap:10px; pointer-events:auto;
    background:rgba(2,6,5,.9); border:3px solid var(--edge); padding:14px 16px;
}
#ask.on{ display:flex; }
#ask-lb{ font-family:var(--px); font-size:var(--fs2); color:#ff9ecb; letter-spacing:1px;
    text-shadow:0 0 8px rgba(255,150,200,.35); }
#ask-row{ display:flex; gap:10px; }
#ask-in{
    flex:1; font-family:var(--px); font-size:var(--fs); color:#eafff4;
    background:rgba(0,0,0,.55); border:2px solid #4fd39a; padding:8px 12px; outline:none;
    letter-spacing:2px;
}
#ask-in:focus{ border-color:#9dffce; box-shadow:0 0 10px rgba(80,210,150,.4); }
#ask-go{
    font-family:var(--px); font-size:var(--fs); color:#4fd39a;
    background:#0d1f17; border:2px solid #4fd39a; padding:8px 18px; cursor:pointer; letter-spacing:2px;
}
#ask-go:hover{ background:#143024; }
#ask .wrong{ color:#ffd24d; font-family:var(--px); font-size:var(--fs2); letter-spacing:1px; }
/* 输入时把背景对话虚化，让输入区成为明确焦点 */
#dg{ transition:opacity .18s, top .18s ease; }
#stage.askon #dg{ opacity:.22; }

/* 居中独白态 + 选项/输入框：对话框上移让位；可点区域稍后淡入，
   避免「对话框还在下移、按钮已经压上来」的那一下瞬态重叠 */
@keyframes chin{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
#stage.centerdg.choiceon #dg.center{ top:32%; }
#stage.centerdg.choiceon #choices{ bottom:7%; gap:8px; animation:chin .24s ease .2s both; }
#stage.centerdg.askon #dg.center{ top:32%; }
#stage.centerdg.askon #ask{ bottom:12%; animation:chin .24s ease .2s both; }

/* ---------- 红字 ---------- */
#dg-tx .red{ color:#ff4d4d; text-shadow:0 0 10px rgba(255,60,60,.55), 1px 0 rgba(255,60,60,.3), -1px 0 rgba(120,160,255,.25); }

/* ---------- 背景隐藏 / 对话框居中 ---------- */
#stage.nobg #bg{ display:none; }
#stage.nobg{ background:#02050a; }
#dg.center{ left:50%; right:auto; top:50%; bottom:auto; transform:translate(-50%,-50%); min-height:0; max-width:78%; }
#dg.center.on{ transform:translate(-50%,-50%); }

/* ---------- 强制切出屏 ---------- */
#cutout{
    position:absolute; inset:0; z-index:90; background:#000; color:#9fd9b6;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    font-size:var(--fs); text-align:center; gap:16px; padding:8%;
}
#cutout.on{ display:flex; }
#cutout .s{ color:#6f9a83; font-size:var(--fs2); }
#cutout button{
    font-family:var(--px); font-size:var(--fs); background:#0b1a14; color:#bfe8cf;
    border:2px solid rgba(120,255,190,.5); padding:10px 22px; cursor:pointer;
}
</style>
</head>
<body>

<div id="screen">
  <div id="stage">
    <div id="cam">
      <div id="bg"></div>
      <div id="chara"><div class="in" id="chara-in">
        <div class="ck"></div>
        <img id="face0" alt="" src="../../character/口林00.png">
        <img id="face1" alt="" src="../../character/口林01.png">
      </div></div>
    </div>

    <div id="fx">
      <div class="scan"></div>
      <div class="rgb"></div>
      <div class="roll"></div>
      <div class="glow"></div>
      <div class="flick"></div>
      <div class="vig"></div>
    </div>

    <div id="labels">
      <div class="lb l-cam">CAM　#cam　translate + scale</div>
      <div class="lb l-fx">CRT　#fx　扫描线 / 栅格 / 暗角 / 滚动 / 闪烁</div>
      <div class="lb l-bg">BG　走廊.png　2848x1400　cover</div>
      <div class="lb l-ch">CHARA　口林00 / 口林01.png　1280x960　rgba（透明）</div>
      <div class="lb l-ui">UI　#dg　Zpix 像素字体</div>
    </div>

    <div id="ui">
      <div id="top">
        <span class="t">示例演示　·　文字 AVG 舞台</span>
        <span class="r">点击 / 空格：继续　　A：自动　　D：调试</span>
      </div>
      <div id="dg">
        <div id="dg-nm"></div>
        <div id="dg-tx"></div>
        <div id="dg-more">▼</div>
      </div>
    </div>

    <div id="dbg">
      <h4>调试面板　<span class="kv">D 开关</span></h4>
      <label>镜头缩放 <span class="kv" id="v-z">1.00</span></label>
      <input type="range" id="r-z" min="60" max="240" value="100">
      <label>镜头横移 <span class="kv" id="v-x">0</span></label>
      <input type="range" id="r-x" min="-40" max="40" value="0">
      <label>立绘横移 <span class="kv" id="v-cx">0</span></label>
      <input type="range" id="r-cx" min="-60" max="60" value="0">
      <label>立绘大小 <span class="kv" id="v-cs">1.00</span></label>
      <input type="range" id="r-cs" min="60" max="170" value="100">
      <div class="row">
        <button data-a="f0">闭口</button>
        <button data-a="f1">开口</button>
        <button data-a="mir">镜像</button>
        <button data-a="bh">呼吸</button>
        <button data-a="hide">淡出</button>
        <button data-a="show">淡入</button>
      </div>
      <div class="row">
        <button data-a="crt">CRT 开/关</button>
        <button data-a="exp">拆开</button>
        <button data-a="replay">重播</button>
      </div>
    </div>

    <div id="flash"></div>

    <div id="choices"></div>
    <div id="ask">
      <div id="ask-lb"></div>
      <div id="ask-row">
        <input id="ask-in" type="text" autocomplete="off" spellcheck="false" maxlength="16">
        <button id="ask-go" data-a="go">确认</button>
      </div>
      <div class="wrong" id="ask-wrong" style="display:none"></div>
    </div>
    <div id="cutout">
      <div>【已强制切出 · 进度已保存】</div>
      <div class="s">下一次进入时，将从「核对」环节继续。</div>
      <button id="cutout-btn">继续（回到核对）</button>
    </div>
    <a id="meta-home" href="../../index.html">↩ 返回主页面</a>
  </div>
</div>

<script>
(function(){
"use strict";

var $ = function(s){ return document.querySelector(s); };
var stage = $('#stage'), cam = $('#cam'), chara = $('#chara'), cin = $('#chara-in'),
    f0 = $('#face0'), f1 = $('#face1'), fx = $('#fx'),
    dg = $('#dg'), tx = $('#dg-tx'), nmEl = $('#dg-nm'), more = $('#dg-more'),
    dbg = $('#dbg'), flash = $('#flash'),
    choicesEl = $('#choices'), cutoutEl = $('#cutout'), cutoutBtn = $('#cutout-btn'),
    askBox = $('#ask'), askLb = $('#ask-lb'), askIn = $('#ask-in'), askGo = $('#ask-go'), askWrong = $('#ask-wrong'),
    metaHome = $('#meta-home');

/* 演出运行时状态：说话人名字（玩家可选）、是否在等选项、中断令牌 */
var NAME = '？？？', NAMEBOX = true, inChoice = false, BREAK = { __brk:true };
    /* metaHome 已在上方变量链里声明并赋值（#meta-home 末态「返回主页面」入口） */

/* ---------- 状态 ---------- */
var S = {
    cam: { z:1, x:0, y:0 },
    ch : { x:0, y:0, s:1, mirror:false, op:0 }
};
var stageW = 1280, stageH = 720;
var cur = null, typingTimer = null, autoTimer = null, autoOn = false, AUTO_MS = 2400;
var gen = 0;      /* gen：脚本世代号，reset 时 +1 可中断正在演的旧脚本 */
var SPEED = 1;    /* 演出速度倍率：续传快进时置 0，追上进度后恢复 1 */

/* ---------- 度量：像素字号取 12 的整数倍，保证 Zpix 锐利 ---------- */
function measure(){
    stageW = stage.clientWidth; stageH = stage.clientHeight;
    var base = stageW / 1280 * 24;
    var fs  = Math.max(12, Math.round(base / 12) * 12);
    var fs2 = Math.max(12, Math.round(fs / 2 / 12) * 12);
    stage.style.setProperty('--fs', fs + 'px');
    stage.style.setProperty('--fs2', fs2 + 'px');
    applyCam(); applyChara();
}
function applyCam(){
    cam.style.transform = 'translate3d(' + (S.cam.x / 100 * stageW) + 'px,' +
        (S.cam.y / 100 * stageH) + 'px,0) scale(' + S.cam.z + ')';
}
function applyChara(){
    var sx = S.ch.s * (S.ch.mirror ? -1 : 1);
    chara.style.transform = 'translate(-50%,0) translate3d(' + (S.ch.x / 100 * stageW) + 'px,' +
        (-S.ch.y / 100 * stageH) + 'px,0) scale(' + sx + ',' + S.ch.s + ')';
    chara.style.opacity = S.ch.op;
}

/* ---------- 补间 ---------- */
function easeInOut(p){ return p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2; }
function animate(dur, fn){
    return new Promise(function(res){
        dur = (dur || 0) * SPEED;                 /* SPEED=0：续传快进时补间直接跳到终点 */
        if (!dur || dur <= 0){ fn(1); res(); return; }
        var t0 = performance.now();
        (function frame(now){
            var p = Math.min(1, (now - t0) / dur);
            fn(easeInOut(p));
            if (p < 1) requestAnimationFrame(frame); else res();
        })(performance.now());
    });
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms || 0); }); }

/* ---------- 相机 ---------- */
function camTo(o){
    o = o || {};
    var dur = (o.dur == null) ? 800 : o.dur;
    var f = { z:S.cam.z, x:S.cam.x, y:S.cam.y };
    var t = {
        z:(o.z == null ? f.z : o.z),
        x:(o.x == null ? f.x : o.x),
        y:(o.y == null ? f.y : o.y)
    };
    return animate(dur, function(k){
        S.cam.z = f.z + (t.z - f.z) * k;
        S.cam.x = f.x + (t.x - f.x) * k;
        S.cam.y = f.y + (t.y - f.y) * k;
        applyCam();
    });
}

/* ---------- 立绘 ---------- */
function charaTo(o){
    o = o || {};
    var dur = (o.dur == null) ? 700 : o.dur;
    var f = { x:S.ch.x, y:S.ch.y, s:S.ch.s, op:S.ch.op };
    var t = {
        x:(o.x == null ? f.x : o.x),
        y:(o.y == null ? f.y : o.y),
        s:(o.s == null ? f.s : o.s),
        op:(o.opacity == null ? f.op : o.opacity)
    };
    if (o.mirror != null) S.ch.mirror = !!o.mirror;
    return animate(dur, function(k){
        S.ch.x = f.x + (t.x - f.x) * k;
        S.ch.y = f.y + (t.y - f.y) * k;
        S.ch.s = f.s + (t.s - f.s) * k;
        S.ch.op = f.op + (t.op - f.op) * k;
        applyChara();
    });
}
function face(i){
    f0.classList.toggle('on', i === 0);
    f1.classList.toggle('on', i === 1);
}
function breathe(on){ cin.classList.toggle('breathe', !!on); }

/* ---------- 说话（逐字 + 口型 + 红字） ---------- */
function setName(str){
    if (str == null || str === ''){ nmEl.classList.remove('on'); return; }
    nmEl.textContent = str; nmEl.classList.add('on');
}
/* 把 [[red]]…[[/red]] 拆成「普通/红字」片段，便于渐进渲染 */
function splitRed(text){
    var parts = [], re = /\[\[(\/?)(red)\]\]/g, m, pos = 0, red = false;
    while ((m = re.exec(text))){
        var seg = text.slice(pos, m.index);
        if (seg.length) parts.push({ t:seg, r:red });
        pos = re.lastIndex;
        red = (m[1] !== '/');
    }
    var tail = text.slice(pos);
    if (tail.length) parts.push({ t:tail, r:red });
    return parts;
}
/* 完整渲染成红字 span 的文档片段 */
function renderText(text){
    var frag = document.createDocumentFragment();
    splitRed(text).forEach(function(p){
        if (p.r){ var s = document.createElement('span'); s.className = 'red'; s.textContent = p.t; frag.appendChild(s); }
        else frag.appendChild(document.createTextNode(p.t));
    });
    return frag;
}
/* 只渲染前 count 个“可见字符”，红字标签同样随打字渐进出现 */
function renderPartial(text, count){
    var frag = document.createDocumentFragment();
    var shown = 0, inSpan = false, curSpan = null;
    var parts = splitRed(text);
    for (var i = 0; i < parts.length; i++){
        var p = parts[i];
        var avail = count - shown;
        if (avail <= 0) break;
        var chunk = p.t.slice(0, avail);
        if (!chunk.length) continue;
        if (p.r){
            if (!inSpan){ curSpan = document.createElement('span'); curSpan.className = 'red'; frag.appendChild(curSpan); inSpan = true; }
            curSpan.appendChild(document.createTextNode(chunk));
        } else {
            if (inSpan){ inSpan = false; curSpan = null; }
            frag.appendChild(document.createTextNode(chunk));
        }
        shown += chunk.length;
    }
    return frag;
}
function plain(s){ return s.replace(/\[\[red\]\]|\[\[\/red\]\]/g, ''); }
function say(text, opt){
    opt = opt || {};
    return new Promise(function(res){
        if (opt.name != null && NAMEBOX) setName(opt.name);
        else if (NAME && NAMEBOX) setName(NAME);
        else if (!NAMEBOX) setName('');
        clearTimeout(autoTimer); autoTimer = null;
        clearChoice();
        dg.classList.add('on');
        more.classList.remove('on');
        tx.textContent = '';
        var ptext = plain(text);
        var st = { text:text, i:0, spd:opt.speed || 34, mouth:(opt.mouth !== false), res:res, done:false };
        cur = st;
        clearInterval(typingTimer);
        if (st.mouth) face(1);                 /* 说话＝固定用「开口」那张静态立绘 */
        function complete(){
            if (st.done) return;
            st.done = true;
            clearInterval(typingTimer); typingTimer = null;
            tx.innerHTML = ''; tx.appendChild(renderText(text));
            face(0);                            /* 说完＝回到「闭口」那张 */
            /* 终态（定在末句）不出 ▼ 也不自动推进 —— 那里就是终点，没有下一句了 */
            if (!ENDED) more.classList.add('on');
            if (!ENDED && autoOn && !inChoice) autoTimer = setTimeout(advance, AUTO_MS);
        }
        st.complete = complete;
        typingTimer = setInterval(function(){
            st.i++;
            tx.innerHTML = ''; tx.appendChild(renderPartial(text, st.i));
            if (st.i >= ptext.length) complete();
        }, st.spd);
    });
}
function advance(){
    if (inChoice) return;                      // 选项出现时，空格/点击不推进对话
    clearTimeout(autoTimer); autoTimer = null;
    if (!cur) return;
    if (!cur.done){ cur.complete(); return; }   // 第一下：把字打完
    var st = cur; cur = null; more.classList.remove('on');
    st.res();                                    // 第二下：进入下一句
}
function clearDlg(){

    clearTimeout(autoTimer); autoTimer = null;
    dg.classList.remove('on'); tx.textContent = ''; more.classList.remove('on');

/* ---------- 交互式演出引擎（await 流程 + gen 中断） ---------- */
function guard(my){ if (my !== gen) return Promise.reject(BREAK); return Promise.resolve(); }
function A(my, p){ if (my !== gen) return Promise.reject(BREAK); return p; }

/* 选项（阻塞，返回选中下标） */

/* 自由输入（阻塞）。judge 为可选判定函数：返回 false 时不关闭、就地提示并等重输
   wrongMsg 可自定义错答提示（不同题目给的引导不同） */
function ask(my, label, judge, wrongMsg){
    if (my !== gen) return Promise.reject(BREAK);
    return new Promise(function(res){
        clearChoice();
        askWrong.style.display = 'none';
        askLb.textContent = label || '请输入答案（回车或点确认）：';
        askBox.classList.add('on'); stage.classList.add('askon'); inChoice = true;
        askIn.value = ''; askIn.disabled = false;
        setTimeout(function(){ try{ askIn.focus(); }catch(e){} }, 40);
        function attempt(){
            var v = askIn.value;
            if (judge && !judge(v)){                 // 答错：留在框内提示重试
                /* wrongMsg 可以是字符串，也可以是函数（按答错次数给不同力度的线索） */
                var wm = (typeof wrongMsg === 'function') ? wrongMsg() : wrongMsg;
                askWrong.textContent = wm || '（这不太对……她的名字就在前面的语境里，再想想？）';
                askWrong.style.display = 'block';
                askIn.value = '';
                try{ askIn.focus(); }catch(e){}
                return;
            }
            inChoice = false;
            askBox.classList.remove('on'); stage.classList.remove('askon');
            askIn.onkeydown = null; askGo.onclick = null;
            res(v);
        }
        askIn.onkeydown = function(e){
            if (e.key === 'Enter'){ e.preventDefault(); attempt(); }
        };
        askGo.onclick = attempt;
    });
}
/* 判定输入是否命中答案（忽略空格/标点/大小写） */
function judgeInput(ans, expect){
    var norm = function(s){ return (s || '').toLowerCase().replace(/[\s，。、！？!?.,]/g, ''); };
    return norm(ans) === norm(expect);
}

/* ---------- 邀请编号（与 travel/qcheck.html 同一套口径） ----------
   qcheck 做完体验核对清单才生成：INV-130331-4827 形式，存 localStorage['mp_bot_invite']。
   编号是**随机**的（qcheck 第 320 行 Math.random）——这里保持随机、不改成统一：
   玩家明知它是随机生成的，却仍然认领这一个属于自己的号码，正是「全暴露」的锚点。 */
var INV_KEY = 'mp_bot_invite';
var INV_RE  = /^INV-[0-9]{6}-[0-9]{4}$/;
function storedInv(){
    try { var v = localStorage.getItem(INV_KEY) || ''; } catch(e){ v = ''; }
    return INV_RE.test(v) ? v : '';
}
/* 玩家输入归一化：去空格、转大写，允许玩家抄成 inv-130331-4827 / INV 130331 4827 */
function normInv(s){
    return (s || '').toUpperCase().replace(/[\s_—–-]/g, '');
}

/* ---------- 那个男人的工号：EMP-2011-0473 ----------
   与 novel/index.html 三问第 ② 问、travel/insurer.html 检索键同一套口径：
   只留字母数字汉字，空格/连字符/大小写全不算 ——
   于是 EMP-2011-0473 / emp20110473 / emp 2011 0473 都一样。
   提示**不直接给答案**（沿用本站约定：判错只给线索，不吐正确编号）。 */
var EMP_CANON = 'EMP-2011-0473';
function loose(s){ return String(s || '').toLowerCase().replace(/[^0-9a-z一-鿿]/g, ''); }
function isEmp(s){ return loose(s) === loose(EMP_CANON); }

/* ---------- 那本书之后，她说的最后一句：「正片开始了。」 ----------
   出处：主页面 NODES.st_novel21「【正片开始了。】」—— 青禾的残稿读完、
   小说网那段演完，她最后留下的就是这一句（这也是「正片」这个词在游戏里的落点）。
   「正片开始了」与「正片开始」都算对：玩家多半只记得那四个字，末尾的「了」不强求。
   提示同样**不直接写出这四个字**（沿用本站约定：判错只给线索）。 */
var LAST_CANON = '正片开始了。';
function isLastLine(s){
    var t = loose(s);
    if (!t) return false;
    return t === '正片开始' || t === '正片开始了' || t.replace(/了+$/, '') === '正片开始';
}

/* ==================================================================
   自动存档
   ------------------------------------------------------------------
   走到哪记到哪：行号 + 舞台态（背景 / 居中 / 名字框 / 立绘）+ 说话人名字。
   下一次进来先读它，按存档里的舞台态把画面摆回去：
     · 记在**问答段**（ph='quiz'）→ 黑屏 · 居中 · 无名字框 +「您回来啦？继续核对吧：」
       （这是文案写死的：切出去后再回来，直接接问答的头一个）
     · 记在**别的段**        → 有立绘的把立绘站回来 +「我们继续吧。」
   存档键 mp_meta_save —— 主页面「清空数据」会连带清掉（见 index.html 的 SUB_FLAGS），
   跟实验楼排序题那个标记一个待遇。
   ★ 同样比时间：存档里记写入时刻 t，主页面清档会写清档戳 mp_clear_at。
     t 早于清档戳 → 这份存档作废、从头再演（防的是"删键没生效"那类漏网情况）。
   ★ 终态（done=1）：最后一句演完就**定在那里**，存档不再作废 ——
     刷新 / 重进 / 换标签页回来，都是直接把末句摆出来（走 showEnd，不走整段快进）。
     不走行号是因为分支选得不一样、后面的台词编号会整体漂移，按行号快进会对不上。
     想从头再看一遍 → demo.html?reset，或主页面「清空数据」。
   演到一半退出（done=0）→ 存档作废，下次从头再来。 */
var SAVE_KEY = 'mp_meta_save';
var CLEAR_KEY = 'mp_clear_at';   /* 主页面「清空数据」写的清档戳（index.html 的 clearSubFlags） */
var lineNo = 0;          /* 当前行号：每句台词 / 每个选项 / 每个输入框各占一号 */
var resumeAt = -1;       /* 续传目标行号；-1=不续传；-2=老档，一路快进到问答段 */
var played = 0;          /* 本轮真正演出来的行数（续传时用来判断存档有没有失效） */
var PHASE = 'chara';     /* 当前处在哪一段：chara / bare / center / quiz */
var quizHead = 0;        /* 问答段第一句的行号（切出后要回到这里） */
var quizBase = -1;       /* 问答段起始行号基准：首次进入时捕获，REDO 重跑时复用，避免行号持续漂移导致存档续传错位 */
var REDO = { __redo:true };   /* 答错信号：退回问答开头（提问：她的名字是？）整段重来 */
var ENDED = false;       /* 终态：整段演完、定在末句 → 不再出 ▼、不再自动推进 */

function skipping(n){
    if (resumeAt === -2) return PHASE !== 'quiz';        /* 老档：快进到问答段为止 */
    return resumeAt >= 0 && n < resumeAt;
}
/* done=1 → 记成「终态」：整段已经演完，下次进来直接停在末句（不清档、不重演） */
function savePoint(n, done){
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            t: Date.now(),                       /* 写入时刻：跟清档戳比，判断这份存档还作不作数 */
            n: (n == null ? lineNo : n),
            ph: PHASE,
            name: NAME,
            bg: !stage.classList.contains('nobg'),
            center: dg.classList.contains('center'),
            nb: NAMEBOX,
            ch: S.ch.op > .5 ? 1 : 0,
            done: done ? 1 : 0
        }));
    } catch(e){}
}
function loadSave(){
    var o = null, stamp = 0;
    try {
        o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
        stamp = Number(localStorage.getItem(CLEAR_KEY) || 0) || 0;
    } catch(e){}
    /* 存档比最后一次清档还早 → 那是上一局留下的，作废（从头再演一次） */
    if (o && typeof o === 'object' && typeof o.n === 'number'){
        if ((Number(o.t) || 0) < stamp){ try { localStorage.removeItem(SAVE_KEY); } catch(e2){} return null; }
        return o;
    }
    /* 兼容上一版存档（只记了「切出过」这一个状态）→ 当成停在问答开头，快进过去 */
    try {
        if (localStorage.getItem('koulin_meta_save') === '1'){
            var nm = localStorage.getItem('koulin_meta_name') || '？？？';
            localStorage.removeItem('koulin_meta_save');
            localStorage.removeItem('koulin_meta_name');
            return { n:-1, ph:'quiz', name:nm, bg:false, center:true, nb:false, ch:0 };
        }
    } catch(e){}
    return null;
}
function clearSave(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

/* 台词 / 选项 / 输入：统一走这三个包装 ——
   续传时自动跳过已经看过的部分（不留痕迹、不打断节奏），追上后自动存档。
   CH 被跳过时返回 null：这样「选名」那一步不会把存档里的名字覆盖掉。 */
function L(text, opt){
    var n = lineNo++;
    if (skipping(n)) return Promise.resolve();
    resumeAt = -1; SPEED = 1; played++;
    savePoint(n);
    return say(text, opt);
}
function CH(my, opts){
    var n = lineNo++;
    if (skipping(n)) return Promise.resolve(null);
    resumeAt = -1; SPEED = 1; played++;
    savePoint(n);
    return choice(my, opts);
}
/* 带判定的选项：选错（wrong）时提示一句，然后抛 REDO 退回问答开头（提问：她的名字是？）整段重来；
   选对才继续。续传快进阶段（选项被 skip 返回 null）视为玩家当初已选对，直接通过，避免卡死。 */
function CHJ(my, opts, correct, wrongText){
    if (my !== gen) return Promise.reject(BREAK);
    return (async function(){
        var c = await A(my, CH(my, opts));
        if (c == null) return correct;        /* 续传快进：当玩家当初已选对，直接通过 */
        if (c !== correct){
            await A(my, L(wrongText, { name:NAME }));
            throw REDO;                        /* 答错 → 退回问答开头整段重来 */
        }
        return c;
    })();
}
function AS(my, label, judge, wrongMsg){
    var n = lineNo++;
    if (skipping(n)) return Promise.resolve('');
    resumeAt = -1; SPEED = 1; played++;
    savePoint(n);
    return ask(my, label, judge, wrongMsg);
}

/* 强制切出 + 存档（回到核对头） */
function cutout(my){
    if (my !== gen) return Promise.reject(BREAK);
    savePoint(quizHead);                                   /* 下次进来：从问答的第一个问题接着 */
    return new Promise(function(res){
        cutoutEl.classList.add('on');
        cutoutBtn.onclick = function(){
            cutoutEl.classList.remove('on');
            gen++; reset();
            start(true);            /* 回到「核对」环节 */
            res();
        };
    });
}

/* ---------- 演出主流程（映射 Meta演示.txt） ----------
   切成四段 + 问答段，段与段之间就是存档点；续传时按行号快进到断点，
   画面按存档里的舞台态摆回去，先说一句再接着往下演。 */
async function play(my, resume){
    if (my !== gen) return;
    lineNo = 0; SPEED = 1; resumeAt = -1; played = 0; quizBase = -1;
    if (metaHome) metaHome.classList.remove('on');          /* 重开 / 快进 → 收起返回入口 */

    var sv = resume ? loadSave() : null;

    /* 终态存档（done）→ 直接把末句摆出来定住，不走整段快进：
       行号续传靠不住 —— 分支选得不一样，后面的台词编号就整体漂移，
       末句编号对不上就会一路跳过、被当成「存档失效」从头再演。 */
    if (sv && sv.done){ await A(my, showEnd(my, sv)); return; }

    if (sv){
        NAME = (typeof sv.name === 'string' && sv.name) ? sv.name : '？？？';
        /* n<0 = 上一版存档（只记了「切出过」）→ 一路快进到问答段 */
        resumeAt = (typeof sv.n === 'number' && sv.n >= 0) ? sv.n : -2;
        SPEED = 0;                                          /* 快进：补间全部瞬间到位 */

        /* 先把舞台摆回存档里的样子：背景在不在 · 居不居中 · 有没有名字框 · 立绘在不在 */
        await A(my, set({ bg:!!sv.bg, center:!!sv.center, nameBox:sv.nb !== false }));
        await A(my, charaTo({ opacity: sv.ch ? 1 : 0, dur:0 }));
        if (sv.bg && !sv.center){            /* 有立绘的那一段：让她重新站回走廊里 */
            face(0); breathe(true);
            await A(my, camTo({ z:1.12, y:-2, dur:0 }));
            await A(my, charaTo({ x:-12, s:1.06, opacity:1, dur:0 }));
        }
        {
            /* 问答段沿用文案写死的「问答重返」那句；其余一律「我们继续吧。」
               注意：这句走的是裸 say（不是 L）—— 它是续传时附加的一句，不占行号，
               也不能被快进跳过，否则续传进来第一句就没了。 */
            await A(my, say(sv.ph === 'quiz' ? '您回来啦？继续核对吧：' : '我们继续吧。', { name:NAME }));
        }
    } else {
        /* —— 首次进来：开场演出（立绘 + 走廊 + 正常对话框）—— */
        face(0);
        await A(my, flashIn());
        await A(my, camTo({ z:1.12, y:-2, dur:1400 }));
        await A(my, charaTo({ opacity:1, dur:1000 }));
        await A(my, charaTo({ x:-12, s:1.06, dur:1000 }));
        breathe(true);
    }

    await A(my, segIntro(my));
    await A(my, segMeta(my));
    await A(my, segBare(my));
    await A(my, segCenter(my));
    await A(my, quiz(my));

    /* 一句都没演出来 = 存档的行号超出了现在的稿子（改过稿）→ 这份存档（哪怕是终态）
       都不作数了，清掉从头再演一遍。 */
    if (played === 0 && sv){ clearSave(); return start(false); }

    /* 终态（末句演完 → ENDED，quiz() 里已写好 done 存档）→ 存档**留着**，
       下次进来直接停在末句，不再从头；其余（演到一半退出）→ 作废，下次从头。 */
    if (!ENDED) clearSave();
}

        await A(my, L('嗯，我也喜欢您', { name:NAME }));
        await A(my, L('不用管我的喜欢是不是设计好的选项', { name:NAME }));
        await A(my, L('您选择了这个，就说明您希望得到回应。', { name:NAME }));
    } else {
        await A(my, L('哈哈哈哈', { name:NAME }));
        await A(my, L('您都被这么多人喜欢过了，也不会少她这一次的。', { name:NAME }));
    }

    await A(my, L('临走以前，我最后提醒您一句吧。', { name:NAME }));
    await A(my, L(LAST_LINE, { name:NAME }));
    /* 终态：演完就定在这里。存档不清，改记 done —— 刷新、重进、换标签页回来
       都直接跳到这一句并显示它，不再从头演，也不再出 ▼ 提示「还有下一句」。
       想从头再看一遍 → 用 demo.html?reset（或主页面「清空数据」）。 */
    ENDED = true; more.classList.remove('on');
    if (metaHome) metaHome.classList.add('on');           /* 末态浮出「返回主页面」入口 */
    savePoint(lineNo - 1, true);            /* 记成终态（行号仅供参考，续传走 showEnd） */
}

/* ---------- 启动 / 续传 ---------- */
function run(resume){
    var my = ++gen;
    return (async function(){
        try { await play(my, resume); }
        catch (e){ if (e !== BREAK) console.error('[play]', e); }
    })();
}
function start(resume){
    reset();
    return run(resume);
}

/* ---------- 交互 ---------- */
document.addEventListener('keydown', function(e){
    if (e.target === askIn) return;              /* 输入框内按键交给输入框自己处理 */
    var k = e.key;
    if (k === ' ' || k === 'Enter' || k === 'z' || k === 'Z'){ e.preventDefault(); advance(); }
    else if (k === 'a' || k === 'A'){ autoOn = !autoOn; }
    else if (k === 'd' || k === 'D'){ dbg.classList.toggle('on'); }
    else if (k === 'r' || k === 'R'){ reset(); start(false); }
});
stage.addEventListener('click', function(e){
    if (dbg.contains(e.target)) return;
    if (choicesEl.contains(e.target)) return;   // 点选项按钮不冒泡触发推进
    if (askBox.contains(e.target)) return;     // 点输入框不触发推进
    advance();
});

/* ---------- 调试面板接线 ---------- */
var rz = $('#r-z'), rx = $('#r-x'), rcx = $('#r-cx'), rcs = $('#r-cs');
function liveCam(){ camTo({ z:+rz.value/100, x:+rx.value, dur:0 });
    $('#v-z').textContent = (+rz.value/100).toFixed(2);
    $('#v-x').textContent = rx.value; }
function liveCh(){ charaTo({ x:+rcx.value, s:+rcs.value/100, dur:0 });
    $('#v-cx').textContent = rcx.value;
    $('#v-cs').textContent = (+rcs.value/100).toFixed(2); }
rz.oninput = liveCam; rx.oninput = liveCam;
rcx.oninput = liveCh; rcs.oninput = liveCh;
dbg.addEventListener('click', function(e){
    e.stopPropagation();
    var b = e.target.closest('button'); if (!b) return;
    var a = b.getAttribute('data-a');
    if (a === 'f0') face(0);
    if (a === 'f1') face(1);
    if (a === 'mir'){ S.ch.mirror = !S.ch.mirror; applyChara(); }
    if (a === 'bh') breathe(!cin.classList.contains('breathe'));
    if (a === 'hide') charaTo({ opacity:0, dur:500 });
    if (a === 'show') charaTo({ opacity:1, dur:500 });
    if (a === 'crt') fx.classList.toggle('off');
    if (a === 'exp') expose(!stage.classList.contains('expose'));
    if (a === 'replay'){ reset(); start(false); }
});

/* ---------- 启动（含存档续传） ---------- */
window.addEventListener('resize', measure);
measure();
function boot(){
    measure();
    /* demo.html?reset —— 想从头再看一遍时走这里（终态存档平时是不清的） */
    if (/[?&]reset\b/.test((window.location && window.location.search) || '')) clearSave();
    /* 有自动存档就接着演（存档不在这里删：它要留着，下次进来还得用） */
    var resume = !!loadSave();
    var go = function(){ start(resume); };
    if (document.fonts && document.fonts.ready){
        var done = false;
        document.fonts.ready.then(function(){ if (!done){ done = true; go(); } });
        setTimeout(function(){ if (!done){ done = true; go(); } }, 2500);
    } else { go(); }
}

/* ---------- 对外 API ---------- */
window.AVG = {
    stage: stage, state: S,
    /* 进度探针：当前行号 / 续传目标 / 所在段 / 本轮已演行数 / 速度倍率 */
    prog: function(){ return { n:lineNo, at:resumeAt, ph:PHASE, played:played, speed:SPEED, name:NAME, ended:ENDED }; },
    save: function(){ return loadSave(); }, wipe: clearSave,
    say: say, name: setName, face: face, breathe: breathe,
    camTo: camTo, charaTo: charaTo, choice: choice, cutout: cutout,
    show: function(){ return charaTo({ opacity:1, dur:900 }); },
    hide: function(){ return charaTo({ opacity:0, dur:700 }); },
    expose: expose, set: set, reset: reset, run: start, wait: wait,
    flash: flashIn, clear: clearDlg,
    script: null,
    auto: function(ms){ if (ms === false){ autoOn = false; } else { autoOn = true; if (ms) AUTO_MS = ms; } return autoOn; },
    ready: boot
};

if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
