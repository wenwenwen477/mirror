<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT4 · 头朝地摔的</title>
<style>
/* ==================================================================
   CUT4 · 头朝地摔的
   ------------------------------------------------------------------
   取材：F:\网页游戏\幂偌0.2\原文.txt 第 76~300 段

   接的是 CUT3 的结尾（玻琳秋独自在教室里翻《华灯初上》）。
   这一段的结构是**双线**：
     · 现实线 —— 教室里那一声铃、窗外坠下去的人形、夜晚并排走着的两个人
     · 小说线 —— 《华灯初上》第四章「她在窗口」的正文（原文里带【】的那些）
   两条线在原文里本来就是交织的：她们一边演这本书，一边吐槽这本书。

   ★ 表现方式：**一本一页一页翻的书**（不滚动）。
     现实 → 教室 / 夜路背景 + 两个人在底下说话（幂偌青蓝 / 玻琳秋玫红）
     小说 → 屏幕上半部分一张纸，正文一句一句往上排（新的一句会「写」出来）
     换章 → 突然的黑屏 + 白字 + 一行译文（硬切，故意不给过渡）
     ★ 两个人永远在**纸的前面**（z 高于书页），像俯身看书那样压在纸的下沿
       —— 层次就靠这个。
     ★ 推进只有一种动作：**翻页**。点画面 / 按 → / 空格 / 滚轮 / 左右滑，
       都只是翻一页（或翻回去一页）。背景和角色一直在，动的是纸上的字：
       收走旧的 → 换 → 一句一句放新的。没有纸在屏幕上飞。
     ★ 坠楼那一幕不用 CG：**一个「人」字栽下来，砸到地上，散成一地碎片。**
   颜色分工（一眼要能分清谁在说话）：
     小说正文  黑墨 + 宋体 + 纸黄底
     幂偌      青蓝 #2e7d8f
     玻琳秋    玫红 #b0446a
     旁白      灰白、半透明
   ================================================================== */
:root{
    --mi:#2e7d8f;            /* 幂偌 —— 青蓝 */
    --mi-l:#e2f2f4;
    --he:#b0446a;            /* 玻琳秋 —— 玫红 */
    --he-l:#fbe9ef;
    --ink:#2b2622;           /* 小说正文 —— 墨 */
    --paper:#f4e9cf;         /* 纸 */
    --paper2:#ece0c2;
    --song:SimSun,"Songti SC","STSong","Noto Serif CJK SC",serif;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
}
*{ box-sizing:border-box; }
/* ★ 不滚动。整页就是一本书，高度锁死，推进只靠翻页。 */
html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
body{
    background:#0b0a09; color:#d8d2c6;
    font:14px/1.9 var(--sans);
}

/* ==================================================================
   背景：教室（默认）→ 夜晚街道（夜路那几段）
   全部由 #bgstage 里的层做交叉淡入，跟 CUT3 一个路子。
   ================================================================== */
#bgstage{ position:fixed; inset:0; z-index:0; overflow:hidden; background:#0b0a09; }
.bg{ position:absolute; inset:0; opacity:0; transition:opacity 1.8s ease; }
.bg.on{ opacity:1; }

/* 教室：墙 + 窗光斜柱 + 一排排课桌 */
.bg-room{
    background:
        linear-gradient(118deg, rgba(255,251,231,.85) 0 12%, rgba(255,251,231,0) 40%),
        linear-gradient(180deg,#2b3440 0%,#333d47 22%,#3a4048 46%,#2f343a 100%);
}
.bg-room::before{        /* 课桌横带 */
    content:""; position:absolute; inset:56% 0 0 0; opacity:.3;
    background:repeating-linear-gradient(180deg,
        rgba(30,26,22,.55) 0 14px, rgba(70,62,52,.30) 14px 26px, rgba(0,0,0,0) 26px 54px);
}
.bg-room::after{         /* 后墙窗 */
    content:""; position:absolute; left:4%; top:10%; width:26%; height:30%;
    background:linear-gradient(180deg,#4a5a68,#39454f);
    box-shadow:inset 0 0 0 3px rgba(20,24,28,.7);
}
/* 夜晚街道：路灯光斑 + 远处楼窗 + 湿路面反光 */
.bg-night{
    background:
        radial-gradient(closest-side at 18% 26%, rgba(255,224,160,.42), rgba(255,224,160,0)),
        radial-gradient(closest-side at 78% 20%, rgba(255,224,160,.30), rgba(255,224,160,0)),
        linear-gradient(180deg,#14161f 0%,#1a1d26 44%,#24262c 62%,#16171c 100%);
}
.bg-night::before{       /* 楼窗点点 */
    content:""; position:absolute; inset:0 0 42% 0; opacity:.5;
    background:
        radial-gradient(circle, rgba(255,238,190,.9) 0 1.6px, rgba(0,0,0,0) 2px) 0 0/34px 26px,
        radial-gradient(circle, rgba(255,238,190,.5) 0 1.3px, rgba(0,0,0,0) 2px) 10px 8px/46px 38px;
}
.bg-night::after{        /* 湿路面 */
    content:""; position:absolute; inset:66% 0 0 0;
    background:linear-gradient(180deg, rgba(255,214,150,.14), rgba(255,214,150,0) 70%);
}

/* ==================================================================
   顶部：一条极简的进度条 + CUT4 标
   ================================================================== */
#hud{ position:fixed; left:0; right:0; top:0; z-index:90; pointer-events:none;
    display:flex; align-items:center; gap:14px; padding:11px 20px;
    background:linear-gradient(180deg, rgba(6,6,6,.82), rgba(6,6,6,0)); }
#hud .tag{ font:700 11px/1 var(--sans); letter-spacing:3px; color:#0b0a09;
    background:var(--paper); padding:5px 10px; border-radius:2px; }
#hud .now{ font-size:12px; color:#b8b0a2; letter-spacing:1px; }
#hud .bar{ flex:1; height:2px; background:rgba(255,255,255,.10); border-radius:2px; overflow:hidden; }
#hud .bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--mi),var(--he));
    transition:width .3s linear; }

/* ==================================================================
   现实层：两个人的立绘 + 头顶气泡
   ★ z70 —— 压在书页（z60）**上面**。两个人像俯身看书那样压在纸的下沿，
     层次（质感）就是这么来的。看书时只是虚化一点点（景深），不撤掉。
   ================================================================== */
/* bottom 留出翻页条的位置（#nav 在 bottom:14px） */
.duo{ position:fixed; left:50%; bottom:74px; z-index:70; display:flex; align-items:flex-end;
    gap:88px; transform:translateX(-50%); pointer-events:none;
    transition:opacity .5s ease, filter .5s ease; }
.duo.read{ opacity:.68; filter:blur(.8px) brightness(.9); }
/* 坠楼那两拍：两个人退成影子，把画面让给那一下 */
.duo.gone{ opacity:.12; filter:blur(3px) brightness(.55); }
.who{ width:150px; display:flex; flex-direction:column; align-items:center;
    opacity:.34; filter:grayscale(.7);
    transition:opacity .5s ease, filter .5s ease; }
.who.on{ opacity:1; filter:none; }
.who .fg{ position:relative; width:100%; height:250px; }
.who .fg::before{
    content:""; position:absolute; left:-16%; right:-16%; bottom:-8px; top:20px;
    background:radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0) 76%);
}
.who .fg svg{ display:block; width:100%; height:100%; }
.who .fg{ animation:bob 1.2s ease-in-out infinite; }
#wm .fg{ animation-delay:-.18s; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

/* 气泡。两个人的**边框和底色都不同** —— 远处也能一眼分清谁在说话。 */
.bub{ position:relative; width:250px; max-height:32vh; overflow:hidden;
    margin:0 0 10px; padding:11px 15px; border-radius:12px;
    font-size:14.5px; line-height:1.9; letter-spacing:.3px;
    opacity:0; transform:translateY(10px) scale(.96);
    transition:opacity .34s ease, transform .34s ease; }
.bub.on{ opacity:1; transform:translateY(0) scale(1); }
/* 幂偌：青蓝 */
#wm .bub{ background:rgba(226,242,244,.96); border:1px solid rgba(46,125,143,.45);
    border-left:4px solid var(--mi); color:#17454e; }
/* 玻琳秋：玫红 */
#wh .bub{ background:rgba(251,233,239,.96); border:1px solid rgba(176,68,106,.42);
    border-right:4px solid var(--he); color:#6d1f3c; }
.bub::after{ content:""; position:absolute; bottom:-7px; width:11px; height:11px;
    border:1px solid rgba(0,0,0,.14); transform:rotate(45deg); }
#wm .bub::after{ left:50%; margin-left:-6px; background:rgba(226,242,244,.96);
    border-top:0; border-left:0; }
#wh .bub::after{ left:50%; margin-left:-6px; background:rgba(251,233,239,.96);
    border-top:0; border-right:0; }
.bub .who-tag{ display:block; margin-bottom:3px; font-size:10.5px; font-weight:700;
    letter-spacing:2px; opacity:.62; }
#wm .bub .who-tag{ color:var(--mi); }
#wh .bub .who-tag{ color:var(--he); }

/* 提词器：旁白。画面正中偏上，不吃指针事件。 */
#tele{ position:fixed; left:50%; top:20%; z-index:55; width:min(620px,78vw);
    padding:12px 26px; text-align:center; pointer-events:none;
    background:rgba(16,15,13,.88); border:1px solid rgba(200,190,160,.20); border-radius:12px;
    font-family:var(--song); font-size:15.5px; letter-spacing:.8px; color:#cdc6b6;
    opacity:0; transform:translate(-50%,-10px);
    transition:opacity .4s ease, transform .4s ease, top .4s ease; }
#tele.on{ opacity:1; transform:translate(-50%,0); }
/* 让位给「人」往下摔的那条路线 —— 旁白挪到最上头 */
#tele.up{ top:7.5%; width:min(680px,86vw); font-size:14.5px; }

/* 重点标记：写 **这样** */
.hl{ font-weight:700; color:#8a2f1c;
    background:linear-gradient(transparent 62%, rgba(238,190,60,.34) 62%);
    -webkit-box-decoration-break:clone; box-decoration-break:clone; }
#tele .hl{ color:#e8b473; background:linear-gradient(transparent 62%, rgba(238,190,60,.24) 62%); }
.bub .hl{ color:#a8341f; }

/* ==================================================================
   小说页：屏幕上半部分的一张纸
   ★ 纸在人物**后面**（#page z60 < .duo z70）：
     两个人像俯身看书那样压在纸的下沿，层次（质感）就出来了。
   ★ 高度跟着行数长 —— 不再是先撑出 56vh 的空白，最多到 58vh 就翻页。
   ================================================================== */
#page{ position:fixed; left:50%; top:7vh; z-index:60; width:min(820px, 90vw);
    min-height:36vh; max-height:48vh; overflow:hidden; padding:24px 44px 30px;
    transform:perspective(1600px) translateX(-50%) rotateY(94deg) scale(.94);
    transform-origin:left center;
    opacity:0; pointer-events:none;
    background:
        linear-gradient(105deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 100%),
        linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%);
    border-radius:3px;
    box-shadow:0 26px 70px rgba(0,0,0,.66), 0 0 0 1px rgba(120,100,60,.35),
        7px 9px 0 -2px rgba(228,214,176,.55), 14px 18px 0 -5px rgba(214,198,152,.30);
    transition:transform .58s cubic-bezier(.4,.1,.2,1), opacity .32s ease, filter .45s ease; }
#page.on{ transform:perspective(1600px) translateX(-50%) rotateY(0deg) scale(1); opacity:1; }
/* 书脊那一道折痕 */
#page::before{
    content:""; position:absolute; left:26px; top:0; bottom:0; width:1px;
    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(90,70,40,.30) 20%, rgba(90,70,40,.30) 80%, rgba(0,0,0,0));
}
#page::after{         /* 纸的横纹 */
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:3px;
    background:repeating-linear-gradient(180deg,
        rgba(120,95,55,.07) 0 1px, rgba(0,0,0,0) 1px 4px);
}
#page .hd{ position:relative; z-index:2; text-align:center; padding-bottom:9px;
    border-bottom:1px solid rgba(120,95,55,.30); margin-bottom:13px; }
#page .hd .bt{ font-family:var(--song); font-size:14px; letter-spacing:6px; color:#6b5533; }
#page .hd .bc{ margin-top:3px; font-size:11px; letter-spacing:2px; color:#93805c; }
#page .bd{ position:relative; z-index:2; }
#page .ln{ font-family:var(--song); font-size:18px; line-height:2.02; color:var(--ink);
    letter-spacing:1.1px; text-indent:2em; margin:0 0 2px;
    opacity:0; transform:translateY(6px);
    transition:opacity .36s ease, transform .36s ease; }
#page .ln.in{ opacity:1; transform:translateY(0); }
/* 翻页 = 先把这一页的字**一句一句收走**，再一句一句放新的。
   ★ 写在 .in 后面 —— 同特异性时后写的赢，收走才能盖住「已显示」状态。
   ★ 方向跟着翻页走：往前翻 = 往上收（这一页被翻上去），
     往回翻 = 往下收（退回去）。 */
#page .ln.out{ opacity:0; transition:opacity .17s ease, transform .17s ease; }
#page .ln.out.up{ transform:translateY(-10px); }
#page .ln.out.down{ transform:translateY(10px); }
/* 最新的一句：左边一道竖线当「正在读」的游标 */
#page .ln.now{ text-indent:0; padding-left:2em; position:relative; }
#page .ln.now::before{ content:"▎"; position:absolute; left:0; color:#8a2f1c;
    animation:caret 1s steps(1) infinite; }
@keyframes caret{ 0%,49%{ opacity:1; } 50%,100%{ opacity:.15; } }
/* 打字：外层撑住排版，内层一步一停地露出来（clip-path 不触发重排） */
#page .ln > span{ display:block; }
/* 页码：给纸下方的空处一个说得通的理由 */
#page .pf{ position:relative; z-index:2; margin-top:8px; text-align:center;
    font-family:var(--song); font-size:11.5px; letter-spacing:3px; color:#a89066; }

/* ==================================================================
   铃声 / 冲击
   ================================================================== */
#bellfx{ position:fixed; inset:0; z-index:76; pointer-events:none; opacity:0; }
#bellfx.go{ animation:bell 1.1s ease; }
@keyframes bell{ 0%{ opacity:.9; background:radial-gradient(circle at 50% 42%, rgba(255,244,214,.55), rgba(255,244,214,0) 46%); }
                 100%{ opacity:0; } }
/* 冲击：一闪即过的暗红（坠楼那一下）。注意力交给下面的文字动画，别抢戏。 */
#shock{ position:fixed; inset:0; z-index:94; pointer-events:none; opacity:0; background:#2a0b07; }
#shock.go{ animation:shock .62s ease; }
@keyframes shock{ 0%{ opacity:.5; } 100%{ opacity:0; } }

/* ==================================================================
   「人」摔碎 —— 用字演，不用CG
   ------------------------------------------------------------------
   一个人字从画面上头摔下来，砸到地面，散成一地碎片。
   ★ 碎片的做法：把同一个字复制十几份，每份用 clip-path 切一块，
     各自飞向不同方向 —— 不用额外的字库字符（部首那几个 unicode
     在很多机器上会变成豆腐块），切出来的每一块就是真的原字的一部分。
   ================================================================== */
#fall{ --sz: min(36vh, 33vw);
    position:fixed; inset:0; z-index:96; pointer-events:none; opacity:0;
    transition:opacity .35s ease; }
#fall.on{ opacity:1; }
#fall .slot{ position:absolute; left:50%; top:50%; width:var(--sz); height:var(--sz);
    transform:translate(-50%,-50%); }
#fall .box{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
#fall .g{ display:block; font-family:var(--song); font-size:var(--sz); line-height:1;
    color:#f0e8d8; text-shadow:0 0 26px rgba(0,0,0,.75); }
/* 落地那一道横向的冲击线 */
#fall .hit{ position:absolute; left:50%; top:50%; width:0; height:1px; opacity:0;
    background:linear-gradient(90deg, rgba(240,232,216,0), rgba(240,232,216,.9), rgba(240,232,216,0)); }
/* 下坠时拖在身后的那一道风 */
#fall .trail{ position:absolute; left:50%; top:50%; width:2px; height:var(--sz); opacity:0;
    margin-left:-1px; margin-top:calc(var(--sz) / -2);
    background:linear-gradient(180deg, rgba(240,232,216,0), rgba(240,232,216,.42), rgba(240,232,216,0));
    filter:blur(1px); }
#fall .frags{ position:absolute; inset:0; }
/* ★ 碎片要和原字**严丝合缝**：同样的方块、同样的位置、同样的字号，
   只是一块块被切掉。用 margin 居中而不用 translate —— transform 要留给飞行。 */
#fall .frags .pc{ position:absolute; left:50%; top:50%;
    width:var(--sz); height:var(--sz);
    margin-left:calc(var(--sz) / -2); margin-top:calc(var(--sz) / -2);
    display:flex; align-items:center; justify-content:center;
    will-change:transform,opacity; }
#fall .frags .pc .g{ text-shadow:none; }

/* ==================================================================
   黑屏字幕卡：「翻页吧。」/「头朝地摔的。」
   ------------------------------------------------------------------
   ★ 硬切，不做淡入 —— 突然，才有压迫感。
     黑底 + 白字 + 一行小字译文，然后由玩家自己翻走。
   ================================================================== */
#black{ position:fixed; inset:0; z-index:97; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:0 8vw; text-align:center;
    background:#000; opacity:0; pointer-events:none; visibility:hidden; }
#black.on{ opacity:1; visibility:visible; }
#black .zh{ font-family:var(--song); font-weight:400; color:#fff;
    font-size:clamp(30px,6.2vw,64px); letter-spacing:.22em; text-indent:.22em;
    animation:cardIn .34s cubic-bezier(.2,.7,.2,1) both; }
#black .rule{ width:min(300px,52vw); height:1px; margin:26px 0 16px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.34), rgba(255,255,255,0));
    animation:cardIn .5s ease .16s both; }
#black .en{ font-family:var(--sans); font-size:11.5px; letter-spacing:.44em;
    text-indent:.44em; color:rgba(255,255,255,.44);
    animation:cardIn .6s ease .24s both; }
#black.fin .zh{ text-shadow:0 0 40px rgba(255,255,255,.22); }
/* 黑屏卡把翻页条盖住了，停两秒多才浮出一行极淡的提示，免得人卡在这儿 */
#black .hint{ position:absolute; left:0; right:0; bottom:26px; opacity:0;
    font-size:11px; letter-spacing:.4em; text-indent:.4em; color:rgba(255,255,255,.20);
    animation:hintIn .8s ease 2.6s both; }
@keyframes hintIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes cardIn{ 0%{ opacity:0; letter-spacing:.6em; filter:blur(6px); }
                   100%{ opacity:1; filter:blur(0); } }

/* 目录 */
#tocs{ position:fixed; right:16px; top:50%; z-index:88; transform:translateY(-50%);
    font-size:11px; letter-spacing:1px; text-align:right; }
#tocs a{ display:block; padding:3px 0; color:rgba(220,210,190,.34); text-decoration:none;
    transition:color .3s ease; }
#tocs a.on{ color:var(--paper); font-weight:700; }
#tocs a:hover{ color:#fff; }

/* ==================================================================
   翻页条：像书的页脚。上一页 / 页码 / 下一页
   ================================================================== */
/* ★ 居中不用 left:50%+translateX(-50%) —— 绝对定位元素只给 left 时，
   可用宽度只剩视口的一半，窄屏上会把「下一页」挤成两行、整条变成两层。
   改成 left:0/right:0 + width:max-content + margin auto：按内容宽度居中。 */
#nav{ position:fixed; left:0; right:0; bottom:14px; z-index:92;
    width:max-content; max-width:calc(100vw - 16px); margin:0 auto;
    display:flex; align-items:center; gap:14px;
    padding:7px 13px; border-radius:2px;
    background:rgba(244,233,207,.94); border:1px solid rgba(120,95,55,.38);
    box-shadow:0 8px 26px rgba(0,0,0,.45);
    font-size:12px; letter-spacing:2px; color:#6b5533; }
#nav a{ color:#6b5533; text-decoration:none; padding:3px 9px; border-radius:2px;
    cursor:pointer; user-select:none; white-space:nowrap;
    transition:background .2s ease, color .2s ease; }
#nav a:hover{ background:rgba(120,95,55,.16); color:#3a2a12; }
#nav a.off{ opacity:.3; pointer-events:none; }
#nav .pn{ font-family:var(--song); font-size:12.5px; letter-spacing:1px;
    color:#8a7550; min-width:88px; text-align:center; white-space:nowrap; }
#nav .how{ font-size:11px; letter-spacing:1px; color:#a08a62; padding-left:4px;
    border-left:1px solid rgba(120,95,55,.28); }
#nav .how.off{ display:none; }

/* 窄屏 */
@media (max-width:900px){
    .duo{ gap:40px; bottom:64px; }
    .who{ width:96px; }
    .who .fg{ height:156px; }

/* ==================================================================

function hl(s){
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*([^*]+)\*\*/g, '<b class="hl">$1</b>');
}
/* 换句的「两段式」：先淡出，再换内容淡入。
   同一个元素连续用时，过渡被打断会从当前透明度接着走 → 整段等于没发生。 */
var POP_OUT = 200;
function swapIn(el, html){
    el.style.transition = 'none';
    el.innerHTML = html;
    el.classList.remove('on');
    void el.offsetWidth;
    el.style.transition = '';
    el.classList.add('on');
}
function pop(el, html){
    if (el._t){ clearTimeout(el._t); el._t = 0; }
    el.style.transitionDuration = '';
    if (!el.classList.contains('on')){ swapIn(el, html); return; }
    el.style.transitionDuration = POP_OUT + 'ms';
    el.classList.remove('on');
    el._t = setTimeout(function(){ el._t = 0; el.style.transitionDuration = ''; swapIn(el, html); }, POP_OUT);
}
function hide(el){
    if (el._t){ clearTimeout(el._t); el._t = 0; }
    el.style.transitionDuration = '';
    el.classList.remove('on');
}
function fx(el){
    el.classList.remove('go');
    void el.offsetWidth;      /* 强制重排，让动画能重播 */
    el.classList.add('go');
}

/* ------------------------------------------------------------------
   书页内容：整页**按起点重建**
   ------------------------------------------------------------------
   ★ 以前是一行一行往上 append。往回翻会把同一句再堆一次、页数也乱
     —— 这就是那个最明显的小 bug。现在每走到一拍，就从这一段最早的
     那一句重新排一遍，前进后退结果都一样。
   ------------------------------------------------------------------ */
function pageStart(i){
    var s = i;
    while (s > 0 && SCRIPT[s - 1].k === 'bk') s--;
    return s;
}
/* 第几张纸（纯装饰的页码） */
function bookPageNo(i){
    var n = 0;
    for (var j = 0; j <= i; j++){
        if (SCRIPT[j].k === 'bk' && (j === 0 || SCRIPT[j - 1].k !== 'bk')) n++;
    }
    return n || 1;
}
/* 打字：clip-path 从左往右开。不引起重排，标点换行也不会乱。 */
function typeLine(span, txt){
    var n = String(txt).replace(/\*\*/g, '').length;
    var ms = Math.max(380, Math.min(1500, n * 46));
    try {
        return span.animate([{ clipPath:'inset(0 100% 0 0)' }, { clipPath:'inset(0 0 0 0)' }],
            { duration:ms, easing:'linear', fill:'both' });
    } catch (e){ return null; }
}
/* 一行一行收 / 放的时候，相邻两句差这么多毫秒 */
var T_STEP = 22;
function mkLine(txt){
    var d = document.createElement('p');
    d.className = 'ln';
    d.innerHTML = '<span>' + hl(txt) + '</span>';
    pageBd.appendChild(d);
    return d;
}
var pageLines = [];
function repaintPage(i, animateLast){
    var s = pageStart(i);
    pageBd.innerHTML = '';
    pageLines = [];
    var last = null;
    for (var j = s; j <= i; j++){
        var d = mkLine(SCRIPT[j].t);
        pageLines.push(d);
        if (j === i) last = d;
    }
    trimPage();
    /* ★ 一句一句**回来**：和「一句一句收走」对称，翻页这件事才分步成立。
       delay 递增 → 上一句先落定，下一句才跟上来。 */
    pageLines.forEach(function(d, k){ d.style.transitionDelay = (k * T_STEP) + 'ms'; });
    requestAnimationFrame(function(){
        pageLines.forEach(function(d){ d.classList.add('in'); });
        /* 最新的那一句：额外打一遍字 */
        if (animateLast && last && pageLines.indexOf(last) >= 0){
            last.classList.add('now');
            typeLine(last.firstChild, SCRIPT[i].t);
        }
    });
    pagePf.textContent = '— ' + bookPageNo(i) + ' —';
}
/* ------------------------------------------------------------------
   把这一页的字**收走**：一句一句，方向跟着翻页走。
     往前 → 往上收（这一页被翻上去）　往回 → 往下收（退回去）
   返回这一段用了多久，调用方等它收干净了再换内容。
   ------------------------------------------------------------------ */
var T_OUT = 170;
function collectLines(dir){
    var n = pageLines.length;
    if (!n) return 0;
    pageLines.forEach(function(d, k){
        d.classList.remove('now');
        d.style.transitionDelay = (k * T_STEP) + 'ms';
        d.classList.add('out', dir === 'up' ? 'up' : 'down');
    });
    return T_OUT + (n - 1) * T_STEP;
}
/* 纸最多占多少：按**纸自己此刻的真实高度**算，多出来的行从最前面撤掉。
   以前写死「屏幕 40%」，小屏上照样会溢出、大屏上又留一大片空。 */
function trimPage(){
    var avail = pageEl.clientHeight - pageBd.offsetTop - 30;
    if (!(avail > 60)) avail = Math.max(150, Math.round(window.innerHeight * 0.3));
    while (pageLines.length > 1){
        var h = 0;
        pageLines.forEach(function(d){ h += d.offsetHeight; });
        if (h <= avail) break;
        var old = pageLines.shift();
        old.remove();
    }
}

/* ==================================================================
   「人」摔下来 —— 纯粹用字演
   ------------------------------------------------------------------
   ① 一个「人」从画面上头栽下来（"该怎么形容才好呢"这一拍）
   ② 砸到地上先砸扁，再炸成一地碎片（"头朝地摔，脑袋开花"这一拍）
   ★ 碎片的做法：把字所在的那个方块按 3×4 网格切成 24 个三角
     （格子顶点共享 → 拼起来严丝合缝，不会缺角也不会叠角），
     每片都是这个字自己的一部分。不用额外的字符 —— 部首那些
     unicode 在很多机器上是豆腐块，靠不住。
   ================================================================== */
/* 固定的伪随机：每次播出都一样，不会一遍一个样 */
function rndOf(k){ var x = Math.sin(k * 127.1) * 43758.5453; return x - Math.floor(x); }
function buildShards(){
    var cols = 3, rows = 4, pts = [], out = [], i, j;
    for (j = 0; j <= rows; j++){
        pts[j] = [];
        for (i = 0; i <= cols; i++){
            var jx = (i > 0 && i < cols) ? (rndOf(i * 31 + j * 7) - .5) * 9 : 0;
            var jy = (j > 0 && j < rows) ? (rndOf(i * 17 + j * 53) - .5) * 9 : 0;
            pts[j][i] = [ i / cols * 100 + jx, j / rows * 100 + jy ];
        }
    }
    for (j = 0; j < rows; j++) for (i = 0; i < cols; i++){
        var a = pts[j][i], b = pts[j][i + 1], c = pts[j + 1][i], d = pts[j + 1][i + 1];
        out.push([a[0], a[1], b[0], b[1], d[0], d[1]]);
        out.push([a[0], a[1], d[0], d[1], c[0], c[1]]);
    }
    return out;
}
var SHARDS = buildShards();
function polyOf(p){
    var s = [];
    for (var k = 0; k < p.length; k += 2) s.push(p[k] + '% ' + p[k + 1] + '%');
    return 'polygon(' + s.join(',') + ')';
}

var fallAnim = null, fallT1 = 0, midFall = false;
function offFall(){
    if (fallT1){ clearTimeout(fallT1); fallT1 = 0; }
    if (fallAnim){ try { fallAnim.cancel(); } catch (e){} fallAnim = null; }
    try { ftrail.getAnimations().forEach(function(a){ a.cancel(); }); } catch (e){}
    ffrags.innerHTML = '';
    ftrail.style.opacity = '';
    fbox.style.opacity = '';
    fbox.style.visibility = '';
    fbox.style.transform = '';
    fallEl.classList.remove('on');
    midFall = false;
}
/* 下坠：从上头栽到画面中下部（还没着地） */
function humanDrop(ms, done){
    ffrags.innerHTML = '';
    fbox.style.opacity = '1';
    fbox.style.visibility = '';
    fallEl.classList.add('on');
    var H = window.innerHeight, end = LAND * H;
    /* 身后拖的那一道风 */
    ftrail.animate([
        { transform:'translateY(' + (-0.62 * H) + 'px) scaleY(.7)', opacity:0 },
        { transform:'translateY(' + (-0.30 * H) + 'px) scaleY(1.5)', opacity:.6, offset:.45 },
        { transform:'translateY(' + end + 'px) scaleY(.5)', opacity:0 }
    ], { duration:ms, easing:'cubic-bezier(.42,.02,.86,.34)', fill:'both' });
    fallAnim = fbox.animate([
        { transform:'translateY(' + (-0.66 * H) + 'px) rotate(-14deg)', opacity:0, offset:0 },
        { transform:'translateY(' + (-0.42 * H) + 'px) rotate(-9deg)',  opacity:1, offset:.24 },
        { transform:'translateY(' + end + 'px) rotate(8deg)',           opacity:1, offset:1 }
    ], { duration:ms, easing:'cubic-bezier(.42,.02,.86,.34)', fill:'forwards' });
    /* ★ 别在这儿把 fallAnim 置空 —— 砸地那一下要拿它 cancel。
       （cancel 不掉的话，fill:forwards 会压住内联 opacity，原字一直杵着。） */
    fallAnim.onfinish = function(){ if (done) done(); };
    return fallAnim;
}
/* 着地 + 砸扁 + 炸开成碎片 */
function humanImpact(){
    midFall = false;
    fx(shockEl);
    if (fallAnim){ try { fallAnim.cancel(); } catch (e){} fallAnim = null; }
    try { ftrail.getAnimations().forEach(function(a){ a.cancel(); }); } catch (e){}
    ftrail.style.opacity = '0';
    var H = window.innerHeight, W = Math.max(340, window.innerWidth * 0.74);
    var base = 'translateY(' + (LAND * H) + 'px) ';
    /* 落地那道横线 */
    fhit.animate([
        { width:'0px', opacity:0 },
        { width:W + 'px', opacity:.85, offset:.3 },
        { width:W + 'px', opacity:0 }
    ], { duration:640, easing:'ease-out', fill:'both' });
    /* ★ 先砸扁 ——「人」贴着地面横向摊开，比直接消失像「摔」
       （动画 fill:forwards 会压住内联 style，所以先摊完再藏） */
    try {
        fbox.animate([
            { transform: base + 'scale(1,1)' },
            { transform: base + 'translateY(9px) scale(1.16,.09)' }
        ], { duration:120, easing:'cubic-bezier(.2,.8,.3,1)', fill:'forwards' });
    } catch (e){}
    if (fallT1) clearTimeout(fallT1);
    fallT1 = setTimeout(spawnShards, 118);
}
/* 炸成 24 片：从落地那一带朝上、朝外崩出去 */
function spawnShards(){
    fallT1 = 0;
    var H = window.innerHeight;
    var base = 'translateY(' + (LAND * H) + 'px) ';
    fbox.style.opacity = '0';
    fbox.style.visibility = 'hidden';
    SHARDS.forEach(function(p, k){
        var d = document.createElement('div');
        d.className = 'pc';
        d.style.clipPath = polyOf(p);
        d.style.webkitClipPath = polyOf(p);
        d.innerHTML = '<span class="g">人</span>';
        ffrags.appendChild(d);
        var cx = (p[0] + p[2] + p[4]) / 3, cy = (p[1] + p[3] + p[5]) / 3;
        var r1 = rndOf(k + 1), r2 = rndOf(k + 7), r3 = rndOf(k + 13);
        var dx = (cx - 50) * 6.4 + (r1 - .5) * 200;
        var dy = -(30 + r2 * 260) + (cy - 55) * 1.7;
        var rt = (r3 - .5) * 460;
        d.animate([
            { transform: base + 'translate(0px,0px) rotate(0deg) scale(1)', opacity:1, offset:0 },
            { transform: base + 'translate(' + (dx * .55) + 'px,' + (dy * .7) + 'px) rotate(' + (rt * .5) + 'deg) scale(.99)', opacity:1, offset:.28 },
            { transform: base + 'translate(' + dx + 'px,' + (dy + 330) + 'px) rotate(' + rt + 'deg) scale(.7)', opacity:1, offset:.55 },
            { transform: base + 'translate(' + (dx * 1.06) + 'px,' + (dy + 430) + 'px) rotate(' + (rt * 1.1) + 'deg) scale(.6)', opacity:0, offset:1 }
        ], { duration: 1150 + Math.round(r2 * 520), easing:'cubic-bezier(.14,.55,.3,1)', fill:'forwards' });
    });
}
function fallBeat(b){
    teleEl.classList.add('up');
    duoEl.classList.add('gone');       /* 让画面给那一击 */
    if (/该怎么形容/.test(b.t)){
        offFall();
        humanDrop(940, function(){ midFall = true; });
    } else {
        if (midFall) humanImpact();
        else humanDrop(300, humanImpact);     /* 直接从别处跳过来的：先摔下来再砸 */
    }
}

function showBeat(i){

    if (isCardBeat(b)){

            wh.classList.add('on'); wm.classList.remove('on');
        } else {
            hide(bubM); hide(bubH);
            pop(teleEl, hl(b.t));
            wm.classList.remove('on'); wh.classList.remove('on');
        }
        /* 摔在地上那一幕：文字动画，注意力全给它 */
        if (b.k === 'shock') fallBeat(b);
        else { teleEl.classList.remove('up'); offFall(); duoEl.classList.remove('gone'); }
    }

    /* 特效 */
    if (b.k === 'bell') fx(bellEl);

    /* HUD */
    hudNow.textContent = b.n;
    hudBar.style.width = (i / (SCRIPT.length - 1) * 100) + '%';
    var tk = 0;
    for (var q = 0; q < tocMap.length; q++) if (tocMap[q].i <= i) tk = q;
    tocLinks.forEach(function(a, k){ a.classList.toggle('on', k === tk); });
}

/* ==================================================================
   翻页 —— 这一段唯一的推进方式
   ------------------------------------------------------------------
   ★ 没有滚动条。整页就是一本书：一次动作 = 翻一页（或翻回去一页）。
     · 点画面      下一页
     · → ↓ 空格    下一页　　← ↑ 上一页　　Home / End 头尾
     · 滚轮        向下滚 = 下一页，向上 = 上一页（一次手势只翻一页）
     · 左右滑      触屏
   ------------------------------------------------------------------
   ★ 翻页的**分步**（一步一步来，别一锅端）：
       ① 收　这一页的字一句一句收走（往前往上，往回往下）
       ② 换　收干净了才重建内容 —— 交换发生在纸面上没有字的那一刻
       ③ 放　新的字一句一句回来，最新那句再打一遍字
     以前「翻页」是一张米黄的纸盖上来再退走：那纸要么铺满整屏（读不出
     是什么东西），要么得做得很大才能盖住书页（看着就突兀）。
     现在没有纸在飞 —— 动的是字本身。
   ================================================================== */
var TOTAL = SCRIPT.length;
/* 换完内容后再锁这么久才收翻页状态，免得连点把「放」这一步吃掉 */
var T_SETTLE = 90;
var turning = false, firstTurn = true, pending = -1;

function setNav(){
    pnumEl.textContent = (cur < 0 ? 1 : cur + 1) + ' / ' + TOTAL;
    navPrev.classList.toggle('off', cur <= 0);
    navNext.classList.toggle('off', cur >= TOTAL - 1);
}
function go(i){
    i = Math.max(0, Math.min(TOTAL - 1, i));
    /* 正在翻的时候又来一下：记着，翻完就去。以前是直接丢掉，
       连点几下会有「按了没反应」的手感。 */
    if (turning){ pending = i; return; }
    if (i === cur) return;
    turning = true;
    if (firstTurn){ firstTurn = false; howEl.classList.add('off'); }
    /* ① 收：只有「小说 → 小说」才需要。
       黑屏卡要的是硬切的突然，等 170ms 收字就没劲了；
       书页整页关掉的时候，字跟着整页一起走，也不该再单独收一次。 */
    var wait = 0;
    if (SCRIPT[i].k === 'bk' && cur >= 0 && SCRIPT[cur].k === 'bk'){
        wait = collectLines(i > cur ? 'up' : 'down');
    }
    /* ② 换 + ③ 放：字收干净了才动内容 */
    setTimeout(function(){
        showBeat(i);
        setNav();
        setTimeout(function(){
            turning = false;
            if (pending >= 0){ var p = pending; pending = -1; if (p !== cur) go(p); }
        }, T_SETTLE);
    }, wait);
}
function next(){ go(cur + 1); }
function prev(){ go(cur - 1); }
/* ★ 翻页条要自己接住点击 —— 上面那个「点画面翻页」是 pointerup，
   而 #nav 被它排除了（不然点「上一页」会同时触发下一页）。
   少了这两行，翻页条就是两个摆设。 */
navPrev.addEventListener('click', function(e){ e.preventDefault(); prev(); });
navNext.addEventListener('click', function(e){ e.preventDefault(); next(); });

/* 点画面 = 下一页（翻页条、目录不算；触屏走 swipe，不在这儿处理） */
document.addEventListener('pointerup', function(e){
    if (e.button !== 0) return;
    if (e.pointerType && e.pointerType !== 'mouse') return;
    if (e.target.closest && e.target.closest('#nav')) return;
    if (e.target.closest && e.target.closest('#tocs')) return;
    next();
});

/* 键盘 */
window.addEventListener('keydown', function(e){
    var k = e.key;
    /* 不带 Enter —— 焦点落在翻页条上时，回车会被链接和这里各算一次 */
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown'){
        e.preventDefault(); next();
    } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){
        e.preventDefault(); prev();
    } else if (k === 'Home'){ e.preventDefault(); go(0); }
    else if (k === 'End'){ e.preventDefault(); go(TOTAL - 1); }
});

/* 滚轮：一次手势只翻一页，不做连续滚动 */
window.addEventListener('wheel', function(e){
    if (turning) return;
    if (Math.abs(e.deltaY) < 6) return;
    e.preventDefault();
    if (e.deltaY > 0) next(); else prev();
}, { passive:false });

/* 触屏：左右滑 / 上下滑 */
var tx = 0, ty = 0, tt = 0;
window.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now();
}, { passive:true });
window.addEventListener('touchend', function(e){
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Date.now() - tt > 900) return;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); return; }
    if (Math.abs(dy) > 56){ dy < 0 ? next() : prev(); }
}, { passive:true });

/* 开场：第 0 页 */
setStage('room');
showBeat(0);
setNav();
window.MP_CUT4 = { show:showBeat, go:go, next:next, prev:prev, total:TOTAL };
</script>
