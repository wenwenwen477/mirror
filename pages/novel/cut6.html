<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT6 · 眼与神</title>
<style>
/* ==================================================================
   CUT6 · 眼与神
   ------------------------------------------------------------------
   取材：原文.txt 第 336~391 段

   接的是 CUT5 的末尾（坠落记忆停在「也只能哭喊。」）。
   视觉完全沿用 CUT4 —— 同样是一本一页一页翻的书。
   之所以能直接沿用：这一段仍然是**双线**，只是换了一个收法：
     · 小说线 —— 《华灯初上》结局的正文（原文里带【】的那些）：
                  那个女生解释自己为什么摔 → 机械降神 → 想看烟花吗
                  → 停电 → 涡旋与那只眼睛 → 居然是个好结局
     · 现实线 —— 玻琳秋坐在自己座位上把书看完，幂偌来找她，
                  两人边走向食堂边吐槽那个烂结局，走到岔路口分开
   ★ 顺序是：**书（结局） → 人（吐槽） → 岔路（分开）**。
     小说线先一个人静静演完，现实线才接上——上一段是两个人一起演书，
     这一段是「书演完了，该两个人自己说了」。
   ★ 收在【实验楼？】她这样想。下一段就是事故现场，这里是最后一步铺垫：
     她要去的那个方向，和 CUT5 里那件事是同一个方向。

   ★ 表现方式：**一本一页一页翻的书**（不滚动）。
     现实 → 教室 / 夜路背景 + 两个人在底下说话（幂偌青蓝 / 玻琳秋玫红）
     小说 → 屏幕上半部分一张纸，正文一句一句往上排（新的一句会「写」出来）
     换章 → 突然的黑屏 + 白字 + 一行译文（硬切，故意不给过渡）
     ★ 两个人永远在**纸的前面**（z 高于书页），像俯身看书那样压在纸的下沿
       —— 层次就靠这个。
     ★ 推进只有一种动作：**翻页**。点画面 / 按 → / 空格 / 滚轮 / 左右滑，
       都只是翻一页（或翻回去一页）。背景和角色一直在，动的是纸上的字：
       收走旧的 → 换 → 一句一句放新的。没有纸在屏幕上飞。
     ★ 坠楼那一幕不用 CG：**一个「人」字栽下来，砸到地上，散成一地碎片。**
   颜色分工（一眼要能分清谁在说话）：
     小说正文  黑墨 + 宋体 + 纸黄底
     幂偌      青蓝 #2e7d8f
     玻琳秋    玫红 #b0446a
     旁白      灰白、半透明
   ================================================================== */
:root{
    --mi:#2e7d8f;            /* 幂偌 —— 青蓝 */
    --mi-l:#e2f2f4;
    --he:#b0446a;            /* 玻琳秋 —— 玫红 */
    --he-l:#fbe9ef;
    --ink:#2b2622;           /* 小说正文 —— 墨 */
    --paper:#f4e9cf;         /* 纸 */
    --paper2:#ece0c2;
    --song:SimSun,"Songti SC","STSong","Noto Serif CJK SC",serif;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
}
*{ box-sizing:border-box; }
/* ★ 不滚动。整页就是一本书，高度锁死，推进只靠翻页。 */
html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
body{
    background:#0b0a09; color:#d8d2c6;
    font:14px/1.9 var(--sans);
}

/* ==================================================================
   背景：教室（默认）→ 夜晚街道（夜路那几段）
   全部由 #bgstage 里的层做交叉淡入，跟 CUT3 一个路子。
   ================================================================== */
#bgstage{ position:fixed; inset:0; z-index:0; overflow:hidden; background:#0b0a09; }
.bg{ position:absolute; inset:0; opacity:0; transition:opacity 1.8s ease; }
.bg.on{ opacity:1; }

/* 教室：墙 + 窗光斜柱 + 一排排课桌 */
.bg-room{
    background:
        linear-gradient(118deg, rgba(255,251,231,.85) 0 12%, rgba(255,251,231,0) 40%),
        linear-gradient(180deg,#2b3440 0%,#333d47 22%,#3a4048 46%,#2f343a 100%);
}
.bg-room::before{        /* 课桌横带 */
    content:""; position:absolute; inset:56% 0 0 0; opacity:.3;
    background:repeating-linear-gradient(180deg,
        rgba(30,26,22,.55) 0 14px, rgba(70,62,52,.30) 14px 26px, rgba(0,0,0,0) 26px 54px);
}
.bg-room::after{         /* 后墙窗 */
    content:""; position:absolute; left:4%; top:10%; width:26%; height:30%;
    background:linear-gradient(180deg,#4a5a68,#39454f);
    box-shadow:inset 0 0 0 3px rgba(20,24,28,.7);
}
/* 夜晚街道：路灯光斑 + 远处楼窗 + 湿路面反光 */
.bg-night{
    background:
        radial-gradient(closest-side at 18% 26%, rgba(255,224,160,.42), rgba(255,224,160,0)),
        radial-gradient(closest-side at 78% 20%, rgba(255,224,160,.30), rgba(255,224,160,0)),
        linear-gradient(180deg,#14161f 0%,#1a1d26 44%,#24262c 62%,#16171c 100%);
}
.bg-night::before{       /* 楼窗点点 */
    content:""; position:absolute; inset:0 0 42% 0; opacity:.5;
    background:
        radial-gradient(circle, rgba(255,238,190,.9) 0 1.6px, rgba(0,0,0,0) 2px) 0 0/34px 26px,
        radial-gradient(circle, rgba(255,238,190,.5) 0 1.3px, rgba(0,0,0,0) 2px) 10px 8px/46px 38px;
}
.bg-night::after{        /* 湿路面 */
    content:""; position:absolute; inset:66% 0 0 0;
    background:linear-gradient(180deg, rgba(255,214,150,.14), rgba(255,214,150,0) 70%);
}

/* ==================================================================
   顶部：一条极简的进度条 + CUT6 标
   ================================================================== */
#hud{ position:fixed; left:0; right:0; top:0; z-index:90; pointer-events:none;
    display:flex; align-items:center; gap:14px; padding:11px 20px;
    background:linear-gradient(180deg, rgba(6,6,6,.82), rgba(6,6,6,0)); }
#hud .tag{ font:700 11px/1 var(--sans); letter-spacing:3px; color:#0b0a09;
    background:var(--paper); padding:5px 10px; border-radius:2px; }
#hud .now{ font-size:12px; color:#b8b0a2; letter-spacing:1px; }
#hud .bar{ flex:1; height:2px; background:rgba(255,255,255,.10); border-radius:2px; overflow:hidden; }
#hud .bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--mi),var(--he));
    transition:width .3s linear; }

/* ==================================================================
   现实层：两个人的立绘 + 头顶气泡
   ★ z70 —— 压在书页（z60）**上面**。两个人像俯身看书那样压在纸的下沿，
     层次（质感）就是这么来的。看书时只是虚化一点点（景深），不撤掉。
   ================================================================== */
/* bottom 留出翻页条的位置（#nav 在 bottom:14px） */
.duo{ position:fixed; left:50%; bottom:74px; z-index:70; display:flex; align-items:flex-end;
    gap:88px; transform:translateX(-50%); pointer-events:none;
    transition:opacity .5s ease, filter .5s ease; }
.duo.read{ opacity:.68; filter:blur(.8px) brightness(.9); }
/* 坠楼那两拍：两个人退成影子，把画面让给那一下 */
.duo.gone{ opacity:.12; filter:blur(3px) brightness(.55); }
.who{ width:150px; display:flex; flex-direction:column; align-items:center;
    opacity:.34; filter:grayscale(.7);
    transition:opacity .5s ease, filter .5s ease; }
.who.on{ opacity:1; filter:none; }
.who .fg{ position:relative; width:100%; height:250px; }
.who .fg::before{
    content:""; position:absolute; left:-16%; right:-16%; bottom:-8px; top:20px;
    background:radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0) 76%);
}
.who .fg svg{ display:block; width:100%; height:100%; }
.who .fg{ animation:bob 1.2s ease-in-out infinite; }
#wm .fg{ animation-delay:-.18s; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

/* 气泡。两个人的**边框和底色都不同** —— 远处也能一眼分清谁在说话。 */
.bub{ position:relative; width:250px; max-height:32vh; overflow:hidden;
    margin:0 0 10px; padding:11px 15px; border-radius:12px;
    font-size:14.5px; line-height:1.9; letter-spacing:.3px;
    opacity:0; transform:translateY(10px) scale(.96);
    transition:opacity .34s ease, transform .34s ease; }
.bub.on{ opacity:1; transform:translateY(0) scale(1); }
/* 幂偌：青蓝 */
#wm .bub{ background:rgba(226,242,244,.96); border:1px solid rgba(46,125,143,.45);
    border-left:4px solid var(--mi); color:#17454e; }
/* 玻琳秋：玫红 */
#wh .bub{ background:rgba(251,233,239,.96); border:1px solid rgba(176,68,106,.42);
    border-right:4px solid var(--he); color:#6d1f3c; }
.bub::after{ content:""; position:absolute; bottom:-7px; width:11px; height:11px;
    border:1px solid rgba(0,0,0,.14); transform:rotate(45deg); }
#wm .bub::after{ left:50%; margin-left:-6px; background:rgba(226,242,244,.96);
    border-top:0; border-left:0; }
#wh .bub::after{ left:50%; margin-left:-6px; background:rgba(251,233,239,.96);
    border-top:0; border-right:0; }
.bub .who-tag{ display:block; margin-bottom:3px; font-size:10.5px; font-weight:700;
    letter-spacing:2px; opacity:.62; }
#wm .bub .who-tag{ color:var(--mi); }
#wh .bub .who-tag{ color:var(--he); }

/* 提词器：旁白。画面正中偏上，不吃指针事件。 */
#tele{ position:fixed; left:50%; top:20%; z-index:55; width:min(620px,78vw);
    padding:12px 26px; text-align:center; pointer-events:none;
    background:rgba(16,15,13,.88); border:1px solid rgba(200,190,160,.20); border-radius:12px;
    font-family:var(--song); font-size:15.5px; letter-spacing:.8px; color:#cdc6b6;
    opacity:0; transform:translate(-50%,-10px);
    transition:opacity .4s ease, transform .4s ease, top .4s ease; }
#tele.on{ opacity:1; transform:translate(-50%,0); }
/* 让位给「人」往下摔的那条路线 —— 旁白挪到最上头 */
#tele.up{ top:7.5%; width:min(680px,86vw); font-size:14.5px; }

/* 重点标记：写 **这样** */
.hl{ font-weight:700; color:#8a2f1c;
    background:linear-gradient(transparent 62%, rgba(238,190,60,.34) 62%);
    -webkit-box-decoration-break:clone; box-decoration-break:clone; }
#tele .hl{ color:#e8b473; background:linear-gradient(transparent 62%, rgba(238,190,60,.24) 62%); }
.bub .hl{ color:#a8341f; }

/* ==================================================================
   小说页：屏幕上半部分的一张纸
   ★ 纸在人物**后面**（#page z60 < .duo z70）：
     两个人像俯身看书那样压在纸的下沿，层次（质感）就出来了。
   ★ 高度跟着行数长 —— 不再是先撑出 56vh 的空白，最多到 58vh 就翻页。
   ================================================================== */
#page{ position:fixed; left:50%; top:7vh; z-index:60; width:min(820px, 90vw);
    min-height:36vh; max-height:48vh; overflow:hidden; padding:24px 44px 30px;
    transform:perspective(1600px) translateX(-50%) rotateY(94deg) scale(.94);
    transform-origin:left center;
    opacity:0; pointer-events:none;
    background:
        linear-gradient(105deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 100%),
        linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%);
    border-radius:3px;
    box-shadow:0 26px 70px rgba(0,0,0,.66), 0 0 0 1px rgba(120,100,60,.35),
        7px 9px 0 -2px rgba(228,214,176,.55), 14px 18px 0 -5px rgba(214,198,152,.30);
    transition:transform .58s cubic-bezier(.4,.1,.2,1), opacity .32s ease, filter .45s ease; }
#page.on{ transform:perspective(1600px) translateX(-50%) rotateY(0deg) scale(1); opacity:1; }
/* 书脊那一道折痕 */
#page::before{
    content:""; position:absolute; left:26px; top:0; bottom:0; width:1px;
    background:linear-gradient(180deg, rgba(0,0,0,0), rgba(90,70,40,.30) 20%, rgba(90,70,40,.30) 80%, rgba(0,0,0,0));
}
#page::after{         /* 纸的横纹 */
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:3px;
    background:repeating-linear-gradient(180deg,
        rgba(120,95,55,.07) 0 1px, rgba(0,0,0,0) 1px 4px);
}
#page .hd{ position:relative; z-index:2; text-align:center; padding-bottom:9px;
    border-bottom:1px solid rgba(120,95,55,.30); margin-bottom:13px; }
#page .hd .bt{ font-family:var(--song); font-size:14px; letter-spacing:6px; color:#6b5533; }
#page .hd .bc{ margin-top:3px; font-size:11px; letter-spacing:2px; color:#93805c; }
#page .bd{ position:relative; z-index:2; }
#page .ln{ font-family:var(--song); font-size:18px; line-height:2.02; color:var(--ink);
    letter-spacing:1.1px; text-indent:2em; margin:0 0 2px;
    opacity:0; transform:translateY(6px);
    transition:opacity .36s ease, transform .36s ease; }
#page .ln.in{ opacity:1; transform:translateY(0); }
/* 翻页 = 先把这一页的字**一句一句收走**，再一句一句放新的。
   ★ 写在 .in 后面 —— 同特异性时后写的赢，收走才能盖住「已显示」状态。
   ★ 方向跟着翻页走：往前翻 = 往上收（这一页被翻上去），
     往回翻 = 往下收（退回去）。 */
#page .ln.out{ opacity:0; transition:opacity .17s ease, transform .17s ease; }
#page .ln.out.up{ transform:translateY(-10px); }
#page .ln.out.down{ transform:translateY(10px); }
/* 最新的一句：左边一道竖线当「正在读」的游标 */
#page .ln.now{ text-indent:0; padding-left:2em; position:relative; }
#page .ln.now::before{ content:"▎"; position:absolute; left:0; color:#8a2f1c;
    animation:caret 1s steps(1) infinite; }
@keyframes caret{ 0%,49%{ opacity:1; } 50%,100%{ opacity:.15; } }
/* ------------------------------------------------------------------
   ★ 书里那部分要能一眼分出来 —— 两种「书里的字」不是一个身份：
       bk  原文引用（带引号的那些）→ 墨黑、正体、顶格两字缩进
       bt  玻琳秋读完的**转述**（原文没加引号，但讲的是书里的事）
           → 淡褐、行首一道竖线、字号小半号、缩进一格
     两者的差别不是颜色深浅而已，**缩进和那道竖线**才让它读起来像「另一层」。
   ------------------------------------------------------------------ */
#page .ln.bt{ color:#6a563c; font-size:16.4px; text-indent:0;
    padding-left:1.9em; border-left:2px solid rgba(154,130,86,.42); }
#page .ln.bt.now{ padding-left:1.9em; }
#page .ln.bt.now::before{ left:2px; }
#page .ln.bt .sp{ margin-left:.2em; }   /* bt 行里用全角空格缩进，是「引述语气」的记号 */
@media (max-width:900px){ #page .ln.bt{ font-size:14.2px; } }
/* 页眉右上角一个「书中」角标：只要纸是开着的就挂着，提醒这页不是现实 */
#page .hd .bk-tag{ position:absolute; right:0; top:50%; transform:translateY(-50%);
    font-size:10px; letter-spacing:3px; text-indent:3px; color:#8a7550;
    border:1px solid rgba(138,117,80,.45); border-radius:2px; padding:2px 7px; }
#page .hd{ position:relative; }
/* 打字：外层撑住排版，内层一步一停地露出来（clip-path 不触发重排） */
#page .ln > span{ display:block; }
/* 页码：给纸下方的空处一个说得通的理由 */
#page .pf{ position:relative; z-index:2; margin-top:8px; text-align:center;
    font-family:var(--song); font-size:11.5px; letter-spacing:3px; color:#a89066; }

/* ==================================================================
   铃声 / 冲击
   ================================================================== */
#bellfx{ position:fixed; inset:0; z-index:76; pointer-events:none; opacity:0; }
#bellfx.go{ animation:bell 1.1s ease; }
@keyframes bell{ 0%{ opacity:.9; background:radial-gradient(circle at 50% 42%, rgba(255,244,214,.55), rgba(255,244,214,0) 46%); }
                 100%{ opacity:0; } }
/* 冲击：一闪即过的暗红（坠楼那一下）。注意力交给下面的文字动画，别抢戏。 */
#shock{ position:fixed; inset:0; z-index:94; pointer-events:none; opacity:0; background:#2a0b07; }
#shock.go{ animation:shock .62s ease; }
@keyframes shock{ 0%{ opacity:.5; } 100%{ opacity:0; } }

/* ==================================================================
   「人」摔碎 —— 用字演，不用CG
   ------------------------------------------------------------------
   一个人字从画面上头摔下来，砸到地面，散成一地碎片。
   ★ 碎片的做法：把同一个字复制十几份，每份用 clip-path 切一块，
     各自飞向不同方向 —— 不用额外的字库字符（部首那几个 unicode
     在很多机器上会变成豆腐块），切出来的每一块就是真的原字的一部分。
   ================================================================== */
#fall{ --sz: min(36vh, 33vw);
    position:fixed; inset:0; z-index:96; pointer-events:none; opacity:0;
    transition:opacity .35s ease; }
#fall.on{ opacity:1; }
#fall .slot{ position:absolute; left:50%; top:50%; width:var(--sz); height:var(--sz);
    transform:translate(-50%,-50%); }
#fall .box{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
#fall .g{ display:block; font-family:var(--song); font-size:var(--sz); line-height:1;
    color:#f0e8d8; text-shadow:0 0 26px rgba(0,0,0,.75); }
/* 落地那一道横向的冲击线 */
#fall .hit{ position:absolute; left:50%; top:50%; width:0; height:1px; opacity:0;
    background:linear-gradient(90deg, rgba(240,232,216,0), rgba(240,232,216,.9), rgba(240,232,216,0)); }
/* 下坠时拖在身后的那一道风 */
#fall .trail{ position:absolute; left:50%; top:50%; width:2px; height:var(--sz); opacity:0;
    margin-left:-1px; margin-top:calc(var(--sz) / -2);
    background:linear-gradient(180deg, rgba(240,232,216,0), rgba(240,232,216,.42), rgba(240,232,216,0));
    filter:blur(1px); }
#fall .frags{ position:absolute; inset:0; }
/* ★ 碎片要和原字**严丝合缝**：同样的方块、同样的位置、同样的字号，
   只是一块块被切掉。用 margin 居中而不用 translate —— transform 要留给飞行。 */
#fall .frags .pc{ position:absolute; left:50%; top:50%;
    width:var(--sz); height:var(--sz);
    margin-left:calc(var(--sz) / -2); margin-top:calc(var(--sz) / -2);
    display:flex; align-items:center; justify-content:center;
    will-change:transform,opacity; }
#fall .frags .pc .g{ text-shadow:none; }

/* ==================================================================
   黑屏字幕卡：「翻页吧。」/「头朝地摔的。」
   ------------------------------------------------------------------
   ★ 硬切，不做淡入 —— 突然，才有压迫感。
     黑底 + 白字 + 一行小字译文，然后由玩家自己翻走。
   ================================================================== */
#black{ position:fixed; inset:0; z-index:97; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:0 8vw; text-align:center;
    background:#000; opacity:0; pointer-events:none; visibility:hidden; }
#black.on{ opacity:1; visibility:visible; }
#black .zh{ font-family:var(--song); font-weight:400; color:#fff;
    font-size:clamp(30px,6.2vw,64px); letter-spacing:.22em; text-indent:.22em;
    animation:cardIn .34s cubic-bezier(.2,.7,.2,1) both; }
#black .rule{ width:min(300px,52vw); height:1px; margin:26px 0 16px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.34), rgba(255,255,255,0));
    animation:cardIn .5s ease .16s both; }
#black .en{ font-family:var(--sans); font-size:11.5px; letter-spacing:.44em;
    text-indent:.44em; color:rgba(255,255,255,.44);
    animation:cardIn .6s ease .24s both; }
#black.fin .zh{ text-shadow:0 0 40px rgba(255,255,255,.22); }
/* 黑屏卡把翻页条盖住了，停两秒多才浮出一行极淡的提示，免得人卡在这儿 */
#black .hint{ position:absolute; left:0; right:0; bottom:26px; opacity:0;
    font-size:11px; letter-spacing:.4em; text-indent:.4em; color:rgba(255,255,255,.20);
    animation:hintIn .8s ease 2.6s both; }
@keyframes hintIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes cardIn{ 0%{ opacity:0; letter-spacing:.6em; filter:blur(6px); }
                   100%{ opacity:1; filter:blur(0); } }

/* ==================================================================
   整页黑幕：停电之后
   ------------------------------------------------------------------
   ★ 停电这一段有三步，一步都不能并掉（用户明确要求）：
       ① 黑屏大字卡（#black，复用 CUT5/4 那一套）
       ② **整个页面直接黑掉** —— 不是把背景调暗，是盖一层纯黑（#darkveil）
          把教室、纸、两个人、翻页条全盖住，只留字。
       ③ 从此只有**白色的字**从黑里往外冒（#tele.whiteout：无底框、
          无边框、字自己发一点微光）。
     顺序上，① 之后才 ②，② 之后才 ③；③ 演几拍之后才轮到眼球。
   ================================================================== */
#darkveil{ position:fixed; inset:0; z-index:80; background:#000;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .85s ease, visibility .85s; }
#darkveil.on{ opacity:1; visibility:visible; }
body.st-dark .duo{ opacity:0; }            /* 两个人一起让出去 */
/* 翻页条在黑幕里退到几乎看不见，只留一条缝让人知道还能翻 */
body.st-dark #nav{ opacity:.22; }
body.st-dark #nav:hover{ opacity:1; }
body.st-dark #tocs{ opacity:.3; }
/* 白字浮出来：提词器卸掉所有框，只剩一行发微光的字。
   ★ z 抬到 94 —— 必须压在 #motes(82) 和 #flash(93) 上面，
     不然眼球那场会被四散的字糊住看不清。 */
#tele.whiteout{ z-index:94; top:9%; width:min(760px,84vw); padding:0;
    background:none; border:0; border-radius:0;
    font-family:var(--song); font-size:clamp(17px,2.3vw,25px);
    letter-spacing:.14em; text-indent:.14em; color:#e9e6dd;
    text-shadow:0 0 22px rgba(190,205,255,.30), 0 0 3px rgba(255,255,255,.35); }
#tele.whiteout.on{ animation:rise 1.1s cubic-bezier(.16,.8,.24,1) both; }
@keyframes rise{
    0%{ opacity:0; transform:translate(-50%,26px); filter:blur(9px); letter-spacing:.5em; }
    100%{ opacity:1; transform:translate(-50%,0);  filter:blur(0);   letter-spacing:.14em; } }
/* 白字里书里的那两句：左右各一道细白线，像引文 */
#tele.whiteout.q{ padding:0 30px; }
#tele.whiteout.q::before, #tele.whiteout.q::after{
    content:""; position:absolute; top:6%; bottom:6%; width:1px;
    background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.34), rgba(255,255,255,0)); }
#tele.whiteout.q::before{ left:0; } #tele.whiteout.q::after{ right:0; }
@media (max-width:900px){ #tele.whiteout{ top:8%; font-size:16px; } }

/* ==================================================================
   四周的云 / 雨 / 风 / 雷 / 电 —— 一整片会呼吸的字
   ------------------------------------------------------------------
   ★ 这是眼球那场戏的**全部素材**：眼球不是画上去的一张图，
     是这些字从四面八方聚过来、拧成一股、最后凝成的那只眼。
     所以它们一开始就要在：极低透明度、缓慢自转和浮动，
     随剧情推进一级一级收紧（.lvl1 → .lvl4）。
   ================================================================== */
#motes{ position:fixed; inset:0; z-index:82; pointer-events:none;
    opacity:0; visibility:hidden; overflow:hidden;
    transition:opacity 1.6s ease, visibility 1.6s; }
#motes.on{ opacity:1; visibility:visible; }
/* ★ 这里**不给每个字挂 text-shadow**。
   一千多个字各带一个 14px 模糊阴影 = 每帧上千次阴影光栅化，
   实测帧耗时 77ms（13fps，卡到看不下去）。
   去掉逐字阴影后字仍是亮白的（color:#cfd8ea 本来就比背景亮很多），
   观感几乎无损；真要发光感，就在**少数几个**大字上单独挂阴影，
   不要全场都挂。 */
#motes .mote{ position:absolute; font-family:var(--song); color:#cfd8ea;
    line-height:1; white-space:nowrap; will-change:transform,opacity; }
/* ★ 合成层**逐字提**在字多时反而是最优解（实测 24.3ms）：
     提到 #mspin 容器上试过（31.5ms / p90 90ms），完全不提也一样重绘。
   ★ 这一场的性能全靠两件事撑着（都试错过）：
     ① 每个字**不挂 text-shadow**。一千多个字各带一个 14px 模糊阴影
        = 每帧上千次阴影光栅化，实测 77ms（13fps，卡到看不下去）。
        字本身是亮白的（#cfd8ea 比背景亮很多），去掉阴影观感几乎无损。
     ② 值没变就不写 DOM（moteLoop 里比对 _x/_y/_s/_o）。 */
/* ★ 字号是 buildMotes 里逐字写死的内联值（每个字大小不一样才不呆），
     透明度也由 moteLoop 每帧算。所以这里**不写** font-size / opacity ——
     写了也会被内联值盖掉，留着只会误导。 */
/* 云字的父容器。★ inset:0（不是 0×0）—— 字按**视口坐标**算好偏移，
   容器必须和视口一样大，偏移才落在同一个坐标系里。
   ★ 这里**不套 CSS 自转**：球面的自转与行波已经在 moteLoop 里逐字算了
     （每个字的经度 lam 都在推进，还带纬向差速），再套一层 CSS rotate
     就是两层转速相乘，转速对不上；而且字的球面位置会被整体拧偏、
     拧出球面 —— 壳的形状就散了。
   ★ will-change 不在这一层：字多时**逐字提**反而是最优解
     （实测 24.3ms；提到容器上是 31.5ms / p90 90ms）。
     上面的注释里记了这条，别再改回去。 */
#mspin{ position:absolute; inset:0; }

/* ==================================================================
   眼珠 —— **内切在**那个字球壳里的那只眼
   ------------------------------------------------------------------
   ★ 就是主菜单那只眼球：**汉字网格 + 镂空瞳孔 + 眼珠可转**。
     瞳孔 = 空洞（一个字的圆内什么都不画），虹膜环 = 受光侧字密、
     背光侧字疏，眼眶 = 一圈轮廓字，其余留空。
     睁开 = 纵向半高 ay 从一条缝长到全开，瞳孔随之由无到有。
     眼珠 = 瞳孔中心 (ox,oy) 在眼眶里游走。
   ★ 眼珠和壳是**两回事**：壳由周围的字汇聚而成（moteLoop），
     眼珠自己是 canvas 画的一层。内切靠 SHELL_R = 眼窝半宽 + 一点余量。
   ★ **为什么用 canvas，而不是像主菜单那样拼 <pre> 字符串**：
     网格眼珠的前提是「一个字正好一格宽」，这依赖字体等宽。
     主菜单在作者机器上装了 Sarasa Mono，所以那条路走得通；
     这里实测本机 13px 雅黑 —— `丶丿氵灬` 被回退到别的字体，
     宽度只有全角的一半，整只眼会歪成一坨。
     canvas 逐格 fillText、自己算 x/y，**一个字都不依赖字体**，
     换台机器还是同一只眼。
   ================================================================== */
#eyeball{ position:absolute; left:50%; top:44%; z-index:2;
    transform:translate(-50%,-50%);
    opacity:0; transition:opacity .9s ease; }
#eyeball.on{ opacity:1; }
#eyecv{ display:block; }

/* 云翳炸开那一下（eye:4）：白闪 + 字被掀出去
   ★ 白闪要**短**。实测 820ms、峰值 .92 时，闪完还有一大团灰雾留在
     画面正中，把「乌云满天满城风雨」那几拍的字全糊掉了 ——
     闪是给「轰」那一下用的，不是给后面几拍留的。
     收到 460ms、峰值 .7：白得够狠，尾巴收得快。 */
#flash{ position:fixed; inset:0; z-index:93; pointer-events:none;
    background:radial-gradient(circle at 50% 44%, rgba(255,255,255,.92), rgba(255,255,255,0) 58%);
    opacity:0; }
#flash.go{ animation:flash .46s ease-out; }
@keyframes flash{ 0%{ opacity:0; } 12%{ opacity:.7; } 100%{ opacity:0; } }

/* 目录 */
#tocs{ position:fixed; right:16px; top:50%; z-index:88; transform:translateY(-50%);
    font-size:11px; letter-spacing:1px; text-align:right; }
#tocs a{ display:block; padding:3px 0; color:rgba(220,210,190,.34); text-decoration:none;
    transition:color .3s ease; }
#tocs a.on{ color:var(--paper); font-weight:700; }
#tocs a:hover{ color:#fff; }

/* ==================================================================
   翻页条：像书的页脚。上一页 / 页码 / 下一页
   ================================================================== */
/* ★ 居中不用 left:50%+translateX(-50%) —— 绝对定位元素只给 left 时，
   可用宽度只剩视口的一半，窄屏上会把「下一页」挤成两行、整条变成两层。
   改成 left:0/right:0 + width:max-content + margin auto：按内容宽度居中。 */
#nav{ position:fixed; left:0; right:0; bottom:14px; z-index:92;
    width:max-content; max-width:calc(100vw - 16px); margin:0 auto;
    display:flex; align-items:center; gap:14px;
    padding:7px 13px; border-radius:2px;
    background:rgba(244,233,207,.94); border:1px solid rgba(120,95,55,.38);
    box-shadow:0 8px 26px rgba(0,0,0,.45);
    font-size:12px; letter-spacing:2px; color:#6b5533; }
#nav a{ color:#6b5533; text-decoration:none; padding:3px 9px; border-radius:2px;
    cursor:pointer; user-select:none; white-space:nowrap;
    transition:background .2s ease, color .2s ease; }
#nav a:hover{ background:rgba(120,95,55,.16); color:#3a2a12; }
#nav a.off{ opacity:.3; pointer-events:none; }
#nav .pn{ font-family:var(--song); font-size:12.5px; letter-spacing:1px;
    color:#8a7550; min-width:88px; text-align:center; white-space:nowrap; }
#nav .how{ font-size:11px; letter-spacing:1px; color:#a08a62; padding-left:4px;
    border-left:1px solid rgba(120,95,55,.28); }
#nav .how.off{ display:none; }

/* 窄屏 */
@media (max-width:900px){

    .who .fg{ height:156px; }

}

function hl(s){

/* 换句的「两段式」：先淡出，再换内容淡入。
   同一个元素连续用时，过渡被打断会从当前透明度接着走 → 整段等于没发生。 */
var POP_OUT = 200;
function swapIn(el, html){
    el.style.transition = 'none';
    el.innerHTML = html;
    el.classList.remove('on');
    void el.offsetWidth;
    el.style.transition = '';
    el.classList.add('on');
}
function pop(el, html){
    if (el._t){ clearTimeout(el._t); el._t = 0; }
    el.style.transitionDuration = '';
    if (!el.classList.contains('on')){ swapIn(el, html); return; }
    el.style.transitionDuration = POP_OUT + 'ms';
    el.classList.remove('on');
    el._t = setTimeout(function(){ el._t = 0; el.style.transitionDuration = ''; swapIn(el, html); }, POP_OUT);
}
function hide(el){
    if (el._t){ clearTimeout(el._t); el._t = 0; }
    el.style.transitionDuration = '';
    el.classList.remove('on');
}
function fx(el){
    el.classList.remove('go');
    void el.offsetWidth;      /* 强制重排，让动画能重播 */
    el.classList.add('go');
}

/* ------------------------------------------------------------------
   书页内容：整页**按起点重建**
   ------------------------------------------------------------------
   ★ 以前是一行一行往上 append。往回翻会把同一句再堆一次、页数也乱
     —— 这就是那个最明显的小 bug。现在每走到一拍，就从这一段最早的
     那一句重新排一遍，前进后退结果都一样。
   ------------------------------------------------------------------ */
function pageStart(i){
    var s = i;
    while (s > 0 && isBookK(SCRIPT[s - 1].k)) s--;
    return s;
}

   两者都排在纸上、同一页一起排 —— 但每行按自己的身份上不同的样式。 */
function isBookK(k){ return k === 'bk' || k === 'bt'; }

function bookPageNo(i){
    var n = 0;
    for (var j = 0; j <= i; j++){

    }
    return n || 1;
}
/* 打字：clip-path 从左往右开。不引起重排，标点换行也不会乱。 */
function typeLine(span, txt){
    var n = String(txt).replace(/\*\*/g, '').length;
    var ms = Math.max(380, Math.min(1500, n * 46));
    try {
        return span.animate([{ clipPath:'inset(0 100% 0 0)' }, { clipPath:'inset(0 0 0 0)' }],
            { duration:ms, easing:'linear', fill:'both' });
    } catch (e){ return null; }
}
/* 一行一行收 / 放的时候，相邻两句差这么多毫秒 */
var T_STEP = 22;
function mkLine(txt, kind){
    var d = document.createElement('p');
    d.className = 'ln' + (kind === 'bt' ? ' bt' : '');
    d.innerHTML = '<span>' + hl(txt) + '</span>';

var pageLines = [];
function repaintPage(i, animateLast){
    var s = pageStart(i);
    pageBd.innerHTML = '';
    pageLines = [];
    var last = null;
    for (var j = s; j <= i; j++){
        var d = mkLine(SCRIPT[j].t, SCRIPT[j].k);
        pageLines.push(d);
        if (j === i) last = d;
    }
    trimPage();
    /* ★ 一句一句**回来**：和「一句一句收走」对称，翻页这件事才分步成立。
       delay 递增 → 上一句先落定，下一句才跟上来。 */
    pageLines.forEach(function(d, k){ d.style.transitionDelay = (k * T_STEP) + 'ms'; });
    requestAnimationFrame(function(){
        pageLines.forEach(function(d){ d.classList.add('in'); });
        /* 最新的那一句：额外打一遍字 */
        if (animateLast && last && pageLines.indexOf(last) >= 0){
            last.classList.add('now');
            typeLine(last.firstChild, SCRIPT[i].t);
        }
    });

/* ------------------------------------------------------------------
   把这一页的字**收走**：一句一句，方向跟着翻页走。
     往前 → 往上收（这一页被翻上去）　往回 → 往下收（退回去）
   返回这一段用了多久，调用方等它收干净了再换内容。
   ------------------------------------------------------------------ */
var T_OUT = 170;
function collectLines(dir){
    var n = pageLines.length;
    if (!n) return 0;
    pageLines.forEach(function(d, k){
        d.classList.remove('now');
        d.style.transitionDelay = (k * T_STEP) + 'ms';
        d.classList.add('out', dir === 'up' ? 'up' : 'down');
    });
    return T_OUT + (n - 1) * T_STEP;
}
/* 纸最多占多少：按**纸自己此刻的真实高度**算，多出来的行从最前面撤掉。
   以前写死「屏幕 40%」，小屏上照样会溢出、大屏上又留一大片空。
   ★ avail 里必须把**页码行 .pf** 也算进去。以前只减了正文上方的偏移和
     底部 padding，漏了页码那一行（margin-top 8 + 字号 11.5 那行）：
     正文不溢出、整张纸却溢出 20 多 px，最后一行被裁掉半截。 */
function trimPage(){
    /* ★ pagePf 已经是全局缓存的 DOM 句柄，这里原来又 getElementById 一次。
       同理 marginTop：.pf 的 margin-top 是 CSS 里写死的 8px，
       用 getComputedStyle 去读它会**强制样式重算**，每次翻书页都白付一次。 */
    var pfH = (pagePf ? pagePf.offsetHeight : 0) + 8;
    var avail = pageEl.clientHeight - pageBd.offsetTop - pfH - 30;
    if (!(avail > 60)) avail = Math.max(150, Math.round(window.innerHeight * 0.3));
    /* ★ 行高只读一次。原来是 while 里每轮都 forEach 一遍累加 offsetHeight
       —— n 行撤 k 次就是 O(n²) 次 offsetHeight，而每次都强制同步布局。
       （offsetHeight 在循环里改会触发 layout-thrash，这是纸面裁切唯一的开销来源。） */
    if (pageLines.length <= 1) return;
    var hs = [];
    var total = 0;
    for (var i = 0; i < pageLines.length; i++){
        var hh = pageLines[i].offsetHeight;
        hs.push(hh); total += hh;
    }
    while (pageLines.length > 1 && total > avail){
        total -= hs.shift();
        pageLines.shift().remove();
    }
}

/* ==================================================================
   「人」摔下来 —— 纯粹用字演
   ------------------------------------------------------------------
   ① 一个「人」从画面上头栽下来（"该怎么形容才好呢"这一拍）
   ② 砸到地上先砸扁，再炸成一地碎片（"头朝地摔，脑袋开花"这一拍）
   ★ 碎片的做法：把字所在的那个方块按 3×4 网格切成 24 个三角
     （格子顶点共享 → 拼起来严丝合缝，不会缺角也不会叠角），
     每片都是这个字自己的一部分。不用额外的字符 —— 部首那些
     unicode 在很多机器上是豆腐块，靠不住。
   ================================================================== */
/* 固定的伪随机：每次播出都一样，不会一遍一个样 */
function rndOf(k){ var x = Math.sin(k * 127.1) * 43758.5453; return x - Math.floor(x); }
function buildShards(){
    var cols = 3, rows = 4, pts = [], out = [], i, j;
    for (j = 0; j <= rows; j++){
        pts[j] = [];
        for (i = 0; i <= cols; i++){
            var jx = (i > 0 && i < cols) ? (rndOf(i * 31 + j * 7) - .5) * 9 : 0;
            var jy = (j > 0 && j < rows) ? (rndOf(i * 17 + j * 53) - .5) * 9 : 0;
            pts[j][i] = [ i / cols * 100 + jx, j / rows * 100 + jy ];
        }
    }
    for (j = 0; j < rows; j++) for (i = 0; i < cols; i++){
        var a = pts[j][i], b = pts[j][i + 1], c = pts[j + 1][i], d = pts[j + 1][i + 1];
        out.push([a[0], a[1], b[0], b[1], d[0], d[1]]);
        out.push([a[0], a[1], d[0], d[1], c[0], c[1]]);
    }
    return out;
}
var SHARDS = buildShards();
function polyOf(p){
    var s = [];
    for (var k = 0; k < p.length; k += 2) s.push(p[k] + '% ' + p[k + 1] + '%');
    return 'polygon(' + s.join(',') + ')';
}

var fallAnim = null, fallT1 = 0, midFall = false;

/* 下坠：从上头栽到画面中下部（还没着地） */
function humanDrop(ms, done){
    ffrags.innerHTML = '';
    fbox.style.opacity = '1';
    fbox.style.visibility = '';
    fallEl.classList.add('on');
    var H = window.innerHeight, end = LAND * H;

    ftrail.animate([
        { transform:'translateY(' + (-0.62 * H) + 'px) scaleY(.7)', opacity:0 },
        { transform:'translateY(' + (-0.30 * H) + 'px) scaleY(1.5)', opacity:.6, offset:.45 },
        { transform:'translateY(' + end + 'px) scaleY(.5)', opacity:0 }
    ], { duration:ms, easing:'cubic-bezier(.42,.02,.86,.34)', fill:'both' });
    fallAnim = fbox.animate([
        { transform:'translateY(' + (-0.66 * H) + 'px) rotate(-14deg)', opacity:0, offset:0 },
        { transform:'translateY(' + (-0.42 * H) + 'px) rotate(-9deg)',  opacity:1, offset:.24 },
        { transform:'translateY(' + end + 'px) rotate(8deg)',           opacity:1, offset:1 }
    ], { duration:ms, easing:'cubic-bezier(.42,.02,.86,.34)', fill:'forwards' });
    /* ★ 别在这儿把 fallAnim 置空 —— 砸地那一下要拿它 cancel。
       （cancel 不掉的话，fill:forwards 会压住内联 opacity，原字一直杵着。） */
    fallAnim.onfinish = function(){ if (done) done(); };
    return fallAnim;
}
/* 着地 + 砸扁 + 炸开成碎片 */
function humanImpact(){
    midFall = false;
    fx(shockEl);
    if (fallAnim){ try { fallAnim.cancel(); } catch (e){} fallAnim = null; }
    try { ftrail.getAnimations().forEach(function(a){ a.cancel(); }); } catch (e){}
    ftrail.style.opacity = '0';
    var H = window.innerHeight, W = Math.max(340, window.innerWidth * 0.74);
    var base = 'translateY(' + (LAND * H) + 'px) ';
    /* 落地那道横线 */
    fhit.animate([
        { width:'0px', opacity:0 },
        { width:W + 'px', opacity:.85, offset:.3 },
        { width:W + 'px', opacity:0 }
    ], { duration:640, easing:'ease-out', fill:'both' });
    /* ★ 先砸扁 ——「人」贴着地面横向摊开，比直接消失像「摔」
       （动画 fill:forwards 会压住内联 style，所以先摊完再藏） */
    try {
        fbox.animate([
            { transform: base + 'scale(1,1)' },
            { transform: base + 'translateY(9px) scale(1.16,.09)' }
        ], { duration:120, easing:'cubic-bezier(.2,.8,.3,1)', fill:'forwards' });
    } catch (e){}
    if (fallT1) clearTimeout(fallT1);
    fallT1 = setTimeout(spawnShards, 118);
}
/* 炸成 24 片：从落地那一带朝上、朝外崩出去 */
function spawnShards(){
    fallT1 = 0;
    var H = window.innerHeight;
    var base = 'translateY(' + (LAND * H) + 'px) ';
    fbox.style.opacity = '0';

/* ==================================================================

   ------------------------------------------------------------------
   ★ 这一场是 CUT6 视觉上的正主，做法上守三条：
     ① 那个**球壳**是四周「云雨风雷」的字聚成的 —— 眼珠**内切在壳里**，
        不是字去拼眼睛。字先满天飘着（lvl1），再收拢（lvl2），
        落到球面坐标上成为壳（lvl3），眼睛才睁得开。
     ② 瞳孔是**留空**的：虹膜那一圈字，中间刻意不排字。
        眼睛之所以像眼睛，靠的是那个洞。
     ③ 睁开之后要**上下合目一次**（致意），再被「轰」地炸开。
   ================================================================== */
var motesEl = document.getElementById('motes'), mspin = document.getElementById('mspin');
var eyeballEl = document.getElementById('eyeball');

/* 字库：只取画面里真的读得出「天气」的字。
   ★ 刻意避开生僻字和 Unicode 符号 —— 那些字在别人机器上可能是豆腐块。 */
var SKY_SET = ('云 雨 风 雷 雪 霜 雾 霭 电 霆 雹 霞 霓 岚 氤 氲 潮 汐 涌 卷 涡 旋 拧 扭 曲 膨 胀 撕 裂 炸 崩 震 轰 闪 灭 光 芒 月 夜 露 冰 晶 柱 弦 弧 线 网 幕 帘 壁 穹 顶 渊 流').split(' ');
SKY_SET = SKY_SET.filter(function(c){ return c && c.length === 1; });

/* 固定伪随机：每次播出一样，不会一遍一个样 */
function det(k){ var x = Math.sin(k * 91.7) * 43758.5453; return x - Math.floor(x); }

/* 云字 = **一个**字场，从满天散云聚成那个大球壳。不是两套字。
   ★ 这里之前理解错了两件事，都改过来了：
     ① 不是「字汇聚成眼睛」—— 眼珠本来就**内切在球里**，是**壳**由字汇聚而成。
        所以「字吸到眼格上」那套（eyeSlots / bindEyeSlots）整个删掉了。
     ② 球壳和散云是**同一批字**：l1 满天散布，l3 落到球面坐标上。
        换两套字的话「汇聚」就没有过程可看 —— 一到 l3 凭空冒出上千个字。
   每个字带一组**球面坐标**（斐波那契球分布 + 黄金角经度），
   l3 的壳就是把这批字从「屏幕极坐标散布」插值到「球面坐标」，
   球面透视（近大远小、近亮远虚）本来就是球面坐标自带的。
   ------------------------------------------------------------------ */
/* 纤维球分布的黄金角 → 球面均匀布点，不会有疏密带 */
var GA = Math.PI * (3 - Math.sqrt(5));
/* ★ 1100 个字（跟主菜单的球壳同量级）。少了一眼就能看穿：
   壳上的字稀疏 → 球面轮廓不连续 → 读成「一圈字」而不是「一个球」；
   而「球」这件事，全靠轮廓连续。 */
var MOTE_N = 1100;
var motes = [];
/* 壳的球心与半径。眼珠内切于它，所以半径由眼珠尺寸推出来，不是拍脑袋定的。 */
var SHELL_R = 0, SHELL_CX = 0, SHELL_CY = 0;
var SHELL_TILT = 0.32;              /* 自转轴倾斜，让球转起来有立体感 */
/* TILT 是字面常量 → 它的 sin/cos 也只算一次，moteLoop 里直接读 */
var SHELL_CT = Math.cos(SHELL_TILT), SHELL_ST = Math.sin(SHELL_TILT);
/* 散云层（满天风雨那几拍）的椭圆基准半径，随视口变，只在 shellLayout 里更新 */
var fogRX = 0, fogRY = 0;
/* d^2.2 查表：近实远虚。球面 d 越大（越正对玩家）越亮。 */
var POW_LUT = new Float32Array(257);
for (var _p2 = 0; _p2 <= 256; _p2++) POW_LUT[_p2] = Math.pow(_p2 / 256, 2.2);
/* sin/cos 查表：上千个字每帧四千多次三角函数是热循环大头，换表后降到可忽略 */
var SIN_N = 8192, SIN_SCALE = SIN_N / (Math.PI * 2), SIN_MASK = SIN_N - 1;
var fsin, fcos;
(function(){
    var L = new Float32Array(SIN_N), S = SIN_SCALE, M = SIN_MASK, Q = SIN_N >> 2;
    for (var i = 0; i < SIN_N; i++) L[i] = Math.sin(i / S);
    fsin = function(a){ return L[((a * S) | 0) & M]; };
    fcos = function(a){ return L[((((a * S) | 0) + Q) & M)]; };
})();

/* 壳的半径：眼窝半宽 + 一圈余量，这样眼珠正好内切在壳里。
   ★ 早先按视口长边算，壳大到超出画面、被裁成一段弧，
     读出来是「一大片字」而不是「一个球」—— 球必须有完整轮廓。 */
function shellLayout(){
    sizeEye();
    var W = window.innerWidth, H = window.innerHeight;
    SHELL_R = Math.min(eax * ECELL + 52, Math.min(W, H) * 0.62);
    SHELL_CX = W / 2;
    SHELL_CY = H * 0.44;
    /* 散云层的椭圆基准，跟视口走。只在 resize 时变，
       原来写在 moteLoop 的循环体里 = 每帧 2200 次读 window。 */
    fogRX = W * 0.54; fogRY = H * 0.52;
}
/* 一个字的球面位（会被自转/行波推动）与散云位（屏幕上飘着）之间插值 */
function buildMotes(){
    if (motes.length) return;
    shellLayout();
    for (var i = 0; i < MOTE_N; i++){
        var el = document.createElement('span');
        el.className = 'mote';
        /* 一部分给「词」（云卷云舒、雨骤风狂），其余单字 —— 词更耐看 */
        var isWord = (i % 4 === 0);
        var txt;
        if (isWord){
            var a = Math.floor(det(i * 7 + 2) * SKY_SET.length);
            var b = Math.floor(det(i * 11 + 5) * SKY_SET.length);
            txt = SKY_SET[a] + SKY_SET[b] + SKY_SET[(a + b) % SKY_SET.length];
        } else {
            txt = SKY_SET[Math.floor(det(i * 7 + 2) * SKY_SET.length)];
        }
        el.textContent = txt;
        var sz = (isWord ? 12 : 10) + Math.round(det(i * 13 + 3) * (isWord ? 9 : 7));
        el.style.fontSize = sz + 'px';
        mspin.appendChild(el);
        var phi = Math.acos(1 - 2 * (i + 0.5) / MOTE_N);   /* 斐波那契球分布 */
        var o = {
            el:el, s:sz,
            sp:Math.sin(phi), cp:Math.cos(phi), phiv:phi,
            lam:i * GA,                              /* 初始经度 */
            /* 角速度含纬度差速 → 云带式流动；行波相位差 → 有机感 */
            w:0.055 * (1 + Math.sin(phi * 3.1) * 0.35),
            wj:(det(i * 47 + 3) - 0.5) * 0.35,
            jit:det(i * 37 + 8) * Math.PI * 2,
            sj:0, cj:0,
            a0:0.6 + det(i * 59 + 7) * 0.4,
            /* ★ sc0 = 这个字的**云态缩放基准**，全程不变。
               两处缩放都以它为基准：
                 云态 sc = sc0
                 壳态 sc = sc0 × (0.58 + 0.56×d)   ← 近大远小，倍数 0.58~1.14
               ★ 必须是常量：掺任何每帧变化的量（原来有个 motePull*0.5），
                 云态的矩阵就每帧变 → 一千多个字每帧重画 → 实测 43.8ms。
               值域刻意贴着 1：字固有就是 10~21px，缩放接近 1 才有「雾」的感觉；
               早先给到 1.6~2.1，字大得像乱码不像云。 */
            sc0:0.86 + (sz - 15) * 0.016,
            /* 散云位（l1 用）：极坐标 + 面积均匀的椭圆分布 */
            fa:det(i * 17 + 7) * Math.PI * 2,
            fr:0.015 + det(i * 19 + 11) * 0.985,
            fs:(0.010 + det(i * 31 + 4) * 0.030) * (i % 2 ? 1 : -1),
            fph:det(i * 41 + 9) * Math.PI * 2,
            famp:6 + det(i * 43 + 3) * 16,
            /* ★ 这两个原本是在 moteLoop 里每帧现算的：
               det(i*43+3) 和 det(i*47+5) —— det() 内部就是一个 Math.sin，
               1100 个字 × 60 帧 = 每秒六万多次三角函数，而入参 (i) 永远不变。
               改成建字时预算一次，热循环里只读字段。
               fpj 存 det(i*47+5) 本身（拧转的抖动幅度，0~1）；
               fpf 存 det(i*43+3) 由 famp 反推：famp = 6 + det*16 → det = (famp-6)/16。
               跟这一段上面的 tA/tB（sin 拆成 sin·cos+cos·sin）是同一个手法，
               那处把上千次三角降到 2 次，这里把上千次降到 0。 */
            fpj:det(i * 47 + 5),
            fpf:(det(i * 43 + 3)),
            /* 两侧位置的帧间缓存（中间态隔帧交替时读上一帧那侧） */
            sx0:0, sy0:0, sSh:0, oSh:0, dSh:1,
            fx0:0, fy0:0, oCl:0,
            _x:NaN, _y:NaN, _s:-1, _o:-1, _r:-1
        };
        o.sj = Math.sin(o.jit); o.cj = Math.cos(o.jit);
        motes.push(o);
    }
}
/* 整片自转 + 每字呼吸 + 透明度按级次抬。一条 rAF 循环。
   ★ 每帧全量更新，一个都不跳。试过「每帧只更新一半」省算力，
     结果每个字只有 30Hz，肉眼直接看出一顿一顿 —— 省的算力
     远不如掉一半刷新率来得明显。 */
var moteRAF = 0, moteT0 = 0, motePull = 0, motePullTo = 0;
/* 帧计数：中间态（e 在 0 和 1 之间）用它做隔帧交替，
   让每帧只算一侧的位置 —— 见 moteLoop 里的说明，那是最有效的一处优化。 */
var moteFrame = 0;
/* 「聚成壳」的进度：0 = 还在满天卷，1 = 每个字都落在自己的球面点上 */
var moteGath = 0, moteGathTo = 0;
/* 每一级的目标透明度。眼睛睁开（lvl3 之后）压低，让开中间。
   ★ 这几档不能高：眼珠是主角，壳的字一旦亮过虹膜，
     整幅画就变成「一片糊字里有个眼」，眼就废了。
   ★ l1 也不能太淡：这一步是「黑夜里的月亮照耀周身的云 / 所有的云卷曲着」，
     云字要看得见才有戏。实测 .15 几乎只剩几个字（像空屏），.24 刚好。
   ★ l4（云翳炸开）同样不能压太低：那几拍是「乌云满天，满城风雨」，
     字全没了就只剩黑屏一句白字，戏没了。 */

var moteOp = MOTE_OP.l1, moteOpTo = MOTE_OP.l1;
function moteLoop(ts){
    if (!moteT0) moteT0 = ts;
    moteFrame++;

    /* pull / op / gath 都朝目标值平滑靠 —— 收紧是渐进的，不是一帧跳过去的 */
    motePull += (motePullTo - motePull) * 0.055;
    moteOp   += (moteOpTo   - moteOp)   * 0.06;
    moteGath += (moteGathTo - moteGath) * 0.05;
    var e = moteGath * moteGath * (3 - 2 * moteGath);      /* smoothstep */
    var wS = e, wC = 1 - e;                                 /* 壳权重 / 云权重 */
    var cx = SHELL_CX, cy = SHELL_CY, R = SHELL_R;

    var ct = SHELL_CT, stl = SHELL_ST;

    var exw = eax * ECELL + 8, exh = EAYMAX * ECELL + 8;
    /* sin(t*0.23+jit) 拆成 sin(t*0.23)·cos(jit) + cos(t*0.23)·sin(jit)：
       前两项全帧只算一次，cos/sin(jit) 每个字预存 → 上千次三角变 2 次 */
    var tA = 0.15 * Math.sin(t * 0.23), tB = 0.15 * Math.cos(t * 0.23);
    var dev = 0.03 + 0.95 * moteOp / 0.30;                    /* 随级次抬的整体亮度 */
    if (dev > 1) dev = 1;
    for (var i = 0; i < motes.length; i++){
        var m = motes[i];
        /* ---------- 两边插值：每帧**只算一侧**，另一侧读上一帧的缓存 ----------
           ★ 这是本文件实测出来的最大一处性能杠杆，位置和原因都要记住：
             逐项隔离测出来的（1100 字每帧写 transform 只多花 2.5ms，
             写 opacity 几乎不花钱，**重绘根本不是瓶颈**）：

               L1 满天云   e = 0    → 只算云位   26ms
               L3 成壳睁眼 e = 1    → 只算壳位   26ms
               L2 中间态   e ≈ 0.38 → 两侧都算   47ms   ← 就是它卡

             两侧都算 = 计算量翻倍。所以中间态改成**隔帧交替**：
             偶数帧重算壳位、奇数帧重算云位，各字用上一帧那侧的结果插值。
             视觉上察觉不到 —— 字本来每帧都在动，插值两端的相位各差 16ms，
             而这时整段动画本来就是缓慢的过渡（gath 的缓动系数只有 0.05）。
             代价是两个额外的字段（m.sx0/sy0、m.fx0/fy0）。
             ★ 门槛 0.001 / 0.999：稳态（e 精确到 0 或 1）必须每帧算全的那侧，
               不能交替 —— 交替会让自转变成 30Hz 的台阶。 */
        var mid = e > 0.001 && e < 0.999;         /* 中间态：两侧交替 */
        var calcShell = !mid || (moteFrame & 1) === 0;
        var calcCloud = !mid || (moteFrame & 1) === 1;
        var x, y, sShell = 0, oShell = 0, d = 1;
        var sx = cx, sy = cy;
        if (calcShell){
            /* ---------- 壳位：球面坐标 + 自转 + 行波 ---------- */
            var lam = m.lam + t * m.w + tA * m.cj + tB * m.sj;
            var x0 = m.sp * fcos(lam), z0 = m.sp * fsin(lam), y0 = m.cp;
            var y1 = y0*ct - z0*stl, z1 = y0*stl + z0*ct;        /* 轴倾斜 */
            /* 行波：两个波长不同的波叠加，整球字一起荡（与眼珠呼吸同频 0.8） */
            var wav = fsin(2*lam + 3*m.phiv - t*0.8 + m.wj) * 0.6

            var arx = sx - cx, ary = sy - cy;

            sy += ( arx/arl) * wav * 9 * wS;

            /* ★ 壳态缩放**以云态为基准**再乘「近大远小」。
               原来照抄主菜单的绝对值 0.5 + 0.72*d，值域 0.5~1.22；
               而云态是 0.8~2.1 —— 两套值域完全不搭，聚壳那一下缩放差近一倍。
               改成同基准的倍数后，过渡才是「收拢」而不是「整体塌下去」。 */
            sShell = m.sc0 * (0.58 + 0.56 * d);
            /* di 不用夹取：d = (z1+1)/2 且 z1∈[-1,1] → di ∈ [0,256] 恒成立。
               （原来那两个分支是死代码，白白两次数值比较 × 1100 × 60。） */
            oShell = (0.03 + 0.95 * POW_LUT[(d * 256) | 0]) * m.a0 * dev;
            m.sx0 = sx; m.sy0 = sy; m.sSh = sShell; m.oSh = oShell; m.dSh = d;
        } else { sx = m.sx0; sy = m.sy0; sShell = m.sSh; oShell = m.oSh; d = m.dSh; }
        /* ★ sCloud 是**每字常量**（m.sc0），不掺任何每帧变化的量。
           它原来带一个 `motePull * 0.5`（拧紧时字变大）—— 那会让云态的
           矩阵每帧变，一千多个字每帧重画，下面 scale 的门槛就全作废了
           （实测那一档 43.8ms）。「拧紧」的观感改由**位置内缩**
           承担（上面 frc 那行），本来就够。
           也正因为它是常量，**不需要**跟 fx/fy 一起做隔帧缓存。 */
        var sCloud = m.sc0, oCloud = 0;
        var fx = 0, fy = 0;
        if (calcCloud){
            /* ---------- 云位：极坐标 + 自转 + 呼吸浮动 ----------
               半径/角度的抖动用建字时预算的 m.fpf / m.fpj，
               不再每帧调 det()（那里面就是一个 Math.sin）。
               云位半径随聚壳进度**同步内缩**（剧情上就是「所有的云卷曲着」，
               云是往里卷的，不是被硬拖到球上的）。 */
            var f = Math.min(1, motePull * (0.55 + m.fpf * 0.75));
            var frc = Math.sqrt(m.fr) * (1 - 0.52 * f) * (1 - 0.42 * e);
            var fa = m.fa + t * m.fs + motePull * (1.1 + m.fpj * 2.4) * (i % 2 ? 1 : -1);
            /* window.innerWidth/Height 原来写在循环体里 = 每帧 2200 次 DOM 读，
               提到循环外（fogRX/fogRY 在 shellLayout 里随视口更新）。 */
            fx = cx + fcos(fa) * frc * fogRX + fsin(t * 0.5 + m.fph) * m.famp;
            fy = cy + fsin(fa) * frc * fogRY;
            oCloud = moteOp * (0.62 + 0.38 * fsin(t * 0.7 + m.fph));
            m.fx0 = fx; m.fy0 = fy; m.oCl = oCloud;
        } else { fx = m.fx0; fy = m.fy0; oCloud = m.oCl; }
        var x = fx + (sx - fx) * e, y = fy + (sy - fy) * e;
        /* ---------- 绕开眼珠（只有壳态需要）---------- */
        var vf = 1;
        if (wS > 0.002){
            var exd = (x - cx) / exw, eyd = (y - cy) / exh;
            var e2 = exd*exd + eyd*eyd;
            /* 只在瞳孔/虹膜附近淡出，贴着眼珠轮廓就恢复 ——
               挖一大片空窗的话壳会断成两个半球，像两个圈而不是一个球。 */
            vf = e2 >= 1.0 ? 1 : Math.max(0, Math.min(1, (e2 - 0.45) / 0.55));
            if (e2 < 1.5 && e2 > 1e-4){
                var q = 1 - e2 / 1.5;
                var kk = 1 + 0.14 * q * q;
                x = cx + exd * kk * exw;
                y = cy + eyd * kk * exh;
            }
        }
        /* ---------- 缩放 / 旋转：云态（每字恒定）→ 壳态（近大远小）---------- */
        /* ★ 这两样是整个演出最贵的两项，所以**只在最后一段给变化**。
           逐项隔离测出来的（1100 字，无头 1410×805，每帧只写这一项）：
             只写 translate                        25.1ms
             + scale（每帧变）                     30.5ms
             + rotate（每帧变）                    29.6ms
             + scale + rotate（都每帧变）          45.3ms   ← 最坏组合
           而写 opacity 几乎免费（16.6ms）、平移只多 2.5ms。
           贵的原因是「满屏 + 矩阵每帧变」→ 一千多个字每帧重画。

           于是用门槛把两件事分开：
             e ≤ 0.82  → scale/rotate 取**每字常量** → 矩阵稳定 → 26ms
             e >  0.82  → 在 0.18 段里平滑过渡到壳态值
           0.82 之后字已经收进球里、只占屏幕约六成，那点代价可以接受
           （实测那一档 33ms，持续约 0.9s，且正是「云拧成球」的高潮）。

           ★ 门槛为什么不是 0：早先试过 `mid ? sCloud : 满插值`，
             即 e 跨 0.999 那一帧突变 —— 读出来就是「底下那些字聚到一起
             以后突然全变小了」。旋转同理（mid 恒 0，一进壳态全体歪 20°）。
             **满屏的矩阵跳变比矩阵渐变更刺眼**，眼睛对「突然」极其敏感。
             而 0.82 这个门槛处 scale 是连续的（kS 从 0 起步、smoothstep），
             不存在跳变。 */
        var kS = e > 0.82 ? (e - 0.82) / 0.18 : 0;
        var kSm = kS * kS * (3 - 2 * kS);           /* smoothstep，收尾更柔 */
        var sc = kSm > 0 ? (sCloud + (sShell - sCloud) * kSm) : sCloud;
        var rot = kSm > 0 ? Math.round(m.jit * 0.35 * kSm * 16) / 16 : 0;
        /* ---------- 透明度：近实远虚（壳） ↔ 呼吸（云）---------- */
        var op = oShell * vf * wS + oCloud * wC;
        var xi = Math.round(x * 10) / 10, yi = Math.round(y * 10) / 10;
        /* 值没变就不写 DOM（等价于写同一个值），省掉一部分样式重算 */
        var sci = Math.round(sc * 100) | 0;
        var rqi = rot;
        var opi = Math.round(op * 100) | 0;
        if (opi !== m._o){ m._o = opi; m.el.style.opacity = opi / 100; }
        if (xi !== m._x || yi !== m._y || sci !== m._s || rqi !== m._r){
            m._x = xi; m._y = yi; m._s = sci; m._r = rqi;
            m.el.style.transform = 'translate(' + xi + 'px,' + yi + 'px)' +
                ' translate(-50%,-50%) rotate(' + rqi + 'rad) scale(' + (sci / 100) + ')';
        }
    }
    if (motesEl.classList.contains('on')) moteRAF = requestAnimationFrame(moteLoop);
    else moteRAF = 0;
}
function startMotes(){
    buildMotes();
    shellLayout();
    if (!motesEl.classList.contains('on')) motesEl.classList.add('on');
    if (!moteRAF){ moteT0 = 0; moteRAF = requestAnimationFrame(moteLoop); }
}
function offMotes(){
    motesEl.classList.remove('on', 'l1', 'l2', 'l3', 'l4');
    motePullTo = 0; moteGathTo = 0; moteOpTo = MOTE_OP.l1;
    if (moteRAF){ cancelAnimationFrame(moteRAF); moteRAF = 0; }
}

/* ------------------------------------------------------------------
   眼珠（canvas）：**汉字网格 + 镂空瞳孔 + 眼珠可转**，
   网格规模与比例逐个抄主菜单 index.html：
     COLS=78 ROWS=40 ax=33 AYMAX=14 SLIT=1.5 ri=13 rp=5.5
   ★ 抄而不是自己调：之前 CUT6 自己定 74×30 / 30 / 13 / 8.5 / 6.4 ——
     纵向只有 30 行而眼眶半高就占 13 格，虹膜相对太小，
     上下眼白挤成两条线，出来是「一朵菊花」不是眼睛。
   ★ 眼珠能转（瞳孔中心 ox/oy 在眼眶里游走）——这是「活眼」的关键。
     瞳孔钉死在正中的眼睛画得再细也 dead：眼白一动不动就是一枚徽章。
   ★ canvas 逐格 fillText、自己算 x/y，一个字都不依赖字体等宽。
   ------------------------------------------------------------------ */
var ECOLS_MAX = 78, EROWS = 40;
var ECOLS = ECOLS_MAX, ecx = ECOLS / 2, ecy = EROWS / 2;
var eax = 33, EAYMAX = 14, ESLIT = 1.5;
/* ★ erp（瞳孔半径）**比主菜单调小了**：那边 erp=5.5 是配 78×40 的大网格、
   而且眼球只占屏幕一小块；这里球壳几乎撑满画面，同样的比例看着就「瞪得吓人」。
   5.5/13 = 0.42，瞳孔直径吃掉虹膜的四成多 —— 压迫感是够了，但读起来像
   一个洞而不是「凝视」。收到 4.2/13 ≈ 0.32：虹膜那圈字还剩六成半，
   眼白与虹膜之间也有肉可看。 */
var eri = 13, erp = 4.2;
/* 窄屏时按同一比例缩的基准（缩放见 sizeEye） */
var ECOLS0 = 78, EROWS0 = 40;
/* 受光方向：左上。虹膜环上迎光侧字**密**、背光侧字**疏** → 球感 */
var LIGHT_X = -0.7071, LIGHT_Y = -0.7071;
/* 明暗阶梯。★ 档数要多、跨度要匀：八档（丶丿氵灬火目眼晶）时
   从「火」到「目」只隔一档，受光侧与背光侧直接断层，
   画面上就是半边「火」半边「目眼晶」，像贴了两块不同材质。
   现在按笔画密度排十七档：点 → 撇 → 三点水 → 四点底 → 少笔画 → 多笔画。 */
var ERAMP = '丶丿丶氵氺灬火炎焱木林森目相睛瞳晶';
/* ★ elumCh 查表化。原来的实现每帧每格调一次：Math.round + charAt +
   两次边界比较 —— 一帧一千八百次纯算术，纯粹在烧 CPU。
   现在建成 257 项的字符表，调用处只是 arr[x|0] 一取。
   跟 POW_LUT / fsin 查表是同一套思路：热路径上凡是「输入有界、结果离散」
   的映射都该预生成。 */
var ELUM_LUT = new Array(257);
for (var _e1 = 0; _e1 <= 256; _e1++){
    var _ei = Math.round(_e1 / 256 * (ERAMP.length - 1));
    if (_ei < 0) _ei = 0;
    if (_ei > ERAMP.length - 1) _ei = ERAMP.length - 1;
    ELUM_LUT[_e1] = ERAMP.charAt(_ei);
}
function elumCh(lum){
    var k = (lum * 256) | 0;
    if (k < 0) k = 0; else if (k > 256) k = 256;
    return ELUM_LUT[k];
}
/* 逐格几何预计算：列方向 (dx/ax)^2 和行方向 (dy)^2 都是定值，
   只有 ay 在变 → 每帧只需一次除法，省掉三千多次乘除 */
var ECOL_EX2 = new Float32Array(ECOLS), EROW_DY2 = new Float32Array(EROWS);
(function(){
    for (var c = 0; c < ECOLS; c++){ var e = (c - ecx) / eax; ECOL_EX2[c] = e * e; }
    for (var r = 0; r < EROWS; r++){ var y = r - ecy; EROW_DY2[r] = y * y; }
})();

var eyecv = document.getElementById('eyecv'), eyectx = eyecv ? eyecv.getContext('2d') : null;
var ECELL = 14, EDPR = 1;
function sizeEye(){
    if (!eyecv) return;
    /* ★ 一格要比一个字**大**。字占满格子 → 虹膜连成一片实心色块，
       球感全无。留出约三成，字与字之间才有缝，才看得出疏密。
     ★ 一格 = min(宽向, **高向**) 都装得下的最大值：网格 78×40，
       只按宽度算格子会在矮视口上上下溢出（上下各要留 6 行边）。 */
    var W = window.innerWidth, H = window.innerHeight;
    var fit = Math.min(W / (ECOLS0 + 2), H / (EROWS0 + 2));
    ECOLS = ECOLS0; EROWS = EROWS0;
    if (fit >= 12){
        /* ★ 上限从 20 收到 14：20 时眼 canvas 1560×800，吃掉八成屏宽，
           而且眼窝半宽（33*20=660px）戳出了壳半径上限（min(W,H)*0.62），
           眼珠不是「内切在壳里」而是顶穿壳。
           参照主菜单那只眼（13px 格 → 1014×520，54% 屏宽）收到 14
           （1092×560，58% 屏宽，视觉跟主页面对齐）。
         ★ 还要受壳钳一道：眼窝半宽 + 余量 52 不得超过壳半径上限，
           否则矮视口上（如 768 高）眼珠又会戳出壳外。 */
        ECELL = Math.min(14, Math.floor(fit), Math.floor((Math.min(W, H) * 0.62 - 52) / 33));
        eax = 33; eri = 13; erp = 4.2; EAYMAX = 14; ESLIT = 1.5;
    } else {
        /* 格子放不大 → 整张网格按比例缩小，用更大的格子换清晰度。
           一格 7px、字 4.6px，那不叫眼睛，叫噪点。
           ★ 眼窝/虹膜/瞳孔/全开半高全都按「格」给的，网格一变
             它们必须一起乘 k，否则虹膜会顶出眼眶、瞳孔缩成一个小点。 */
        ECELL = 12;
        var k = fit / 12;
        /* 同一道壳钳：矮视口上按比例再收，保证眼珠仍内切在壳里 */
        k = Math.min(k, (Math.min(W, H) * 0.62 - 52) / (33 * 12));
        ECOLS = Math.max(40, Math.round(ECOLS0 * k));
        EROWS = Math.max(22, Math.round(EROWS0 * k));
        eax = 33 * k; eri = 13 * k; erp = 4.2 * k;
        EAYMAX = 14 * k; ESLIT = 1.5 * k;
    }
    ecx = ECOLS / 2; ecy = EROWS / 2;
    /* 行方向 dy² 与列方向都依赖中心（减列/减行后中心变了）—— 重算 */
    ECOL_EX2 = new Float32Array(ECOLS);
    for (var c2 = 0; c2 < ECOLS; c2++){ var e2 = (c2 - ecx) / eax; ECOL_EX2[c2] = e2 * e2; }
    EROW_DY2 = new Float32Array(EROWS);
    for (var r2 = 0; r2 < EROWS; r2++){ var y2 = r2 - ecy; EROW_DY2[r2] = y2 * y2; }
    EDPR = Math.min(2, window.devicePixelRatio || 1);
    var w = ECOLS * ECELL, h = EROWS * ECELL;
    eyecv.style.width = w + 'px';
    eyecv.style.height = h + 'px';
    eyecv.width = Math.round(w * EDPR);
    eyecv.height = Math.round(h * EDPR);
    if (eyectx) eyectx.setTransform(EDPR, 0, 0, EDPR, 0, 0);
    /* ★ font / textAlign / textBaseline 只在这里设一次。
       canvas 的 font 是**惰性解析属性**：每帧赋值都会触发一次字体匹配，
       比普通属性写贵得多。而它只随 ECELL 变（= resize），其余时候不该碰。
       drawEyeGrid 每帧只 clearRect + fillText，不再设这三样。 */
    if (eyectx){
        eyectx.font = eyeFont();
        eyectx.textAlign = 'center';
        eyectx.textBaseline = 'middle';
    }
}
function eyeFont(){ return Math.round(ECELL * 0.66) + 'px SimSun,"Songti SC","STSong","Noto Serif CJK SC",serif'; }
/* ox/oy = 瞳孔中心相对网格正中的偏移（格），抄主菜单 buildEye 的头两参。
   眼眶（ECOL_EX2）用正中，虹膜与瞳孔用 pgx/pgy —— 眼窝一动不动、
   只有眼珠在眼眶里转，这才是「眼睛在看你」而不是「一枚眼睛图案」。 */
function drawEyeGrid(ay, depth, ox, oy){
    if (!eyectx) return;
    var g = eyectx;
    g.clearRect(0, 0, ECOLS * ECELL, EROWS * ECELL);
    ay = (ay == null) ? EAYMAX : ay;
    depth = (depth == null) ? 1 : depth;
    var pgx = ecx + (ox || 0), pgy = ecy + (oy || 0);
    var rpEff = erp * Math.min(1, ay / EAYMAX);      /* 瞳孔随睁眼由无到有 */
    var rp2 = rpEff * rpEff;
    var invAy2 = 1 / (ay * ay);
    var riLo2 = (eri - 1.4) * (eri - 1.4), riHi2 = (eri + 1.4) * (eri + 1.4);
    var rpEdge2 = (rpEff + 1.1) * (rpEff + 1.1);
    var slit = ay < 4.0;
    /* ★ 原来这里每帧现算 fsz 并赋 g.font，现在都由 sizeEye / eyeFont 定好了。
       ★ elumCh 改成查表：原来每帧每格调一次，内含 Math.round + charAt
       + 两次边界比较，一帧下来一千八百次。现在预生成 257 项的字符表。 */
    var half = ECELL / 2;
    for (var r = 0; r < EROWS; r++){
        var dy0 = r - ecy;
        var ey2 = EROW_DY2[r] * invAy2;
        if (ey2 > 1) continue;                        /* 整行都在眼眶外 */
        var hw = eax * Math.sqrt(1 - ey2);
        var c0 = Math.max(0, Math.ceil(ecx - hw)), c1 = Math.min(ECOLS - 1, Math.floor(ecx + hw));
        for (var c = c0; c <= c1; c++){
            var dxp = c - pgx, dyp = r - pgy;
            var dx = c - ecx, d2 = dx*dx + dy0*dy0;
            var ch = null;
            /* 瞳孔方向的距离，全格只算一次：虹膜分支、fillStyle 高光、
               眼眶分支都要用。虹膜分支原来算过一份 d、高光又算一份 d4，
               眼眶分支还再算一份 d3 —— 同一个表达式一格算三遍。 */
            var d2p = dxp*dxp + dyp*dyp;
            var dP = Math.sqrt(d2p) || 1;
            if (slit) ch = elumCh(0.48);
            else {
                if (d2p <= rp2) continue;                              /* 瞳孔：留空 */
                if (d2p >= riLo2 && d2p <= riHi2){
                    ch = elumCh(0.45 + depth * 0.42 * ((dxp/dP)*LIGHT_X + (dyp/dP)*LIGHT_Y));
                } else if (d2p < rpEdge2) ch = '丶';                  /* 瞳孔边一道极淡的线 */
                else if (ECOL_EX2[c] + ey2 > 0.85){
                    var d3 = Math.sqrt(d2) || 1;      /* 眼眶用正中，不是瞳孔 */
                    ch = elumCh(0.56 + 0.12 * ((dx/d3)*LIGHT_X + (dy0/d3)*LIGHT_Y));
                } else continue;                                       /* 其余留空 */
            }
            var x = c * ECELL + half, y = r * ECELL + half;
            if (ch === '丶') g.fillStyle = 'rgba(214,228,255,.34)';
            else {
                /* 迎光侧更亮一点：虹膜环的字在光里发微光。
                   明暗按**瞳孔相对位置**算 —— 眼珠一转，高光跟着转。 */
                var sh = (dxp/dP)*LIGHT_X + (dyp/dP)*LIGHT_Y;
                g.fillStyle = sh > .1 ? '#f4f8ff' : (sh < -.35 ? '#a9bcdf' : '#dce6fa');
            }
            g.fillText(ch, x, y);
        }
    }
}

/* ---- 睁开：先只有一条横缝（云层那条长缝）→ 静一下 → 自然睁开 ----
   1900ms 全程 easeInOutCubic。匀速会很机械 —— 眼睑是软的。
   ------------------------------------------------------------------
   ★ 这三条（开合 / 眼珠游走 / 呼吸）**合并在一条 rAF 里**，
     全部写成「当前值朝目标值缓动」，不再各跑各的定时器。
     原因：分开跑就会出现「眼睑在合、瞳孔已经停了」的错拍，
     而且三条 rAF 各自 cancel 极易漏掉一条（之前就有过一次
     合目后眼睛再也不睁的 bug，就是两个 rAF 抢同一条句柄）。 */
var eyeRAF = 0, eyeT0 = 0, eyeHold = 0;
/* 开合：ay 是「目标」，实际值每帧朝它靠 */
var eyeAyT = ESLIT, eyeAy = ESLIT, eyeDepth = 0;
/* 眼珠：瞳孔中心偏移（格）。上限 = eri - erp - 1.5（抄主菜单的 maxLook），
   再大虹膜就压出眼眶了。eri/erp 会随窄屏缩放，所以**现算**不写死。 */
var eyeOx = 0, eyeOy = 0, eyeOxT = 0, eyeOyT = 0;
/* 游走：mode 与 until 抄主菜单的 gaze。★ 这里没有鼠标也没有宠物，
   所以只有「乱看别处」和「直视」两种，外加剧情要的「盯住不动」。 */
var gaze = { mode:'center', until:0, wx:0, wy:0, k:0.16 };
function drawEye(){ drawEyeGrid(eyeAy, eyeDepth, eyeOx, eyeOy); }
/* 换 gaze 目标。k 是缓动系数：0.16 ≈ 每帧走 16%，主菜单就用这个数 */
function pickGaze(now){
    if (Math.random() < .42){                    /* 乱看别处（最多） */
        gaze.mode = 'wander';
        var a = Math.random() * Math.PI * 2;
        var reach = (eri - erp - 1.5) * (0.35 + Math.random() * 0.55);
        gaze.wx = Math.cos(a) * reach; gaze.wy = Math.sin(a) * reach * 0.7;
        gaze.until = now + 1200 + Math.random() * 2800;
    } else {                                     /* 直视 */
        gaze.mode = 'center';
        gaze.until = now + 1800 + Math.random() * 3800;
    }
    gaze.k = 0.16;
}
function eyeGazeHold(x, y, ms){                 /* 剧情：盯住一个人看，不动 */
    gaze.mode = 'hold';
    gaze.wx = x; gaze.wy = y;
    gaze.until = performance.now() + (ms || 4200);
}
/* ★ 睁眼之后就一直在跑这条循环，直到 offEye。
   顺序很重要：先算 ay（开合）→ 再算瞳孔偏移 → 最后画。
   瞳孔偏移必须在 ay 之后算，因为「先闭眼再转到某处」和
   「转到某处再闭眼」读起来完全不是一回事。 */
function eyeLoop(ts){
    if (!eyeT0) eyeT0 = ts;
    var now = ts, tS = (ts - eyeT0) / 1000;
    /* ① 开合：ay 朝目标缓动。全开时叠一点呼吸（主菜单的 2.8%）。 */
    eyeAy += (eyeAyT - eyeAy) * 0.075;
    var ayDraw = eyeAy;
    if (eyeAy > EAYMAX * 0.92) ayDraw = EAYMAX * (1 + 0.028 * Math.sin(tS * 0.8));
    /* ② 眼珠游走：换目标 → 缓动过去。
       「乱看」时在目标点附近加一点高频微抖，像在打量。 */
    if (now > gaze.until) pickGaze(now);
    if (gaze.mode === 'center'){ eyeOxT = 0; eyeOyT = 0; }
    else if (gaze.mode === 'hold'){ eyeOxT = gaze.wx; eyeOyT = gaze.wy; }
    else {
        /* 乱看时的「微抖」幅度 —— 0.35 格太小了，眼睛几乎不动。
           ★ 眼珠要动就得动得**看得见**：一格是 ECELL(17px)，
             0.35 格 = 6px，肉眼几乎读不出「在转」。
             抖到 0.9~1.4 格（15~24px）才有「眼珠在动」的感觉。
             高频（3.1/2.3 rad/s，约 2 秒一个来回）才像活眼在扫，
             低频只会像整张图在晃。 */
        eyeOxT = gaze.wx + Math.sin(tS * 3.1) * (0.9 + 0.5 * Math.sin(tS * 0.7));
        eyeOyT = gaze.wy + Math.cos(tS * 2.3) * (0.8 + 0.4 * Math.cos(tS * 0.9));
    }
    eyeOx += (eyeOxT - eyeOx) * gaze.k;
    eyeOy += (eyeOyT - eyeOy) * gaze.k;
    /* ③ 画。深度跟着 ay 走：闭眼时球感退掉，睁开才立体 */
    eyeDepth = Math.max(0, Math.min(1, (ayDraw - ESLIT) / (EAYMAX - ESLIT)));
    drawEyeGrid(ayDraw, eyeDepth, eyeOx, eyeOy);
    eyeRAF = requestAnimationFrame(eyeLoop);
}
function eyeOpen(){
    sizeEye();
    /* 壳的半径是按眼珠尺寸推的（内切），眼珠尺寸变了壳要跟着变 */
    shellLayout();
    eyeballEl.classList.add('on');
    eyeAy = ESLIT; eyeAyT = ESLIT; eyeDepth = 0;
    eyeOx = eyeOy = eyeOxT = eyeOyT = 0;
    gaze.mode = 'center'; gaze.until = 0;
    drawEye();                                   /* 先是一条缝 */
    if (eyeRAF) cancelAnimationFrame(eyeRAF);
    if (eyeHold){ clearTimeout(eyeHold); eyeHold = 0; }
    /* 100ms 后开始睁：睁眼前先静一下，看得出「云层撕开长缝」这回事 */
    eyeHold = setTimeout(function(){
        eyeHold = 0;
        if (!eyeballEl.classList.contains('on')) return;
        eyeAyT = EAYMAX;
    }, 100);
    eyeT0 = 0;
    eyeRAF = requestAnimationFrame(eyeLoop);
}
/* 合目 / 扫视：amount=1 全闭（致意），0.5 半闭（在找）。
   只是把 ayT 打到半开/全闭，再定个定时器睁回来 —— 缓动全在 eyeLoop 里。 */
function eyeClose(amount, closeMs, holdMs, openMs){
    if (!eyeballEl.classList.contains('on')) return;
    if (eyeHold){ clearTimeout(eyeHold); eyeHold = 0; }
    eyeAyT = ESLIT + (EAYMAX - ESLIT) * (1 - amount);
    eyeHold = setTimeout(function(){
        eyeHold = 0;
        if (eyeballEl.classList.contains('on')) eyeAyT = EAYMAX;
    }, closeMs + holdMs);
}
function eyeBlink(){ eyeClose(1, 640, 1180, 1000); }
function eyeGlance(){ eyeClose(0.5, 400, 640, 620); }
function offEye(){
    eyeballEl.classList.remove('on');
    if (eyeRAF){ cancelAnimationFrame(eyeRAF); eyeRAF = 0; }
    if (eyeHold){ clearTimeout(eyeHold); eyeHold = 0; }
    eyeAy = eyeAyT = ESLIT; eyeDepth = 0;
    eyeOx = eyeOy = eyeOxT = eyeOyT = 0;
}
/* ------------------------------------------------------------------
   一拍一级台阶。四级是有次序的，**不能跳**：
     1 满天云卷（字散着，很淡，慢）—— 还没有球
     2 收 + 拧（字开始往球面聚，变亮，转速加快）
     3 聚成壳 → 静一下 → 眼在壳里睁开 → 眼珠乱转 → 上下合目致意
     4 炸开（白闪 + 字被掀散成满天风雨，眼睛淡出）
   ★ 「聚成壳」与「眼睁开」之间必须隔开：
     拧到底的那一帧直接睁眼，眼会像「啪」地弹出来，
     读不出「云层撕开长缝」这回事。
   ------------------------------------------------------------------ */
function eyeStep(lvl, dark){
    if (!dark) return;
    if (lvl === 1){
        startMotes();
        motesEl.classList.add('l1');
        motesEl.classList.remove('l2', 'l3', 'l4');
        motePullTo = 0; moteGathTo = 0; moteOpTo = MOTE_OP.l1;
        offEye();
    } else if (lvl === 2){
        startMotes();
        motesEl.classList.add('l2');
        motesEl.classList.remove('l1', 'l3', 'l4');
        motePullTo = 0.34;            /* 开始收，但还没拧到底 */
        /* ★ 已经在往球面上落了 —— 这一拍就是原文的
           「形成球体、蜿蜒着四肢、凌乱扭曲」。 */
        moteGathTo = 0.42;
        moteOpTo = MOTE_OP.l2;
        /* ★ 眼是 l3 才睁的，所以往回翻到这一级必须把眼收掉。
           不收的话现象是：从 l3 往回翻，云在散、壳在松，
           但那只眼还亮着悬在中间 —— 读起来像「眼一直睁着」，
           「一层层卷起来」的次序就没了。
           offEye 对「本来就没睁」是幂等的，正向流程不受影响。 */
        if (eyeballEl.classList.contains('on')) offEye();
    } else if (lvl === 3){
        startMotes();
        motesEl.classList.add('l3');
        motesEl.classList.remove('l1', 'l2', 'l4');
        motePullTo = 1;               /* 拧到最紧 */
        moteGathTo = 1;               /* ★ 每个字都落在自己的球面点上 = 成壳 */
        moteOpTo = MOTE_OP.l3;
        if (!eyeballEl.classList.contains('on')){
            /* ① 聚壳（gath 缓动，约 1.4s）
               ② 静一下（壳已经成型、画面是静的）
               ③ 眼在壳里睁开（眼睑从闭到开，慢的 —— 抬眼本身就是戏） */
            setTimeout(function(){ eyeOpen(); }, 1500);
        }
        /* ★ 「转动着寻找」是扫视（半闭一下），「上下合目，向她致意」
           是完整的合 → 睁。两种都要在 eyeStep 里按台词判 ——
           这两句自己都带 eye:3，外面的 else if 永远轮不到。 */
        if (/上下合目/.test(SCRIPT[cur].t)) setTimeout(eyeBlink, 1600);
        else if (/寻找/.test(SCRIPT[cur].t)){
            setTimeout(eyeGlance, 2000);
            /* 「转动着寻找释放了自己的人」→ 眼珠真的在乱转。
               游走在 eyeLoop 里，睁眼那一刻就在游了，
               这里只是把「乱看」的时间拉长一点，别一睁就盯住。 */
            gaze.until = performance.now() + 3400;
        }
    } else if (lvl === 4){
        fx(flashEl);
        startMotes();
        /* ★ remove 必须把 l1/l2/l3 **全列出来**。
           原来只 remove('l1','l2')，从 l3 直落 l4 时实测 cls 是 "on l3 l4" ——
           l3 的样式还挂着。级次 class 是给 CSS 用的钩子，留着残根
           就会有一半样式在错误的级次上生效（后面改 CSS 必踩）。 */
        motesEl.classList.add('l4');
        motesEl.classList.remove('l1', 'l2', 'l3');
        /* ★ 炸开 = 壳散回满天。moteGathTo 归 0 就够了 ——
           l1 用的本来就是「满天散布」那套位置，所以 gath 一落，
           每个字自己就飞回它的散云位，不需要另写一套摊平逻辑。
           （之前那个「按椭圆重排半径」的做法已删：它跟 l1 是同一批
             位置，重排反而多一份状态、还多一个出错方向。）
           白闪之后壳还在的话，就等于「炸开之后天上还挂着一个球」，
           跟「乌云满天满城风雨」直接打架。 */
        motePullTo = 0; moteGathTo = 0; moteOpTo = MOTE_OP.l4;
        setTimeout(function(){ offEye(); }, 620);
    }
}

function showBeat(i){
    if (i === cur) return;
    cur = i;
    var dark = false;

    if (i < 0){
        hide(bubM); hide(bubH); hide(teleEl);
        wm.classList.remove('on'); wh.classList.remove('on');
        closePage(); offCard(); offFall();
        teleEl.classList.remove('up'); teleEl.classList.remove('whiteout');
        teleEl.classList.remove('q');
        duoEl.classList.remove('gone');
        offMotes(); offEye();
        document.body.classList.remove('st-dark');
        return;
    }
    var b = SCRIPT[i];
    dark = (b.stage === 'dark');
    setStage(b.stage);
    /* 提词器的两种身份：普通（灰白、带框） / whiteout（黑幕里的白字） */
    teleEl.classList.toggle('whiteout', dark);
    teleEl.classList.toggle('q', dark && b.k === 'bk');

    /* 1) 黑屏大字卡：整段魂儿都没了，只留一行白字 */
    if (isCardBeat(b)){
        showCard(b);
        if (b.k === 'final') writeCut6();
    /* 2) 小说正文：一张纸，一句一句往纸上排
          ★ bk（原文）和 bt（转述）都排纸上 —— 都是「书里的」 */
    } else if (isBookK(b.k) && !dark){
        offCard();
        openPage();
        hide(bubM); hide(bubH); hide(teleEl);
        wm.classList.remove('on'); wh.classList.remove('on');
        repaintPage(i, true);
        teleEl.classList.remove('up');
        offFall();
        duoEl.classList.remove('gone');
    /* 3) 现实：教室 / 夜路上的两个人 */
    } else {
        offCard();
        closePage();
        if (b.k === 'mi'){
            hide(teleEl); hide(bubH);
            pop(bubM, '<span class="who-tag">' + NAME.mi + '</span>' + hl(b.t));
            wm.classList.add('on'); wh.classList.remove('on');
        } else if (b.k === 'he'){
            hide(teleEl); hide(bubM);
            pop(bubH, '<span class="who-tag">' + NAME.he + '</span>' + hl(b.t));
            wh.classList.add('on'); wm.classList.remove('on');
        } else {
            hide(bubM); hide(bubH);
            pop(teleEl, hl(b.t));
            wm.classList.remove('on'); wh.classList.remove('on');
        }
        /* 摔在地上那一幕：文字动画，注意力全给它 */
        if (b.k === 'shock') fallBeat(b);
        else { teleEl.classList.remove('up'); offFall(); duoEl.classList.remove('gone'); }
    }

    /* 特效 */
    if (b.k === 'bell') fx(bellEl);

    /* ★ 眼球那一场：四级台阶（eye:1..4）
         1  云开始卷，漫天字浮现
         2  字越聚越紧，开始拧
         3  拧到最紧 → 眼睛睁开；「转动着寻找」压一次眼睑；「合目致意」闭一次
         4  云翳炸开，白闪一下，字被掀散
       没写 eye 的黑幕拍（比如停电那几句）就是纯白字，不动。 */
    if (b.eye) eyeStep(b.eye, dark);
    /* 「眼球上下合目，向她致意。」—— 这一拍要真的合一次眼。
       ★ 只能走 else if：这句自己带 eye:3，if(b.eye) 会先命中。
         所以合目必须放进 eyeStep(3) 里按台词判，不能挂在外面。 */
    else if (dark && /上下合目/.test(b.t)) setTimeout(eyeBlink, 260);

    /* HUD */
    hudNow.textContent = b.n;
    hudBar.style.width = (i / (SCRIPT.length - 1) * 100) + '%';
    var tk = 0;
    for (var q = 0; q < tocMap.length; q++) if (tocMap[q].i <= i) tk = q;
    tocLinks.forEach(function(a, k){ a.classList.toggle('on', k === tk); });
}

/* ==================================================================
   翻页 —— 这一段唯一的推进方式
   ------------------------------------------------------------------
   ★ 没有滚动条。整页就是一本书：一次动作 = 翻一页（或翻回去一页）。
     · 点画面      下一页
     · → ↓ 空格    下一页　　← ↑ 上一页　　Home / End 头尾
     · 滚轮        向下滚 = 下一页，向上 = 上一页（一次手势只翻一页）
     · 左右滑      触屏
   ------------------------------------------------------------------
   ★ 翻页的**分步**（一步一步来，别一锅端）：
       ① 收　这一页的字一句一句收走（往前往上，往回往下）
       ② 换　收干净了才重建内容 —— 交换发生在纸面上没有字的那一刻
       ③ 放　新的字一句一句回来，最新那句再打一遍字
     以前「翻页」是一张米黄的纸盖上来再退走：那纸要么铺满整屏（读不出
     是什么东西），要么得做得很大才能盖住书页（看着就突兀）。
     现在没有纸在飞 —— 动的是字本身。
   ================================================================== */
var TOTAL = SCRIPT.length;
/* 换完内容后再锁这么久才收翻页状态，免得连点把「放」这一步吃掉 */
var T_SETTLE = 90;
var turning = false, firstTurn = true, pending = -1;

function setNav(){
    pnumEl.textContent = (cur < 0 ? 1 : cur + 1) + ' / ' + TOTAL;
    navPrev.classList.toggle('off', cur <= 0);
    navNext.classList.toggle('off', cur >= TOTAL - 1);
}
function go(i){
    i = Math.max(0, Math.min(TOTAL - 1, i));
    /* 正在翻的时候又来一下：记着，翻完就去。以前是直接丢掉，
       连点几下会有「按了没反应」的手感。 */
    if (turning){ pending = i; return; }
    if (i === cur) return;
    turning = true;
    if (firstTurn){ firstTurn = false; howEl.classList.add('off'); }
    /* ① 收：只有「小说 → 小说」才需要。
       黑屏卡要的是硬切的突然，等 170ms 收字就没劲了；
       书页整页关掉的时候，字跟着整页一起走，也不该再单独收一次。 */
    var wait = 0;
    if (isBookK(SCRIPT[i].k) && cur >= 0 && isBookK(SCRIPT[cur].k)){
        wait = collectLines(i > cur ? 'up' : 'down');
    }
    /* ② 换 + ③ 放：字收干净了才动内容 */
    setTimeout(function(){
        showBeat(i);
        setNav();
        setTimeout(function(){
            turning = false;
            if (pending >= 0){ var p = pending; pending = -1; if (p !== cur) go(p); }
        }, T_SETTLE);
    }, wait);
}
function next(){ go(cur + 1); }
function prev(){ go(cur - 1); }
/* ★ 翻页条要自己接住点击 —— 上面那个「点画面翻页」是 pointerup，
   而 #nav 被它排除了（不然点「上一页」会同时触发下一页）。
   少了这两行，翻页条就是两个摆设。 */
navPrev.addEventListener('click', function(e){ e.preventDefault(); prev(); });
navNext.addEventListener('click', function(e){ e.preventDefault(); next(); });

/* 点画面 = 下一页（翻页条、目录不算；触屏走 swipe，不在这儿处理） */
document.addEventListener('pointerup', function(e){
    if (e.button !== 0) return;
    if (e.pointerType && e.pointerType !== 'mouse') return;
    if (e.target.closest && e.target.closest('#nav')) return;
    if (e.target.closest && e.target.closest('#tocs')) return;
    next();
});

/* 键盘 */
window.addEventListener('keydown', function(e){
    var k = e.key;
    /* 不带 Enter —— 焦点落在翻页条上时，回车会被链接和这里各算一次 */
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown'){
        e.preventDefault(); next();
    } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){
        e.preventDefault(); prev();
    } else if (k === 'Home'){ e.preventDefault(); go(0); }
    else if (k === 'End'){ e.preventDefault(); go(TOTAL - 1); }
});

/* 滚轮：一次手势只翻一页，不做连续滚动 */
window.addEventListener('wheel', function(e){
    if (turning) return;
    if (Math.abs(e.deltaY) < 6) return;
    e.preventDefault();
    if (e.deltaY > 0) next(); else prev();
}, { passive:false });

/* 触屏：左右滑 / 上下滑 */
var tx = 0, ty = 0, tt = 0;
window.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; tt = Date.now();
}, { passive:true });
window.addEventListener('touchend', function(e){
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Date.now() - tt > 900) return;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); return; }
    if (Math.abs(dy) > 56){ dy < 0 ? next() : prev(); }
}, { passive:true });

/* 开场：第 0 页 */
setStage('room');
showBeat(0);
setNav();
window.MP_CUT6 = { show:showBeat, go:go, next:next, prev:prev, total:TOTAL };
</script>
