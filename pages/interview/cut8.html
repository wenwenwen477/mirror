<style>
/* ==================================================================
   CUT8 · 答记者问 —— 逆转裁判式舞台
   ------------------------------------------------------------------
   ★ 立绘**全部同台**：这个场面有几个人，台上就站几个人。
     演出靠走位（左右移动 / 纵深进退 = 缩放）、跳跃、旋转、明暗来做；
     再叠一层**运镜**：镜头平移 + 推拉（焦点跟说话人走，收紧=张力）。
   ★ 原作插在半路的采访问答 → 上半屏滑下「采访室」，双线交织；
     "轰隆"一声巨响会把采访线当场砸断（原文就是这么写的）。
   ★ 大黑屏卡用在「目不转睛，前所未见……」那两拍 —— 整块黑掉，
     只剩一行白字（CUT4「翻页吧。」的形制）。
   ================================================================== */
#theater{ position:fixed; inset:0; background:#07090b; overflow:hidden; }
#theater.shake8{ animation:sh8 .6s linear; }
@keyframes sh8{
    0%,100%{ transform:translate(0,0); }
    12%{ transform:translate(-7px,4px); } 25%{ transform:translate(8px,-3px); }
    38%{ transform:translate(-6px,5px); } 50%{ transform:translate(6px,3px); }
    62%{ transform:translate(-4px,-4px); } 75%{ transform:translate(4px,2px); }
    88%{ transform:translate(-2px,1px); }
}

/* ---------------- 世界：背景 + 全体立绘，一起吃运镜 ---------------- */
#world{ position:absolute; inset:0; z-index:1; will-change:transform; }
#bgc{ position:absolute; inset:0; }

/* 立绘：底部中心锚点，走位 / 缩放 / 旋转全在 transform 里 */
.pc{ position:absolute; left:0; bottom:0; opacity:0;
     transform-origin:50% 100%; will-change:transform,opacity; }
.pc svg{ display:block; height:min(56vh,520px);
         filter:drop-shadow(0 0 12px rgba(200,208,194,.14));
         transition:filter .35s ease; }
.pc.tall svg{ height:min(63vh,585px); }
.pc.far svg{ filter:brightness(.75) drop-shadow(0 0 8px rgba(200,208,194,.08)); }
.pc .tag{ text-align:center; font-size:12px; letter-spacing:3px; margin-top:8px;
          color:rgba(200,208,194,.5); white-space:nowrap; }
.pc.dim svg{ filter:brightness(.5) saturate(.8) drop-shadow(0 0 10px rgba(200,208,194,.05)); }

/* 停电 / 火光 */
#dark8{ position:fixed; inset:0; z-index:8; background:#000; opacity:0;
        pointer-events:none; transition:opacity 1.2s ease; }
#dark8.on{ opacity:.82; }
#fire8{ position:fixed; left:15%; right:15%; bottom:0; height:36%; z-index:9;
        pointer-events:none; opacity:0; transition:opacity 1.2s ease;
        background:radial-gradient(ellipse at 50% 100%, rgba(255,120,40,.32), rgba(255,60,20,.12) 45%, transparent 72%); }
#fire8.on{ opacity:1; animation:flick8 1.6s ease-in-out infinite; }
@keyframes flick8{ 0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.4) } }

/* ---------------- 上半分屏：两个模式（采访室 / 坠落） ----------------
   分屏里也全用对话立绘，不再画小黑人剪影。 */
#fb{ position:fixed; left:0; right:0; top:0; height:46%; z-index:20;
     transform:translateY(-103%); transition:transform .65s cubic-bezier(.3,.7,.3,1);
     background:#0d1117; border-bottom:2px solid rgba(200,208,194,.3);
     box-shadow:0 14px 40px rgba(0,0,0,.5); }
#fb.on{ transform:none; }
#fbcap{ position:absolute; left:20px; bottom:10px; font-size:12px; letter-spacing:3px;
        color:rgba(200,208,194,.55); text-shadow:0 0 8px rgba(0,0,0,.8); z-index:5; }
.fmode{ position:absolute; inset:0; display:none; overflow:hidden; }
.fmode.on{ display:block; }

/* —— 模式一：采访室（她 + 记者，对话立绘） —— */
#fmode-itv{ background:
    radial-gradient(120% 90% at 50% -10%, rgba(120,136,150,.16), rgba(10,13,17,0) 60%), #0d1117; }
#fmode-itv .fwall{ position:absolute; left:0; right:0; bottom:22%; height:2px;
    background:rgba(200,208,194,.12); }
#fmode-itv .fdesk{ position:absolute; left:18%; right:18%; bottom:10%; height:9%;
    background:#1c232b; border-top:2px solid rgba(200,208,194,.16); }
#fmode-itv .fred{ position:absolute; bottom:21%; width:8px; height:5px; border-radius:1px;
    background:rgba(200,60,60,.85); animation:fred8 1.4s ease-in-out infinite; }
@keyframes fred8{ 0%,100%{ opacity:.45 } 50%{ opacity:1 } }
#fmode-itv .fps{ position:absolute; bottom:17%; }
#fmode-itv .fps svg{ display:block; height:23vh;
    filter:drop-shadow(0 0 10px rgba(200,208,194,.12)); }
#fmode-itv .fps .ftag{ text-align:center; font-size:11px; letter-spacing:2px;
    color:rgba(200,208,194,.45); margin-top:4px; }

/* —— 模式二：坠落（幂偌的立绘栽下来，碎成碎片，再慢慢拼回去） —— */
#fmode-fall{ background:
    linear-gradient(180deg, rgba(120,144,168,.10), rgba(10,13,17,0) 55%), #0b0e14; }
#fmode-fall .ffloor{ position:absolute; left:8%; right:8%; bottom:15%; height:2px;
    background:rgba(200,208,194,.14); }
#fmode-fall .fbox{ position:absolute; left:50%; bottom:15%;
    transform:translateX(-50%); will-change:transform; }
#fmode-fall .fbox svg{ display:block; height:26vh;
    filter:drop-shadow(0 0 10px rgba(200,208,194,.12)); }
#fmode-fall .ffrags{ position:absolute; inset:0; }
#fmode-fall .ffrags .fp{ position:absolute; will-change:transform,opacity; }
#fmode-fall .ffrags .fp svg{ display:block; }
#fmode-fall .fhit{ position:absolute; left:50%; bottom:15%; width:0; height:2px; opacity:0;
    background:linear-gradient(90deg, rgba(240,232,216,0), rgba(240,232,216,.9), rgba(240,232,216,0)); }
/* 碎裂戏的狠话：写在分屏里（不挡底下的台词），随立绘一起崩飞/重组 */
#fmode-fall .fcap{ position:absolute; left:50%; top:5%; transform:translateX(-50%);
    width:86%; text-align:center; z-index:7; opacity:0; pointer-events:none;
    font-family:"Songti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
    font-size:clamp(15px,2.5vw,27px); letter-spacing:.06em; line-height:1.55;
    color:#f0e8d8; text-shadow:0 0 20px rgba(0,0,0,.92); transition:opacity .6s ease; }
#fmode-fall .fcap.on{ opacity:1; }
/* 采访线在跑的时候，下面的事件世界压暗一点 */
body.itv #world{ filter:brightness(.5); }
#world{ transition:transform .1s linear, filter .8s ease; }

/* 对话框浮在一切之上；黑屏大字卡保持干净（CUT4 形制），红章只在场景里用（如黑板擦），不砸在黑卡上 */
#dbox{ z-index:122; }
/* 开场（标题 / 未开始）先藏起来，begin() 真正开演时再揭开 */
#dbox.start-hidden{ opacity:0; pointer-events:none; }

/* ---------------- 红章 ---------------- */
#stamp{ position:fixed; left:50%; top:36%; z-index:126;
        transform:translate(-50%,-50%) scale(3) rotate(14deg);
        opacity:0; pointer-events:none; }
#stamp.on{ animation:slam8 1.15s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes slam8{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(3) rotate(14deg); }
    34%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-6deg); }
    42%{ transform:translate(-50%,-50%) scale(1.07) rotate(-6deg); }
    50%,86%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-6deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1) rotate(-6deg); }
}
#stamp .seal{ display:flex; align-items:center; justify-content:center;
    width:min(44vw,290px); height:min(44vw,290px);
    border:6px solid rgba(176,35,42,.85); border-radius:12px;
    box-shadow:0 0 36px rgba(176,35,42,.4), inset 0 0 26px rgba(176,35,42,.2);
    background:rgba(22,9,9,.42); }
#stamp .word{ font-family:"Songti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;

    letter-spacing:.06em; text-indent:.06em;
    text-shadow:0 0 24px rgba(200,50,58,.55); }

/* 白闪 */
#flash{ position:fixed; inset:0; z-index:58; background:rgba(255,250,240,.96);
        opacity:0; pointer-events:none; }
#flash.on{ animation:fl8 .55s ease-out; }
@keyframes fl8{ 0%{opacity:0} 14%{opacity:1} 100%{opacity:0} }

/* 开场卡 / 终幕 */
#title8,#fin{ position:fixed; inset:0; z-index:65; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;

#title8.off,#fin.off{ opacity:0; pointer-events:none; }
#title8 .t8{ font-size:13px; letter-spacing:6px; color:var(--ink2); }
#title8 .n8{ font-size:30px; letter-spacing:12px; text-indent:12px; color:var(--ink); }

#fin .f8{ font-size:16px; letter-spacing:6px; color:var(--ink2); }
#toArticle{ margin-top:20px; padding:12px 24px; border:1px solid rgba(200,208,194,.4);
    color:var(--ink); font-size:14px; letter-spacing:3px; text-decoration:none;
    transition:all .2s ease; }
#toArticle:hover{ border-color:#c8453f; color:#e8caca; background:rgba(176,35,42,.08); }
#fin .fh{ margin-top:14px; font-size:11.5px; letter-spacing:2px; color:#5f675d; }
</style>

var cam = { x:.5, z:1, tx:.5, tz:1 };          /* 镜头：焦点 + 变焦 */

function mkChar(type, cls){
    var el = document.createElement('div');
    el.className = 'pc' + (cls ? ' ' + cls : '');
    el.innerHTML = spriteSVG(type) + '<div class="tag">' + TAGS[type] + '</div>';
    world.appendChild(el);

    if (type === 'lq') st.x = .28;
    CH[type] = { el: el, st: st, tg: { x: st.x, y: 0, s: 1, r: 0, a: 0 } };
}

/* 走位 / 缩放 / 旋转：T('mp', {x:.5, s:1.06}) ；snap = 立即到位 */
function T(who, props, snap){
    var c = CH[who]; if (!c) return;
    for (var k in props){
        c.tg[k] = props[k];
        if (snap) c.st[k] = props[k];
    }
}

var bgc = document.getElementById('bgc'), bctx = bgc.getContext('2d');

function drawBg(name){
    var W = innerWidth, H = innerHeight;
    bctx.clearRect(0, 0, W, H);
    bctx.fillStyle = '#07090b'; bctx.fillRect(0, 0, W, H);
    if (name === 'room'){
        var g = bctx.createRadialGradient(W * .5, -H * .15, 10, W * .5, H * .55, W * .7);
        g.addColorStop(0, 'rgba(70,78,66,.34)'); g.addColorStop(.75, 'rgba(7,9,12,0)');
        bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
        bctx.strokeStyle = 'rgba(200,208,194,.10)'; bctx.lineWidth = 2;
        bctx.strokeRect(W * .04, H * .1, W * .22, H * .42);
        bctx.fillStyle = 'rgba(120,140,150,.045)';
        bctx.fillRect(W * .04, H * .1, W * .22, H * .42);
        bctx.strokeStyle = 'rgba(200,208,194,.14)'; bctx.lineWidth = 3;
        bctx.strokeRect(W * .82, H * .12, W * .13, H * .62);

        bctx.fillRect(W * .855, H * .18, W * .06, H * .055);

        for (var i = 0; i < 5; i++) bctx.fillRect(W * (.1 + i * .15), H * .8, W * .07, H * .012);
        bctx.fillStyle = 'rgba(200,208,194,.04)'; bctx.fillRect(0, H * .86, W, 2);
    } else if (name === 'lab'){
        var g2 = bctx.createRadialGradient(W * .5, H * .3, 10, W * .5, H * .6, W * .6);

        bctx.fillStyle = g2; bctx.fillRect(0, 0, W, H);
        bctx.fillStyle = '#1a1f26'; bctx.fillRect(W * .08, H * .66, W * .52, H * .04);
        bctx.fillStyle = '#141920'; bctx.fillRect(W * .08, H * .7, W * .52, H * .16);
        bctx.fillStyle = 'rgba(120,90,60,.08)';

function bgFit(){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    bgc.width = Math.round(W * dpr); bgc.height = Math.round(H * dpr);
    bgc.style.width = W + 'px'; bgc.style.height = H + 'px';
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBg(curBg);
}

/* 主循环：缓动 + 上屏（走位起伏 / 镜头 / 深度排序） */
function frame(){
    var now = Date.now();
    for (var k in CH){
        var c = CH[k], st = c.st, tg = c.tg;
        for (var p in tg) st[p] += (tg[p] - st[p]) * .065;
        var moving = Math.abs(tg.x - st.x) > .02;
        var bob = moving ? Math.abs(Math.sin(now / 140)) * H * .007 : 0;
        c.el.style.opacity = Math.max(0, Math.min(1, st.a)).toFixed(3);
        c.el.style.transform =
            'translateX(' + (st.x * W).toFixed(1) + 'px)' +
            'translateY(' + (st.y * H - bob).toFixed(1) + 'px)' +
            'translateX(-50%)' +
            'scale(' + st.s.toFixed(3) + ')' +
            'rotate(' + st.r.toFixed(2) + 'deg)';
        c.el.style.zIndex = Math.round(10 + st.s * 30 + st.y * 120);
    }
    cam.x += (cam.tx - cam.x) * .05;
    cam.z += (cam.tz - cam.z) * .05;
    var shx = shakeT > 0 ? (Math.random() - .5) * 13 * shakeT : 0;
    var shy = shakeT > 0 ? (Math.random() - .5) * 9 * shakeT : 0;
    shakeT = Math.max(0, shakeT - .045);
    world.style.transform =
        'translate(' + (W / 2 + shx).toFixed(1) + 'px,' + (H * .55 + shy).toFixed(1) + 'px)' +
        'scale(' + cam.z.toFixed(3) + ')' +
        'translate(' + (-W * cam.x).toFixed(1) + 'px,' + (-H * .55).toFixed(1) + 'px)';
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- 上半分屏：采访室 + 坠落（全部用对话立绘） ----------------
   模式一「采访室」：她 + 记者（对话立绘），双线的另一条；
   模式二「坠落」：幂偌的立绘栽下来，砸碎成碎片，再慢慢拼回去 ——
   参考CUT4的「人」摔碎（clip-path 网格切片），原文写的是"她在慢慢重组"。
   分屏只占上半屏，台词一直在下面，文本不会被盖住。 */
var FB = (function(){
    var panel = document.getElementById('fb');
    var cap = document.getElementById('fbcap');
    var mItv = document.getElementById('fmode-itv');
    var mFall = document.getElementById('fmode-fall');
    var fbox = document.getElementById('fbox');
    var ffrags = document.getElementById('ffrags');
    var fhit = document.getElementById('fhit');
    var mode = '';
    var anims = [], timers = [], SHARDS = null;

    /* 采访室：注入两个对话立绘（只注入一次） */
    var itvBuilt = false;
    function itvBuild(){
        if (itvBuilt) return; itvBuilt = true;
        document.getElementById('fpcLq').innerHTML =
            spriteSVG('lq') + '<div class="ftag">玻琳秋</div>';
        document.getElementById('fpcJi').innerHTML =
            spriteSVG('ji') + '<div class="ftag">本台记者</div>';
    }

    /* 碎片网格：把立绘的包围盒按网格切成三角（顶点共享，严丝合缝） */
    function rndOf(k){ var x = Math.sin(k * 127.1) * 43758.5453; return x - Math.floor(x); }
    function buildShards(cols, rows){
        var pts = [], out = [], i, j;
        for (j = 0; j <= rows; j++){
            pts[j] = [];
            for (i = 0; i <= cols; i++){
                var jx = (i > 0 && i < cols) ? (rndOf(i * 31 + j * 7) - .5) * 8 : 0;
                var jy = (j > 0 && j < rows) ? (rndOf(i * 17 + j * 53) - .5) * 8 : 0;
                pts[j][i] = [ i / cols * 100 + jx, j / rows * 100 + jy ];
            }
        }
        for (j = 0; j < rows; j++) for (i = 0; i < cols; i++){
            var a = pts[j][i], b = pts[j][i + 1], c = pts[j + 1][i], d = pts[j + 1][i + 1];
            out.push([a[0],a[1], b[0],b[1], d[0],d[1]]);
            out.push([a[0],a[1], d[0],d[1], c[0],c[1]]);
        }
        return out;
    }
    function polyOf(p){
        var s = [];
        for (var k = 0; k < p.length; k += 2) s.push(p[k] + '% ' + p[k + 1] + '%');
        return 'polygon(' + s.join(',') + ')';
    }
    function clearFall(){
        anims.forEach(function(a){ try { a.cancel(); } catch (e){} }); anims = [];
        timers.forEach(function(t){ clearTimeout(t); }); timers = [];
        ffrags.innerHTML = '';
        fbox.style.opacity = '1'; fbox.style.visibility = 'visible';
        fbox.style.transform = 'translateX(-50%)';
        fhit.style.opacity = '0';
        var fc = document.getElementById('fcap');
        if (fc){ fc.classList.remove('on'); fc.textContent = ''; }
    }
    function setMode(m){ mode = m; }

    return {
        /* 采访室 */
        itv: function(caption){
            itvBuild();
            clearFall();
            setMode('itv');
            mItv.classList.add('on'); mFall.classList.remove('on');
            cap.textContent = caption || '火灾之后 · 采访室';
            panel.classList.add('on');
        },
        /* 坠落：立绘栽下来 → 砸扁（停住）。碎裂 / 重组另行触发（剧情节点）。 */
        fall: function(caption){
            setMode('fall');
            clearFall();
            this._shattered = false; this._reassembled = false;
            fbox.innerHTML = spriteSVG('mp');          /* 坠落的是幂偌的立绘 */
            SHARDS = buildShards(4, 3);
            mFall.classList.add('on'); mItv.classList.remove('on');
            cap.textContent = caption || '';
            panel.classList.add('on');
            /* 栽下来 */
            var a = fbox.animate([
                { transform:'translateX(-50%) translateY(-46vh) rotate(-5deg)' },
                { transform:'translateX(-50%) translateY(0px) rotate(4deg)' }
            ], { duration:680, easing:'cubic-bezier(.42,.02,.86,.34)', fill:'forwards' });
            anims.push(a);
            a.onfinish = function(){ this.impact(); }.bind(this);
        },
        impact: function(){
            /* ★ 压扁之前把盒子量下来 —— 砸地那一下会把 fbox 压成一条线，
               之后再量就会得到"几乎为零"的尺寸，碎片会碎成一片小灰点。 */
            this._boxRect = fbox.getBoundingClientRect();
            var Ww = Math.max(300, innerWidth * .4);
            var ha = fhit.animate([
                { width:'0px', opacity:0 },
                { width:Ww + 'px', opacity:.85, offset:.3 },
                { width:Ww + 'px', opacity:0 }
            ], { duration:600, easing:'ease-out', fill:'both' });
            anims.push(ha);
            var ba = fbox.animate([
                { transform:'translateX(-50%) scale(1,1)', offset:0 },
                { transform:'translateX(-50%) translateY(10px) scale(1.2,.12)', offset:.45 },
                { transform:'translateX(-50%) scale(1.05,.95)', offset:.72 },
                { transform:'translateX(-50%) scale(1,1)', offset:1 }
            ], { duration:300, easing:'cubic-bezier(.2,.8,.3,1)', fill:'forwards' });
            anims.push(ba);
            /* ★ 落地只做一下缓冲（压扁→立刻回弹到正常直立），不长期停在扁态；
               碎裂留到剧情到"像碎了的镜子"由 SHATTER 指令触发，不在这里自动炸。 */
        },
        shatter: function(){
            if (this._shattered) return; this._shattered = true;
            /* 立绘的包围盒 → 每片一只 clip-path 过的立绘副本。
               ★ 用压扁前量好的盒子（this._boxRect）；分屏只有 46% 高，
                 崩飞要"横向铺开、纵向收着"，否则碎片会飞出分屏被裁掉。 */
            var r = this._boxRect || fbox.getBoundingClientRect();
            var pw = r.width, ph = r.height, sx = r.left, sy = r.top;
            var Vw = innerWidth;
            var Hf = document.getElementById('fb').getBoundingClientRect().height;
            fbox.style.opacity = '0'; fbox.style.visibility = 'hidden';
            SHARDS.forEach(function(p, k){
                var d = document.createElement('div');
                d.className = 'fp';
                d.style.left = sx + 'px'; d.style.top = sy + 'px';
                d.style.width = pw + 'px'; d.style.height = ph + 'px';
                d.style.clipPath = polyOf(p);
                d.style.webkitClipPath = polyOf(p);
                d.innerHTML = spriteSVG('mp');
                d.querySelector('svg').style.height = ph + 'px';
                ffrags.appendChild(d);
                var cx = (p[0] + p[2] + p[4]) / 3, cy = (p[1] + p[3] + p[5]) / 3;
                var r1 = rndOf(k + 1), r2 = rndOf(k + 7), r3 = rndOf(k + 13);
                var dx = (cx - 50) / 50 * (Vw * .30) + (r1 - .5) * (Vw * .20);   /* 横向大幅炸开 */
                var dy = -(4 + r2 * Hf * .18) + (cy - 50) / 50 * (ph * .16);      /* 纵向只收一点点 */
                var rt = (r3 - .5) * 360;
                var a = d.animate([
                    { transform:'translate(0px,0px) rotate(0deg)', opacity:1, offset:0 },
                    { transform:'translate(' + (dx * .72) + 'px,' + dy + 'px) rotate(' + (rt * .6) + 'deg)', opacity:1, offset:.32 },
                    { transform:'translate(' + dx + 'px,' + (dy * .35 + Hf * .08) + 'px) rotate(' + rt + 'deg) scale(.86)', opacity:1, offset:.62 },
                    { transform:'translate(' + (dx * 1.02) + 'px,' + (Hf * .12) + 'px) rotate(' + (rt * 1.04) + 'deg) scale(.8)', opacity:.95, offset:1 }
                ], { duration: 950 + Math.round(r2 * 380), easing:'cubic-bezier(.14,.55,.3,1)', fill:'forwards' });
                anims.push(a);
            });
            /* 重组不在这里自动跑 —— 等剧情到"她在慢慢重组"由 REASSEMBLE 触发 */
        },
        reassemble: function(){
            if (this._reassembled) return; this._reassembled = true;
            var list = ffrags.querySelectorAll('.fp');
            for (var k = 0; k < list.length; k++){
                (function(d, k){
                    var from = getComputedStyle(d).transform;
                    var a = d.animate([
                        { transform: from === 'none' ? 'translate(0,0)' : from, opacity:.92 },
                        { transform:'translate(0px,0px) rotate(0deg)', opacity:1 }
                    ], { duration: 1400, delay: k * 9, easing:'cubic-bezier(.3,.7,.25,1)', fill:'forwards' });
                    anims.push(a);
                })(list[k], k);
            }
        },
        fallEnd: function(){
            this.close();
        },
        /* 碎裂戏字幕：写进分屏，不挡底下的台词 */
        fallCap: function(text){
            var c = document.getElementById('fcap');
            if (c){ c.textContent = text || ''; c.classList.add('on'); }
        },
        close: function(){
            panel.classList.remove('on');
            document.body.classList.remove('itv');
            clearFall();
            mItv.classList.remove('on'); mFall.classList.remove('on');
            mode = '';
        }
    };
})();

/* ---------------- 调度表：cue 名 → 一串指令 ----------------
   T:谁,x.5,y0,s1,r0,a1[,snap]   C:镜头焦点,变焦   K 敲/震   F 白闪
   B 轰隆(闪+震+敲+停电)   D+/D- 停电开关   I+/I- 采访线   F8/F8- 火光 */
function stage(str){
    str.split(';').forEach(function(cmd){
        cmd = cmd.trim(); if (!cmd) return;
        var m;
        if (m = /^T:(\w+),(.+)$/.exec(cmd)){
            var who = m[1], props = {}, snap = false;
            m[2].split(',').forEach(function(p){
                p = p.trim();
                if (p === 'snap'){ snap = true; return; }
                var kv = /^([xysra])(-?\d*\.?\d+)$/.exec(p);
                if (kv) props[kv[1]] = +kv[2];
            });
            T(who, props, snap);
        } else if (m = /^C:(-?[\d.]+),(-?[\d.]+)$/.exec(cmd)){
            camT(+m[1], +m[2]);
        } else if (cmd === 'K'){ knock(); shake();
        } else if (cmd === 'F'){ flash();
        } else if (cmd === 'B'){ flash(); shake(); knock(); dark8(true);
        } else if (cmd === 'D+'){ dark8(true);
        } else if (cmd === 'D-'){ dark8(false);
        } else if (cmd === 'I+'){ FB.itv(); document.body.classList.add('itv');
        } else if (cmd === 'I-'){ FB.close(); document.body.classList.remove('itv');
        } else if (cmd === 'F8'){ fire8(true);
        } else if (cmd === 'F8-'){ fire8(false);
        } else if (cmd === 'SH'){ shake();
        } else if (cmd === 'FALL'){ FB.fall('二楼窗口 · 她跳了下去');
        } else if (cmd === 'FALLEND'){ FB.fallEnd();
        } else if (cmd === 'SHATTER'){ FB.shatter();
        } else if (cmd === 'REASSEMBLE'){ FB.reassemble();
        } else if (cmd.indexOf('bg:') === 0){ curBg = cmd.slice(3); drawBg(curBg); }
    });
}

/* ---------------- 台词驱动：cue / 红章 / 打光 ---------------- */
function onLine(it){
    if (it.cue) cue(it.cue);                 /* 先调度，再打光 —— 顺序别反 */
    focusWho(it.w);
    if (it.cap) FB.fallCap(it.cap);          /* 碎裂戏：狠话写进分屏，不挡底下台词 */
    if (it.st){
        if (it.st === 'hbc') stamp('黑板擦'), itv(2);
        /* 配电箱那句走黑屏大字，卡上只留那一行字，红章就不砸上去了（红章留给场景用） */
        if (it.st === 'pdn'){ itv(3); if (!it.big) stamp('配电箱'); }
    }
}

/* ---------------- 收尾：末行黑屏大字（"因为这次，有人接她。"）由剧本负责 ----------------
   不叠那两张莫名其妙的黑卡，结束直接过渡到入口（index.html）。 */
function endSeq(){
    document.getElementById('dbox').classList.add('off');   /* 收掉尾巴上可能闪出的空对话框 */
    unlock('cut8s');                                        /* 演完了 → 主页面补剧情按钮 / 采访页小眼球开口 */
    setTimeout(function(){ location.href = 'index.html'; }, 450);
}

/* ---------------- 开演 ---------------- */
var began = false;
var titleEl = document.getElementById('title8');
function begin(){
    if (began) return;
    began = true;
    itv(1);                                    /* 能站在这里，钠那一档就算过了 */
    titleEl.classList.add('off');
    setTimeout(function(){ titleEl.style.display = 'none'; }, 950);
    setTimeout(function(){
        document.getElementById('dbox').classList.remove('start-hidden');
        window.CUT7Dialog.play(SCRIPT, {
            who: WHO,
            sink: false,
            onLine: function(i, it){ onLine(it); },
            onEnd: endSeq,
            onExit: function(){ location.href = 'index.html'; }
        });
    }, 750);
}
titleEl.addEventListener('click', begin);
document.addEventListener('keydown', function(e){
    if (!began && (e.key === 'z' || e.key === 'Z' || e.key === 'Enter')){ e.preventDefault(); begin(); }
});
})();
</script>
