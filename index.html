   排序题是"已答过"、Meta 演示是"上次没演完"，看起来就像清档没生效。
   mp_lab_q1        实验楼搜索「幂偌」的排序题标记（pages/school/lab.html）
   mp_meta_save     Meta 演示的自动存档（pages/write/demo.html，含进度行号/舞台态）
   koulin_meta_*    上一版存档键，留着兜底清掉老档 */
var SUB_FLAGS = ['mp_lab_q1', 'mp_meta_save', 'koulin_meta_save', 'koulin_meta_name', 'mp_player_name'];
var CLEAR_STAMP = 'mp_clear_at';        // 清档戳：见下面 clearSubFlags 的说明
function clearSubFlags(){
    SUB_FLAGS.forEach(function(k){ try { localStorage.removeItem(k); } catch (e) {} });
    /* ★ 除了删键，再写一个"清档戳"（此刻的时间戳）。
       为什么要有它：删键只在这一页的这一刻生效 —— 玩家在**别的标签页**清的档、
       或者某个标记是旧版本留下的、没被删干净，子页面就认不出"这次是清过档了"，
       于是排序题是"已答过"、提问框不再出现，看着就像清档没生效。
       有了戳之后，子页面拿自己的标记跟它比时间：
       **标记晚于最后一次清档才算数**，比它早的一律当没发生过（见 pages/school/lab.html）。 */
    try { localStorage.setItem(CLEAR_STAMP, String(Date.now())); } catch (e) {}
}

if (Q_RESET){
    try { localStorage.removeItem(SKEY); } catch (e) {}
    try { localStorage.removeItem(UNLOCK_KEY); } catch (e) {}   // ?reset 时连网页那边的解锁一起清
    clearSubFlags();                                            // ?reset 同上：子页面标记一起清
} else {
    try {
        var _raw = localStorage.getItem(SKEY);
        if (_raw){
            var _p = JSON.parse(_raw);
            if (_p && _p.seen && _p.used){
                save = _p;
                if (!save.ans) save.ans = {};              // 兼容旧档
                if (!save.storyDone) save.storyDone = {};  // 同上
            }
        }
    } catch (e) {}
}
function saveNow(){ try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) {} dbgRender(); }

/* 调试角标：used / seen / ans 三项，方便确认存档到底记了什么 */
var dbgEl = null;
if (DEBUG){
    dbgEl = document.createElement('div');
    dbgEl.id = 'dbg';
    dbgEl.className = 'on';
    (document.body || document.documentElement).appendChild(dbgEl);
}
function dbgRender(){
    if (!dbgEl) return;
    var u = Object.keys(save.used).filter(function(k){ return (save.used[k] || []).length; })
              .map(function(k){ return k + '[' + save.used[k].join(',') + ']'; }).join(' ');
    var s = Object.keys(save.seen).join(',');
    var a = Object.keys(save.ans || {})
              .map(function(k){ return k + '=' + save.ans[k]; }).join(' ');
    dbgEl.textContent = 'used: ' + (u || '—') + '   seen: ' + (s || '—') +
                        '   ans: ' + (a || '—') +
                        '   ·  R 清档重开 · B 重开一轮';
}

Object.keys(NODES).forEach(function(k){
    var n = NODES[k];
    n._id = k;                                            // 节点自带 id，方便存档
    /* 注意：_seen **不从存档里恢复**。
       它是"这一局里已经播过"的标记，只用来避免同一局内重复逐字播同一句。
       如果读档时把 seen 也恢复，那句就会整句直接显示、一个字都不打——看起来很突兀。
       读档该跳过的是"已经走过的路"（见 resumeId），不是"打字这个动作"。 */
    n._seen = false;
    (n.opts || []).forEach(function(o, i){
        o._idx = i;
        o._used = (save.used[k] || []).indexOf(i) >= 0;   // 选过的分支不再出现
    });
});
/* 该节点还剩哪些可选分支（选过的移除） */
function availOpts(n){
    return (n && n.opts) ? n.opts.filter(function(o){ return !o._used; }) : [];
}
/* 分支的去处：可以写死一个节点 id，也可以写一个函数——
   函数在选择那一刻才求值，于是"同一句问话，按之前答过什么给出不同的回应"。
   例：to: function(){ return save.ans.faith === 'yes' ? 'q3a_f' : 'q3a_n'; } */
function optTo(o){ return (typeof o.to === 'function') ? o.to() : o.to; }

/* ---- 读档时该从哪一句接着走：把已经走过的路整段跳过 ----
   规则顺着"主线"往下摸：
     · 这一问已经选过了 → 顺着当时选的那条分支往下走（整句跳过，不重播）；
     · 有分支但还没选 → 就停在这一问（把问题重新打一遍，等玩家答）；
     · 只是一句串场台词、且以前说过 → 顺着 next 往下；
     · 没说过的句子 → 停在这儿。
   没有存档时第一轮就返回 'open'，和正常开局完全一样。 */
function resumeId(){
    var id = 'open', guard = 0;
    while (guard++ < 80){
        var n = NODES[id];
        if (!n) return 'open';
        if (n.fx){
            /* 特效节点：已经放过就不再放（不重放黑屏），顺着它后面的台词继续；
               一次都没看过说明是选了之后刷新的 —— 那就补看一次。 */
            if (!save.seen[id]) return id;
            if (n.next){ id = n.next; continue; }
            return null;                                 // 放过了、后面也没话 → 不开场
        }
        var ui = (save.used[id] || [])[0];
        if (ui != null && n.opts && n.opts[ui]){          // 已答 → 走当时那条分支
            id = optTo(n.opts[ui]);                       // 去处可能是函数（条件分支），这里要求值
            continue;
        }
        if (n.opts) return id;                            // 还没答 → 停在这一问
        if (!save.seen[id]) return id;                    // 还没说过 → 停在这儿
        if (n.next){ id = n.next; continue; }             // 串场台词 → 接着往下
        return id;                                        // 走到头了
    }
    return 'open';
}

var dlg = document.getElementById('dlg');
var dpre = document.getElementById('dlg-pre');
var dopts = document.getElementById('dlg-opts');
var blackEl = document.getElementById('black');
var blackCn = document.getElementById('black-cn');
var blackEn = document.getElementById('black-en');
var redEl = document.getElementById('redlight');
/* 整屏红光：给带 red:1 的节点用（现在只有「重申：如有不适请即刻离我而去。」那一句）。
   开：进那一句时；关：走到下一句 / 本轮结束 / 清档。 */
function redLight(on){
    if (!redEl) return;
    if (on) redEl.classList.add('on');
    else    redEl.classList.remove('on');
}
dopts.style.rowGap = OPT_GAP + 'px';
var tok = [], typed = 0, curNode = null, curRows = DROWS;
var typing = false, pendingBack = null, dlgOpen = false, justTyped = false;
var optShown = 0, optTimer = null, optBoxes = {}, optLock = false;
var optStep = 0, optMounted = 0;      // 每多一条选项容器会长高多少（首条实测，之后复用）
var optGapUsed = OPT_GAP;             // 当前实际用的缝隙（收紧时要重新实测 optStep）

/* 对白容器是 bottom 定位的：选项一多，容器变高，整块内容会被瞬间顶上去——这就是"跳"。
   这里不用 height 过渡（那会每帧重排），而是先用 transform 把这一跳抵消掉，再动画滑回 0，
   全程只有 transform，走合成层。 */
function slideComp(dy){
    if (!dy) return;
    dlg.style.transition = 'none';
    dlg.style.transform = 'translate(-50%,' + dy + 'px)';
    void dlg.offsetWidth;                                   // 让"没有过渡"的这一帧先落地
    dlg.style.transition = 'transform .5s cubic-bezier(.22,.61,.36,1), opacity .8s ease';
    dlg.style.transform = 'translate(-50%,0px)';
}

function rep(s, n){ var o = ''; for (var i = 0; i < n; i++) o += s; return o; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dw(ch){ return ch.charCodeAt(0) > 0x2E80 ? 2 : 1; }        // 全角计 2 列
function tw(s){ var w = 0; for (var i = 0; i < s.length; i++) w += dw(s.charAt(i)); return w; }
/* 红色发光文字（.nm 这个样式类就干这个：名字、强调字、问题内容都用它） */
function redHTML(t){ return '<span class="nm">' + esc(t) + '</span>'; }
function nmHTML(){ return redHTML(NM); }
/* 玩家名字（小说网隐藏内容第三问输入的）。无则回落「玩家」。终句「很高兴认识您，<名字>。」用。
   按需求只有「您」「玩家」标红，玩家名本身用普通字。 */
var PLR_NAME = (function(){ try { var s = (localStorage.getItem('mp_player_name') || '').replace(/^\s+|\s+$/g, ''); return s || ''; } catch (e){ return ''; } })();
function pnHTML(){ return esc(PLR_NAME || '玩家'); }

function toTokens(segs){
    var out = [];
    (segs || []).forEach(function(s){
        if (typeof s === 'string'){
            for (var i = 0; i < s.length; i++) out.push(s.charAt(i));
        } else if (s && s.r != null){
            /* {r:'您'} → 这几个字红色发光。拆成单字，好让它跟着打字机一个一个出来 */
            var t = String(s.r);
            for (var j = 0; j < t.length; j++) out.push({h: t.charAt(j)});
        } else if (s && s.pn){
            out.push({pn:1});                                // {pn:1} → 玩家名（红字，无则回落「玩家」）
        } else {
            out.push({nm:1});                                // {nm:1} → 名字
        }
    });
    return out;
}

/* 按列宽折行：名字是原子 token（3 个全角 = 6 列），不拆开 */
function layoutTokens(list, cols){
    var lines = [], w = 0, h = '';
    function br(){ lines.push({w:w, h:h}); w = 0; h = ''; }
    for (var i = 0; i < list.length; i++){
        var t = list[i];
        if (typeof t === 'string'){
            var cw = dw(t);
            if (w + cw > cols && w > 0) br();
            w += cw; h += esc(t);
        } else if (t.h != null){
            var c2 = dw(t.h);                                // 红色发光的单字
            if (w + c2 > cols && w > 0) br();
            w += c2; h += redHTML(t.h);
        } else if (t.pn){
            var pw = tw(PLR_NAME || '玩家');                  // 玩家名（红字）：按实际字数占列，不拆开
            if (w + pw > cols && w > 0) br();
            w += pw; h += pnHTML();
        } else {
            if (w + 6 > cols && w > 0) br();
            w += 6; h += nmHTML();
        }
    }
    lines.push({w:w, h:h});
    return lines;
}

/* ---- 框的右竖线：它必须是「框的右边缘」，而不是「正文后面补了几个空格」 ----
   光靠补空格有个老毛病：一旦某个字符的实际显示宽度和计数不一致（比如 · 在中文等宽字体里
   占两格却按一格算），整行就会多出一格，右边的 | 跟着往外漂，框就歪了。

   这里**不去推算**字符宽度，而是直接把「上边框那一行」渲染出来量它的真实像素宽度：
   框有多宽由这行说了算，正文区是定宽的，左右两根 | 绝对定位钉在两端。
   这样哪怕字体不是严格等宽（中文机子上常常回退到微软雅黑之类），框也是正的。 */
var BARW = {}, CW = {};                             // 边框行宽度 / 单字宽度，各量一次就缓存
function probeW(txt, div){
    try {
        var p = document.createElement('pre');
        p.className = 'probe';
        p.textContent = txt;
        dlg.appendChild(p);
        var w = (p.getBoundingClientRect ? p.getBoundingClientRect().width : 0) || p.offsetWidth || 0;
        dlg.removeChild(p);
        return w > 0 ? w / (div || 1) : 0;
    } catch (e) { return 0; }
}
/* 该列数的上边框行，真实占多少像素 */
function barW(box){
    if (BARW[box] == null) BARW[box] = probeW('+' + rep('-', box) + '+', 1);
    return BARW[box];
}
/* 单个框线字符的宽度（用来把 | 的中心对准 + 的中心） */
function charW(ch){
    if (CW[ch] == null) CW[ch] = probeW(rep(ch, 50), 50);
    return CW[ch];
}
/* | 比 + 窄的话，竖线的中心会偏——补上这一半差值，两根线才真正对齐 */
function barShift(){
    var d = charW('+') - charW('|');
    return d > 0 ? (d / 2) : 0;
}
/* 一个全角字占多少像素 → 半角列宽 = 它的一半（正文按"全角=2列、半角=1列"计数） */
function colW(){
    return (charW('眼') || 19) / 2;
}
/* ---- 正文实际能写多少列：**按像素算，不靠列数硬凑** ----
   以前直接用「框的列数 - 2」当可写列数，一旦字体不是严格双宽（中文机子上常常回退到
   微软雅黑之类：' - ' 远比一个汉字的一半窄），算出来的可写宽度会比框的真实内宽还大，
   于是字一直打到边框上才折行——看着就是"换行换晚了"，最后一两个字还会被裁掉。
   现在改成：量出框的真实像素宽 → 扣掉两侧留白 → 除以半角列宽 → 得到真正装得下的列数。 */
function contentCols(box){
    var W = barW(box), cp = charW('|'), cw = colW();
    if (!W || !cp || !cw) return box - 2;                 // 量不到（异常环境）→ 退回老算法
    var M = (2 + PAD) * cp;                               // 两侧各让出「框线 + 一列 + PAD」
    var n = Math.floor((W - 2 * M) / cw - 0.5);           // 再留半列，免得亚像素取整把最后一字切掉半个
    return Math.max(8, Math.min(box - 2, n));
}
/* 把若干已按列宽补齐的行，套上 - | + 边框（注意：主渲染循环也叫 frame，故此处名 boxFrame） */
function boxFrame(rows, box){
    box = box || DBOX;
    var bar = '<span class="fr">' + '+' + rep('-', box) + '+' + '</span>';
    var W = barW(box);                                   // 量不到（异常环境）就是 0
    if (!W){                                             // → 退回纯文本排版
        var h0 = bar + '\n';
        rows.forEach(function(r){ h0 += '<span class="fr">|</span> ' + r + ' <span class="fr">|</span>\n'; });
        return h0 + bar;
    }
    var d  = barShift().toFixed(2);                      // | 与 + 的中心差
    var cp = (charW('|') || W / (box + 2));              // 一根竖线占多宽
    var M  = ((2 + PAD) * cp).toFixed(2);                // 正文区左右各让出「框线 + 一列 + PAD」
    var Ws = W.toFixed(2) + 'px';
    var html = '<span class="rw" style="width:' + Ws + '">' + bar + '</span>';
    rows.forEach(function(r){
        html += '<span class="rw" style="width:' + Ws + '">' +
                    '<span class="fr bl" style="left:' + d + 'px">|</span>' +
                    '<span class="bd" style="margin-left:' + M + 'px;margin-right:' + M + 'px">' + r + '</span>' +
                    '<span class="fr br" style="right:' + d + 'px">|</span>' +
                '</span>';
    });
    return html + '<span class="rw" style="width:' + Ws + '">' + bar + '</span>';
}

function draw(){
    var cols = contentCols(DBOX), rows = [];
    var ls = layoutTokens(tok.slice(0, typed), cols);
    var last = ls.length - 1;
    ls.forEach(function(L, idx){
        // 打字过程中，句末跟一个闪烁光标（古早文字游戏）
        var tail = (typing && typed > 0 && idx === last) ? '<span class="cur">_</span>' : '';
        rows.push(L.h + tail + rep(' ', Math.max(0, cols - L.w - (tail ? 1 : 0))));
    });
    while (rows.length < curRows) rows.push(rep(' ', cols));   // 高度固定（整句的行数），打字过程中不再变高
    dpre.innerHTML = boxFrame(rows);
}

/* 选项：每个分支一个**独立的小框**（不是共用一个大框，方便以后做成满屏都是选项）。
   挂载第 i 个分支（i 是 NODES 里的原始下标），自上而下展开。 */
function mountOpt(o, i){
    if (optBoxes[i]) return;
    var cols = contentCols(OPTBOX);
    var txt = '  · ' + o.t;
    var row = '<span class="op">' + esc(txt) + '</span>' + rep(' ', Math.max(0, cols - tw(txt)));
    var pre = document.createElement('pre');
    pre.className = 'optbox';
    pre._row = row; pre._box = OPTBOX;             // 留给 resize 时按新列宽重画
    pre.innerHTML = boxFrame([row], OPTBOX);
    dopts.appendChild(pre);
    optBoxes[i] = pre;
    pre.addEventListener('mouseenter', function(){ if (optsReady()) pre.classList.add('on'); });
    pre.addEventListener('mouseleave', function(){ pre.classList.remove('on'); });
    pre.addEventListener('click', function(){ if (optsReady()) choose(i); });
    requestAnimationFrame(function(){ pre.classList.add('in'); });     // 下一帧才展开，动画才生效
    // 容器长高了 → 抵掉这一跳，让它滑上去而不是蹦上去
    if (!optStep){
        var cs = window.getComputedStyle ? window.getComputedStyle(dopts) : null;
        var gap = cs ? (parseFloat(cs.rowGap) || parseFloat(cs.gap) || 15) : 15;
        optStep = pre.offsetHeight + gap;                    // 只实测一次，之后都用它
    }
    slideComp(optMounted === 0 ? pre.offsetHeight : optStep);
    optMounted++;
}

/* 字打完 → 主框上飘，选项框从框下沿逐条掉出来 */
function openOpts(){
    var av = availOpts(curNode);
    if (!av.length) return;
    /* 选项一多（第四问有 5 条）整叠会顶出屏幕 → 自动收紧缝隙；
       缝变了就得重新实测一次「每多一条长高多少」（optStep 是按旧缝算的）。 */
    var g = (av.length >= 5) ? OPT_GAP_TIGHT : OPT_GAP;
    if (g !== optGapUsed){ dopts.style.rowGap = g + 'px'; optGapUsed = g; optStep = 0; }
    dpre.classList.add('lift');
    optShown = 0; optBoxes = {};
    dopts.innerHTML = '';
    optMounted = 0;
    void dopts.offsetWidth;                                 // 只触发一次回流让入场动画生效（不再每帧读高度）
    dopts.classList.add('on');
    stepOpts();
}
function stepOpts(){
    var av = availOpts(curNode);
    if (optShown >= av.length) return;
    var o = av[optShown];
    mountOpt(o, o._idx);
    optShown++;
    optTimer = setTimeout(stepOpts, 95);
}
/* 收回选项框、主框挪回原位 */
function closeOpts(){
    if (optTimer) clearTimeout(optTimer);
    optShown = 0; optBoxes = {}; optLock = false;
    dopts.classList.remove('on');
    dpre.classList.remove('lift');
    setTimeout(function(){
        if (dopts.classList.contains('on')) return;         // 又开了新的一轮，别动
        if (!optMounted) return;
        var H = dopts.offsetHeight;                         // 清空前的高度 = 内容会往下掉多少
        dopts.innerHTML = '';
        optMounted = 0;
        slideComp(-H);                                      // 抵消"往下掉"，让它滑下去
    }, 540);
}

/* ---- 特殊演出：直接黑屏 → 正中一行字（中文在上、英文在下）→ 显示完直接切回来 ----
   给 NODES 里带 fx 的节点用（第四问选「AI」）：不打字、不走对白框，整屏抢过去。
   进出都是"切"：#black 没有 transition，加/去 .on 就是一帧的事；只有两行字是淡进来的。 */
var BLACK_IN = 260;                  // 黑下来之后，隔多久出第一行中文（ms）
var BLACK_EN = 800;                  // 每行中文出来之后，隔多久出它下面那句英文
var BLACK_LINE = 1800;               // 每两行中文之间隔多久（有几行就依次往后推）
var BLACK_HOLD = 2800;               // 最后一行英文出来后再停留多久 → 然后直接切回来
var BLACK_BACK = 900;                // 切回来之后，隔多久再把对白框摊开说后面那句
var blackOn = false, blackTimers = [], fxNext = null;

/* fx.cn 两种写法都吃：
   一行 → ['文字', {r:'红字'}]        多行 → [ ['第一句',{r:'…'}], ['第二句',…] ]
   （判断依据：第一个元素是不是数组） */
function fxLines(v){
    if (!v) return [];
    if (!v.length) return [];
    return (v.length && Array.isArray(v[0])) ? v : [v];
}
/* fx.en 是纯字符串：可以写一句，也可以写成数组，一行一条 */
function fxEnLines(v){
    if (!v) return [];
    if (typeof v === 'string') return [v];
    return v;
}

function fxHTML(segs){                       // {r:'…'} → 红字；{nm:1} → 名字；字符串 → 原文
    var h = '';
    (segs || []).forEach(function(s){
        if (typeof s === 'string') h += esc(s);
        else if (s && s.r != null){
            var t = String(s.r);
            for (var j = 0; j < t.length; j++) h += redHTML(t.charAt(j));   // 逐字包，好一起发光
        }
        else if (s && s.nm) h += nmHTML();
    });
    return h;
}
/* after：演出放完之后要接的那一句（就是 fx 节点上的 next）。没有就放完收工。 */
function showBlack(fx, after){
    blackTimers.forEach(clearTimeout); blackTimers = [];
    fxNext = after || null;
    var cns = fxLines(fx.cn), ens = fxEnLines(fx.en);
    blackCn.innerHTML = ''; blackEn.innerHTML = '';
    var i, cnEls = [], enEls = [];
    cns.forEach(function(seg){
        var d = document.createElement('div');
        d.className = 'bl'; d.innerHTML = fxHTML(seg);
        blackCn.appendChild(d); cnEls.push(d);
    });
    ens.forEach(function(t){
        var d = document.createElement('div');
        d.className = 'bl'; d.textContent = t;
        blackEn.appendChild(d); enEls.push(d);
    });
    blackOn = true;
    blackEl.classList.add('on');                       // 无过渡 → 直接黑
    for (i = 0; i < cnEls.length; i++){                // 一行一行依次亮：中文 → 它的英文
        var at = BLACK_IN + i * BLACK_LINE;
        blackTimers.push(setTimeout(addOn(cnEls[i]), at));
        if (enEls[i]) blackTimers.push(setTimeout(addOn(enEls[i]), at + BLACK_EN));
    }
    var last = BLACK_IN + Math.max(0, cnEls.length - 1) * BLACK_LINE + (enEls.length ? BLACK_EN : 0);
    blackTimers.push(setTimeout(blackEnd, last + BLACK_HOLD));
}
function addOn(el){ return function(){ el.classList.add('on'); }; }
function cutBack(){                                    // 直接切回来：不淡出，一帧结束
    blackTimers.forEach(clearTimeout); blackTimers = [];
    blackEl.classList.remove('on');
    blackCn.innerHTML = '';
    blackEn.innerHTML = '';
    blackOn = false;
    fxNext = null;                                     // 手动切的（调试 / Dlg.cut）→ 后面那句也不接
}
/* 演出**正常放完**才走这里：切回画面，若这个节点还有话要说，就把框重新摊开接着说 */
function blackEnd(){
    var nx = fxNext;
    cutBack();
    if (!nx){
        /* 黑屏就是这段演出的最后一环（后面没话了）→ 到这儿才算演完 */
        if (Gate.storyOf != null) Gate.storyEnd();
        return;
    }
    setTimeout(function(){ openAt(nx); }, BLACK_BACK);
}

/* 一句话说完之后：还有分支 → 弹选项；还有去处 → 走过去；都没有 → 本轮结束，合框。
   框会在屏幕上多停一会儿再合（HOLD_END / HOLD_END_SEEN，见文件上部"可调参数"处）。 */
function afterSay(){
    if (availOpts(curNode).length){ setTimeout(openOpts, 240); return; }
    /* 这两个标记跟"还有没有下一句"无关：这句话一说完，该出现的就得出场 */
    if (curNode && curNode.pet)  Pet.ensure();                 // 宠物
    if (curNode && curNode.gate) Gate.show(curNode.gate);      // 网页入口按钮
    if (pendingBack){
        var b = pendingBack; pendingBack = null;
        setTimeout(function(){ go(b); }, 1600);
        return;
    }
    if (curNode && curNode.next){                               // 还有下一句 → 接着说
        var nx = curNode.next;
        setTimeout(function(){ go(nx); }, GAP_NEXT);
        return;
    }
    setTimeout(endDlg, justTyped ? HOLD_END : HOLD_END_SEEN);   // 没有可走的路 → 停一会儿再合框
}

function typeNext(){
    if (typed >= tok.length){ typing = false; draw(); afterSay(); return; }
    var t = tok[typed]; typed++; draw();
    var d = (typeof t === 'string' && '，。、！？…'.indexOf(t) >= 0) ? 250 : 52;
    setTimeout(typeNext, d);
}

function go(id){
    var n = NODES[id];
    if (!n) return;
    closeOpts();
    optLock = false;
    curNode = n;
    /* retry:1 的节点 → 每次进来把选项都还回来（这批"剧情按钮"问的问题可以反复问，
       不像主线那样选过就消失） */
    if (n.retry) (n.opts || []).forEach(function(o){ o._used = false; });
    if (n.fx){                                           // 特殊演出：不走对白框，直接抢屏
        endDlg();                                        // 框收掉（在黑屏底下进行，看不见）
        n._seen = true; save.seen[n._id] = true; saveNow();
        showBlack(n.fx, n.next);                         // 放完接 next 那句（没有就收工）
        redLight(!!n.red);                               // 放在 endDlg 之后 —— endDlg 会把红光收掉
        return;
    }
    /* 这一句要不要整屏红光：亮在这一句开场、走到下一句时灭（见下面 go 的下一轮） */
    redLight(!!n.red);
    tok = toTokens(n.say || ['…']);
    /* 先按整句算一遍要占几行，框一开场就撑到那么大：
       否则打到一半折行，框会突然长高一截（bottom 定位 → 整块往上蹦），看着像字被吞了。 */
    curRows = Math.max(DROWS, layoutTokens(tok, contentCols(DBOX)).length);
    /* 每次进入都重新逐字打出来 —— 包括重玩、回看、或走分支绕回来再点。
       「看过」仍记进 save.seen，但那只是给刷新后 resumeId 续接用的，
       与「这一遍要不要重打字」无关：用户希望重看时再打一遍，而不是整句直接蹦出来。 */
    justTyped = true;                                        // 这遍是逐字打出来的（收尾停顿走 HOLD_END）
    n._seen = true; save.seen[n._id] = true; saveNow();      // 看过即存档（供刷新续接）
    typed = 0; typing = true; draw(); typeNext();
}

/* 选择分支：一个分支只能选一次；选完立刻存档，其余选项框淡出，被选中的闪一下 */
function choose(i){
    if (typing || !curNode || !curNode.opts) return;
    var o = curNode.opts[i];
    if (!o || o._used) return;                               // 选过的不再响应
    o._used = true;
    if (!(curNode && curNode.retry)){                    // retry:1 → 不写进存档，下次还能再选
        if (!save.used[curNode._id]) save.used[curNode._id] = [];
        save.used[curNode._id].push(i);
    }
    if (curNode.ans && o.val != null){                       // 这一问的答案 → save.ans.键，供后面调用
        save.ans[curNode.ans] = o.val;
    }
    saveNow();                                               // 存档（刷新后仍记得）
    optLock = true;                                          // 锁住，防连点
    Object.keys(optBoxes).forEach(function(k){
        var el = optBoxes[k];
        if (+k === i) el.classList.add('picked');
        else el.classList.add('fade');
    });
    var to = optTo(o);                                       // 条件分支在这一刻定下去哪句
    var tgt = NODES[to];
    pendingBack = (tgt && tgt.back) ? tgt.back : null;
    setTimeout(function(){ go(to); }, 430);                  // 亮一下再走
}

function optsReady(){
    if (!dlgOpen || optLock || !curNode) return false;
    var av = availOpts(curNode);
    return av.length > 0 && optShown >= av.length;
}

document.addEventListener('keydown', function(e){
    if (DEBUG && (e.key === 'r' || e.key === 'R')){ cutBack(); dlgReset(); return; }   // 清档并重开一轮
    if (DEBUG && (e.key === 'b' || e.key === 'B')){ if (!dlgOpen) openDlg(); return; }
    if (!optsReady()) return;
    var av = availOpts(curNode), n = parseInt(e.key, 10);
    if (!isNaN(n) && n >= 1 && n <= av.length) choose(av[n - 1]._idx);
});

function openDlg(){
    if (dlgOpen) return;
    var rid = resumeId();                                // 读档 → 该从哪一句接着走
    if (rid === null) return;                            // 全部走完（最后一站是特效且无后话）→ 不再开场
    dlgOpen = true;
    dlg.classList.add('on');
    document.body.classList.add('dlg-on');
    if (rid !== 'open'){                                 // 有进度：先说一句「就让我们继续吧。」再接上
        NODES.resume.next = rid;
        go('resume');
    } else {
        go('open');
    }
    requestAnimationFrame(function(){ dpre.classList.add('unfold'); });   // 展开动画
}
/* 把框直接摊开在某句话上（不走 resumeId）——给黑屏演出放完之后接话用 */
function openAt(id){
    if (dlgOpen || NODES[id] == null) return;
    if (Gate.storyOf === 'metaend' && window.BGMControl) window.BGMControl.switchTo('bgm/Time with you.mp3');  // 终局对话（含刷新续接）→ 专属 BGM
    dlgOpen = true;
    dlg.classList.add('on');
    document.body.classList.add('dlg-on');
    go(id);
    requestAnimationFrame(function(){ dpre.classList.add('unfold'); });
}

/* 本轮结束：框合起来（展开的反向），眼球落回画面中央 */
function endDlg(){
    if (!dlgOpen) return;
    if (curNode && curNode.clear){ try { hideDataBtn(); } catch (e) {} resetDlg(); }  // 数据清空：是→抹掉全部进度
    redLight(false);                                     // 收场时红光一定跟着灭（免得留在屏上）
    closeOpts();
    dpre.classList.remove('unfold');                         // 合拢成一条线
    setTimeout(function(){
        dlg.classList.remove('on');
        document.body.classList.remove('dlg-on');
        dlgOpen = false;
        /* 框合上了 = 这段演完了。要是这一段是剧情按钮点开的 → 把这枚按钮撤掉、写进存档。
           （黑屏演出期间不算完：那种节点走的是 blackEnd 那条出口。） */
        if (Gate.storyOf != null && !blackOn) Gate.storyEnd();
    }, 620);
}

/* 清空存档，让所有分支重新可选 */
function resetDlg(){
    try { localStorage.removeItem(SKEY); } catch (e) {}
    try { localStorage.removeItem(UNLOCK_KEY); } catch (e) {}   // 网页那边解锁的也一起清掉
    clearSubFlags();                       // 子页面的一次性标记 / 自动存档，跟着一起清
    save = { seen: {}, used: {}, ans: {}, storyDone: {} };   // storyDone 一起清 → 剧情按钮重新可用
    Pet.hide();                                       // 清档 = 宠物也一起撤走
    Gate.storyOf = null;                              // 演到一半清档 → 别再等着收尾
    Gate.stowAll(false);                              // 有被收起的网页按钮 → 一并放回（下一行 hide() 会把它们全撤掉）
    Gate._rows = null; Gate._lay = null;              // 布局缓存（不然清档后还按老行结构排）
    Gate.hide();                                      // 网页入口按钮同理
    Gate.setHidden(false);                            // 旁边那只小眼睛也变回睁着的
    PetCare._sig = ''; PetCare.render();              // 饲养进度（EXP/等级/技能）也一起归零
    PetCare.show = false; PetCare.hover = false;      // 面板收回去（下次摸一下才再出来）
    Object.keys(NODES).forEach(function(k){
        NODES[k]._seen = false;
        (NODES[k].opts || []).forEach(function(o){ o._used = false; });
    });
    dbgRender();
}
/* 清档 + 立刻重开一轮（调试时最常用） */
function dlgReset(){
    cutBack();
    resetDlg();
    if (dlgOpen){ endDlg(); setTimeout(openDlg, 760); }
    else openDlg();
}
window.Dlg = { go: go, open: openDlg, close: endDlg, reset: dlgReset,
               fx: showBlack, cut: cutBack };      // fx/cut：手动试黑屏那一段演出
Object.defineProperty(window.Dlg, 'save', { get: function(){ return save; } });
Object.defineProperty(window.Dlg, 'ans',  { get: function(){ return save.ans; } });   // 各个问题的答案

/* 窗口尺寸变了 → 字号可能跟着变（窄屏 media query）→ 重新量列宽，把已挂着的框重排一遍 */
window.addEventListener('resize', function(){
    BARW = {}; CW = {};                     // 字号可能变了（窄屏 media query）→ 重新量
    if (dlgOpen) draw();
    Object.keys(optBoxes).forEach(function(k){
        var p = optBoxes[k];
        if (p._row != null) p.innerHTML = boxFrame([p._row], p._box);
    });
});
PetCare.init();          // 存档变量 ready 之后才建面板（见上面的说明）
dbgRender();
console.info('[幂偌] 对白存档键：' + SKEY +
            '　·　清档：控制台 Dlg.reset()　或　地址栏加 ?reset　·　?debug 显示存档角标');

/* ==================================================================
   背景音乐：主页面加载即准备 bgm/Chaolis.mp3，受浏览器自动播放策略限制，
   在玩家第一次交互（点选 / 按键 / 触摸）后才真正出声；右上角按钮随时开关，
   关过的偏好记进 localStorage，刷新后保持。
   ------------------------------------------------------------------ */
(function(){
    var metaDone = (function(){ try { var s = JSON.parse(localStorage.getItem('mp_meta_save') || 'null'); return !!(s && s.done); } catch(e){ return false; } })();
    var DEFAULT_SRC = metaDone ? 'bgm/Time with you.mp3' : 'bgm/Chaolis.mp3';
    var BG = new Audio(DEFAULT_SRC);
    BG.loop = true; BG.volume = 0.55; BG.preload = 'auto';
    var btn = document.getElementById('musicbtn');
    var off = (function(){ try { return localStorage.getItem('mp_music_off') === '1'; } catch(e){ return false; } })();
    var on = !off;                 // 默认开（除非上次手动关过）
    function paint(){ if (!btn) return; btn.classList.toggle('off', !on); btn.textContent = on ? '♪ 音乐' : '✕ 静音'; }
    function play(){ var p = BG.play(); if (p && p.catch) p.catch(function(){}); }   // 自动播放被拦时静默失败
    /* 首次用户手势：若没被关，就出声；之后把监听器撤掉，不再自动触发 */
    function autoStart(){
        if (on){ play(); }
        document.removeEventListener('click', autoStart);
        document.removeEventListener('keydown', autoStart);
        document.removeEventListener('touchstart', autoStart);
    }
    document.addEventListener('click', autoStart);
    document.addEventListener('keydown', autoStart);
    document.addEventListener('touchstart', autoStart);
    if (btn) btn.addEventListener('click', function(e){
        e.stopPropagation();       // 按钮自己的点击不冒泡到 autoStart，避免双重逻辑
        on = !on;
        if (on) play(); else BG.pause();
        try { localStorage.setItem('mp_music_off', on ? '0' : '1'); } catch(err){}
        paint();
    });
    paint();
    /* 剧情专属 BGM 切换：把全局背景乐换到指定曲目 / 切回默认。
       switchTo 会跳过"已经在播同一首"的情况，避免重复 pause/play 造成杂音；
       保持 loop / volume / 开关状态（on 决定是否切过去后出声）。 */
    var curSrc = DEFAULT_SRC;
    var curId = metaDone ? 'timewithyou' : 'chaolis';
    function curMusicId(){ for (var i=0;i<MUSICS.length;i++){ if (MUSICS[i].src === curSrc) return MUSICS[i].id; } return null; }
    function switchTo(src){
        if (!src || src === curSrc) return;
        try { BG.pause(); } catch(e){}
        curSrc = src;
        BG.src = src;
        if (on){ play(); }
        curId = curMusicId();
        renderMusicBox();
    }
    function restore(){ switchTo(DEFAULT_SRC); }
    /* 终局演完调用：把「默认 BGM」改成指定曲（之后玩家手动切换才会变）。
       若当前已在播该曲则只更新默认、不重复 pause/play，避免杂音。 */
    function setDefault(src){ if (!src) return; DEFAULT_SRC = src; if (curSrc !== DEFAULT_SRC) switchTo(DEFAULT_SRC); }
    /* ---- 音乐盒：已解锁曲目随时回听（Chaolis 恒解锁，终局曲 metaend 演完后解锁） ---- */
    var MUSICS = [
        { id:'chaolis',     name:'喀丽丝',  src:'bgm/Chaolis.mp3',       def:true },
        { id:'timewithyou', name:'与你同在', src:'bgm/Time with you.mp3', def:false }
    ];
    var UNLOCK_KEY_M = 'mp_music_unlocked';
    var unlockedM = (function(){ try { var a = JSON.parse(localStorage.getItem(UNLOCK_KEY_M) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } })();
    function musicUnlocked(id){ var m = MUSICS.filter(function(x){ return x.id===id; })[0]; return m && (m.def || unlockedM.indexOf(id) >= 0); }
    function unlockMusic(id){
        var m = MUSICS.filter(function(x){ return x.id===id; })[0];
        if (!m || m.def) return;
        if (unlockedM.indexOf(id) < 0){ unlockedM.push(id); try{ localStorage.setItem(UNLOCK_KEY_M, JSON.stringify(unlockedM)); }catch(e){} }
        renderMusicBox();
    }
    function renderMusicBox(){
        var list = document.getElementById('mb-list'); if (!list) return;
        var cur = curMusicId();
        list.innerHTML = '';
        MUSICS.forEach(function(m){
            var row = document.createElement('div');
            row.className = 'mb-item' + (m.id===cur ? ' cur' : '') + (musicUnlocked(m.id) ? '' : ' locked');
            var left = document.createElement('span'); left.textContent = m.name;
            var tag = document.createElement('span'); tag.className = 'mb-tag';
            tag.textContent = (m.id===cur) ? '播放中' : (musicUnlocked(m.id) ? '点击播放' : '未解锁');
            row.appendChild(left); row.appendChild(tag);
            if (musicUnlocked(m.id)){ row.addEventListener('click', function(){ switchTo(m.src); renderMusicBox(); }); }
            list.appendChild(row);
        });
    }
    var mbBtn = document.getElementById('musicboxbtn');
    var mbPanel = document.getElementById('musicbox');
    if (mbBtn && mbPanel){
        mbBtn.addEventListener('click', function(e){ e.stopPropagation(); mbPanel.classList.toggle('on'); if (mbPanel.classList.contains('on')) renderMusicBox(); });
        document.addEventListener('click', function(e){
            if (mbPanel.classList.contains('on') && !mbPanel.contains(e.target) && e.target !== mbBtn) mbPanel.classList.remove('on');
        });
    }
    renderMusicBox();
    window.BGMControl = { switchTo: switchTo, restore: restore, setDefault: setDefault, unlock: unlockMusic };
})();

/* ==================================================================
   数据清空按钮（#databtn）：读完青禾残稿、演完小说网那段剧情之后由 Gate.storyEnd 唤起；
   点一下 → 大眼问是否清空（NODES.st_novel_clear），是→清空全部数据，否→保留。
   ------------------------------------------------------------------ */
function showDataBtn(){ var b = document.getElementById('databtn'); if (b) b.classList.add('on'); }
function hideDataBtn(){ var b = document.getElementById('databtn'); if (b) b.classList.remove('on'); }
/* 数据清空问答可反复点：每次打开都当第一次——清掉这条链上节点的「看过」标记、
   选项「用过」标记，以及存档里对应的 seen/used。否则第二次进入会吞掉上次选过的那个
   选项（availOpts 过滤 _used），且跳过逐字打字、直接把选项甩出来。 */
function resetNovelClear(){
    var chain = ['st_novel_clear', 'st_novel_clear2', 'st_novel_yes', 'st_novel_no'];
    chain.forEach(function(id){
        var n = NODES[id];
        if (!n) return;
        n._seen = false;
        (n.opts || []).forEach(function(o){ o._used = false; });
    });
    if (save.seen) chain.forEach(function(id){ delete save.seen[id]; });
    if (save.used) delete save.used['st_novel_clear2'];
    try { saveNow(); } catch(e){}
}
(function(){
    var btn = document.getElementById('databtn');
    if (btn) btn.addEventListener('click', function(e){
        e.stopPropagation();                                   // 别让它又触发音乐启动之类的全局逻辑
        if (typeof dlgOpen !== 'undefined' && dlgOpen) return;  // 正演着别打断
        if (typeof openAt === 'function'){ resetNovelClear(); openAt('st_novel_clear'); }
    });
    /* 刷新后若已演过那段，按钮直接补回来 */
    try { if (save && save.storyDone && save.storyDone.novel) showDataBtn(); } catch (e){}
})();
</script>
