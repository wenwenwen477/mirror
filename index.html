<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幂偌 0.1</title>
<style>
:root{ --bg:#0a0c10; --eye:#c8d0c2; }
*{box-sizing:border-box}
html,body{height:100%}
body{ margin:0; background:var(--bg); overflow:hidden; cursor:crosshair; }   /* 全屏恒定十字光标（cursor 会继承） */
/* 扫描线 + 暗角（氛围，非界面） */
body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    /* 不用 mix-blend-mode：整屏混合会让每一帧都重新合成一次，很吃性能，直接叠半透明效果一样 */
    background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px),
        radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%);
}
#stage{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    will-change:transform;      /* 对白出现时整个舞台要上移，先提成合成层，别每帧重画 1100 个字 */
}
#eye{
    margin:0; position:relative; z-index:1;   /* 眼珠压在文字球之上 */
    /* 全宽汉字才能对齐成网格，故用 CJK 字体；空格亦用全角空格 */
    font:13px/1 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:var(--eye); white-space:pre; user-select:none;
    cursor:crosshair; opacity:0; transition:opacity .45s ease;
    text-shadow:0 0 4px rgba(200,208,194,.16);
    contain:layout style;       /* 3120 个字的重排关在自己盒子里，不外溢到整页 */
}
#eye.show{ opacity:1; }
/* 文字漩涡环：包围眼珠，乱转·翻滚·远近透明 */
#ring{
    position:absolute; inset:0; pointer-events:none; z-index:0;   /* 垫在眼珠之下 */
    opacity:0; transition:opacity 2.8s ease;
    font:13px/1 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:var(--eye);
    contain:layout style;
}
#ring.on{ opacity:1; }
#ring span{
    position:absolute; left:0; top:0;
    /* 这行别删：1100 个字每帧都在改 transform/opacity，不提升成合成层就会每帧重绘 1100 次文字 */
    will-change:transform,opacity;
    text-shadow:0 0 4px rgba(200,208,194,.12);
}
/* ---- 宠物：一团纯文字/符号，落在眼球上爬行；能被鼠标拖起来，松手自己掉回眼球 ---- */
#pet{
    position:absolute; left:0; top:0; z-index:3;     /* 压在眼珠(1)与球面字流(0)之上 */
    margin:0; pointer-events:auto; cursor:grab; user-select:none;
    font:17px/1.06 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:#dfe6d8; white-space:pre; text-align:center;
    text-shadow:0 0 6px rgba(200,208,194,.45), 0 0 14px rgba(200,208,194,.18);
    will-change:transform,opacity; contain:layout style;
    opacity:0;   /* 注意：每帧由 JS 直接写 inline opacity（球面透视 + 出场淡入），这里不要加 transition */
}
#pet.on{ opacity:1; }
#pet.drag{ cursor:grabbing; }
#pet:hover{ text-shadow:0 0 9px rgba(200,208,194,.75), 0 0 22px rgba(200,208,194,.3); }
#pet .pr{ display:block; }    /* 一行一段、各自居中：字体不是严格等宽时也不会散架 */
/* ---- 饲养面板：等级顶在宠物头上，EXP 小窗开在它旁边 ----
   注意这里用 CSS 边框、不用字符凑框：面板里要写数字（EXP 12 / 1000），
   而本机字体不是严格双宽（实测：汉字 12px、全角＋－｜ 12px、数字却只有 7.04px，
   并不等于汉字的一半），用字符凑框的话每行右侧的 ｜ 会参差不齐。
   （对白框那套 boxFrame 是靠"逐行量像素"才对齐的，这里犯不上。） */
#pet-lv, #pet-box{
    position:absolute; left:0; top:0; z-index:3;      /* 与宠物同层 */
    margin:0; pointer-events:none; user-select:none; white-space:pre;
    font:12px/1.55 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:#dfe6d8; text-shadow:0 0 6px rgba(200,208,194,.4);
    will-change:transform,opacity; contain:layout style;
    opacity:0;      /* 每帧由 JS 写 inline opacity（跟着宠物在球面上的远近一起淡） */
}
#pet-lv{
    text-align:center; letter-spacing:1px; color:#f2ddd0;
    text-shadow:0 0 7px rgba(242,221,208,.5), 0 0 16px rgba(242,200,180,.18);
}
#pet-lv.up{ animation:petlvup 1.15s ease; }           /* 升级时亮一下 */
@keyframes petlvup{
    0%  { color:#fff0e0; text-shadow:0 0 15px rgba(255,226,190,.95), 0 0 34px rgba(255,205,160,.5); }
    100%{ color:#f2ddd0; text-shadow:0 0 7px rgba(242,221,208,.5), 0 0 16px rgba(242,200,180,.18); }
}
#pet-box{
    padding:7px 12px 8px;
    pointer-events:auto;      /* 只有小窗能接住鼠标：指针停在窗里 / 在窗里点一下 = "还在操作"，面板就不会自动收 */
    cursor:default;
    border:1px solid rgba(200,208,194,.24);
    /* 柔和的暗底：球面字流从窗口底下经过时别把字搅花（跟入口按钮同一个做法） */
    background:radial-gradient(130% 130% at 50% 50%, rgba(8,10,13,.9), rgba(8,10,13,.64));
    box-shadow:0 0 20px rgba(0,0,0,.45);
}
#pet-box .t{ color:#9fb0a4; letter-spacing:2px; }
#pet-box .z{ color:#a9c0cf; }                              /* 睡着时小窗里那句提示（跟头顶的 Z 同色） */
/* 技能行：EXP 够的时候可以点，点了就升一级 */
#pet-box .sk-row{ padding:2px 0 3px; cursor:pointer; }
#pet-box .sk-row .n{ color:#dfe6d8; }
#pet-box .sk-row .c{ color:#8fa093; }
#pet-box .sk-row.ok .c{ color:#c6d8bf; }                       /* 买得起：亮一点 */
#pet-box .sk-row.ok:hover .n{ color:#fff2dc; text-shadow:0 0 9px rgba(255,235,200,.6); }
#pet-box .sk-row.done{ cursor:default; }
#pet-box .sk-row.done .n, #pet-box .sk-row.done .c{ color:#9fb0a4; }
#pet-box .sk-row.buy{ animation:skbuy .9s ease; }              /* 刚买下：暖白一闪 */
@keyframes skbuy{
    0%  { color:#fff3dd; text-shadow:0 0 14px rgba(255,226,175,.9); }
    100%{ color:#dfe6d8; text-shadow:0 0 6px rgba(200,208,194,.4); }
}
#pet-box .sk-row.no{ animation:skno .34s ease; }               /* EXP 不够：左右抖一下 */
@keyframes skno{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-3px); } 75%{ transform:translateX(3px); } }
#pet-box .bar{                                        /* EXP 进度条 */
    display:block; width:154px; height:5px; margin:4px 0 4px;
    border:1px solid rgba(200,208,194,.2); background:rgba(200,208,194,.07);
}
#pet-box .bar i{ display:block; height:100%; background:rgba(214,224,206,.72); }
/* 摸一下就冒出来的爱心：位置写在 left/top，飘的过程交给 Web Animations */
.hrt{
    position:absolute; left:0; top:0; z-index:3; pointer-events:none; user-select:none;
    font:15px/1 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:#f2bcc6; text-shadow:0 0 8px rgba(242,188,198,.75), 0 0 18px rgba(240,150,170,.35);
    will-change:transform,opacity;
}
/* 后空翻落地时炸开的星星（同层、不接鼠标，飘完自己删掉） */
.str{
    position:absolute; left:0; top:0; z-index:3; pointer-events:none; user-select:none;
    font:13px/1 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:#f4e6c4; text-shadow:0 0 8px rgba(255,232,180,.8), 0 0 18px rgba(255,206,140,.35);
    will-change:transform,opacity;
}
/* 睡着时头顶冒的 Z：慢慢往上飘、飘得歪歪扭扭，字号逐个不同（像 ZZZ 那样一大一小） */
.zzz{
    position:absolute; left:0; top:0; z-index:3; pointer-events:none; user-select:none;
    font:14px/1 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:#e2eef8; text-shadow:0 0 8px rgba(200,224,244,.85), 0 0 20px rgba(150,195,230,.42);
    will-change:transform,opacity;
}
/* ---- 网页入口：用符号围成的一枚按钮，从涡流里飞进来；点一下就打开那张网页 ----
   可能同时有好几枚（每解锁一个入口多一枚），所以外层 #gates 只是个铺满舞台的容器，
   真正的按钮是里面的 .gate；上下错开排，免得叠在一起。 */
#gates{
    /* 压在宠物(3)、眼珠(1)、球面字流(0)之上；但**在对白框(20)之下** ——
       入口飘出来时正说着话，就该被对白框遮着，等话说完才看得见。 */
    position:absolute; inset:0; z-index:4;
    pointer-events:none; user-select:none;
}
.gate{
    position:absolute; left:0; top:0;
    margin:0; pointer-events:none; user-select:none;
    /* 行高压到 1.06：相邻两行的 ｜ 才能接成一条完整的竖线（行距一大，竖线就断成一截一截的） */
    font:16px/1.06 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:var(--eye); white-space:pre; text-align:center;   /* 一行一段各自居中：字体不严格等宽也不散架 */
    /* 与对话框 #dlg 同款：眼珠色文字 + 纯黑底 + 一层微光（有了黑底就不需要大扩散了） */
    text-shadow:0 0 6px rgba(200,208,194,.15);
    padding:10px 20px;
    /* 黑底：与总开关（.gate-sw）同款——柔和径向渐变，边缘化开，不像纯黑方块那样像贴了张硬纸。 */
    background:radial-gradient(ellipse at center, rgba(6,8,6,.9) 55%, rgba(6,8,6,.7) 100%);
    will-change:transform,opacity;
    opacity:0;
    /* 透明度**只在状态切换时由 step() 写一次**（放出来 / 藏起来 / 第一次淡入），
       每次都配这条 .35s 过渡 → 出场是"化"出来的，不是"飞"进来的。
       （早先 step() 每帧写 opacity 来做飞入的渐显，这条过渡被反复打断，
         位置又在飞行动画里乱改 —— 两个问题叠在一起，就是"点一下它就往上跑"。） */
    transition: opacity .35s ease, color .3s ease, text-shadow .3s ease;
}
.gate.on{ pointer-events:auto; cursor:pointer; }
/* 悬浮：整枚提亮 + 微光；子元素（框线 .gf / 入口名 .glb）各自再提一档——
   否则它们身上的 color/text-shadow 会把根 .gate 的变亮盖过去，悬浮就“没反应”了。
   （藏起来的按钮在 step() 里会摘掉 .on，所以 :hover 自动失效，不会误亮。） */
.gate.on:hover{
    color:#f4faf5;
    text-shadow:0 0 9px rgba(200,208,194,.5);
}
.gate.on:hover .glb{ color:#ffffff; text-shadow:0 0 9px rgba(200,208,194,.5); }
.gate.on:hover .gf{  color:var(--eye); text-shadow:0 0 9px rgba(200,208,194,.45); }
.gate .gl{ display:block; }
.gate .gf{ color:#98a189; text-shadow:0 0 6px rgba(152,161,137,.22); }   /* 框线：与对话框 .fr 同色（眼珠色暗调） */
.gate .glb{ color:#e6efe7; text-shadow:0 0 8px rgba(200,208,194,.4); }   /* 入口名：比框线亮一档 */
/* 同一枚入口配的那枚「剧情」按钮 = 副按钮：
   **摆在它自己那枚网页按钮的正下方**（同一条中心线上，见 Gate.layout），
   比网页按钮小一号、字暗一档 —— 一眼看得出这两个是绑在一起的一套：上面跳转、下面说话。
   ★ 放下方而不是右边，是为了"间隔问题不存在"：
     网页按钮那一格永远只有它自己的宽度，副按钮的出现与消失**完全不影响**网页按钮的落点。
     放右边时撤一枚副按钮 → 那一格窄 136px → 行内累加把右边所有按钮各带左移 136px，
     行宽一变连分行都要重跑（实测把某枚横移 984px）。 */
.gate.gate-story{
    font-size:11px; padding:5px 9px;
    background:radial-gradient(ellipse at center, rgba(6,8,6,.9) 55%, rgba(6,8,6,.7) 100%);
}
.gate.gate-story .glb{ color:#cfe0d6; text-shadow:0 0 7px rgba(200,208,194,.4); }
.gate.gate-story .gf{ color:#8f9c92; text-shadow:0 0 5px rgba(152,161,137,.22); }
/* ---- 总开关：网页 / 剧情按钮旁边那枚小眼睛 ----
   睁着的眼睛 → 整套按钮都在画面上；点一下换成**画了一道斜线的眼睛** → 整套藏起来
   （做剧情的时候用它清场）。它是工具，不是剧情里的一环：小一号、暗一号。
   注意：这几条要写在 .gate.on 之后 —— 同权重，靠"后来者居上"把指针事件拿回来。 */
.gate.gate-sw{
    font-size:13px; line-height:1.04; padding:6px 8px;
    color:#8ea093; cursor:pointer; pointer-events:auto; opacity:0;
    background:radial-gradient(ellipse at center, rgba(6,8,6,.9) 55%, rgba(6,8,6,.7) 100%);
    transition:opacity .9s ease, color .3s ease;
    /* ★ z-index 抬到入口按钮之上。它和入口按钮同在 #gates 里、默认都是 auto，
       谁在 DOM 里靠后就命中谁 —— 小眼睛是先创建的，于是被后放出来的入口按钮
       盖住（实测点它的中心，elementFromPoint 命中的是入口按钮的 .gf）。 */
    z-index:1;
}
.gate.gate-sw.on{ opacity:.62; }              /* 平时压暗一点，别跟入口抢戏 */
.gate.gate-sw:hover{ opacity:1; color:#e2ede4; }
.gate.gate-sw.xed{ color:#6f7a73; }           /* 斜线眼（藏起来了）：再暗一档 */
/* ---- 背景音乐开关：固定右上角，与总开关（.gate-sw）同款观感 ---- */
#musicbtn{
    position:fixed; top:14px; right:16px; z-index:40;
    font:13px/1.04 "Sarasa Mono SC","Sara Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    letter-spacing:2px; padding:6px 9px;
    color:#8ea093; cursor:pointer; pointer-events:auto; user-select:none;
    background:radial-gradient(ellipse at center, rgba(6,8,6,.9) 55%, rgba(6,8,6,.7) 100%);
    border:1px solid rgba(143,156,146,.35); border-radius:2px;
    text-shadow:0 0 6px rgba(152,161,137,.3);
    transition:color .3s ease, opacity .3s ease;
}
#musicbtn:hover{ color:#e2ede4; }
#musicbtn.off{ color:#6f7a73; }
@media (max-width:760px){ #musicbtn{ font-size:11px; padding:5px 6px; } }
/* ---- 音乐盒按钮 + 面板：固定右上角，与音乐开关同款观感 ---- */
#musicboxbtn{
    position:fixed; top:14px; right:104px; z-index:40;
    font:13px/1.04 "Sarasa Mono SC","Sara Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    letter-spacing:2px; padding:6px 9px;
    color:#8ea093; cursor:pointer; pointer-events:auto; user-select:none;
    background:radial-gradient(ellipse at center, rgba(6,8,6,.9) 55%, rgba(6,8,6,.7) 100%);
    border:1px solid rgba(143,156,146,.35); border-radius:2px;
    text-shadow:0 0 6px rgba(152,161,137,.3);
    transition:color .3s ease, opacity .3s ease;
}
#musicboxbtn:hover{ color:#e2ede4; }
@media (max-width:760px){ #musicboxbtn{ font-size:11px; padding:5px 6px; right:84px; } }
#musicbox{
    position:fixed; top:48px; right:16px; z-index:41; min-width:200px; padding:8px 9px;
    background:radial-gradient(ellipse at top, rgba(8,10,8,.97), rgba(6,8,6,.95));
    border:1px solid rgba(143,156,146,.4); border-radius:3px;
    box-shadow:0 0 18px rgba(0,0,0,.6);
    font:12px/1.5 "Sarasa Mono SC","Sara Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:#cdd6cb; display:none;
}
#musicbox.on{ display:block; }
#musicbox .mb-title{ color:#8ea093; letter-spacing:3px; margin-bottom:7px; border-bottom:1px solid rgba(143,156,146,.25); padding-bottom:5px; }
#musicbox .mb-item{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:5px 6px; border-radius:2px; cursor:pointer; color:#cdd6cb; }
#musicbox .mb-item:hover{ background:rgba(143,156,146,.12); color:#e2ede4; }
#musicbox .mb-item.cur{ color:#e7f0e4; background:rgba(143,156,146,.2); }
#musicbox .mb-item.locked{ color:#6f7a73; cursor:not-allowed; }
#musicbox .mb-item .mb-tag{ font-size:10px; color:#8ea093; letter-spacing:1px; white-space:nowrap; }
#musicbox .mb-item.cur .mb-tag{ color:#9fe0a0; }
#musicbox .mb-hint{ margin-top:7px; font-size:10px; color:#6f7a73; letter-spacing:1px; }
/* ---- 数据清空按钮：固定右下角，与音乐开关同款观感；读完青禾残稿后才浮出 ---- */
#databtn{
    position:fixed; bottom:14px; right:16px; z-index:40;
    font:13px/1.04 "Sarasa Mono SC","Sara Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    letter-spacing:2px; padding:6px 9px;
    color:#8ea093; cursor:pointer; pointer-events:none; user-select:none; opacity:0;
    background:radial-gradient(ellipse at center, rgba(6,8,6,.9) 55%, rgba(6,8,6,.7) 100%);
    border:1px solid rgba(143,156,146,.35); border-radius:2px;
    text-shadow:0 0 6px rgba(152,161,137,.3);
    transition:color .3s ease, opacity .5s ease;
}
#databtn:hover{ color:#e2ede4; }
#databtn.on{ opacity:1; pointer-events:auto; }
@media (max-width:760px){ #databtn{ font-size:11px; padding:5px 6px; } }
/* ---- 窄屏：按钮整体缩小一档 ----
   一枚网页按钮在 16px 字号下约 232px 宽，8 枚入口一行放不下 → 每行一枚 →
   8 行 × (105+5+70+14) ≈ 1550px，比画面高得多，实测 400px 视口下顶部那几枚直接出画。
   跟 #dlg / #black 用的是同一套思路（窄屏降一档字号），这里补上 .gate 缺席的那一份。
   降到 13px 后单枚约 190px，400px 能放两枚、行数减半 → 塞得进画面。 */
@media (max-width:760px){
    .gate{ font-size:13px; padding:7px 13px; }
    .gate.gate-story{ font-size:10px; padding:4px 7px; }
    .gate.gate-sw{ font-size:11px; padding:5px 6px; }
}
/* ---- 解锁提示：网页里解开了新东西时，画面上方冒一句 ---- */
#tip{
    position:fixed; left:50%; top:13vh; transform:translate(-50%,-10px);
    z-index:30; opacity:0; pointer-events:none;
    font:17px/1.9 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:#dfece2; letter-spacing:3px; text-align:center; white-space:pre-line;
    text-shadow:0 0 9px rgba(210,232,220,.85), 0 0 26px rgba(150,205,180,.4), 0 0 60px rgba(90,170,140,.22);
    transition:opacity .9s ease, transform .9s ease;
}
#tip.on{ opacity:1; transform:translate(-50%,0); }
/* ---- 对白框：只有 - | + 围出的一圈框线，内部不填黑（古早文字游戏感） ---- */
#dlg{
    position:fixed; left:50%; bottom:6vh; transform:translateX(-50%);
    z-index:20; display:flex; flex-direction:column; align-items:center;
    opacity:0; pointer-events:none; transition:opacity .8s ease;
    contain:layout style;
}
#dlg.on{ opacity:1; pointer-events:auto; }
#dlg pre{
    margin:0; background:#000; color:var(--eye); white-space:pre;   /* 与眼珠同一种颜色 */
    font:19px/1.62 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    text-shadow:0 0 6px rgba(200,208,194,.15);                      /* 有黑底了，只留一层微光 */
}
/* 主框：出场由中间向上下展开 */
#dlg-pre{
    clip-path:inset(50% 0 50% 0); opacity:.4;
    transition:clip-path .6s cubic-bezier(.22,.61,.36,1), opacity .5s ease,
               transform .55s cubic-bezier(.22,.61,.36,1);
}
#dlg-pre.unfold{ clip-path:inset(0 0 0 0); opacity:1; }
#dlg-pre.lift{ transform:translateY(-11px); }        /* 字打完 → 整框往上飘 */
/* 选项：每个分支一个**独立的小框**（不是共用一个框），逐条往下弹出。
   注意：这里绝不碰 height / margin-top —— 那两个属性每帧都要重排，在这个页面上会明显卡顿。
   容器只做 opacity + transform（走合成层），"往下弹出"由每个小框自己的 transform 完成。 */
#dlg-opts{
    /* gap 由 JS 的 OPT_GAP 设定（每个选项都是独立的小框，彼此留出缝隙、不连成一片） */
    display:flex; flex-direction:column; align-items:center; gap:26px;
    margin-top:14px; opacity:0; transform:translateY(-10px);
    transition:opacity .32s ease, transform .45s cubic-bezier(.22,.61,.36,1);
}
/* 关键：容器自己也是个 <pre>，会继承上面那条黑底规则——
   不把它设成透明的话，选项之间的缝隙会被容器的黑底填满，看起来就成了一整块。 */
#dlg #dlg-opts{ background:transparent; padding:0; }
#dlg-opts.on{ opacity:1; transform:translateY(0); }
/* 单个选项框：自上而下展开（in）／悬停整框变亮（on）／被选中闪一下（picked）／其余淡出（fade） */
#dlg-opts .optbox{
    clip-path:inset(0 0 100% 0); opacity:0; transform:translateY(-10px);
    transition:clip-path .42s cubic-bezier(.22,.61,.36,1), opacity .3s ease,
               transform .38s cubic-bezier(.22,.61,.36,1);
}
#dlg-opts .optbox.in{ clip-path:inset(0 0 0 0); opacity:1; transform:translateY(0); }
#dlg-opts .optbox.on .fr, #dlg-opts .optbox.on .op{
    color:var(--eye); text-shadow:0 0 9px rgba(200,208,194,.5);
}
#dlg-opts .optbox.picked{ animation:pickflash .4s ease; }
@keyframes pickflash{ 0%{filter:brightness(1)} 30%{filter:brightness(2.2)} 100%{filter:brightness(1)} }
#dlg-opts .optbox.fade{ opacity:.16; }
/* 每一行都是一块定宽的容器；左右两根 | **绝对定位钉在容器的左右边缘**。
   它们是「框的边」，不是「正文后面又打了几个空格」——正文再长、某个字实际占几格，
   右竖线都不会跟着挪。正文区左右各留一列，不贴着框线。 */
#dlg .rw{ display:block; position:relative; white-space:pre; }
#dlg .bd{ display:block; overflow:hidden; }            /* 超出的部分裁掉，不外溢压到框线上 */
#dlg .bl, #dlg .br{ position:absolute; top:0; }
#dlg .bl{ left:0; }
#dlg .br{ right:0; }
/* 量列宽用的探针：量完即删，不占位 */
#dlg pre.probe{ position:absolute; left:0; top:0; visibility:hidden; pointer-events:none; }
/* 框线：与眼珠同色系的暗调（不是蓝灰），压得住但不抢正文 */
#dlg .fr{ color:#98a189; text-shadow:0 0 6px rgba(152,161,137,.22); }
#dlg .op{ color:#8e9a92; }                /* 选项常态：眼珠色的暗调 */
#dlg .op.on{ color:var(--eye); text-shadow:0 0 9px rgba(200,208,194,.5); }   /* 悬停/选中 */
#dlg .op.used{ color:#5f6a63; }           /* 已问过 */
/* 古早文字游戏：句末闪烁光标 */
#dlg .cur{ animation:curblink 1.05s steps(1) infinite; }
@keyframes curblink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
/* 窄屏收缩，避免框溢出画面 */
@media (max-width:1000px){ #dlg pre{ font-size:16px; } }
@media (max-width:760px){ #dlg pre{ font-size:13px; } }
/* 红色发光文字：对白里的名字/强调字、黑屏字幕里的关键字，都是 .nm
   （注意：这里不能写成 #dlg .nm —— 那样黑屏里的红字就套不上样式，只剩普通文字色） */
.nm{
    color:#ff3a3a; font-weight:normal;
    text-shadow:0 0 6px rgba(255,40,40,.95), 0 0 16px rgba(255,20,20,.6), 0 0 30px rgba(255,0,0,.35);
    animation:nmglow 2.1s ease-in-out infinite;
}
/* 黑屏上的红字：底是全黑，光晕可以再放开一点
   （必须连 animation 一起换 —— 动画里的 text-shadow 优先级高于普通声明，只改上面那条是不生效的） */
#black-cn .nm{ animation:nmglow2 2.1s ease-in-out infinite; }
@keyframes nmglow2{
    0%,100%{ text-shadow:0 0 7px rgba(255,45,45,.9),  0 0 18px rgba(255,25,25,.6),  0 0 34px rgba(255,10,10,.35); }
    50%    { text-shadow:0 0 13px rgba(255,70,70,1),  0 0 30px rgba(255,30,30,.9),  0 0 58px rgba(255,10,10,.55); }
}
@keyframes nmglow{
    0%,100%{ text-shadow:0 0 5px rgba(255,40,40,.8), 0 0 13px rgba(255,25,25,.45), 0 0 24px rgba(255,0,0,.25); }
    50%    { text-shadow:0 0 10px rgba(255,70,70,1), 0 0 24px rgba(255,30,30,.8), 0 0 44px rgba(255,10,10,.5); }
}
/* 对白出现时眼球稍稍上抬，给框让位 */
#stage{ transition:transform 1.2s ease; }
body.dlg-on #stage{ transform:translateY(-7vh); }
/* 调试角标（只有 ?debug / ?reset 时才出现） */
#dbg{
    position:fixed; right:10px; bottom:8px; z-index:60; display:none;
    font:11px/1.6 "Sarasa Mono SC","Sarasa Term SC","Microsoft YaHei",monospace;
    color:#6f7a73; letter-spacing:.4px; pointer-events:none;
    text-shadow:0 0 4px rgba(111,122,115,.25);
}
#dbg.on{ display:block; }

/* ---- 特殊回答：直接黑屏，屏幕正中一行字（中文在上、英文在下），显示完直接切回来 ----
   抢屏用：z-index 40 → 压在对话框(20)之上、调试角标(60)之下。
   进出都不做淡入淡出（没有 transition）→ 是"切"，不是"化"。 */
#black{
    position:fixed; inset:0; z-index:40; display:none; background:#000;
    flex-direction:column; align-items:center; justify-content:center; gap:26px;
    pointer-events:none;
}
#black.on{ display:flex; }
/* 逐行淡入：中文区在上、英文区在下，各自按行依次亮起来 */
#black-cn, #black-en{ display:flex; flex-direction:column; align-items:center; }
#black-cn{ gap:16px; }
#black-en{ gap:12px; }
#black .bl{ opacity:0; }
#black .bl.on{ opacity:1; }
#black-cn{
    font:25px/1.95 "Sarasa Mono SC","Sarasa Term SC","Noto Sans Mono CJK SC","Microsoft YaHei","PingFang SC",monospace;
    color:var(--eye); letter-spacing:1px; text-align:center; padding:0 6vw;
    text-shadow:0 0 8px rgba(200,208,194,.22);
}
#black-cn .bl{ transition:opacity .55s ease; }
#black-en{
    font:15px/1.95 "Georgia","Times New Roman",serif;
    color:#7c847a; letter-spacing:1.6px; text-align:center; padding:0 8vw;
    text-shadow:0 0 6px rgba(124,132,122,.18);
}
#black-en .bl{ transition:opacity .85s ease; }
@media (max-width:1000px){ #black-cn{ font-size:20px; } #black-en{ font-size:13px; } }
@media (max-width:760px){  #black-cn{ font-size:17px; } #black-en{ font-size:11px; } }

/* ---- 整屏红光：第一问答「不成年」后那一句「重申：……」用 ----
   盖在最上层（z-index 40，压过对白框 20、压不到调试角标 60），不接鼠标。
   用 mix-blend-mode:screen 而不是直接铺一层半透明红：screen 是"打光"，
   黑底会被染成暗红、亮字会被提亮泛红 —— 看上去是红光打在整个画面上，
   而不是蒙了一层红塑料膜，对白框里的字照样读得清。 */
#redlight{
    position:fixed; inset:0; z-index:40; pointer-events:none;
    opacity:0; mix-blend-mode:screen;
    background:radial-gradient(125% 125% at 50% 45%, rgba(255,86,58,.62), rgba(178,16,12,.9) 62%, rgba(120,8,6,.95));
    transition:opacity .9s ease;                      /* 灭：慢慢褪 */
}
#redlight.on{ opacity:1; transition:opacity .42s ease; }   /* 亮：快一点，像灯突然打下来 */
</style>
</head>
<body>

<div id="stage">
    <div id="ring" aria-hidden="true"></div>
    <pre id="eye" title="我偶尔会看您一眼"></pre>
    <div id="pet" aria-hidden="true"></div>
    <div id="gates" aria-hidden="true"></div>     <!-- 网页入口按钮，一个入口一枚，由 JS 往里填 -->
</div>

<!-- 解锁提示：网页那边解开了新东西，这边冒一句（演出细节待定，先用这一句占位） -->
<div id="tip" aria-hidden="true"></div>

<!-- 背景音乐开关：固定右上角，点一下开／关（Chaolis.mp3） -->
<div id="musicbtn" title="点一下：开／关背景音乐">♪ 音乐</div>
<div id="musicboxbtn" title="点一下：打开音乐盒">♫ 乐库</div>
<div id="musicbox">
  <div class="mb-title">♫ 音乐盒</div>
  <div id="mb-list"></div>
  <div class="mb-hint">通关终局对话后解锁更多</div>
</div>

<!-- 数据清空按钮：读完青禾的残稿、演完那段剧情后浮出；点一下让大眼问是否清空 -->
<div id="databtn" title="清空所有进度与已解锁的网页页面">数据清空</div>

<div id="dlg">
    <pre id="dlg-pre" aria-live="polite"></pre>
    <pre id="dlg-opts" aria-hidden="true"></pre>
</div>

<div id="black" aria-hidden="true">
    <div id="black-cn"></div>
    <div id="black-en"></div>
</div>

<div id="redlight" aria-hidden="true"></div>

<script>
/* 第一幕：巨大眼球——眼珠由汉字线稿拼成，内切于一个文字球面之中。
   出场：屏幕中央先浮现一条汉字细缝 → 自然睁开（平滑动画过渡）→ 再立体化；
   睁眼开始时，周围的文字球苏醒——倾斜自转、云带式流动、近亮远暗。 */

var COLS = 78, ROWS = 40;
var cx = COLS/2, cy = ROWS/2;
var ax = 33, ay = 14;     // 眼眶（杏仁）半宽/半高，单位=网格（全宽汉字，已是方形）
var ASP = 1.0;            // 全宽汉字每格方形，无需横向修正
var ri = 13, rp = 5.5;    // 虹膜 / 瞳孔 半径
var AYMAX = 14, SLIT = 1.5;   // 全开高度 / 缝隙高度

// 明暗台阶：由汉字疏密表现。最暗用全角空格(背景/瞳孔)，越亮字越密；
// 用「目/眼/晶」作最密一档，呼应"文字成眼"。
var SP = '　';
var RAMP = "丶丿氵灬火目眼晶";   // 0..7：稀疏 → 致密

function lumCh(lum){
    var i = Math.round(lum * (RAMP.length - 1));
    if (i < 0) i = 0; if (i > RAMP.length - 1) i = RAMP.length - 1;
    return RAMP.charAt(i);
}

// ox/oy：瞳孔中心相对正中偏移（盯鼠标）；ay：当前纵向半高（入场动画）；
// depth：立体程度 0(平) → 1(全立体)。
// 画法：纯线条轮廓——只勾勒外眼眶、虹膜环与空洞瞳孔，内部留空（压迫感来自镂空凝视）。
var LIGHT_X, LIGHT_Y;                       // 归一化后的受光方向（左上）
(function(){ var lx = -0.62, ly = -0.62, ll = Math.sqrt(lx*lx + ly*ly);
             LIGHT_X = lx/ll; LIGHT_Y = ly/ll; })();

/* 逐格几何预计算：列方向的 (dx/ax)^2 和行方向的 (r-cy)^2 都是定值，
   只有 ay 在变 → 每帧只需一次除法，省掉 3120 次乘法/除法 */
var COL_EX2 = new Float32Array(COLS), ROW_DY2 = new Float32Array(ROWS);
for (var _c = 0; _c < COLS; _c++){ var _e = (_c - cx) / ax; COL_EX2[_c] = _e * _e; }
for (var _r = 0; _r < ROWS; _r++){ var _y = _r - cy; ROW_DY2[_r] = _y * _y; }
/* 空格串查表：拼一行空白不用一个字符一个字符加 */
var SP_N = [];
(function(){ var s = ''; for (var i = 0; i <= COLS; i++){ SP_N.push(s); s += SP; } })();
var SP_ROW = SP_N[COLS] + '\n';

function buildEye(ox, oy, ay, depth){
    ox = ox || 0; oy = oy || 0;
    ay = (ay == null) ? AYMAX : ay;
    depth = (depth == null) ? 1 : depth;
    var pgx = cx + ox, pgy = cy + oy;
    var rpEff = rp * Math.min(1, ay / AYMAX);   // 瞳孔随睁眼由无到有
    var invAy2 = 1 / (ay * ay);
    // 距离判定全部用平方比，避开 sqrt —— 只有真正要算明暗的那两圈（虹膜环 / 外轮廓）才开方
    var rp2 = rpEff * rpEff;
    var riLo2 = (ri - 1.4) * (ri - 1.4), riHi2 = (ri + 1.4) * (ri + 1.4);
    var rpEdge2 = (rpEff + 1.1) * (rpEff + 1.1);
    var slit = ay < 4;
    var out = '';
    for (var r = 0; r < ROWS; r++){
        var ey2 = ROW_DY2[r] * invAy2;
        if (ey2 > 1){ out += SP_ROW; continue; }            // 整行都在眼眶外
        // 只遍历这一行里真正落在眼形内的列区间，两侧用空格串补齐
        var hw = ax * Math.sqrt(1 - ey2);
        var c0 = Math.max(0, Math.ceil(cx - hw)), c1 = Math.min(COLS - 1, Math.floor(cx + hw));
        var line = SP_N[c0];
        var dy = r - pgy;
        for (var c = c0; c <= c1; c++){
            var dx = (c - pgx) * ASP;
            var d2 = dx*dx + dy*dy;
            if (d2 <= rp2){ line += SP; continue; }         // 瞳孔 = 空洞（留白）
            if (slit){ line += lumCh(0.48); continue; }     // 缝隙：一条干净的横线
            if (d2 >= riLo2 && d2 <= riHi2){
                // 虹膜环：受光侧密、背光侧疏 → 立体（depth 控制对比）
                var d = Math.sqrt(d2) || 1;
                var shade = (dx/d)*LIGHT_X + (dy/d)*LIGHT_Y;             // -1..1
                line += lumCh(0.45 + depth * 0.42 * shade);
            } else if (d2 < rpEdge2){
                line += '丶';                                // 瞳孔边缘，一道极淡的线
            } else if (COL_EX2[c] + ey2 > 0.85){
                var d3 = Math.sqrt(d2) || 1;                 // 外眼眶轮廓
                line += lumCh(0.56 + 0.12 * ((dx/d3)*LIGHT_X + (dy/d3)*LIGHT_Y));
            } else line += SP;
        }
        out += line + SP_N[COLS - 1 - c1] + '\n';
    }
    return out;
}

var eye = document.getElementById('eye');
eye.textContent = buildEye(0, 0, SLIT, 0);   // 先画一条缝

/* ---- 出场时间线 ---- */
var P = { fade: 320, hold: 460, open: 1080, depth: 860 };
var t0 = null, ayCur = SLIT, depthCur = 0, introDone = false, needRedraw = true;
var lastQ = { x: 999, y: 999, a: -1, d: -1 };    // 上一次真正重画时用的量化参数

function easeOut(x){ return 1 - Math.pow(1 - x, 3); }
function easeInOut(x){ return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }   // 自然过渡：慢起缓停，无过冲

function frame(ts){
    if (blackOn){ lastTs = ts; requestAnimationFrame(frame); return; }   // 黑屏期间画面不可见 → 不画
    if (t0 === null) t0 = ts;
    var t = ts - t0;
    var animating = false;
    if (t < P.fade){ ayCur = SLIT; depthCur = 0; }
    else if (t < P.fade + P.hold){ ayCur = SLIT; depthCur = 0; }
    else if (t < P.fade + P.hold + P.open){
        var p = easeInOut((t - P.fade - P.hold) / P.open);   // 自然睁开：平滑动画过渡
        ayCur = SLIT + (AYMAX - SLIT) * p;
        depthCur = 0; animating = true;
    }
    else if (t < P.fade + P.hold + P.open + P.depth){
        ayCur = AYMAX;
        depthCur = easeOut((t - P.fade - P.hold - P.open) / P.depth);   // 立体化
        animating = true;
    }
    else {
        ayCur = AYMAX; depthCur = 1;
        if (!introDone){
            introDone = true; animating = true;
            setTimeout(openDlg, 1100);
            setTimeout(function(){ Pet.ensure(); }, 1600);   // 答过第六问的话，一进来就该有那只宠物
            /* 开场演出完了 → 把存档里放过的网页入口补出来，再补上网页那边解锁过的 */
            setTimeout(function(){ Gate.ensure(); ensureUnlock(); checkUnlock(); startUnlockWatch(); }, 1900);
        }
    }

    // 入场结束后：眼睛随文字球同拍呼吸（0.8），眨眼走同一套开合数学
    if (introDone){
        var tS = ts * 0.001;
        var ayB = AYMAX * (1 + 0.028 * Math.sin(tS * 0.8));
        if (blinkT >= 0){
            var bp = (ts - blinkT) / 300;
            if (bp >= 1){ blinkT = -1; }
            else ayB = Math.min(ayB, Math.max(1.4, AYMAX * (1 - Math.sin(Math.PI * bp) * 0.94)));
        }
        ayCur = ayB; animating = true;      // 呼吸恒动 → 眼与球连成一体
        // 凝视行为：到点换状态
        if (ts >= gaze.until) pickGaze(ts);
        if (gaze.mode === 'pet' && petStareLost()) pickGaze(ts);
        if (gaze.mode === 'mouse'){ tar.x = mLook.x; tar.y = mLook.y; }
        else if (gaze.mode === 'pet'){
            /* 盯着宠物：跟着祂走，只在方向上加一丝几乎看不出的游移 —— 盯着的眼睛不会完全钉死 */
            var pl = lookAt(Pet.x, Pet.y, ts);
            tar.x = pl.x + Math.sin(tS*1.7)*0.10;
            tar.y = pl.y + Math.cos(tS*1.3)*0.10;
        }
        else if (gaze.mode === 'wander'){
            tar.x = gaze.wx + Math.sin(tS*3.1)*0.35;    // 微小扫视，像在打量
            tar.y = gaze.wy + Math.cos(tS*2.3)*0.35;
        }
        else { tar.x = 0; tar.y = 0; }                  // 直视玩家
        var dx = tar.x - cur.x, dy = tar.y - cur.y;
        if (Math.abs(dx) > 0.12 || Math.abs(dy) > 0.12){
            cur.x += dx * gaze.k; cur.y += dy * gaze.k;  // k：盯宠物时转得慢一些
        }
    }
    if (needRedraw) animating = true;   // 眨眼等外部触发
    /* 重建一个 78×40 的字符网格 + 整块 textContent 是很贵的一次重排：
       把参数量化后再比，只有真的变了才重画（呼吸/凝视的抖动大部分帧会被吃掉） */
    if (animating){
        // 量化精度取到 1/8 格(1.6px) 与 1/16 行 —— 比字符网格本身还细，肉眼看不出台阶
        var qx = Math.round(cur.x * 8) / 8, qy = Math.round(cur.y * 8) / 8;
        var qa = Math.round(ayCur * 16) / 16, qd = Math.round(depthCur * 64) / 64;
        if (qx !== lastQ.x || qy !== lastQ.y || qa !== lastQ.a || qd !== lastQ.d){
            lastQ.x = qx; lastQ.y = qy; lastQ.a = qa; lastQ.d = qd;
            eye.textContent = buildEye(qx, qy, qa, qd);
            needRedraw = false;
        }
    }

    // 文字漩涡环：眼睛开始睁开时苏醒，此后每帧推进
    if (!ringOn && t >= P.fade + P.hold){ ringOn = true; ringBox.classList.add('on'); }
    var dts = lastTs === null ? 0.016 : Math.min(0.05, (ts - lastTs) / 1000);
    if (ringOn) updateRing(ts, dts);
    if (Pet.alive) Pet.update(ts, dts);      // 宠物跟同一条时间线走（黑屏时会被上面的 return 跳过）
    PetCare.update(ts);                      // 饲养面板跟着宠物（宠物不在时由它自己淡出）
    if (Gate.ids.length) Gate.update(ts, dts);     // 网页入口按钮同一条时间线
    lastTs = ts;
    requestAnimationFrame(frame);
}

/* 缝出现后淡入 */
requestAnimationFrame(function(){

/* 凝视行为：大部分时候直视屏幕或随便看看别处；偶尔盯鼠标；
   最少见、但看得最久的 —— 转过去盯着那只宠物。 */
var maxLook = ri - rp - 1.5;
var cur = { x:0, y:0 }, tar = { x:0, y:0 }, blinkT = -1;
var mLook = { x:0, y:0 };

/* 眼球中心（视口坐标）。对白弹出时舞台整体上移 7vh，位置会变；
   但每帧读一次 getBoundingClientRect 太贵 → 缓存，最多每 400ms 量一次。 */
var eyeC = { x:0, y:0, t:-1e9 };
function eyeCenter(ts){
    if (ts - eyeC.t > 400){
        var b = eye.getBoundingClientRect();
        eyeC.x = b.left + b.width/2; eyeC.y = b.top + b.height/2; eyeC.t = ts;
    }
    return eyeC;
}
/* 屏幕上一点 → 瞳孔该偏多少（单位=网格格）。盯鼠标和盯宠物用同一套换算。 */
function lookAt(x, y, ts){
    var c = eyeCenter(ts);
    var vx = x - c.x, vy = y - c.y;
    var dist = Math.sqrt(vx*vx + vy*vy) || 1;
    var reach = Math.min(maxLook, dist * 0.018);   // 离得越远，眼珠转得越满
    return { x: (vx/dist) * reach, y: (vy/dist) * reach };
}

window.addEventListener('mousemove', function(e){
    if (!introDone) return;
    var l = lookAt(e.clientX, e.clientY, performance.now());
    mLook.x = l.x; mLook.y = l.y;
});

/* 「盯着宠物」这件事的旋钮 —— 想改就改这三个数：
   p = 每次换状态时有多大概率选中它（概率最低）
   min/max = 盯多久（毫秒，时间最长）
   vis = 宠物至少得这么「实在」才值得看；转到球背面淡掉了就别盯着空气 */
var PET_STARE = { p: 0.05, min: 9000, max: 16000, vis: 0.5 };

var gaze = { mode: 'center', until: 1500, wx: 0, wy: 0, k: 0.16 };
function pickGaze(now){
    /* 盯着宠物：概率最低、时间最长。宠物不在 / 正从画面外飞进来 / 已淡到球背面 → 这次不算，往下走 */
    if (Pet.alive && Pet.mode !== 'enter' && Pet.op > PET_STARE.vis && Math.random() < PET_STARE.p){
        gaze.mode = 'pet';
        gaze.until = now + PET_STARE.min + Math.random() * (PET_STARE.max - PET_STARE.min);
        gaze.k = 0.085;                              // 转得慢：不是瞥一眼，是端详
        if (introDone) blinkT = now;                 // 先眨一下再转过去 —— 眨眼正好把"换目标"藏住
        return;
    }
    var r = Math.random();
    if (r < 0.07){                                   // 次之：盯鼠标（惊鸿一瞥）
        gaze.mode = 'mouse';
        gaze.until = now + 1600 + Math.random()*2200;
        gaze.k = 0.16;
    } else if (r < 0.55){                            // 直视屏幕（正对玩家）
        gaze.mode = 'center';
        gaze.until = now + 1800 + Math.random()*3800;
        gaze.k = 0.16;
    } else {                                         // 随便看看别处（最多）
        gaze.mode = 'wander';
        var a = Math.random()*Math.PI*2;
        var reach = maxLook * (0.35 + Math.random()*0.55);
        gaze.wx = Math.cos(a)*reach; gaze.wy = Math.sin(a)*reach;
        gaze.until = now + 1200 + Math.random()*2800;
        gaze.k = 0.16;
    }
}
/* 盯着宠物的中途，祂可能没了 —— 被收走、或绕到球背面看不见了 → 这一趟提前作废 */
function petStareLost(){ return !Pet.alive || Pet.op < 0.3; }

/* 眨眼：随机间隔触发；开合走 buildEye 同一套数学（与呼吸/凝视兼容） */
function scheduleBlink(){
    setTimeout(function(){
        if (!introDone){ scheduleBlink(); return; }
        /* 正盯着宠物看的时候多半不眨 —— 看得入神；偶尔还是眨一下，免得像卡住了 */
        if (!(gaze.mode === 'pet' && Math.random() < 0.65)) blinkT = performance.now();
        scheduleBlink();
    }, 4200 + Math.random()*5200);
}
scheduleBlink();

/* ---- 文字球壳：巨大眼球——眼珠内切于文字球面，球面文字环绕流动 ---- */
var ringBox = document.getElementById('ring');
var VCHARS = '丶丿氵冫氺水火灬風雲渦漩流';   // 云/水意象的字，不与眼珠争「目眼晶」
var R_COUNT = 1100;
var TILT = 0.32;                            // 自转轴倾斜（弧度），让转动更有立体感
var RADIUS = 0, EXW = 0, EXH = 0, RCX = 0, RCY = 0;   // 球半径 / 中央避让椭圆半轴 / 圆心
var ringSpans = [], ringOn = false, lastTs = null;
/* d^2.2 查表：省掉每帧 1100 次 Math.pow */
var POW_LUT = new Float32Array(257);
for (var _p2 = 0; _p2 <= 256; _p2++) POW_LUT[_p2] = Math.pow(_p2 / 256, 2.2);
/* sin/cos 查表：每帧 4400 次三角函数是大头（实测约 0.9ms），换成 8192 点表 ≈ 0.0008rad 精度 */
var SIN_N = 8192, SIN_SCALE = SIN_N / (Math.PI * 2), SIN_MASK = SIN_N - 1;
/* 查表函数闭包化：表/比例尺都在闭包里当局部变量用，热循环里不再做全局查找 */
var fsin, fcos;
(function(){
    var L = new Float32Array(SIN_N), S = SIN_SCALE, M = SIN_MASK, Q = SIN_N >> 2;
    for (var i = 0; i < SIN_N; i++) L[i] = Math.sin(i / S);
    fsin = function(a){ return L[((a * S) | 0) & M]; };
    fcos = function(a){ return L[((((a * S) | 0) + Q) & M)]; };
})();
/* 曾经试过"每帧只更新一半的字"来省算力——结果是每个字只有 30Hz，肉眼直接看出一顿一顿的。
   字少写几次省的那点时间，远不如掉一半刷新率来得明显。所以：每帧全量更新，一个都不跳过。 */

function layoutRing(){
    // 用「眼珠真正的墨迹尺寸」而不是 <pre> 的盒子尺寸来定避让窗：
    // 盒子里有大片空白（78x40 网格 vs 杏仁 33x14），按盒子算会空出一大圈。
    var cw = eye.offsetWidth / COLS, lh = eye.offsetHeight / ROWS;
    RADIUS = eye.offsetWidth / 2 + 45;      // 球半径（眼珠内切于球）
    EXW = ax * cw + 8;                      // 避让椭圆紧贴眼珠轮廓，只留一点余量
    EXH = AYMAX * lh + 8;
    RCX = window.innerWidth / 2; RCY = window.innerHeight / 2;   // 圆心缓存，别每帧读 innerWidth
}
window.addEventListener('resize', layoutRing);

(function initRing(){
    layoutRing();
    var GA = Math.PI * (3 - Math.sqrt(5));  // 黄金角 → 球面均匀布点
    for (var i = 0; i < R_COUNT; i++){
        var s = document.createElement('span');
        s.textContent = VCHARS.charAt((Math.random()*VCHARS.length) | 0);
        s.style.fontSize = (11 + Math.random()*8).toFixed(1) + 'px';
        ringBox.appendChild(s);
        var phi = Math.acos(1 - 2*(i + 0.5)/R_COUNT);   // 斐波那契球分布
        ringSpans.push({
            el: s,
            sp: Math.sin(phi), cp: Math.cos(phi),
            phiv: phi,                                  // 极角（行波的相位参数）
            lam: i * GA,                                // 初始经度
            band: Math.sin(phi*3.1) * 0.35,             // 纬度差速 → 云带式流动
            jit: Math.random()*Math.PI*2,
            sj: 0, cj: 0,                               // sin/cos(jit) 预存，用来拆 sin(t*0.23+jit)
            w: 0.10 * (1 + Math.sin(phi*3.1) * 0.35),   // 该点的角速度（含纬度差速），预存
            wj: (Math.random()-0.5)*0.35,               // 行波的微小相位差（有机感）
            rotV: (Math.random()*2 - 1) * 0.5,          // 缓慢自转（微翻滚）
            a0: 0.6 + Math.random()*0.4
        });
        var o = ringSpans[i];
        o.sj = Math.sin(o.jit); o.cj = Math.cos(o.jit);
    }
})();

function updateRing(ts, dt){
    // 热循环里用到的量全部转成本地变量：全局查找在 1100×60 次/秒 的量级下是能测出来的
    var cx2 = RCX, cy2 = RCY, radius = RADIUS, exw = EXW, exh = EXH;
    var powLut = POW_LUT;
    /* 宠物的避让区（由 updatePet 每帧写入）：字流要把祂绕开 */
    var pax = PETAV.on ? PETAV.x : 0, pay = PETAV.on ? PETAV.y : 0;
    var par = PETAV.on ? PETAV.r : 0, par2 = par * par;
    /* 宠物转到球背面去的时候是半透明的 —— 那时就别再把字推开了（乘上"实在程度"w） */
    var paw = PETAV.on ? PETAV.w : 0;
    var t = ts * 0.001;
    var ct = Math.cos(TILT), stl = Math.sin(TILT);
    /* sin(t*0.23 + jit) 拆成 sin(t*0.23)·cos(jit) + cos(t*0.23)·sin(jit)：
       前两项全帧共用一次，cos/sin(jit) 每个字预存 → 1100 次三角变 2 次 */
    var tA = 0.15 * Math.sin(t * 0.23), tB = 0.15 * Math.cos(t * 0.23);
    for (var i = 0; i < ringSpans.length; i++){
        var o = ringSpans[i];
        // 经度推进：纬度差速 + 微扰 → 像云在球面上流
        var lam = o.lam + t * o.w + tA * o.cj + tB * o.sj;
        var x0 = o.sp * fcos(lam);
        var z0 = o.sp * fsin(lam);
        var y0 = o.cp;
        // 自转轴倾斜（绕 X 轴）
        var y1 = y0*ct - z0*stl;
        var z1 = y0*stl + z0*ct;
        // 行波：两个波长不同的波叠加，整球文字一起荡（0.8 与眼珠呼吸同频）
        var wav = fsin(2*lam + 3*o.phiv - t*0.8 + o.wj) * 0.6
                + fsin(3*lam - 2*o.phiv + t*0.55) * 0.4;
        var rEff = radius * (1 + 0.016 * wav);          // 径向起伏
        var x = cx2 + x0 * rEff;
        var y = cy2 + y1 * rEff;
        // 切向晃动：沿圆周方向推一把，波就"流"起来了
        var rx2 = x - cx2, ry2 = y - cy2;
        var rl = Math.sqrt(rx2*rx2 + ry2*ry2) || 1;
        x += (-ry2/rl) * wav * 9;
        y += ( rx2/rl) * wav * 9;
        var d = (z1 + 1) / 2;                           // 0=球背面 1=正对玩家
        // 避让 + 绕流：先按原位算淡出系数，再把字沿径向轻轻推开——流线绕着眼珠走
        var exd = (x - cx2)/exw, eyd = (y - cy2)/exh;
        var e2 = exd*exd + eyd*eyd;
        // 只在瞳孔/虹膜附近淡出，贴着眼珠轮廓就立刻恢复 —— 不再挖一大片空窗
        var vf = e2 >= 1.0 ? 1 : Math.max(0, Math.min(1, (e2 - 0.45) / 0.55));
        if (e2 < 1.5 && e2 > 1e-4){
            var _q = Math.max(0, 1 - e2/1.5);
            var kk = 1 + 0.14 * _q * _q;                 // 绕流：柔推，不外扩成大空环
            x = cx2 + exd * kk * exw;
            y = cy2 + eyd * kk * exh;
        }
        /* 宠物避让：与上面同一套写法（淡出 + 沿径向外推），圆心跟着宠物走。
           推开的力度乘以 PETAV.w —— 宠物若是退到球的背面（几乎看不见），字就照原路流过去。 */
        if (par2 > 0 && paw > 0.05){
            var pdx = x - pax, pdy = y - pay, pd2 = pdx*pdx + pdy*pdy;
            if (pd2 < par2){
                var pd0 = Math.sqrt(pd2) || 1;
                var pf = (pd0 / par - 0.5) / 0.5;        // 边缘处淡出，中心全空
                if (pf < 0) pf = 0; else if (pf > 1) pf = 1;
                vf *= 1 - (1 - pf) * paw;
                var pk = (par - pd0) * 0.5 / pd0 * paw;   // 绕流：把字推开而不是删掉
                x += pdx * pk; y += pdy * pk;
            }
        }
        // 远近对比拉陡：背面近乎幽灵(0.03)，正面近乎实心(0.98)
        var di = (d * 256) | 0; if (di < 0) di = 0; else if (di > 256) di = 256;
        var opi = ((0.03 + 0.95 * powLut[di]) * vf * o.a0 * 100) | 0;
        var sc = 0.5 + 0.72*d, sci = (sc * 100) | 0;     // 近大远小（跨度更大）
        var rot = o.jit + t * o.rotV;
        // 保留 1 位小数：取整会让字按整像素跳，慢速漂移时看得出台阶
        var xi = Math.round(x * 10) / 10, yi = Math.round(y * 10) / 10;
        var rqi = Math.round(rot * 100) / 100;
        // 值没变就不写 DOM（等价于写了同一个值），省掉一部分样式重算
        if (opi !== o._op){ o._op = opi; o.el.style.opacity = opi / 100; }
        var tf = xi !== o._x || yi !== o._y || sci !== o._s || rqi !== o._r;
        if (tf){
            o._x = xi; o._y = yi; o._s = sci; o._r = rqi;
            o.el.style.transform =
                'translate(' + xi + 'px,' + yi + 'px)' +
                ' translate(-50%,-50%)' +
                ' rotate(' + rqi + 'rad)' +
                ' scale(' + (sci / 100) + ')';
        }
    }
}

/* ==================================================================
   宠物（第六问选完之后放出来的那一团字）
   ------------------------------------------------------------------
   · 形状就是 PETS 里那几行字符——一行一段、各自居中，所以换字体也不会散架。
   · 从画面外的涡流里飘进来 → 落在正对着您的那一面，之后就在**整个球面**上慢慢爬：
     沿大圆（SLERP）走，所以永远贴着球面绕过去，不会从球中间穿；转到背面去会按球面
     透视变淡变小，过一会儿自己绕回来（每三趟里有一趟会往球后面跑一圈）。
   · 能被鼠标拖起来（随便拖到屏幕哪里）；松手会落回球面上离它最近的那一点。
   · 三件日常：① 停下时**左右来回踱步**（PACE）——脚下那块球面没动，只是把画出来的位置
     在屏幕上左右拨一点，所以祂还是贴着球面，看着像在原地来回走；
     ② 爬球 + 踱步攒够运动量（NAP.after 秒）后，自己找一个正对着您的地方**躺下睡觉**：
     换成闭眼的那一版形象、横向摊开纵向压扁地蜷着，头顶慢慢冒 Z，EXP 一点一点地涨；
     睡着时摸它不加 EXP（只冒 Z），但仍然能抓起来挪地方 —— 放下它接着睡；
     ③ Lv.1 起偶尔后空翻（FLIP）。
   · PETAV 是每帧写给球面字流的避让区——涡流会绕开祂；宠物退到背面半透明时（PETAV.w）
     就不再推字，让字照原路流过。
   手动试：Pet.spawn('cat') / Pet.hide()
   　　　　Pet.startNap(performance.now())（= 立刻找地方睡）　Pet.wake(performance.now()) */
/* ★ 注意：形象里的反斜杠 `\` 必须写成 `\\`。
   JS 字符串里 `\ ` 不是合法转义，会被直接吞掉（`'(\   /)'` 出来是 `(   /)`，反斜杠没了）。
   爬虫那行的 `///\oo/\\\` 同理要写成 `'///\\oo/\\\\\\'`。 */
var PETS = {
    cat:     ['  ∧ ∧  ', ' ( ･ω･ )', '  ﾉ   ﾉ ', '   〜   '],
    dog:     [' ▼   ▼ ', ' ( ･ω･ )', '  ﾉ ω ﾉ', '   〜   '],
    hamster: ['ᘛ⁐̤ᕐᐷ'],
    rabbit:  ['(\\            /)', '(˶•ㅅ•˶)O'],
    reptile: ['///\\oo/\\\\\\']
};
/* 睡着的样子：跟上面一一对应 —— 眼睛闭起来、脚收进去、尾巴盘起来。
   再叠一层"压扁"（见下面的 NAP.sx/sy），看起来就是蜷在那儿睡，不是站着打盹。
   没写到的种类就自动沿用白天的样子，只闭眼（见 Pet.setArt）——
   仓鼠那一枚本来就分不出睁眼闭眼，所以故意不写，睡着时只压扁 + 冒 Z。 */
var PETS_SLEEP = {
    cat:     ['  ∧ ∧  ', ' ( -ω- )', '  ﾉ   ﾉ ', '   〜   '],
    dog:     [' ▼   ▼ ', ' ( -ω- )', '  ﾉ ω ﾉ', '   〜   '],
    rabbit:  ['(\\            /)', '(˶-ㅅ-˶)O'],
    reptile: ['///\\--/\\\\\\']
};
var PETAV = { x:0, y:0, r:0, w:1, on:false };   // 球面字流用的避让区（每帧更新；w=这只宠物此刻有多"实在"）
var petEl = document.getElementById('pet');
var stageEl = document.getElementById('stage');

/* 球面 ⇄ 屏幕（与球面字流同一套数学：同一个球心、同一个半径、同一个自转轴倾角，
   所以宠物看上去就是贴在那层文字皮上爬）。v = [x0, y0, z0]，单位向量。 */
function petProj(v, wave){
    var ct = Math.cos(TILT), st = Math.sin(TILT);
    var rad = RADIUS * (1 + 0.016 * (wave || 0));      // 跟着球面的行波一起起伏
    var X = v[0], Y = v[1]*ct - v[2]*st, Z = v[1]*st + v[2]*ct;
    return { x: RCX + X*rad, y: RCY + Y*rad, d: (Z + 1) / 2 };   // d：0=球背面 1=正对玩家
}
/* 屏幕上一点 → 球面上离它最近的那个点（取正面这一层） */
function petUnproj(x, y){
    var nx = (x - RCX) / RADIUS, ny = (y - RCY) / RADIUS;
    var r = Math.sqrt(nx*nx + ny*ny);
    if (r > 1){ nx /= r; ny /= r; r = 1; }             // 拖到球外 → 按到球轮廓上
    var Z = Math.sqrt(Math.max(0, 1 - r*r));           // 正面半球
    var ct = Math.cos(TILT), st = Math.sin(TILT);
    var a = nx, b = ny*ct + Z*st, c = -ny*st + Z*ct;   // 逆着自转轴倾角转回来
    var l = Math.sqrt(a*a + b*b + c*c) || 1;
    return [a/l, b/l, c/l];
}
/* 沿大圆走：SLERP —— 宠物永远贴着球面「绕过去」，不会从球中间穿过去 */
function petSlerp(a, b, t){
    var dp = a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
    if (dp > 0.99999) return b.slice();                  // 几乎重合
    if (dp < -0.99999){ return [b[1], -b[0], b[2]]; }    // 正对面：随便绕一侧过去
    var om = Math.acos(dp), so = Math.sin(om);
    var s0 = Math.sin((1 - t) * om) / so, s1 = Math.sin(t * om) / so;
    return [a[0]*s0 + b[0]*s1, a[1]*s0 + b[1]*s1, a[2]*s0 + b[2]*s1];
}
/* 球面上随便挑一个落脚点。minD = 至少要有多「正对」玩家：
   0 = 整个球面随便跑（可能绕到背面去）；0.85 = 只落在正对着您的那一面。
   做法：直接在「已经倾斜过的」那一层里取深度 Z（均匀分布必有 Z ∈ [-1,1]），
   再把点逆着自转轴倾角转回来 —— 这样一定落得到「够正」的那一面，不用反复试。 */
function petSpot(minD){
    var zMin = 2 * minD - 1;
    if (zMin > 1) zMin = 1;
    var Z = zMin + Math.random() * (1 - zMin);           // 深度（投影到您眼前的那一层）
    var rr = Math.sqrt(Math.max(0, 1 - Z*Z));
    var a = Math.random() * Math.PI * 2;
    var ct = Math.cos(TILT), st = Math.sin(TILT);
    var X = rr * fcos(a), Y = rr * fsin(a);
    return [X, Y*ct + Z*st, -Y*st + Z*ct];               // 逆倾斜：回到球面自转前的坐标
}

var Pet = {
    alive: false, kind: null,
    x: 0, y: 0, rot: 0, sc: 1, bob: 0, op: 1,
    v: [0, 1, 0], vt: [0, 1, 0], px: 0, py: 0,     // 球面上的当前点 / 目标点
    mode: 'off', t0: 0, dur: 0, waitUntil: 0, spd: 30, leg: 0,
    x0: 0, y0: 0, tx: 0, ty: 0, r0: 0, w: 0, h: 0, born: 0,
    flipT: 0, flipDur: 0, flipCd: 0,       // 后空翻：开始时刻 / 时长 / 冷却到什么时候
    /* 踱步：ox/oy 是加在球面坐标上的一点屏幕偏移（脚底下那块球面没动，只是左右挪两步） */

    /* 存档里答过第六问 → 直接把它放出来（刷新/续玩都在） */
    ensure: function(){

        var k = save.ans && save.ans.pet;
        if (k && PETS[k]) this.spawn(k);
    },
    spawn: function(kind){

        if (!rows) return;
        this.kind = kind; this.alive = true;
        this.setArt(false);
        petEl.classList.add('on');
        /* 入场：从画面外的涡流里飘进来（左右随机），落在正对着您的那一面 */
        var side = Math.random() < 0.5 ? -1 : 1;
        this.x0 = RCX + side * (RADIUS * 1.8 + 70);
        this.y0 = RCY + (Math.random() - 0.5) * RADIUS * 1.1;
        this.vt = petSpot(0.85);
        var pg = petProj(this.vt);
        this.x = this.x0; this.y = this.y0;
        this.tx = pg.x;   this.ty = pg.y;
        this.t0 = this.born = performance.now();

        this.spd = 42 + Math.random() * 22;          // 爬行速度（屏幕上看着约多少 px/s）
        this.pace = null; this.ox = this.oy = 0; this.paceDir = 0;
        this.asleep = false; this.tired = 0; this.napNext = false; this.sleepUntil = 0;
        PETAV.on = true;
    },
    hide: function(){
        this.alive = false; this.mode = 'off';

        petEl.innerHTML = '';

    },
    /* 换形象：sleeping=true 用 PETS_SLEEP（闭眼蜷着）；表里没写的种类就只把眼睛闭上 */
    setArt: function(sleeping){
        var rows = PETS[this.kind] || [];

            rows.map(function(r){ return r.replace(/･ω･/g, '-ω-'); });

        rows.forEach(function(r){ html += '<span class="pr">' + esc(r) + '</span>'; });

    startPace: function(ts){

            t0: ts,
            until: ts + PACE.dur[0] + Math.random() * (PACE.dur[1] - PACE.dur[0]),
            w: PACE.w * (0.85 + Math.random() * 0.3),        // 每秒来回的快慢
            amp: PACE.amp * (0.8 + Math.random() * 0.5)      // 左右各挪多远

    },
    /* 睡下：先由 climb 走到一个正对着您的地方，到了那儿才真正躺下（见 arrive） */
    startNap: function(ts){

        this.resumeNap(ts);
    },
    /* 已经睡着了（比如被拖起来挪了个地方又放下）→ 接着睡，不动 sleepUntil */
    resumeNap: function(ts){
        this.mode = 'sleep';
        this.pace = null; this.ox = this.oy = 0; this.paceDir = 0; this.flipT = 0;
        this.zzzAt = ts + 350;
        this.expAt = ts + NAP.every;
        this.setArt(true);
        PetCare.render();
    },
    wake: function(ts){
        this.asleep = false; this.tired = 0; this.napNext = false;
        this.mode = 'wait';
        this.waitUntil = ts + 700 + Math.random() * 900;
        this.setArt(false);
        PetCare.render();
    },
    /* 走/落到某一点之后统一走这里：决定接下来是睡、是踱步、还是干站着 */
    arrive: function(ts){

        if (this.napNext){                          // 这一趟是专门去找地方睡的

        if (this.asleep){                           // 睡着的时候被挪了个地方 → 放下继续睡

    update: function(ts, dt){
        if (!this.alive) return;
        var t = ts * 0.001;
        /* 后空翻（Lv.1 解锁）：站着不动的时候偶尔来一个，每秒 FLIP.p 的概率，
           两次之间至少隔 FLIP.cd —— 平均十几秒一次，不会一直在翻（踱步/睡觉时不翻） */
        if (!this.flipT && ts > this.flipCd && this.mode === 'wait' && !this.pace &&
            this.op > 0.45 && PetCare.lv() >= FLIP.lv){
            if (Math.random() < FLIP.p * dt){ this.flipT = ts; this.flipDur = FLIP.dur; }
        }
        /* 踱步：停下来的那段时间里常常左右来回走两步。脚下那块球面没动 —— 只是把画出来的
           位置在屏幕上左右拨一点（ox/oy），所以祂还是贴在球面上，只是看上去在原地打转。 */
        this.ox = 0; this.oy = 0; this.paceDir = 0;
        if (this.pace){

            } else {

                this.oy = -Math.abs(Math.sin(ph * 2)) * PACE.hop * this.sc;   // 每一步轻轻颠一下
                this.paceDir = Math.cos(ph) >= 0 ? 1 : -1;                    // 朝哪边走就往哪边倾

            }

            /* 飘过来：缓停 + 一路轻飘飘地上下荡 */
            var k = Math.min(1, (ts - this.t0) / this.dur);
            var e = 1 - Math.pow(1 - k, 3);
            this.x = this.x0 + (this.tx - this.x0) * e;
            this.y = this.y0 + (this.ty - this.y0) * e + Math.sin(t * 2.1) * 9 * (1 - k * 0.6);

            var ef = 1 - Math.pow(1 - kf, 3);
            this.x = this.x0 + (this.tx - this.x0) * ef;
            this.y = this.y0 + (this.ty - this.y0) * ef;

                onSphere = true;
            }

               走近对趾点之类的极端情况都由 petSlerp 兜着 —— 它永远绕着球面过去，不会横穿。 */
            var dp = this.v[0]*this.vt[0] + this.v[1]*this.vt[1] + this.v[2]*this.vt[2];
            this.tired += dt;                            // 在球面上爬 = 实打实的运动量
            if (dp > 0.99999){                           // 到了
                this.v = this.vt; this.arrive(ts);
            } else {
                var om = Math.acos(dp < -1 ? -1 : dp);
                var step = (this.spd * dt) / RADIUS;     // px/s → rad/s（按球半径换算）
                if (step >= om){ this.v = this.vt; this.arrive(ts); }
                else this.v = petSlerp(this.v, this.vt, step / om);
            }
            onSphere = true;
        } else if (this.mode === 'sleep'){
            /* 睡着了：待在原地不动，头顶慢慢冒 Z，EXP 一点一点地涨；到点自己醒 */
            if (ts >= this.sleepUntil) this.wake(ts);
            else if (ts >= this.expAt){
                this.expAt = ts + NAP.every;
                PetCare.addExp(NAP.exp, true);           // 安静地加，不把面板弹出来
            }
            if (ts >= this.zzzAt){
                this.zzzAt = ts + NAP.zzz + Math.random() * 520;
                PetCare.zzz();
            }
            onSphere = true;
        } else if (this.mode === 'wait'){
            if (ts >= this.waitUntil && !this.pace){
                if (this.tired >= NAP.after){
                    /* 攒够运动量了 → 找一个正对着您的地方躺下睡（0.8：别睡到球背面去，看不见） */
                    this.vt = petSpot(0.8); this.napNext = true; this.mode = 'climb';
                } else {
                    /* 已经在球背面（快看不见了）→ 下一趟一定转回正面；
                       在正面时每三趟里有一趟跑向整个球面的任意处（常常是绕到背面再转回来），
                       其余两趟就在这对着您的一片区域里活动 —— 大部分时候看得见，但确实在绕着球走。 */
                    var dNow = petProj(this.v).d;
                    var minD = (dNow < 0.4) ? 0.55 : ((this.leg % 3 === 2) ? 0.0 : 0.5);
                    /* 正被大眼珠盯着的时候，这一趟不往球背面跑 —— 不然那口气长的一眼看不到头 */
                    if (gaze.mode === 'pet' && minD < 0.5) minD = 0.5;
                    this.leg++;
                    this.vt = petSpot(minD);
                    this.mode = 'climb';
                }
            }
            onSphere = true;
        }

        if (onSphere){
            /* 位置/大小/明暗都按球面透视来：近大远小、背面近乎透明（跟字流同一套规则） */
            var phi = Math.acos(this.v[1] < -1 ? -1 : (this.v[1] > 1 ? 1 : this.v[1]));
            var lam = Math.atan2(this.v[2], this.v[0]);
            var wav = fsin(2*lam + 3*phi - t*0.8) * 0.6 + fsin(3*lam - 2*phi + t*0.55) * 0.4;
            var pg = petProj(this.v, wav);
            this.bob = Math.sin(ts * 0.019) * 1.6;

            this.y = pg.y + (this.mode === 'wait'  ? Math.sin(ts * 0.006) * 1.0

            this.sc = 0.55 + 0.62 * pg.d;                // 近大远小（与球面字流同步）
            this.op = 0.08 + 0.92 * Math.pow(pg.d, 1.3); // 背面淡出：比字流留得多，还能看见它的轮廓
            if (this.op > 1) this.op = 1;
            /* 侧身：踱步时朝走的那边倾；睡着时整只往一边歪一点（躺下来的意思）；
               其余时候顺着投影出来的移动方向微微侧 */
            var mvx = this.x - this.px, mvy = this.y - this.py;

            } else if (mvx*mvx + mvy*mvy > 0.04){

                this.rot += (want - this.rot) * 0.08;
            } else {
                this.rot += (Math.sin(t * 0.7) * 0.05 - this.rot) * 0.05;
            }
        } else {
            this.sc = 1 + Math.sin(t * 1.6) * 0.02;      // 不在球面上时：只有呼吸
            this.op = 1;
        }
        this.px = this.x; this.py = this.y;

        var fade = Math.min(1, (ts - this.born) / 1800);         // 出场淡入（代替 CSS 过渡）
        var bx = Math.round((this.x + this.ox) * 10) / 10;        // ox/oy：踱步的那点左右偏移
        var by = Math.round((this.y + this.oy) * 10) / 10;
        var rr = Math.round(this.rot * 1000) / 1000;
        var ss = Math.round(this.sc * 1000) / 1000;
        /* 后空翻：整个转一圈（收势正好回到原角度，看不出接缝）+ 跳起来 + 起跳时撑开一点 */
        if (this.flipT){
            var fk = (ts - this.flipT) / this.flipDur;
            if (fk >= 1){
                this.flipT = 0; this.flipCd = ts + FLIP.cd;
                PetCare.flipBonus();                     // 落地：星星 + 爱心 + EXP
            } else {
                var fe = 1 - Math.pow(1 - fk, 2);        // 起转快、收势稳
                rr -= Math.PI * 2 * fe;
                by -= Math.round(Math.sin(Math.PI * fk) * 30 * ss * 10) / 10;
                ss *= 1 + Math.sin(Math.PI * fk) * 0.16;
            }
        }
        /* 睡姿：横向摊开、纵向压扁，再往下沉一点 —— 像蜷在地上；
           压扁的量随时间慢慢起伏，那就是呼吸（睡着才会这样，被抓起来就恢复原样）。 */
        var scx = ss, scy = ss;
        if (this.mode === 'sleep'){
            var br = Math.sin(ts * 0.0016) * NAP.breath;
            scx = ss * NAP.sx * (1 - br * 0.4);
            scy = ss * NAP.sy * (1 + br);
            by += Math.round(NAP.sink * ss * 10) / 10;
        }
        petEl.style.transform = 'translate(' + bx + 'px,' + by + 'px)' +
                                ' translate(-50%,-50%) rotate(' + rr + 'rad) scale(' +
                                scx.toFixed(3) + ',' + scy.toFixed(3) + ')';
        petEl.style.opacity = (this.op * fade).toFixed(3);
        PETAV.x = this.x; PETAV.y = this.y;
        PETAV.r = (Math.max(this.w, this.h) * 0.5 + 16) * this.sc;   // 远处的宠物占的"洞"也小
        PETAV.w = this.op;                                            // 转到背面去就别再推字了
        PETAV.on = true;
    }
};
window.Pet = Pet;

/* ==================================================================
   饲养：点一下宠物 = 摸一下 = +EXP（每下加多少由技能「双手摸摸」决定），头顶冒一颗爱心
   ------------------------------------------------------------------
   · 等级看的是**累计**摸了多少下（save.petExpAll，只增不减），
     EXP（save.petExp）是手上能花的那份 —— 花在技能上不会掉级，这是故意的。
     门槛表 LV_NEED 就在下面，一眼能改。
   · 存档：为了不每次点击都写一次 localStorage，是「攒 1.2 秒写一次」，
     另外在页面被关掉/隐藏时补写一次；清档会一起清掉。
   · 技能在窗口里直接点那一行升级，花的是 EXP（SKILLS[i].cost 是各级的价）。
   · 面板平时是收着的：**摸第一下才冒出来**，之后每摸一下、或指针停在小窗里
     （在窗里移动/点一下也算），倒计时就重置；一段时间没动静就自己淡掉。
     倒计时长 = 下面的 AUTO_HIDE（毫秒）。
   · Lv.1 起，宠物自己会偶尔来个后空翻（见 FLIP），落地 +10 EXP。
   · 睡着的时候（见 NAP）：摸它没有 EXP（只冒一个 Z），但它自己会慢慢地 1 点 1 点地涨。
   手动试：PetCare.pet()（= 摸一下）　PetCare.addExp(50)　PetCare.exp()
   　　　　Pet.startNap(performance.now())（= 立刻躺下睡）　Pet.wake(performance.now()) */
/* 升级门槛（按"累计摸过多少下"算）：Lv.1 要 50 下，Lv.2 累计 150 下
   （＝ 1 级之后再摸 100 下；若本意是"再摸 150 下"，把第二个数改成 200 即可） */
var LV_NEED = [50, 150, 400, 1000, 2400, 5000];
/* 点击技能：cost[i] = 从第 i 级升到 i+1 级要花多少 EXP；gain[i] = 技能第 i 级时每摸一下 +多少
   现在的价格是 50 / 100 / 200 / 400（升满一共要 750 EXP），每升一级每下多给 1 点。 */
var SKILLS  = [ { n:'双手摸摸', cost:[50, 100, 200, 400], gain:[1, 2, 3, 4, 5] } ];
var AUTO_HIDE = 4500;    // 面板多久没动静就收起来（毫秒）
/* 宠物动作「旋转跳跃」（Lv.1 解锁）：偶尔来一个后空翻，落地一圈星星 + 头顶冒爱心，+10 EXP
   p = 每秒触发的概率（0.055 ≈ 平均十几秒一次）　cd = 两次之间的最短间隔（毫秒）
   show = 后空翻给的这笔 EXP 要不要把面板弹出来（false = 只有亲手点才弹） */
var FLIP = { lv: 1, dur: 980, p: 0.055, cd: 9000, exp: 10, show: true };
/* 踱步：停下来的时候不一定干站着 —— 常常会左右来回走两步（脚底下那块球面没动，
   只是把画出来的位置在屏幕上左右拨一点，所以祂还是贴着球面）。
   p = 每次停下有多大概率改成踱步　dur = 踱多久（毫秒，区间随机）
   amp = 左右各挪多远（px，会按远近缩放）　w = 每秒来回多少（弧度/秒）
   hop = 每一步颠多高　tilt = 朝走的那一边倾多少（弧度） */
var PACE = { p: 0.62, dur: [2600, 5400], amp: 13, w: 2.3, hop: 1.8, tilt: 0.15 };
/* 睡觉：在球面上爬 + 踱步攒够 after 秒的运动量，就自己找一个正对着您的地方躺下。
   dur = 一觉睡多久（毫秒，区间随机）　every = 隔多久 +一次 EXP　exp = 每次 +多少
   zzz = 隔多久冒一个 Z　sx/sy = 睡姿压扁的比例（横着摊开、竖着压扁）　sink = 往下沉多少

var NAP = { after: 38, dur: [18000, 28000], every: 2600, exp: 1, zzz: 1250,

var PetCare = {
    lvEl: null, boxEl: null,
    show: false,         // 面板当前要不要显示（摸一下 / 操作小窗 → bump() 打开）
    hideAt: 0,           // 到这个时刻还没动静就收起（performance.now() 时钟）
    hover: false,        // 指针是不是停在小窗里
    f: 0,                // 淡入淡出的当前值，逐帧往目标靠
    bw: 154, bh: 96,     // 小窗尺寸（内容变了才重量一次，不每帧读）
    _sig: '',            // 上次画出来的内容指纹（EXP/等级/技能），一样就跳过重排
    hearts: 0,           // 正在飘的爱心数量（封顶，防连点刷爆）
    _saveT: null,

    init: function(){
        this.lvEl = document.createElement('div');  this.lvEl.id = 'pet-lv';

        stageEl.appendChild(this.boxEl);
        /* 老存档只有 petExp（没记累计），补一份：累计 = 现有 EXP，等级不会掉 */
        if (save.petExp && !save.petExpAll) save.petExpAll = save.petExp;
        this.render();
        var self = this;

        this.boxEl.addEventListener('mouseleave', function(){ self.hover = false; self.bump(); });

    /* 打开面板并把自动收起的倒计时拨回满格 */

    exp:  function(){ return save.petExp || 0; },      // 手上能花的 EXP

        ], { duration: 1650 + Math.random() * 420, easing: 'ease-out' });

    render: function(){
        if (!this.lvEl) return;
        var e = this.exp(), al = this.all(), lv = this.lvOf(al), nd = this.need(lv);
        /* 内容没变就别重排：EXP、等级、技能等级、睡没睡着 都相同才算没变 */
        var sig = e + '|' + al + '|' + lv + '|' + (Pet.asleep ? 'z' : 'w') + '|' +
                  SKILLS.map(function(s, k){ return PetCare.skLv(k); }).join(',');
        if (sig === this._sig) return;
        this._sig = sig;
        var base = lv > 0 ? LV_NEED[lv - 1] : 0;
        var pct  = (nd == null) ? 1 : Math.max(0, Math.min(1, (al - base) / (nd - base)));
        this.lvEl.textContent = 'Lv.' + lv + (nd == null ? '　MAX' : '');
        this.boxEl.innerHTML =
            '<div class="t">饲养等级</div>' +
            '<div>Lv.' + lv + '　EXP　' + e + '</div>' +
            (Pet.asleep ? '<div class="z">睡着中…… EXP 自己慢慢涨</div>' : '') +
            '<span class="bar"><i style="width:' + Math.round(pct * 100) + '%"></i></span>' +
            '<div>' + (nd == null ? '已满级' : '升级还需　' + (nd - al) + '　下（累计 ' + al + '／' + nd + '）') + '</div>' +
            '<div class="t" style="margin-top:6px">点击技能</div>' +
            SKILLS.map(function(s, i){
                var k = PetCare.skLv(i), full = k >= s.cost.length;
                var c2 = full ? ('每次 +' + s.gain[k] + '　·　已满级')
                              : ('每次 +' + s.gain[k] + '　·　升级需 ' + s.cost[k] + ' EXP');
                var can = !full && PetCare.exp() >= s.cost[k];
                return '<div class="sk-row' + (full ? ' done' : (can ? ' ok' : '')) + '" data-sk="' + i + '">' +
                       '<div class="n">　' + s.n + '　Lv.' + k + '</div>' +
                       '<div class="c">　' + c2 + '</div></div>';
            }).join('');
        /* 内容变了才量尺寸（每帧读 offsetWidth 会白白触发一次布局） */
        this.bw = this.boxEl.offsetWidth  || this.bw;
        this.bh = this.boxEl.offsetHeight || this.bh;
    },

    /* 每帧跟着宠物走：等级顶在头上，小窗开在旁边（贴到右边界就翻到左边） */
    update: function(ts){
        if (!this.lvEl) return;
        /* 自动收起：指针停在小窗里就一直续期（hover 时 hideAt 每帧往后推），
           否则到了 hideAt 就收。宠物不在了（被清档/收走）也直接收。 */
        if (this.show){
            if (!Pet.alive){ this.show = false; this.hover = false; }
            else if (this.hover){ this.hideAt = ts + AUTO_HIDE; }
            else if (ts > this.hideAt){ this.show = false; this.hover = false; }
        }
        var want = (Pet.alive && this.show) ? 1 : 0;
        this.f += (want - this.f) * 0.09;
        if (this.f < 0.005 && !want){
            if (this.lvEl.style.display !== 'none'){
                this.lvEl.style.display = 'none'; this.boxEl.style.display = 'none';
            }
            return;
        }
        if (this.lvEl.style.display === 'none'){
            this.lvEl.style.display = ''; this.boxEl.style.display = '';
        }
        var op = Pet.op * this.f;
        var halfH = (Pet.h || 44) * 0.5 * Pet.sc;
        /* 等级顶在头顶，但别顶出画面：宠物爬到上沿/左右边时把它按回来一点 */
        var lx = Math.max(26, Math.min(window.innerWidth  - 26, Pet.x));
        var ly = Math.max(24, Pet.y - halfH - 9);      // translate(-50%,-100%) → 这是标签的**下沿**
        this.lvEl.style.transform = 'translate(' + lx.toFixed(1) + 'px,' + ly.toFixed(1) + 'px) translate(-50%,-100%)';
        this.lvEl.style.opacity = op.toFixed(3);
        var halfW = (Pet.w || 44) * 0.5 * Pet.sc;
        var bx = Pet.x + halfW + 18;
        if (bx + this.bw > window.innerWidth - 12) bx = Pet.x - halfW - 18 - this.bw;
        bx = Math.max(10, Math.min(window.innerWidth - this.bw - 10, bx));
        var by = Math.max(10, Math.min(window.innerHeight - this.bh - 10, Pet.y - this.bh * 0.5));
        this.boxEl.style.transform = 'translate(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px)';
        this.boxEl.style.opacity = op.toFixed(3);
    }
};
window.addEventListener('pagehide', function(){ PetCare.saveFlush(); });
/* init 不在这里调：PetCare 要用存档变量 save，而 save 定义在文件更后面，

/* ---- 拖拽：抓起来随便放，松手它自己掉回眼球 ---- */
var grabOff = { x: 0, y: 0 };
var grabFrom = { x: 0, y: 0 }, grabMoved = false;   // 按下点 / 这次算不算"拖动过"
function stageXY(e){
    var r = stageEl.getBoundingClientRect();      // 舞台被对话框顶上去的时候也能对准
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}
petEl.addEventListener('pointerdown', function(e){
    if (!Pet.alive) return;
    e.preventDefault();
    var p = stageXY(e);
    grabOff.x = Pet.x - p.x; grabOff.y = Pet.y - p.y;    // 记住抓的是哪个部位，别一下跳到指针正中
    grabFrom.x = p.x; grabFrom.y = p.y; grabMoved = false;   // 记下按下的位置，好区分"摸一下"和"拖着走"
    Pet.mode = 'drag';
    petEl.classList.add('drag');
    try { petEl.setPointerCapture(e.pointerId); } catch (err) {}
});
window.addEventListener('pointermove', function(e){
    if (!Pet.alive || Pet.mode !== 'drag') return;
    var p = stageXY(e);
    if (Math.abs(p.x - grabFrom.x) > 9 || Math.abs(p.y - grabFrom.y) > 9) grabMoved = true;
    var nx = p.x + grabOff.x, ny = p.y + grabOff.y;
    Pet.x = Math.max(30, Math.min(window.innerWidth  - 30, nx));   // 别让它被拖出画面
    Pet.y = Math.max(30, Math.min(window.innerHeight - 30, ny));
});
function dropPet(){
    if (!Pet.alive) return;
    /* 按下去基本没挪动 → 不是拖，是摸了一下：加 EXP、头顶冒爱心
       （睡着的时候例外：不加 EXP，只冒一个 Z —— 挪地方照样挪） */
    if (Pet.mode === 'drag' && !grabMoved) PetCare.pet();
    if (Pet.mode !== 'drag') return;
    petEl.classList.remove('drag');
    /* 落点：屏幕上当前这个位置、投射回球面上离它最近的那一点（拖到球外 → 按到球轮廓上） */
    Pet.vt = petUnproj(Pet.x, Pet.y);
    var pg = petProj(Pet.vt);
    Pet.x0 = Pet.x; Pet.y0 = Pet.y; Pet.r0 = Pet.rot;
    Pet.tx = pg.x;  Pet.ty = pg.y;
    var d = Math.sqrt(Math.pow(Pet.tx - Pet.x0, 2) + Math.pow(Pet.ty - Pet.y0, 2));
    Pet.dur = Math.max(380, Math.min(950, d * 1.7));     // 掉得远就慢一点
    Pet.t0 = performance.now();
    Pet.mode = 'fall';
}
window.addEventListener('pointerup', dropPet);
window.addEventListener('pointercancel', dropPet);

/* ==================================================================
   网页入口（一枚入口 = 两枚按钮）
   ------------------------------------------------------------------
   · 按钮本体就是几行字符——跟对话框同一套语言：用符号围一个框，中间写着入口的名字。
     框线用**全角符号**（＋ － ｜ 和全角空格）：它们和汉字一样都是一个字一格，
     所以整框每一行的格数相同、宽度必然一致——不像半角的 ═ ║ 那样会和汉字错开（实测
     ═ 只有 13.5px、汉字 19px，混着排版框会歪）。
   · 从画面外的涡流里飞进来 → 落在眼球正下方；之后轻轻上下浮，鼠标移上去会亮。
   · **一枚入口出两枚按钮，并排在同一行、贴在一起**：
       网页按钮（左，大）→ 点了直接新标签页打开那张网页；
       剧情按钮（右，小一号——它是副按钮）→ 点了眼球说几句、问一问，
                          **演完就退场，只演一次**（演完才写 save.storyDone，之后刷新也不再出现）；
                          演到一半刷新 → 没写存档 → 按钮还在，可以重演一遍；
                          它一退场，同行的网页按钮就归正到正中（一行只剩一枚，重新居中）。
   · 只要有**任何一枚**按钮在场，这堆按钮旁边就多出一只**小眼睛**当总开关：
     睁着的眼睛 → 整套都在画面上；点一下换成画了一道斜线的眼睛 → 整套藏起来（只留它自己），
     做剧情的时候用它清场。
   · 出现过就记进存档（save.gates），刷新 / 续玩会自己再放出来一次（跟宠物一个待遇）；
     隐藏状态也存在存档里（save.gateHide）。

   以后加新入口：
     1) 往 GATES 里加一条：{ label:'名字', url:'地址', story:'对应的对白节点id' }
     2) 在 NODES 里写那个 story 节点（一串台词，说到底自动合框就行，见 NODES 末尾）
     3) 想让它随着某句台词出现 → 在那句台词所在的节点上写 gate:'那个键'。
   手动试：Gate.show('school') / Gate.hide() / Gate.setHidden(true)                */

    cut3:      { label: 'CUT3',     url: 'pages/school/class.html'                    },

        var G = this.GEO, perRow = this.PERROW, groups = [], cur = [], acc = 0, i;
        for (i = 0; i < ids.length; i++){
            var wI = pw[i];
            if (cur.length && (cur.length >= perRow || acc + G.gapX + wI > avail)){
                groups.push({ ids: cur }); cur = []; acc = 0;
            }
            acc += (cur.length ? G.gapX : 0) + wI;
            cur.push(ids[i]);
        }
        if (cur.length) groups.push({ ids: cur });
        return groups;
    },
    /* 落点变了 → 重新分发。已经站稳的按钮会平滑挪过去（见 step），不会瞬移。 */
    relayout: function(){
        var self = this, n = this.ids.length, G = this.GEO;
        if (!n){ this.spot = null; this.swPlace(); return; }
        /* 量宽高。offsetWidth/Height 不含播放中的 scale / rotate → 演出不会把排版带偏。
           副按钮此刻一枚都没有时 sh 量不到 → 用兜底值（实测就是 70）。
           ★ 用兜底值而不是 0：让"第一次冒出副按钮"时行高不突变 ——
             那一下突变会把下面几行整体顶上去，正是"往上跑"。 */
        var pw = new Array(n), hasSub = new Array(n), ph = 0, sh = 0, i;
        for (i = 0; i < n; i++){
            var p = this.items[this.ids[i]], s = this.items[this.ids[i] + '|story'];
            pw[i] = p ? (p.el.offsetWidth || 200) : 200;
            if (p) ph = Math.max(ph, p.el.offsetHeight || 0);
            hasSub[i] = s ? 1 : 0;
            if (s) sh = Math.max(sh, s.el.offsetHeight || 0);
        }
        if (!ph) ph = G.pageH;
        if (!sh) sh = G.subH;

        var L0 = this.layout(pw, this.ids, hasSub, ph, sh);
        var b = L0.b;
        for (i = 0; i < n; i++){
            var id = this.ids[i], it = this.items[id], st = this.items[id + '|story'];
            if (!it) continue;
            /* ★ 落点**只有一套**（layout 的返回值）：字段用 px/py（网页）、sx/sy（剧情）。
               早先这里还并列过一套"玩家拖动落定的快照"，两套字段名还不一样
               （快照是 x/y），一律读 pos.px 就会拿到 undefined → transform 写不出来
               → 按钮退回 CSS 初始的 left:0/top:0 叠在左上角。 */
            var pos = L0.cell[i];
            it.tx = pos.px; it.ty = pos.py;
            if (st){ st.tx = pos.sx; st.ty = pos.sy; }
        }
        this.spot = { l: b.l, r: b.r, t: b.t, bo: b.bo };
        this.swPlace();
    },
    /* 拼出一枚字符框：返回 <pre> 元素（还没定位置，落点由 relayout 算） */
    mkBox: function(id, lbl, kind){
        var FW = '　';                                    // 全角空格：与汉字同宽，拿来当填充
        var pad = 3;
        var lw = Math.ceil(tw(lbl) / 2);                  // 标签占几格（全角算 1 格）
        var W  = 2 + pad * 2 + lw;                        // 整框占几格（含两侧框线）
        var bar  = gateFr('＋' + rep('－', W - 2) + '＋');
        var rowB = gateFr('｜') + rep(FW, W - 2) + gateFr('｜');
        var rowM = gateFr('｜') + rep(FW, pad) +
                   '<span class="glb">' + esc(lbl) + '</span>' + rep(FW, pad) + gateFr('｜');
        var el = document.createElement('pre');
        el.className = 'gate gate-' + kind;               // gate-page / gate-story / gate-sw
        el.setAttribute('data-gate', id);
        if (kind === 'story') el.setAttribute('data-kind', 'story');
        el.innerHTML = gateRow(bar) + gateRow(rowB) + gateRow(rowM) + gateRow(rowB) + gateRow(bar);
        gatesEl.appendChild(el);
        return el;
    },
    /* instant=1：读档时补放。两种都是**直接就位、只化透明度**。
       一枚入口 = 两枚按钮：网页（GATES[id].label）+ 剧情（STORY_LABEL，前提是配了 story 节点） */
    show: function(id, instant){
        var g = GATES[id];
        if (!g || this.items[id]) return;
        this.ids.push(id);
        var a = { el: this.mkBox(id, g.label, 'page'), kind: 'page' };
        this.items[id] = a;
        var b = null;
        /* 不出剧情按钮的四种情况：没写那段剧情 / **这段剧情已经演完（save.storyDone）** /
           本来就没有 story 字段 / **写了 storyAfter 但那个解锁还没到**（看都没看过，不该剧透）。
           演完了就不再出 —— 这枚按钮只属于"第一次"。 */
        if (this.storyReady(id) && g.url){          // 纯剧情入口（无 url）→ 只出一枚主按钮，不另出「剧情」副按钮
            b = { el: this.mkBox(id, STORY_LABEL, 'story'), kind: 'story' };
            this.items[id + '|story'] = b;
        }
        this.relayout();
        /* ★★ 纯淡入：落点 relayout 刚算好，按钮**此刻就在那儿**，只把 opacity 从 0 化到 1。
           .gate 自带 opacity .35s 过渡（见样式表），连过渡都不用自己写。
           位置漂移只该来自"重新规划"；入场演出归演出，不再掺进位置。 */
        [a, b].forEach(function(it){
            if (!it) return;
            it.rot = 0; it.sc = 1; it.mode = 'idle';
            it.x = it.tx; it.by = it.ty; it.y = it.ty;      // 落点 = 布局算好的，一个像素不差
            it._vis = -1;                                    // 强制下一帧切一次透明度
            it.el.classList.add('on');
            /* transform 当场写死，不等 step()。
               ★ show(instant) 是读档路径，跑在开场黑屏里 —— 那段时间 frame() 因为
                 blackOn 提前 return，Gate.update 整段没跑 → 没人写 transform，
                 元素停在 CSS 初始的 left:0/top:0 上（实测刷新后一堆按钮叠在左上角，
                 rect 全是 x=0 y=-49）。非 instant 路径下一帧就会补上，无害。 */
            it.el.style.transform =
                'translate(' + it.x + 'px,' + it.y + 'px) translate(-50%,-50%)';
            if (instant) it.el.style.opacity = '1';
        });
        this.swCheck();
        if (!save.gates) save.gates = (save.gate ? [save.gate] : []);
        if (save.gates.indexOf(id) < 0) save.gates.push(id);
        if (save.gate !== id) save.gate = id;            // 老存档字段，留着兼容
        saveNow();
    },
    hide: function(id){
        var self = this;
        (id ? [id] : this.ids.slice()).forEach(function(k){
            ['', '|story'].forEach(function(suf){
                var it = self.items[k + suf];
                if (!it) return;
                it.el.remove();
                delete self.items[k + suf];
            });
            var i = self.ids.indexOf(k);
            if (i >= 0) self.ids.splice(i, 1);
        });
        this.relayout();
        this.swCheck();
    },
    /* ---- 剧情按钮：演完一次就退场 ----
       点一下 → 演出开始（storyOf 记下是哪一枚）→ **演出真正结束**才走 storyEnd：
         ① 写进存档（save.storyDone）→ 以后刷新 / 续玩都不再出这枚按钮（只触发一次）；
         ② 把它撤掉。
       演到一半就刷新 → 存档没写、storyOf 也没了 → 刷新后剧情按钮照样在，能重演。 */
    storyEnd: function(){
        var id = this.storyOf;
        if (id == null) return;                 // 现在演的不是剧情按钮那段（比如主线）→ 不关它的事
        this.storyOf = null;
        if (this._storyHid){ this._storyHid = false; this.setHidden(false); }   // 剧情期间自动藏的网页按钮，演完放回来
        this.stowPage(id, false);               // 说完 → 那枚网页按钮淡回来（演出期间被收起来了）
        if (!save.storyDone) save.storyDone = {};
        save.storyDone[id] = 1;
        saveNow();
        this.dropStory(id);
        if (id === 'novel') showDataBtn();      // 读完青禾残稿、演完那段 → 浮出「数据清空」按钮
        if (id === 'metaend' && window.BGMControl){ window.BGMControl.unlock('timewithyou'); window.BGMControl.setDefault('bgm/Time with you.mp3'); }  // 终局对话演完 → 解锁终曲并把默认 BGM 设为「与你同在」（玩家手动切换才会换）
    },
    /* 撤掉某一枚剧情按钮：淡出、摘出 items，**然后什么都不做**。
       ★ 这里刻意**不调 relayout**。剧情按钮在网页按钮的正下方，网页按钮的落点
         完全不依赖它（横向不占位、竖向行高已由"这一行曾出现过副按钮"预留），
         所以撤一枚副按钮 → 网页按钮一像素不动、下面几行也不动。
         早先副按钮在右侧同排，撤掉必须重排，才有了后来那一串横向漂移。 */
    dropStory: function(id){
        var k = id + '|story', it = this.items[k];
        if (!it) return;
        delete this.items[k];            // 摘出 items → step() 不再把 opacity 写回 1
        it.mode = 'off';
        it.el.classList.remove('on');    // 淡出途中不接鼠标
        it.el.style.opacity = '0';       // .gate 自带 .35s opacity 过渡 → 自己化掉
        setTimeout(function(){ it.el.remove(); }, 420);
    },
    /* ---- 单枚收起 / 放回：点「剧情」开场时把同一枚入口的**网页按钮**藏起来 ----
       理由：演这段的时候，旁边摆着一枚「点一下跳去那个网页」的按钮，既分散注意力，
       又容易在话说到一半时误触、开出一个新标签页 —— 所以开场先收，演完再放回。
       ★ 只淡出、不摘 DOM、不 relayout：它还在 items 里、位置照旧留着 →
         放回来时一像素不动（撤了再补会触发整块重排，那才是"按钮跑位"的来源）。
       ★ 不进存档：演到一半刷新 → 按钮重建，stowed 自然没了 → 网页按钮照样在。 */
    stowPage: function(id, v){
        var it = this.items[id];                  // 'school' = 网页按钮（'school|story' 是剧情按钮，不动它）
        if (!it) return;
        it.stowed = !!v;
        it._vis = -1;                             // 强制 step() 下一帧重切一次透明度
    },
    /* 全部放回（清档 / 兜底用） */
    stowAll: function(v){
        var self = this;
        this.ids.forEach(function(k){ self.stowPage(k, !!v); });
    },
    /* 这枚入口现在该不该出「剧情」按钮：
       配了 story + 这段没演过 + （若写了 storyAfter）那个解锁已经到了。 */
    storyReady: function(id){
        var g = GATES[id];
        if (!g || !g.story || NODES[g.story] == null) return false;
        if (save.storyDone && save.storyDone[id]) return false;
        if (g.storyAfter && !(save.unlock && save.unlock[g.storyAfter])) return false;
        return true;
    },
    /* 后补一枚「剧情」按钮：入口早就飘在场上了（CUT2 是 CUT1 看完就飘出来的），
       这会儿某个解锁刚到（食堂页滚完 → cut2s）→ 才轮到这枚副按钮出场。
       没到条件 / 已经演过 / 已经在场 → 什么都不做。
       ★ 副按钮在下方，所以新出它只会让**下面几行**往下让一格（真多了一个东西，该让），
         同一行里那些枚一像素不动。 */
    addStory: function(id, instant){
        if (!GATES[id] || this.items[id + '|story']) return;
        if (!this.items[id]){ this.show(id, instant); return; }  // 入口本身都还没出来 → 连它一起放（show 里自己判 storyAfter）
        if (!this.storyReady(id)) return;
        var b = { el: this.mkBox(id, STORY_LABEL, 'story'), kind: 'story' };
        this.items[id + '|story'] = b;
        this.relayout();
        b.rot = 0; b.sc = 1; b.mode = 'idle';
        b.x = b.tx; b.by = b.ty; b.y = b.ty;               // 直接就位
        b._vis = -1;
        b.el.classList.add('on');
        b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px) translate(-50%,-50%)';  // 同 show：当场写，不等下一帧
        if (instant) b.el.style.opacity = '1';
        this.swCheck();
    },
    /* 一枚按钮的每帧演出。
       ★ 只剩两件事：① 平滑收敛到布局落点（重排了不会瞬移）② 极轻的呼吸感。
         入场飞行的插值整段删掉了 —— 位置归位置，演出归演出。 */
    step: function(it, ts, dt, t, k){
        if (!it || it.mode === 'off') return;
        var sq = Math.min(1, dt * 9);                          // 每帧收 14% 左右，约 0.4s 到位
        it.x += (it.tx - it.x) * sq;
        it.by += (it.ty - it.by) * sq;
        /* 呼吸感压到最小（1.4px / 0.008rad）。早先 3.2px + 0.014rad 每秒不停地摆，
           看着像"没对齐又在动"。相位按行给（见 update），同行共用 → 整行像一块板。 */
        it.rot = Math.sin(t * 0.5 + k) * 0.008;
        it.sc  = 1 + Math.sin(t * 1.1 + k * 2) * 0.006;
        it.y = it.by + Math.sin(t * 0.85 + k) * 1.4;
        it.el.style.transform =
            'translate(' + (Math.round(it.x * 10) / 10) + 'px,' + (Math.round(it.y * 10) / 10) + 'px)' +
            ' translate(-50%,-50%) rotate(' + it.rot.toFixed(4) + 'rad) scale(' + it.sc.toFixed(3) + ')';
        /* 透明度**只在状态切换时写一次**。每帧写会把 .35s 过渡反复打断，看着像闪。
           被藏起来时照样把收敛动画走完（放出来时它已经在正确的位置上了）。
           stowed = 这枚单独被收起（点它那枚「剧情」按钮开场时）→ 与整套 hidden 同效。 */
        var want = (this.hidden || it.stowed) ? 0 : 1;
        if (it._vis !== want){
            it._vis = want;
            it.el.style.opacity = want ? '1' : '0';
            if (want) it.el.classList.add('on'); else it.el.classList.remove('on');
        }
    },
    update: function(ts, dt){
        var t = ts * 0.001;
        /* 兜底：窗口尺寸变了就重排。resize 事件偶尔会漏（比如截图工具改了视口），
           每帧比一下尺寸，比只靠事件稳。 */
        if (this.ids.length &&
            (window.innerWidth !== this._w || window.innerHeight !== this._h)){
            this._w = window.innerWidth; this._h = window.innerHeight;
            this.relayout();
        }
        for (var i = 0; i < this.ids.length; i++){
            var id = this.ids[i];
            /* 相位**按行**给，不按按钮：呼吸的上下浮 / 微转 / 微缩放全吃 k。
               原来每枚各给一个 → 同一行两枚永远差一个相位、各自 sin() 错开摆，
               一秒不停，看着就是"没对齐"。同一行共用 k → 整行像一块板。 */
            this.step(this.items[id],          ts, dt, t, i * 2);
            this.step(this.items[id + '|story'], ts, dt, t, i * 2);
        }
    },

    /* ---- 总开关那只小眼睛：建/退场 + 换图案 ----
       有按钮在场时它就在场，没有就跟着退场（它就是"这一堆的开关"）。 */
    swCheck: function(){
        if (this.ids.length && !this.swEl){
            var el = document.createElement('pre');
            el.className = 'gate gate-sw';
            el.setAttribute('title', '点一下：藏起／放出这些网页按钮');
            gatesEl.appendChild(el);
            this.swEl = el;
            this.swArt = '';
        } else if (!this.ids.length && this.swEl){
            this.swEl.remove(); this.swEl = null; this.swArt = ''; return;   // 没入口了 → 它跟着退场
        }
        if (!this.swEl) return;
        var art = eyeArt(this.hidden);
        if (this.swArt !== art){ this.swEl.textContent = art; this.swArt = art; }
        this.swEl.classList.toggle('xed', !!this.hidden);      // 斜线眼再暗一档
        this.swEl.classList.add('on');
        this.swPlace();
    },
    /* ---- 总开关那只小眼睛（.gate-sw）----
       它只做一件事：**点一下** 把这一堆入口藏起来／放出来。

       ★ 位置不自由、不可拖、不存档 —— **每次都从 spot（按钮块四条边）现算**：
         横向贴在按钮块的**右侧**，纵向对准整块的**中线**。
         所以按钮块怎么重排（加入口 / 换窗口尺寸 / 撤副按钮），
         它都自动跟到新的右侧中点，不会脱钩、不会越拖越别扭。
         早先那套「提手 + 玩家摆位 + 落定快照 + 存进存档 + 出画校验」全是给自己找事。 */
    swPlace: function(){
        var el = this.swEl;
        if (!el) return;
        var G = this.GEO, sp = this.spot;
        var W = stageEl.offsetWidth || window.innerWidth, H = stageEl.offsetHeight || window.innerHeight;
        var w = el.offsetWidth || 70, h = el.offsetHeight || 93;
        /* 没有按钮 → 缩回中间（swCheck 会紧接着把它撤掉，这里只是别留残影） */
        var x = sp ? sp.r + G.gapX : (W - w) / 2;
        var y = sp ? (sp.t + sp.bo) / 2 - h / 2 : (H - h) / 2;   // 中线 → 顶边（transform 用的是 translate(0,0)）
        /* 右侧放不下（按钮块顶到右缘）→ 改贴左侧，两边都放不下才钳在画面内 */
        if (sp){
            if (x + w > W - G.pad) x = sp.l - G.gapX - w;
            if (x < G.pad) x = Math.min(W - G.pad - w, Math.max(G.pad, sp.r + G.gapX));
        }
        x = Math.max(G.pad, Math.min(W - G.pad - w, x));
        y = Math.max(G.pad, Math.min(H - G.pad - h, y));
        el.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px) translate(0,0)';
    },
    setHidden: function(v){
        this.hidden = !!v;
        save.gateHide = this.hidden ? 1 : 0;        // 藏没藏记进存档 → 刷新之后还是那个状态
        saveNow();
        this.swCheck();
    },
    toggleHidden: function(){ this.setHidden(!this.hidden); }
};


/* 三枚按钮都在 #gates 里，所以用事件委托，按 data-gate / data-kind 认是哪一枚：
     · 总开关（.gate-sw）   → 整套网页按钮藏起来 / 再放出来
     · 网页按钮（左边那枚） → 新标签页打开那张网页（window.open 被拦时退回 <a target=_blank> 再点一次）
     · 剧情按钮（右边那枚） → 眼球说几句、问一问，说完自己合框（见 startGateStory） */
gatesEl.addEventListener('click', function(e){
    if (!e.target || !e.target.closest) return;
    var sw = e.target.closest('.gate-sw');
    /* 小眼睛只做"藏／放"这一件事，点一下就切。 */
    if (sw){ Gate.toggleHidden(); return; }
    var el = e.target.closest('.gate');
    if (!el) return;
    var id = el.getAttribute('data-gate');
    if (el.getAttribute('data-kind') === 'story'){ startGateStory(id); return; }
    var g = GATES[id];
    if (!g) return;
    if (g.story && !g.url){ startGateStory(id); return; }   // 纯剧情入口（无网页）→ 点直接开对话
    if (!g.url) return;
    if (!window.open(g.url, '_blank')){
        var a = document.createElement('a');
        a.href = g.url; a.target = '_blank'; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
});
/* 点「剧情」按钮 → 把框摊开在那句台词上，说完自动收（与主线互不相干，也不会把主线的续玩进度改掉）。
   演完 → Gate.storyEnd()：这枚按钮淡出退场 + 写 save.storyDone（只演一次）；
   演到一半刷新 → 存档没写 → 刷新后按钮还在。 */
function startGateStory(id){
    var g = GATES[id];
    if (!g || !g.story || typeof openAt !== 'function') return;
    if (NODES[g.story] == null) return;                          // 那段剧情还没写 → openAt 会白跑一趟，别记 storyOf
    var open = function(){
        if (typeof dlgOpen !== 'undefined' && dlgOpen) return;    // 主线正说到一半 → 不打断
        Gate.storyOf = id;                                       // 记下"现在演的是这枚"——演完由 storyEnd 收尾（中途刷新则自动作废）
